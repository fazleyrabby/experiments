<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Saint Morrow</title>
<meta name="description" content="A rain-soaked gothic port city at midnight, explorable in real time.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.webgpu.js",
    "three/webgpu": "./vendor/three.webgpu.js",
    "three/tsl": "./vendor/three.tsl.js",
    "three/addons/": "./vendor/addons/",
    "three-mesh-bvh/": "./vendor/three-mesh-bvh/"
  }
}
</script>
</head>
<body>
<main id="stage" aria-label="Saint Morrow real-time city view"></main>
<div id="loader">
  <div class="loader-glow" aria-hidden="true"></div>
  <div class="loader-inner">
    <h1 class="loader-title">Saint Morrow</h1>
    <p class="loader-tagline">Midnight, in the rain</p>
    <div id="loader-track" role="progressbar" aria-label="Loading Saint Morrow" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="loader-bar"></div>
    </div>
    <div class="loader-meta">
      <span id="status" role="status">Loading the engine</span>
      <span id="loader-percent" aria-hidden="true">0%</span>
    </div>
    <p id="loader-hint" hidden>Slow connection. Still loading.</p>
    <button id="loader-retry" type="button" hidden>Try again</button>
  </div>
</div>
<button id="enter" type="button" hidden>
  <span class="enter-title">Saint Morrow</span>
  <span class="enter-action">Click to walk</span>
  <span class="enter-keys">WASD move · Shift run · Space jump · M sound · Esc release</span>
</button>
<aside id="hud" hidden aria-label="Performance metrics"></aside>
<script type="module" src="./js/main.js"></script>
</body>
</html>
