<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miniature Japanese Village</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f1cdb8;font-family:"Hiragino Sans","Yu Gothic","Helvetica Neue",Arial,sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 56%,rgba(80,34,44,.26) 100%)}
  #caption{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);color:#fff6ea;text-shadow:0 1px 10px rgba(90,34,34,.6);letter-spacing:.16em;font-size:11px;text-transform:uppercase;pointer-events:none;transition:opacity 1.8s ease;white-space:nowrap;text-align:center}
  #caption b{display:block;font-weight:600;font-size:15px;letter-spacing:.34em;margin-bottom:5px}
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:#f4d9c6;color:#7a4a3a;letter-spacing:.32em;font-size:12px;text-transform:uppercase;transition:opacity .9s ease;z-index:5}
  #loader.done{opacity:0;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="caption"><b>Miniature Japanese Village</b>Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div>
<div id="loader">Crafting the village…</div>

<script type="module">
const T0 = performance.now();
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Utilities
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mix = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(20260528);
const texRand = mulberry32(777);
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

function hash2(ix, iz) {
  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iz | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return mix(mix(a, b, ux), mix(c, d, ux), uz);
}
function fbm(x, z, o = 3) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < o; i++) { s += a * vnoise(x * f, z * f); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}
const fract = (x) => x - Math.floor(x);
const posHash = (x, y, z) => fract(Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453);

/* ---- transform + geometry batching (merges many small parts into one mesh) ---- */
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(),
      _s = new THREE.Vector3(), _e = new THREE.Euler(), _c = new THREE.Color(),
      _up = new THREE.Vector3(0, 1, 0), _v1 = new THREE.Vector3();
function M(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) {
  _e.set(rx, ry, rz, 'YXZ'); _q.setFromEuler(_e); _p.set(x, y, z); _s.set(sx, sy, sz);
  return _m4.compose(_p, _q, _s);
}
const BASE = { on: false, m: new THREE.Matrix4() };
const useBase = (m) => { BASE.m.copy(m); BASE.on = true; };
const clearBase = () => { BASE.on = false; };

class Batch {
  constructor(jitter = 0.05) { this.list = []; this.jitter = jitter; }
  _prep(geo, color, jit) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    if (!g.attributes.normal) g.computeVertexNormals();
    const n = g.attributes.position.count;
    _c.set(color);
    if (jit && this.jitter) _c.offsetHSL((rand() - 0.5) * this.jitter * 0.3, 0, (rand() - 0.5) * this.jitter);
    const arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { arr[i * 3] = _c.r; arr[i * 3 + 1] = _c.g; arr[i * 3 + 2] = _c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
    return g;
  }
  add(geo, color, m, jit = true) {
    const g = this._prep(geo, color, jit);
    if (m) g.applyMatrix4(m);
    if (BASE.on) g.applyMatrix4(BASE.m);
    this.list.push(g);
    return this;
  }
  addRaw(geo, color) { return this.add(geo, color, null, false); }
  box(w, h, d, x, y, z, color, ry = 0, rx = 0, rz = 0) {
    return this.add(new THREE.BoxGeometry(w, h, d), color, M(x, y, z, rx, ry, rz));
  }
  cyl(rt, rb, h, seg, x, y, z, color, rx = 0, ry = 0, rz = 0) {
    return this.add(new THREE.CylinderGeometry(rt, rb, h, seg), color, M(x, y, z, rx, ry, rz));
  }
  sph(r, x, y, z, color, sx = 1, sy = sx, sz = sx, det = 1) {
    return this.add(new THREE.IcosahedronGeometry(r, det), color, M(x, y, z, 0, 0, 0, sx, sy, sz));
  }
  rod(a, b, r0, r1, color, seg = 6) {
    _v1.subVectors(b, a); const len = _v1.length(); _v1.divideScalar(len);
    _q.setFromUnitVectors(_up, _v1); _p.addVectors(a, b).multiplyScalar(0.5); _s.set(1, 1, 1);
    _m4.compose(_p, _q, _s);
    return this.add(new THREE.CylinderGeometry(r1, r0, len, seg), color, _m4);
  }
  /* rectangular beam swept along a polyline */
  sweep(pts, w, h, color) {
    const n = pts.length, rings = [];
    const t = new THREE.Vector3(), s = new THREE.Vector3(), nn = new THREE.Vector3();
    const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, n - 1)];
      t.subVectors(b, a).normalize();
      s.crossVectors(_up, t); if (s.lengthSq() < 1e-6) s.set(1, 0, 0); s.normalize();
      nn.crossVectors(t, s).normalize();
      const r = [];
      for (const [sa, na] of corners) r.push(pts[i].clone().addScaledVector(s, sa * w / 2).addScaledVector(nn, na * h / 2));
      rings.push(r);
    }
    const v = [];
    const tri = (a, b, c) => { v.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z); };
    for (let i = 0; i < n - 1; i++) {
      for (let k = 0; k < 4; k++) {
        const a = rings[i][k], b = rings[i][(k + 1) % 4], c = rings[i + 1][k], d = rings[i + 1][(k + 1) % 4];
        tri(a, b, c); tri(b, d, c);
      }
    }
    const r0 = rings[0], r1 = rings[n - 1];
    tri(r0[0], r0[2], r0[1]); tri(r0[0], r0[3], r0[2]);
    tri(r1[0], r1[1], r1[2]); tri(r1[0], r1[2], r1[3]);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
    g.computeVertexNormals();
    return this.add(g, color, null, true);
  }
  build(mat, cast = true, receive = true) {
    if (!this.list.length) return null;
    const g = mergeGeometries(this.list, false);
    this.list.length = 0;
    const m = new THREE.Mesh(g, mat);
    m.castShadow = cast; m.receiveShadow = receive;
    return m;
  }
}

const _o3 = new THREE.Object3D();
function makeInstanced(geo, mat, items, opts = {}) {
  const mesh = new THREE.InstancedMesh(geo, mat, items.length);
  for (let i = 0; i < items.length; i++) {
    const it = items[i], s = it.s ?? 1;
    _o3.position.set(it.x, it.y, it.z);
    _o3.rotation.set(it.rx || 0, it.ry || 0, it.rz || 0);
    _o3.scale.set(it.sx ?? s, it.sy ?? s, it.sz ?? s);
    _o3.updateMatrix();
    mesh.setMatrixAt(i, _o3.matrix);
    if (it.c !== undefined) { _c.set(it.c); mesh.setColorAt(i, _c); }
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = !!opts.cast; mesh.receiveShadow = opts.receive !== false;
  mesh.frustumCulled = false;
  return mesh;
}

/* wind sway injected into standard materials (GPU side, no per-frame CPU work) */
const timeU = { value: 0 };
function addSway(mat, { amp = 0.05, speed = 1.0, useY = true } = {}) {
  const key = `sway-${amp}-${speed}-${useY}`;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = timeU;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
        #else
          vec3 ip = vec3(0.0);
        #endif
        float swPh = ip.x * 0.9 + ip.z * 1.3;
        float swW = ${useY ? 'max(position.y, 0.0)' : '1.0'};
        transformed.x += sin(uTime * ${speed.toFixed(3)} + swPh + position.y * 1.2) * ${amp.toFixed(4)} * swW;
        transformed.z += cos(uTime * ${(speed * 0.83).toFixed(3)} + swPh * 1.3 + position.y) * ${(amp * 0.7).toFixed(4)} * swW;`);
  };
  mat.customProgramCacheKey = () => key;
  return mat;
}

/* =====================================================================
   Procedural textures (canvas)
   ===================================================================== */
function canvasTex(w, h, draw, opt = {}) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d'); draw(c, w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = opt.clamp ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}
const tr = (a, b) => a + (b - a) * texRand();

const woodTex = canvasTex(128, 128, (c, w, h) => {
  c.fillStyle = '#dcdcdc'; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) {
    const x = tr(0, w); c.strokeStyle = `rgba(0,0,0,${tr(0.04, 0.12)})`; c.lineWidth = tr(0.6, 2);
    c.beginPath(); c.moveTo(x, 0);
    for (let y = 0; y <= h; y += 16) c.lineTo(x + Math.sin(y * 0.05 + i) * 1.6, y);
    c.stroke();
  }
  for (let i = 0; i < 26; i++) {
    const x = tr(0, w); c.strokeStyle = `rgba(255,255,255,${tr(0.04, 0.1)})`; c.lineWidth = tr(0.5, 1.4);
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x + tr(-3, 3), h); c.stroke();
  }
});
const plasterTex = canvasTex(128, 128, (c, w, h) => {
  c.fillStyle = '#f2f2f2'; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 14; i++) {
    const x = tr(0, w), y = tr(0, h), r = tr(14, 40);
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${tr(0.03, 0.07)})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 900; i++) { c.fillStyle = `rgba(0,0,0,${tr(0.02, 0.07)})`; c.fillRect(tr(0, w), tr(0, h), tr(1, 2.2), tr(1, 2.2)); }
});
const roofKTex = canvasTex(256, 256, (c, w, h) => {
  c.fillStyle = '#3a414d'; c.fillRect(0, 0, w, h);
  const rowH = 32, colW = 32;
  for (let r = -1; r < 9; r++) {
    for (let k = -1; k < 9; k++) {
      const x = k * colW + (r & 1) * colW / 2, y = r * rowH;
      const g = c.createLinearGradient(0, y, 0, y + rowH);
      g.addColorStop(0, '#59616f'); g.addColorStop(0.65, '#454c59'); g.addColorStop(1, '#262b34');
      c.fillStyle = g; c.beginPath();
      c.moveTo(x + 1, y); c.lineTo(x + colW - 1, y); c.lineTo(x + colW - 1, y + rowH - 9);
      c.quadraticCurveTo(x + colW / 2, y + rowH + 5, x + 1, y + rowH - 9); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(14,16,22,.55)'; c.lineWidth = 1.2; c.stroke();
    }
  }
});
const roofTTex = canvasTex(256, 256, (c, w, h) => {
  c.fillStyle = '#b79b5c'; c.fillRect(0, 0, w, h);
  const cols = ['#a08546', '#cdb577', '#8c7340', '#d8c48a', '#b39555'];
  for (let i = 0; i < 700; i++) {
    const x = tr(0, w), y = tr(0, h), len = tr(30, 90);
    c.strokeStyle = cols[Math.floor(texRand() * cols.length)]; c.globalAlpha = tr(0.35, 0.8); c.lineWidth = tr(1, 2.6);
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + tr(-2, 2), y + len); c.stroke();
  }
  c.globalAlpha = 1;
  for (let y = 24; y < h; y += 48) {
    c.strokeStyle = 'rgba(70,48,22,.45)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, y);
    for (let x = 0; x <= w; x += 16) c.lineTo(x, y + Math.sin(x * 0.12 + y) * 2); c.stroke();
  }
});
const pathTex = canvasTex(128, 256, (c, w, h) => {
  c.fillStyle = '#cdb68a'; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) {
    c.fillStyle = `rgba(${Math.floor(tr(110, 190))},${Math.floor(tr(95, 160))},${Math.floor(tr(70, 125))},${tr(0.4, 0.9)})`;
    c.beginPath(); c.ellipse(tr(0, w), tr(0, h), tr(2, 6), tr(1.5, 4), tr(0, 3), 0, TAU); c.fill();
  }
  for (let i = 0; i < 400; i++) { c.fillStyle = `rgba(80,60,40,${tr(0.05, 0.2)})`; c.fillRect(tr(0, w), tr(0, h), 1.5, 1.5); }
  c.globalCompositeOperation = 'destination-in';
  const g = c.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.22, 'rgba(0,0,0,1)');
  g.addColorStop(0.78, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
});
const glowTex = canvasTex(64, 64, (c, w, h) => {
  const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
}, { clamp: true });
const blobTex = canvasTex(64, 64, (c, w, h) => {
  const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(30,20,10,.55)'); g.addColorStop(0.55, 'rgba(30,20,10,.28)'); g.addColorStop(1, 'rgba(30,20,10,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
}, { clamp: true });
const cloudTex = canvasTex(256, 128, (c, w, h) => {
  for (let i = 0; i < 16; i++) {
    const x = tr(50, w - 50), y = tr(h * 0.45, h * 0.7), r = tr(22, 48);
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
}, { clamp: true });
const norenTex = canvasTex(128, 128, (c, w, h) => {
  c.fillStyle = '#27385c'; c.fillRect(0, 0, w, h);
  c.strokeStyle = '#f3ecd9'; c.lineWidth = 7; c.beginPath(); c.arc(w / 2, h * 0.5, 26, 0, TAU); c.stroke();
  c.lineWidth = 6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(w / 2 - 14, h * 0.5 - 6); c.lineTo(w / 2 + 14, h * 0.5 - 6); c.moveTo(w / 2 - 12, h * 0.5 + 8); c.lineTo(w / 2 + 12, h * 0.5 + 8); c.stroke();
  c.fillStyle = 'rgba(0,0,0,.25)'; for (let x = 0; x < w; x += 32) c.fillRect(x, 0, 2, h);
});
const signTex = canvasTex(128, 64, (c, w, h) => {
  c.fillStyle = '#b98b55'; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 24; i++) { c.strokeStyle = `rgba(60,35,15,${tr(0.08, 0.2)})`; c.lineWidth = 1; c.beginPath(); c.moveTo(0, tr(0, h)); c.lineTo(w, tr(0, h)); c.stroke(); }
  c.fillStyle = '#a3321f'; c.beginPath(); c.arc(w / 2, h / 2, 18, 0, TAU); c.fill();
  c.strokeStyle = '#f2e5c8'; c.lineWidth = 5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(w / 2 - 9, h / 2 - 5); c.lineTo(w / 2 + 9, h / 2 - 5); c.moveTo(w / 2, h / 2 - 11); c.lineTo(w / 2, h / 2 + 11); c.stroke();
}, { clamp: true });

/* =====================================================================
   Shared materials
   ===================================================================== */
const matWood    = new THREE.MeshStandardMaterial({ vertexColors: true, map: woodTex, roughness: 0.82 });
const matPlaster = new THREE.MeshStandardMaterial({ vertexColors: true, map: plasterTex, roughness: 0.96 });
const matStone   = new THREE.MeshStandardMaterial({ vertexColors: true, map: plasterTex, roughness: 0.97 });
const matPlain   = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 });
const matRoofK   = new THREE.MeshStandardMaterial({ map: roofKTex, bumpMap: roofKTex, bumpScale: 2.2, roughness: 0.58, metalness: 0.08 });
const matRoofT   = new THREE.MeshStandardMaterial({ map: roofTTex, bumpMap: roofTTex, bumpScale: 1.6, roughness: 1.0 });
const matShoji   = new THREE.MeshStandardMaterial({ color: 0xf6e6bd, emissive: 0xffa04a, emissiveIntensity: 0.95, roughness: 0.9 });
const matLantern = new THREE.MeshStandardMaterial({ color: 0x5a3a20, emissive: 0xffa233, emissiveIntensity: 1.5, roughness: 0.8 });
const matChochin = new THREE.MeshStandardMaterial({ vertexColors: true, emissive: 0xff5a28, emissiveIntensity: 0.9, roughness: 0.7 });
const matNoren   = new THREE.MeshStandardMaterial({ map: norenTex, roughness: 0.95, side: THREE.DoubleSide });
const matSign    = new THREE.MeshStandardMaterial({ map: signTex, roughness: 0.9 });

/* =====================================================================
   Renderer, scene, lighting, sky
   ===================================================================== */
const host = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color('#f0c9b8'), 70, 190);
const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.5, 700);

/* warm low sun coming from the left-front so the roofs and trunks read with form */
const SUN_DIR = new THREE.Vector3(-0.31, 0.45, 0.84).normalize();
const hemi = new THREE.HemisphereLight(0xd3dcff, 0x9a7650, 1.3);
scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffe2d2, 0.22);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffc788, 4.0);
sun.position.copy(SUN_DIR).multiplyScalar(30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -19; sc.right = 19; sc.top = 19; sc.bottom = -19; sc.near = 4; sc.far = 70;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.04;
sun.shadow.radius = 3;
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(0x9db4ff, 0.75);
rim.position.set(24, 7, -6);
scene.add(rim);

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uTop: { value: new THREE.Color('#6d98e2') }, uMid: { value: new THREE.Color('#f7b4b8') },
    uHor: { value: new THREE.Color('#ffd7a8') }, uSunDir: { value: SUN_DIR }, uSunCol: { value: new THREE.Color('#ffb36b') }
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `

const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), skyMat);

/* =====================================================================
   Island shape, river, terrain height field
   ===================================================================== */
function rimRadius(th) {
  return 13.0 + 1.0 * Math.sin(2 * th + 0.7) + 0.8 * Math.sin(3 * th + 2.1) + 0.5 * Math.sin(5 * th + 4.0)
    + 0.25 * Math.sin(8 * th + 1.3) + 0.8 * (vnoise(Math.cos(th) * 2.4 + 11, Math.sin(th) * 2.4 + 5) - 0.5);
}

const RIVER_PTS = [[5.4, -6.2], [3.6, -5.2], [1.6, -4.3], [0.3, -2.6], [0.5, -0.3], [1.1, 1.8], [0.2, 3.9], [-2.4, 5.2], [-5.2, 6.0], [-8.4, 7.2], [-12.5, 8.6]];
const riverCurve = new THREE.CatmullRomCurve3(RIVER_PTS.map(p => new THREE.Vector3(p[0], 0, p[1])), false, 'catmullrom', 0.5);
const RIVER_N = 260;
const riverSamples = riverCurve.getSpacedPoints(RIVER_N);
const riverX = new Float32Array(RIVER_N + 1), riverZ = new Float32Array(RIVER_N + 1), riverW = new Float32Array(RIVER_N + 1);
for (let i = 0; i <= RIVER_N; i++) {
  const t = i / RIVER_N;
  riverX[i] = riverSamples[i].x; riverZ[i] = riverSamples[i].z;
  riverW[i] = 1.02 + 0.16 * Math.sin(t * 13 + 1) + 1.35 * Math.exp(-t * 11);
}
const RQ = { d: 0, w: 1, i: 0 };
function riverQuery(x, z) {
  let best = 1e9, bi = 0;
  for (let i = 0; i <= RIVER_N; i++) {
    const dx = x - riverX[i], dz = z - riverZ[i], d2 = dx * dx + dz * dz;
    if (d2 < best) { best = d2; bi = i; }
  }
  RQ.d = Math.sqrt(best); RQ.w = riverW[bi]; RQ.i = bi;
  return RQ;
}

const HILLS = [[-6.5, -3.5, 5.5, 1.1], [3, -9, 4.5, 0.75], [8.5, -1.5, 4.2, 0.7], [-3.5, 7.2, 3.4, 0.45],
               [-2.6, -8.2, 3.2, 1.2], [5.5, 6.0, 3.4, 0.4], [-10, 3.2, 3.5, 0.5], [9.2, -6.5, 3, 0.55]];
function terrainBase(x, z) {
  let s = 0;
  for (const h of HILLS) { const dx = x - h[0], dz = z - h[1]; s += h[3] * Math.exp(-(dx * dx + dz * dz) / (h[2] * h[2])); }
  return 0.85 + s + 0.32 * (fbm(x * 0.14 + 7.3, z * 0.14 + 2.1, 3) - 0.5) * 2 + 0.06 * (fbm(x * 0.7, z * 0.7, 2) - 0.5) * 2;
}
/* building pads (flattened ground) */
const PADS = [
  { n: 'main',   x: -6.4, z: -3.4, r: 3.4, f: 2.4 },
  { n: 'kura',   x: -9.9, z: 1.3,  r: 1.7, f: 1.6 },
  { n: 'tea',    x: 5.2,  z: 3.4,  r: 2.5, f: 1.8 },
  { n: 'house3', x: 8.3,  z: -2.3, r: 2.3, f: 1.8 },
  { n: 'shrine', x: -2.8, z: -8.0, r: 1.8, f: 2.0 }
];
for (const p of PADS) p.y = Math.max(terrainBase(p.x, p.z), 0.7);
const WATER_Y = 0.0, BED_Y = -0.62;

function groundHeight(x, z) {
  let h = terrainBase(x, z);
  for (const p of PADS) {
    const d = Math.hypot(x - p.x, z - p.z);
    if (d < p.r + p.f) h = mix(h, p.y, 1 - sstep(p.r, p.r + p.f, d));
  }
  riverQuery(x, z);
  const inner = RQ.w * 0.8, k = sstep(inner, inner + 1.6, RQ.d);
  if (k < 1) h = mix(BED_Y, h, k);
  const rn = Math.hypot(x, z) / rimRadius(Math.atan2(z, x));
  h -= 0.3 * sstep(0.8, 1.0, rn);
  return h;
}

/* =====================================================================
   Terrain mesh (polar grid -> exact organic coastline)
   ===================================================================== */
const SEG = 224, RINGS = 104;
const vIndex = (ring, j) => ring === 0 ? 0 : 1 + (ring - 1) * SEG + (((j % SEG) + SEG) % SEG);
const tCount = 1 + RINGS * SEG;
const tPos = new Float32Array(tCount * 3), tCol = new Float32Array(tCount * 3);
const tIdx = [];
tPos[1] = groundHeight(0, 0);
for (let ring = 1; ring <= RINGS; ring++) {
  const rn = ring / RINGS;
  for (let j = 0; j < SEG; j++) {
    const th = j / SEG * TAU, r = rimRadius(th) * rn;
    const x = r * Math.cos(th), z = r * Math.sin(th);
    const i3 = vIndex(ring, j) * 3;
    tPos[i3] = x; tPos[i3 + 1] = groundHeight(x, z); tPos[i3 + 2] = z;
  }
}
for (let j = 0; j < SEG; j++) tIdx.push(0, vIndex(1, j + 1), vIndex(1, j));
for (let ring = 1; ring < RINGS; ring++) {
  for (let j = 0; j < SEG; j++) {
    const a = vIndex(ring, j), b = vIndex(ring, j + 1), c = vIndex(ring + 1, j), d = vIndex(ring + 1, j + 1);
    tIdx.push(a, b, c, b, d, c);
  }
}
const terrainGeo = new THREE.BufferGeometry();
terrainGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
terrainGeo.setIndex(tIdx);
terrainGeo.computeVertexNormals();
{
  const nrm = terrainGeo.attributes.normal.array;
  const cA = new THREE.Color('#8ab84e'), cB = new THREE.Color('#5a9242'), cC = new THREE.Color('#b0c862'),
        cMoss = new THREE.Color('#4a8247'), cDirt = new THREE.Color('#86683f'), cRock = new THREE.Color('#8e8777'),
        cWet = new THREE.Color('#8d8860'), cGravel = new THREE.Color('#7b8b86'), cDeep = new THREE.Color('#47666a'),
        cLip = new THREE.Color('#6a5a36'), col = new THREE.Color();
  for (let i = 0; i < tCount; i++) {
    const x = tPos[i * 3], h = tPos[i * 3 + 1], z = tPos[i * 3 + 2], ny = nrm[i * 3 + 1];
    col.copy(cB).lerp(cA, fbm(x * 0.33 + 3, z * 0.33 + 9, 3));
    col.lerp(cC, sstep(0.55, 0.8, fbm(x * 0.17 - 5, z * 0.17 + 4, 2)) * 0.8);
    col.lerp(cMoss, sstep(0.6, 0.74, fbm(x * 0.5 + 20, z * 0.5 - 7, 3)) * 0.85);
    col.lerp(cWet, sstep(0.17, 0.0, h) * 0.9);
    col.lerp(cGravel, sstep(0.04, -0.12, h));
    col.lerp(cDeep, sstep(-0.25, -0.6, h));
    col.lerp(cDirt, sstep(0.9, 0.74, ny) * 0.7);
    col.lerp(cRock, sstep(0.78, 0.55, ny));
    const rn = Math.hypot(x, z) / rimRadius(Math.atan2(z, x));
    col.lerp(cLip, sstep(0.93, 1.0, rn) * 0.65);
    tCol[i * 3] = col.r; tCol[i * 3 + 1] = col.g; tCol[i * 3 + 2] = col.b;
  }
}
terrainGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.97 }));
terrain.receiveShadow = true; terrain.castShadow = true;
scene.add(terrain);

/* fast height lookup (bilinear grid) for particles */
const HG_N = 96, HG_R = 17;
const heightGrid = new Float32Array((HG_N + 1) * (HG_N + 1));
for (let iz = 0; iz <= HG_N; iz++) for (let ix = 0; ix <= HG_N; ix++) {
  heightGrid[iz * (HG_N + 1) + ix] = groundHeight((ix / HG_N * 2 - 1) * HG_R, (iz / HG_N * 2 - 1) * HG_R);
}
function groundFast(x, z) {
  const fx = clamp((x / HG_R * 0.5 + 0.5) * HG_N, 0, HG_N - 0.001), fz = clamp((z / HG_R * 0.5 + 0.5) * HG_N, 0, HG_N - 0.001);
  const ix = Math.floor(fx), iz = Math.floor(fz), tx = fx - ix, tz = fz - iz, W = HG_N + 1;
  const a = heightGrid[iz * W + ix], b = heightGrid[iz * W + ix + 1], c = heightGrid[(iz + 1) * W + ix], d = heightGrid[(iz + 1) * W + ix + 1];
  return mix(mix(a, b, tx), mix(c, d, tx), tz);
}

/* =====================================================================
   Layered earth underside (floating island)
   ===================================================================== */
const rimTop = [];
for (let j = 0; j < SEG; j++) { const i3 = vIndex(RINGS, j) * 3; rimTop.push(new THREE.Vector3(tPos[i3], tPos[i3 + 1], tPos[i3 + 2])); }
{
  const K = 7, depth = [0, 0.4, 1.1, 2.3, 3.9, 5.8, 8.0, 9.0], scl = [1, 0.995, 0.955, 0.86, 0.7, 0.45, 0.14, 0.02];
  const pos = [], col = [], idx = [];
  const palette = ['#5f7c3a', '#6d4d2f', '#8a6a46', '#7a6a58', '#6f655c', '#5b524b', '#4a443f', '#4a443f'];
  const c1 = new THREE.Color();
  for (let k = 0; k <= K; k++) {
    for (let j = 0; j < SEG; j++) {
      const th = j / SEG * TAU, top = rimTop[j], cs = Math.cos(th), sn = Math.sin(th);
      const n1 = vnoise(cs * 2.6 + k * 5.1, sn * 2.6 + k * 1.7), n2 = vnoise(cs * 5.5 - k * 2.2, sn * 5.5 + 9.0);
      const s = scl[k] * (1 + (n1 - 0.5) * 0.2 * Math.min(k, 4) / 4);
      pos.push(top.x * s, top.y - depth[k] - (k > 0 ? n2 * 0.4 * k : 0), top.z * s);
      c1.set(palette[k]);
      c1.offsetHSL(0, 0, (vnoise(cs * 9 + k, sn * 9) - 0.5) * 0.12);
      if (k >= 1 && k <= 3) c1.lerp(new THREE.Color('#5c8a44'), sstep(0.7, 0.82, vnoise(cs * 4 + 3, sn * 4 + k)) * 0.5);
      col.push(c1.r, c1.g, c1.b);
    }
  }
  for (let k = 0; k < K; k++) for (let j = 0; j < SEG; j++) {
    const a = k * SEG + j, b = k * SEG + (j + 1) % SEG, c = (k + 1) * SEG + j, d = (k + 1) * SEG + (j + 1) % SEG;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  const flat = g.toNonIndexed(); flat.computeVertexNormals();
  const skirt = new THREE.Mesh(flat, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1.0 }));
  skirt.castShadow = true; skirt.receiveShadow = true;
  scene.add(skirt);

  /* hanging rock chunks beneath the island */
  const chunk = new Batch(0.1);
  const hang = new THREE.IcosahedronGeometry(1, 1);
  const hp = hang.attributes.position;
  for (let i = 0; i < hp.count; i++) {
    const x = hp.getX(i), y = hp.getY(i), z = hp.getZ(i), k = 1 + (posHash(x, y, z) - 0.5) * 0.45;
    hp.setXYZ(i, x * k, y * k * 1.25, z * k);
  }
  hang.computeVertexNormals();
  for (let i = 0; i < 7; i++) {
    const a = rr(0, TAU), d = rr(0.5, 3.4), s = rr(0.5, 1.2);
    chunk.add(hang, pick(['#554c45', '#605750', '#4a443f', '#6a5d50']), M(Math.cos(a) * d, -rr(8.2, 10.2), Math.sin(a) * d, rr(-0.4, 0.4), rr(0, TAU), rr(-0.4, 0.4), s, s * rr(1.0, 1.6), s));
  }
  const hm = chunk.build(matPlain); if (hm) scene.add(hm);
}

/* =====================================================================
   Water: re-uses terrain vertices below sea level, exact shoreline fade
   ===================================================================== */
const waterUniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
  uTime: { value: 0 },
  uSunDir: { value: SUN_DIR },
  uShallow: { value: new THREE.Color('#6fb9a6') },
  uDeep: { value: new THREE.Color('#1d5f7a') },
  uSkyLow: { value: new THREE.Color('#f6cdb8') },
  uSkyHigh: { value: new THREE.Color('#8fb0e0') },
  uSunCol: { value: new THREE.Color('#ffc78e') }
}]);
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms, transparent: true, depthWrite: false, fog: true,
  vertexShader: `
    attribute float aDepth; varying float vDepth; varying vec3 vWorld; uniform float uTime;
    #include <fog_pars_vertex>
    void main(){
      vec3 p = position;
      float k = smoothstep(0.0, 0.4, aDepth);
      p.y += (sin(p.x * 1.7 + uTime * 1.1) * 0.5 + sin(p.z * 2.3 - uTime * 0.9) * 0.5) * 0.014 * k;
      vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
      vWorld = (modelMatrix * vec4(p, 1.0)).xyz; vDepth = aDepth;
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: `
    varying float vDepth; varying vec3 vWorld;
    uniform float uTime; uniform vec3 uSunDir, uShallow, uDeep, uSkyLow, uSkyHigh, uSunCol;
    #include <fog_pars_fragment>
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1,0)), f.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y); }
    vec2 waveGrad(vec2 p, float t){
      vec2 g = vec2(0.0);
      float a = p.x * 1.9 + p.y * 0.8 + t * 0.9;  g += vec2(1.9, 0.8) * cos(a) * 0.5;
      float b = p.x * -1.3 + p.y * 2.1 - t * 0.7; g += vec2(-1.3, 2.1) * cos(b) * 0.4;
      float c = p.x * 3.7 + p.y * 2.9 + t * 1.6;  g += vec2(3.7, 2.9) * cos(c) * 0.16;
      float d = p.x * 0.6 - p.y * 4.1 + t * 1.2;  g += vec2(0.6, -4.1) * cos(d) * 0.12;
      return g;
    }
    void main(){
      vec2 flow = vec2(-0.35, 0.3) * uTime;
      vec2 p = vWorld.xz + flow;
      vec3 N = normalize(vec3(-waveGrad(p, uTime).x * 0.045, 1.0, -waveGrad(p, uTime).y * 0.045));
      vec3 V = normalize(cameraPosition - vWorld);
      float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      float dp = clamp(vDepth, 0.0, 1.0);
      vec3 col = mix(uShallow, uDeep, smoothstep(0.0, 0.62, dp));
      vec3 R = reflect(-V, N);
      vec3 skyc = mix(uSkyLow, uSkyHigh, clamp(R.y * 1.6, 0.0, 1.0));
      col = mix(col, skyc, 0.12 + fres * 0.5);
      vec3 H = normalize(uSunDir + V);
      float spec = pow(max(dot(N, H), 0.0), 220.0);
      col += uSunCol * spec * 1.4;
      float rip = vn(p * 3.2 + vec2(uTime * 0.25, -uTime * 0.2)) * vn(p * 5.7 - vec2(uTime * 0.3, uTime * 0.15));
      col += vec3(0.9, 1.0, 0.95) * smoothstep(0.34, 0.5, rip) * 0.1;
      float foam = (1.0 - smoothstep(0.015, 0.16, vDepth)) * (0.35 + 0.65 * vn(p * 7.0 + uTime * 0.4));
      col = mix(col, vec3(0.96, 0.98, 0.94), foam * 0.55);
      float alpha = mix(0.0, 0.93, smoothstep(0.0, 0.1, vDepth));
      alpha = mix(alpha, alpha * 0.82, 1.0 - smoothstep(0.1, 0.5, dp));
      gl_FragColor = vec4(col, alpha);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`
});
{
  const wp = [], wd = [];
  for (let t = 0; t < tIdx.length; t += 3) {
    const ia = tIdx[t], ib = tIdx[t + 1], ic = tIdx[t + 2];
    if (Math.min(tPos[ia * 3 + 1], tPos[ib * 3 + 1], tPos[ic * 3 + 1]) < -0.01) {
      for (const i of [ia, ib, ic]) { wp.push(tPos[i * 3], WATER_Y, tPos[i * 3 + 2]); wd.push(WATER_Y - tPos[i * 3 + 1]); }
    }
  }
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
  wg.setAttribute('aDepth', new THREE.Float32BufferAttribute(wd, 1));
  const water = new THREE.Mesh(wg, waterMat);
  water.renderOrder = 2; water.frustumCulled = false;
  scene.add(water);
}

/* waterfall where the river leaves the island */
const fallUniforms = { uTime: waterUniforms.uTime };
const fallMat = new THREE.ShaderMaterial({
  uniforms: fallUniforms, transparent: true, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `attribute vec2 aUV; varying vec2 vUv; void main(){ vUv = aUV; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv; uniform float uTime;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1,0)), f.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y); }
    void main(){
      float streak = vn(vec2(vUv.x * 22.0, vUv.y * 3.0 - uTime * 2.4)) * 0.6 + vn(vec2(vUv.x * 48.0, vUv.y * 6.0 - uTime * 3.6)) * 0.4;
      float edge = smoothstep(0.0, 0.18, vUv.x) * smoothstep(1.0, 0.82, vUv.x);
      float fade = 1.0 - smoothstep(0.35, 1.0, vUv.y);
      vec3 col = mix(vec3(0.55, 0.82, 0.88), vec3(1.0), streak * 0.8 + (1.0 - smoothstep(0.0, 0.12, vUv.y)) * 0.6);

      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const fallSpout = { x: 0, y: 0, z: 0, nx: 0, nz: 0, w: 1, cx: 0, cz: 0 };
{
  const cols = [];
  for (let j = 0; j < SEG; j++) if (rimTop[j].y < -0.02) cols.push(j);
  if (cols.length > 1) {
    const rows = 16, pos = [], uvs = [], idx = [];
    const n = cols.length;
    for (let v = 0; v <= rows; v++) {
      const f = v / rows;
      for (let c = 0; c < n; c++) {
        const rp = rimTop[cols[c]], th = Math.atan2(rp.z, rp.x), ox = Math.cos(th), oz = Math.sin(th);
        const out = 0.06 + 1.1 * f * f;
        pos.push(rp.x + ox * out, WATER_Y - f * 8.5, rp.z + oz * out);
        uvs.push(c / (n - 1), f);
      }
    }
    for (let v = 0; v < rows; v++) for (let c = 0; c < n - 1; c++) {
      const a = v * n + c, b = a + 1, d = (v + 1) * n + c, e = d + 1;
      idx.push(a, d, b, b, d, e);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('aUV', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    const fall = new THREE.Mesh(g, fallMat);
    fall.renderOrder = 3; fall.frustumCulled = false;
    scene.add(fall);
    const mid = rimTop[cols[Math.floor(n / 2)]];
    fallSpout.x = mid.x; fallSpout.z = mid.z; fallSpout.w = n * (TAU * 12 / SEG) * 0.5;
    const th = Math.atan2(mid.z, mid.x); fallSpout.nx = Math.cos(th); fallSpout.nz = Math.sin(th);
  }
}

/* =====================================================================
   Placement helpers
   ===================================================================== */
const OCC = [];
const occupy = (x, z, r) => OCC.push({ x, z, r });
function occupied(x, z, pad = 0) {
  for (let i = 0; i < OCC.length; i++) {
    const o = OCC[i], dx = x - o.x, dz = z - o.z, r = o.r + pad;
    if (dx * dx + dz * dz < r * r) return true;
  }
  return false;
}
function landOK(x, z, { rim = 0.9, river = 0.5 } = {}) {
  if (Math.hypot(x, z) > rimRadius(Math.atan2(z, x)) - rim) return false;
  riverQuery(x, z);
  return RQ.d > RQ.w * 1.6 + 0.55 + river;
}
function riverFrame(u) {
  const p = riverCurve.getPointAt(u), t = riverCurve.getTangentAt(u);
  const tl = Math.hypot(t.x, t.z) || 1;
  return { x: p.x, z: p.z, tx: t.x / tl, tz: t.z / tl, w: riverW[Math.min(RIVER_N, Math.round(u * RIVER_N))] };
}

/* =====================================================================
   Traditional roof: curved eaves, tile texture, thick fascia, ridge caps
   ===================================================================== */
function buildRoof(o, wood, plaster) {
  const { W, D } = o, sw = D / 2, rise = o.rise, tk = o.tk ?? 0.14;
  const rx = Math.max((W - D) / 2, 0.001);
  const x1 = W / 2 + o.os, z0 = -(D / 2 + o.ob), z1 = D / 2 + o.of;
  const lift = o.lift ?? 0.12, corner = o.corner ?? 0.16, bulge = o.bulge ?? 0;
  const yOff = o.Hw + tk;
  const gable = o.style === 'gable';
  const F = (u) => u <= 1 ? 0.6 * u + 0.4 * (1 - (1 - u) * (1 - u)) : 1 + 0.6 * (u - 1);
  const sDist = (x, z) => gable ? Math.abs(z) : Math.max(Math.abs(z), Math.max(Math.abs(x) - rx, 0));
  const roofY = (x, z) => {
    const u = sDist(x, z) / sw;
    let y = rise * (1 - F(u)) + bulge * Math.sin(Math.min(u / 1.5, 1) * Math.PI);
    const ex = x1 - Math.abs(x), ez = Math.min(z - z0, z1 - z), e = Math.min(ex, ez);
    y += lift * Math.pow(1 - sstep(0, 0.7, e), 2);
    y += corner * (1 - sstep(0, 1.0, ex)) * (1 - sstep(0, 1.0, ez));
    return y;
  };
  const nx = 64, nz = 48, W1 = nx + 1, vc = W1 * (nz + 1);
  const pos = new Float32Array(vc * 3), uv = new Float32Array(vc * 2);
  const us = o.uvScale ?? 1;
  for (let j = 0; j <= nz; j++) for (let i = 0; i <= nx; i++) {
    const x = mix(-x1, x1, i / nx), z = mix(z0, z1, j / nz), k = j * W1 + i;
    pos[k * 3] = x; pos[k * 3 + 1] = roofY(x, z) + yOff; pos[k * 3 + 2] = z;
    const long = gable || Math.abs(z) >= Math.max(Math.abs(x) - rx, 0);
    uv[k * 2] = (long ? x : z * (x < 0 ? -1 : 1)) * 0.9 * us;
    uv[k * 2 + 1] = -sDist(x, z) * 1.15 * us;
  }
  const idx = [], idxR = [];
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const a = j * W1 + i, b = (j + 1) * W1 + i, c = a + 1, d = b + 1;
    idx.push(a, b, c, c, b, d); idxR.push(a, c, b, c, d, b);
  }
  const top = new THREE.BufferGeometry();
  top.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  top.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  top.setIndex(idx); top.computeVertexNormals();

  const under = new THREE.BufferGeometry();
  const up2 = pos.slice(); for (let k = 0; k < vc; k++) up2[k * 3 + 1] -= tk;
  under.setAttribute('position', new THREE.BufferAttribute(up2, 3)); under.setIndex(idxR); under.computeVertexNormals();
  wood.add(under, o.cUnder ?? '#3b2c22', null, false);

  const ring = [];
  for (let i = 0; i <= nx; i++) ring.push(i);
  for (let j = 1; j <= nz; j++) ring.push(j * W1 + nx);
  for (let i = nx - 1; i >= 0; i--) ring.push(nz * W1 + i);
  for (let j = nz - 1; j >= 1; j--) ring.push(j * W1);
  const tp = [];
  for (let n = 0; n < ring.length; n++) {
    const A = ring[n] * 3, B = ring[(n + 1) % ring.length] * 3;
    const ax = pos[A], ay = pos[A + 1], az = pos[A + 2], bx = pos[B], by = pos[B + 1], bz = pos[B + 2];
    tp.push(ax, ay, az, bx, by, bz, ax, ay - tk, az, bx, by, bz, bx, by - tk, bz, ax, ay - tk, az);
  }
  const trim = new THREE.BufferGeometry();
  trim.setAttribute('position', new THREE.Float32BufferAttribute(tp, 3)); trim.computeVertexNormals();
  wood.add(trim, o.cFascia ?? '#2f231b', null, false);

  const cap = o.cCap ?? '#2b2e37';
  const capPts = (fn, n, a, b) => { const r = []; for (let i = 0; i < n; i++) { const t = mix(a, b, i / (n - 1)); r.push(fn(t)); } return r; };
  if (gable) {
    wood.sweep(capPts((x) => new THREE.Vector3(x, roofY(x, 0) + yOff + 0.07, 0), 24, -x1 + 0.03, x1 - 0.03), 0.28, 0.17, cap);
    for (const s of [-1, 1]) {
      wood.box(0.3, 0.36, 0.3, s * (x1 - 0.12), roofY(x1 - 0.12, 0) + yOff + 0.2, 0, cap);
      wood.box(0.22, 0.16, 0.24, s * (x1 - 0.12), roofY(x1 - 0.12, 0) + yOff + 0.44, 0, cap, 0, 0, s * 0.3);
    }
    const ge = new Batch(0);
    for (const s of [-1, 1]) {
      const n = 16, vv = [];
      const zs = [], ys = [];
      for (let i = 0; i <= n; i++) { const z = mix(-sw, sw, i / n); zs.push(z); ys.push(o.Hw + rise * (1 - F(Math.abs(z) / sw)) - 0.02); }
      for (let i = 0; i < n; i++) {
        const xx = s * (W / 2 - 0.01);
        const b0 = [xx, o.Hw, zs[i]], b1 = [xx, o.Hw, zs[i + 1]], t0 = [xx, ys[i], zs[i]], t1 = [xx, ys[i + 1], zs[i + 1]];
        if (s > 0) vv.push(...b0, ...t1, ...b1, ...b0, ...t0, ...t1); else vv.push(...b0, ...b1, ...t1, ...b0, ...t1, ...t0);
      }
      const gg = new THREE.BufferGeometry();
      gg.setAttribute('position', new THREE.Float32BufferAttribute(vv, 3)); gg.computeVertexNormals();
      plaster.add(gg, o.cGable ?? '#e6dbc0', null, true);
      wood.box(0.12, rise * 0.92, 0.12, s * (W / 2 + 0.03), o.Hw + rise * 0.46, 0, o.cBeam ?? '#3b281c');
      const zAt = (hRel) => { let lo = 0, hi = 1; for (let k = 0; k < 20; k++) { const m = (lo + hi) / 2; if (rise * (1 - F(m)) > hRel) lo = m; else hi = m; } return lo * sw; };
      const z1b = Math.max(0.1, zAt(0.3 + 0.1) - 0.04), z2b = Math.max(0.1, zAt(rise * 0.62 + 0.1) - 0.04);
      wood.box(0.1, 0.1, z1b * 2, s * (W / 2 + 0.03), o.Hw + 0.3, 0, o.cBeam ?? '#3b281c');
      wood.box(0.09, 0.09, z2b * 2, s * (W / 2 + 0.03), o.Hw + rise * 0.62, 0, o.cBeam ?? '#3b281c');
    }
  } else {
    if (rx > 0.06) wood.sweep(capPts((x) => new THREE.Vector3(x, roofY(x, 0) + yOff + 0.07, 0), 8, -rx, rx), 0.28, 0.17, cap);
    for (const s of [-1, 1]) {
      wood.box(0.3, 0.36, 0.3, s * rx, roofY(rx, 0) + yOff + 0.2, 0, cap);
      for (const sz of [-1, 1]) {
        const tEnd = Math.min(sz > 0 ? z1 : -z0, x1 - rx) - 0.03;
        wood.sweep(capPts((t) => new THREE.Vector3(s * (rx + t), roofY(s * (rx + t), sz * t) + yOff + 0.05, sz * t), 14, 0, tEnd), 0.17, 0.13, cap);
      }
    }
  }
  /* exposed rafter ends under the long eaves */
  if (!o.noRafters) for (const zz of [z1 - 0.1, z0 + 0.1]) for (let x = -x1 + 0.45; x < x1 - 0.3; x += 0.32) {
    wood.box(0.07, 0.07, 0.3, x, roofY(x, zz) + yOff - tk - 0.06, zz, '#3b2c22', 0, 0, 0);
  }
  return { top, roofYAbs: (x, z) => roofY(x, z) + o.Hw, yOff };
}

/* =====================================================================

const houseGlow = [];
function makeHouse(c) {
  const g = new THREE.Group();
  const wood = new Batch(0.07), plaster = new Batch(0.035), stone = new Batch(0.09), shoji = new Batch(0), chochin = new Batch(0.05);
  const { W, D, Hw, fh } = c, hh = Hw - fh, pw = c.porch || 0, beamC = c.cBeam, latC = c.cLattice ?? '#5a4331';
  stone.box(W + 0.26, fh, D + 0.26, 0, fh / 2, 0, c.cStone);
  /* rounded stones along the foundation (hand-laid look) */
  for (const sz of [-1, 1]) for (let x = -W / 2 - 0.1; x <= W / 2 + 0.1; x += 0.46) {
    stone.sph(rr(0.14, 0.2), x + rr(-0.05, 0.05), 0.1, sz * (D / 2 + 0.17) + rr(-0.03, 0.03), pick(['#8e897d', '#7c786e', '#9a9486']), 1, 0.7, 0.9, 1);
  }
  plaster.box(W - 0.04, hh, D - 0.04, 0, fh + hh / 2, 0, c.cPlaster);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) wood.box(0.2, hh, 0.2, sx * W / 2, fh + hh / 2, sz * D / 2, beamC);

  const frameCommon = (len) => {
    wood.box(len + 0.2, 0.2, 0.18, 0, hh - 0.1, 0.05, beamC);
    wood.box(len, 0.08, 0.14, 0, hh - 0.52, 0.045, beamC);
    wood.box(len, 0.12, 0.16, 0, 0.06, 0.05, beamC);
  };
  const windowAt = (cx, cy, w, h) => {
    const t = 0.06;
    wood.box(w + t * 2, t, 0.1, cx, cy + h / 2 + t / 2, 0.05, beamC);
    wood.box(w + t * 2, t, 0.1, cx, cy - h / 2 - t / 2, 0.05, beamC);
    wood.box(t, h, 0.1, cx - w / 2 - t / 2, cy, 0.05, beamC);
    wood.box(t, h, 0.1, cx + w / 2 + t / 2, cy, 0.05, beamC);
    shoji.add(new THREE.PlaneGeometry(w, h), '#ffffff', M(cx, cy, 0.035), false);
    const nv = Math.max(2, Math.round(w / 0.3)), nh = Math.max(2, Math.round(h / 0.32));
    for (let k = 1; k < nv; k++) wood.box(0.022, h, 0.03, cx - w / 2 + k * w / nv, cy, 0.062, latC);
    for (let k = 1; k < nh; k++) wood.box(w, 0.022, 0.03, cx, cy - h / 2 + k * h / nh, 0.062, latC);
  };
  const barWindow = (cx, cy, w, h) => {
    wood.box(w + 0.12, h + 0.12, 0.08, cx, cy, 0.03, beamC);
    wood.box(w, h, 0.06, cx, cy, 0.05, '#241c18');
    for (let k = -2; k <= 2; k++) wood.box(0.03, h, 0.04, cx + k * w / 5, cy, 0.09, '#54402f');
  };
  const wallFront = () => {
    const nb = c.bays, bw = W / nb;
    frameCommon(W);
    for (let i = 1; i < nb; i++) wood.box(0.14, hh, 0.14, -W / 2 + i * bw, hh / 2, 0.05, beamC);
    for (let i = 0; i < nb; i++) {
      const cx = -W / 2 + (i + 0.5) * bw, pwid = bw - 0.22;
      if (i === c.doorBay) {
        const hd = hh - 0.72;
        wood.box(pwid, hd, 0.07, cx, 0.12 + hd / 2, 0.03, c.cDoor);
        for (let k = -2; k <= 2; k++) wood.box(0.035, hd - 0.1, 0.03, cx + k * pwid / 5.2, 0.12 + hd / 2, 0.068, '#3a281c');
        wood.box(pwid, 0.07, 0.035, cx, 0.12 + hd * 0.33, 0.075, '#33241a');
        wood.box(pwid, 0.07, 0.035, cx, 0.12 + hd * 0.7, 0.075, '#33241a');
        wood.box(0.05, 0.22, 0.04, cx + pwid / 2 - 0.12, 0.12 + hd * 0.5, 0.09, '#1c1410');
      } else if (c.solidFront) {
        barWindow(cx, hh * 0.58, 0.5, 0.55);
      } else {
        const ps = hh - 1.1, y0 = 0.5;
        wood.box(pwid, 0.36, 0.05, cx, 0.3, 0.025, c.cDoor);
        windowAt(cx, y0 + ps / 2, pwid, ps);
      }
    }
  };
  const wallPlain = (len, win) => {
    frameCommon(len);
    const n = Math.max(1, Math.round(len / 1.5));
    for (let i = 1; i < n; i++) wood.box(0.13, hh, 0.13, -len / 2 + i * len / n, hh / 2, 0.045, beamC);
    if (!c.siding) wood.box(len, 0.07, 0.12, 0, hh * 0.42, 0.04, beamC);
    else for (let x = -len / 2 + 0.22; x < len / 2 - 0.15; x += 0.27) wood.box(0.022, hh - 0.75, 0.02, x, hh * 0.46, 0.0, '#4d3826');
    if (win) {
      const wx = -len / 2 + (Math.floor(n / 2) + 0.5) * len / n, ww = Math.min(1.0, len / n - 0.34);
      if (c.solidFront) barWindow(wx, hh * 0.58, ww * 0.7, 0.5); else windowAt(wx, hh * 0.52 + 0.08, ww, 0.95);
    }
  };
  useBase(M(0, fh, D / 2)); wallFront(); clearBase();
  useBase(M(0, fh, -D / 2, 0, Math.PI)); wallPlain(W, true); clearBase();
  useBase(M(W / 2, fh, 0, 0, Math.PI / 2)); wallPlain(D, true); clearBase();
  useBase(M(-W / 2, fh, 0, 0, -Math.PI / 2)); wallPlain(D, true); clearBase();

  /* roof first (porch columns need its underside height) */
  const roof = buildRoof({ W, D, Hw, style: c.style, rise: c.rise, os: c.os, ob: c.ob, of: c.of, tk: c.tk, bulge: c.bulge, uvScale: c.uvScale,
    cCap: c.cCap, cBeam: beamC, cGable: c.cPlaster, lift: c.lift, corner: c.corner, noRafters: c.thatch, cUnder: c.cUnder, cFascia: c.cFascia }, wood, plaster);

  if (pw > 0) {
    const zf = D / 2, np = Math.round(pw / 0.17), bw = W / c.bays, doorX = -W / 2 + (c.doorBay + 0.5) * bw;
    for (let k = 0; k < np; k++) wood.box(W + 0.44, 0.09, pw / np - 0.012, 0, fh - 0.06, zf + (k + 0.5) * pw / np, c.cDeck);
    stone.box(W + 0.34, fh - 0.12, pw - 0.1, 0, (fh - 0.12) / 2, zf + pw / 2 - 0.05, c.cStone);
    wood.box(W + 0.44, 0.14, 0.14, 0, fh - 0.12, zf + pw + 0.03, beamC);
    for (const cx of c.cols) {
      const zc = zf + pw - 0.1, top = roof.roofYAbs(cx, zc) - 0.02;
      wood.cyl(0.085, 0.095, top - fh, 10, cx, fh + (top - fh) / 2, zc, beamC);
      stone.cyl(0.14, 0.16, 0.1, 8, cx, 0.05 + (fh - 0.1) * 0.0 + 0.0, zc, c.cStone);
    }
    const rail = (x0, z0, x1, z1) => {
      const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz), ry = Math.atan2(-dz, dx), n = Math.max(1, Math.ceil(L / 0.7));
      for (let i = 0; i <= n; i++) wood.box(0.07, 0.5, 0.07, x0 + dx * i / n, fh + 0.25, z0 + dz * i / n, beamC);
      wood.box(L, 0.06, 0.08, (x0 + x1) / 2, fh + 0.52, (z0 + z1) / 2, beamC, ry);
      wood.box(L, 0.04, 0.05, (x0 + x1) / 2, fh + 0.27, (z0 + z1) / 2, beamC, ry);
    };
    const hx = W / 2 + 0.18, zr = zf + pw - 0.02, gap = bw / 2 + 0.2;
    rail(-hx, zf + 0.1, -hx, zr); rail(hx, zf + 0.1, hx, zr);
    rail(-hx, zr, doorX - gap, zr); rail(doorX + gap, zr, hx, zr);
    stone.box(bw + 0.5, 0.17, 0.46, doorX, 0.085, zf + pw + 0.45, c.cStone);
    stone.box(bw + 0.34, 0.3, 0.3, doorX, 0.15, zf + pw + 0.15, c.cStone);
    if (c.chochin) for (const cx of c.chochin) {
      const zc = zf + pw - 0.25, yTop = roof.roofYAbs(cx, zc) - 0.14, yL = yTop - 0.45;
      wood.cyl(0.012, 0.012, 0.3, 4, cx, yTop - 0.15, zc, '#2a1d14');
      chochin.sph(0.19, cx, yL, zc, '#e5472b', 1, 1.3, 1, 1);
      chochin.cyl(0.08, 0.08, 0.05, 8, cx, yL + 0.27, zc, '#241a14');
      chochin.cyl(0.08, 0.08, 0.05, 8, cx, yL - 0.27, zc, '#241a14');
    }
    if (c.noren) {
      const yTop = fh + hh - 0.55, bwid = (bw - 0.4) / 3;
      for (let k = -1; k <= 1; k++) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(bwid - 0.03, 0.62), matNoren);
        m.position.set(doorX + k * bwid, yTop - 0.31, zf + 0.15); m.castShadow = true; g.add(m);
      }

  const parts = [
    [wood.build(matWood), 1], [plaster.build(matPlaster), 1], [stone.build(matStone), 1], [chochin.build(matChochin), 1]
  ];

  rm.castShadow = true; rm.receiveShadow = true; g.add(rm);

  /* soft window glow in front of the shoji screens */
  if (!c.solidFront) {
    const sp = new THREE.Sprite(glowMat);
    sp.position.set(0, fh + hh * 0.5, D / 2 + 0.5); sp.scale.set(W * 0.95, hh * 0.9, 1);
    g.add(sp); houseGlow.push(sp);
  }

  return g;
}

const BRIDGE_U = 0.4;
const bridgeInfo = {};
{

  if (ax < 0) { ax = -ax; az = -az; }
  const sR = bankDist(fr, ax, az, fr.w) + 0.5, sL = bankDist(fr, -ax, -az, fr.w) + 0.5;
  const L = sR + sL, off = (sR - sL) / 2;
  const cx = fr.x + ax * off, cz = fr.z + az * off;
  const yL = groundHeight(fr.x - ax * sL, fr.z - az * sL) + 0.16, yR = groundHeight(fr.x + ax * sR, fr.z + az * sR) + 0.16;
  const ARCH = 1.0;

  const wood = new Batch(0.07), stone = new Batch(0.08), red = new Batch(0.03);

  for (let i = 0; i < nPl; i++) {
    const x = -L / 2 + (i + 0.5) * L / nPl, slope = Math.atan((deckY(x + 0.05) - deckY(x - 0.05)) / 0.1);
    wood.box(L / nPl * 0.9, 0.085, 1.62, x, deckY(x) - 0.04, 0, pick(['#9c7347', '#a67c4d', '#8f6840', '#b0875a']), rr(-0.015, 0.015), 0, slope);

  }
  const line = (z, dy, n = 34) => { const r = []; for (let i = 0; i < n; i++) { const x = -L / 2 + L * i / (n - 1); r.push(new THREE.Vector3(x, deckY(x) + dy, z)); } return r; };
  for (const z of [-0.66, 0.66]) {
    wood.sweep(line(z, -0.3), 0.2, 0.28, '#6d4a2d');

  const nP = Math.round(L / 0.8);
  for (let i = 0; i <= nP; i++) for (const z of [-0.8, 0.8]) {

      red.sph(0.115, x, deckY(x) + 1.12, z, '#c4452a', 1, 1.15, 1, 1);
    }
  }
  for (const s of [-1, 1]) {
    const y = s < 0 ? yL : yR;
    stone.box(1.3, y + 0.62, 2.15, s * (L / 2 - 0.1), (y - 0.62 - 0.1) / 2, 0, '#8a857a');
    stone.box(1.0, 0.18, 1.9, s * (L / 2 - 0.1), y - 0.09, 0, '#9a9488');
    for (let k = 0; k < 4; k++) stone.sph(rr(0.25, 0.4), s * (L / 2 + rr(-0.2, 0.5)), y - 0.35, rr(-1.2, 1.2), pick(['#8f8a7c', '#7b776c', '#9a9586']), 1, 0.7, 1, 1);
  }

    left: new THREE.Vector3(fr.x - ax * (sL + 0.7), 0, fr.z - az * (sL + 0.7)),

const boat = new THREE.Group();
{
  const L = 2.7, ns = 18, nu = 9, hull = [], inner = [];
  const prof = (s, u, inset) => {
    const e = Math.abs(2 * s - 1), b = 0.48 * Math.pow(Math.sin(Math.PI * clamp(s, 0.02, 0.98)), 0.55) - inset;
    const yb = -0.13 + 0.18 * Math.pow(e, 3) + inset * 0.2;
    const yt = 0.36 + 0.22 * Math.pow(e, 3);
    return [(s - 0.5) * L, mix(yb, yt, Math.pow(Math.abs(u), 1.7)), u * b];
  };
  const build = (inset, color, flip) => {
    const pos = [], idx = [];
    for (let i = 0; i <= ns; i++) for (let j = 0; j <= nu; j++) pos.push(...prof(i / ns, (j / nu) * 2 - 1, inset));
    for (let i = 0; i < ns; i++) for (let j = 0; j < nu; j++) {
      const a = i * (nu + 1) + j, b = a + 1, c = (i + 1) * (nu + 1) + j, d = c + 1;
      if (flip) idx.push(a, b, c, b, d, c); else idx.push(a, c, b, b, c, d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    const mid = Math.floor(ns / 2) * (nu + 1) + Math.floor(nu / 2);
    return [g, mid];
  };
  const b1 = new Batch(0.05);
  let [g1, m1] = build(0, 0, false);
  if (g1.attributes.normal.getY(m1) > 0) [g1] = build(0, 0, true);
  let [g2, m2] = build(0.05, 0, true);
  if (g2.attributes.normal.getY(m2) < 0) [g2] = build(0.05, 0, false);
  b1.add(g1, '#86592f', null, false); b1.add(g2, '#b98f5c', null, false);
  const gun = (sg) => { const r = []; for (let i = 0; i <= ns; i++) { const p = prof(i / ns, sg, 0); r.push(new THREE.Vector3(p[0], p[1], p[2])); } return r; };
  b1.sweep(gun(-1), 0.06, 0.05, '#5e3f23'); b1.sweep(gun(1), 0.06, 0.05, '#5e3f23');
  for (const x of [-0.5, 0.4]) b1.box(0.12, 0.04, 0.82, x, 0.22, 0, '#a27a49');
  b1.box(0.5, 0.2, 0.34, 0.85, 0.12, 0, '#a98652');
  b1.rod(new THREE.Vector3(-1.0, 0.25, 0.2), new THREE.Vector3(1.2, 0.35, 0.3), 0.025, 0.025, '#b9a46a', 5);
  boat.add(b1.build(matPlain));
  boat.userData.base = new THREE.Vector3();

  boat.position.set(bx + dx * (Ld - 0.15) + fr.tx * 1.9, 0.0, bz + dz * (Ld - 0.15) + fr.tz * 1.9);

}

    const i0 = push(bx - px * w, 0, bz - pz * w, 0), i1 = push(bx + px * w, 0, bz + pz * w, 0);
    const i2 = push(bx + dx * bend * 0.4 - px * w * 0.6, h * 0.55, bz + dz * bend * 0.4 - pz * w * 0.6, 0.55);
    const i3 = push(bx + dx * bend * 0.4 + px * w * 0.6, h * 0.55, bz + dz * bend * 0.4 + pz * w * 0.6, 0.55);
    const i4 = push(bx + dx * bend, h, bz + dz * bend, 1);
    idx.push(i0, i1, i3, i0, i3, i2, i2, i3, i4);
  }

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  return g;
})();
{
  const spots = scatter(1500, (x, z) => fbm(x * 0.45 + 4, z * 0.45 - 2, 2) > 0.34 && groundHeight(x, z) > 0.18);
  const items = spots.map(([x, z]) => ({ x, y: groundHeight(x, z) - 0.02, z, ry: rr(0, TAU), s: rr(0.8, 1.6), c: pick(['#ffffff', '#eef8c8', '#d9eeaa', '#c6e19a', '#f6ffd8']) }));
  scene.add(makeInstanced(tuftGeo, matVeg, items));
}

/* flowers: stems + coloured heads in small meadow patches */
{
  const centers = scatter(30, (x, z) => groundHeight(x, z) > 0.3, { pathClear: 0.8, river: 0.3 });
  const fl = [];
  for (const [cx, cz] of centers) {
    const main = pick(['#ff8fb4', '#ffffff', '#ffd84a', '#ffa3c4', '#fff3f6']), n = Math.floor(rr(11, 20));
    for (let i = 0; i < n; i++) {
      const a = rr(0, TAU), d = Math.abs(rr(-1, 1)) * rr(0.2, 1.1), x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d;
      if (!landOK(x, z, { rim: 0.4, river: 0.0 }) || occupied(x, z, 0) || pathDist(x, z) < 0.6) continue;
      fl.push({ x, y: groundHeight(x, z) - 0.01, z, s: rr(0.8, 1.35), ry: rr(0, TAU), c: rand() < 0.7 ? main : pick(['#ff8fb4', '#ffffff', '#ffd84a', '#c8a8f4']) });
    }
  }
  const stem = new THREE.CylinderGeometry(0.008, 0.012, 0.22, 4); stem.translate(0, 0.11, 0);
  const head = new THREE.CircleGeometry(0.075, 6); head.rotateX(-Math.PI / 2 + 0.25); head.translate(0, 0.225, 0);
  const core = new THREE.IcosahedronGeometry(0.028, 0); core.translate(0, 0.235, 0);
  const strip = (arr) => arr.map(f => ({ ...f, c: undefined }));
  scene.add(makeInstanced(stem, new THREE.MeshStandardMaterial({ color: 0x4d8a3a, roughness: 1 }), strip(fl)));
  scene.add(makeInstanced(head, new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.8, emissive: 0x442233, emissiveIntensity: 0.25 }), fl));
  scene.add(makeInstanced(core, new THREE.MeshStandardMaterial({ color: 0xf2b630, roughness: 0.7 }), strip(fl)));
}

/* shrubs + azaleas (lumpy clusters, re-using the blossom construction) */
{
  const bushGeo = clusterGeometry(['#4a8838', '#5c9a44', '#3e7633', '#69a64a']);
  const bushMat = addSway(new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }), { amp: 0.03, speed: 1.0, useY: false });
  const azGeo = clusterGeometry(['#e0407c', '#f06aa0', '#c9306a', '#ff8cb8', '#4a8838']);
  const azMat = addSway(new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9, emissive: 0x7a1038, emissiveIntensity: 0.12 }), { amp: 0.025, speed: 1.0, useY: false });
  const items = [], az = [];
  const place = (list, x, z, s) => list.push({ x, y: groundHeight(x, z) + s * 0.1, z, sx: s * rr(1, 1.3), sy: s * rr(0.7, 0.9), sz: s * rr(1, 1.3), ry: rr(0, TAU), c: pick(['#ffffff', '#f0f8e0', '#dcebc4']) });
  const wallBush = (g, lx, lz, s, list = items) => { const p = houseWorld(g, lx, lz); place(list, p.x, p.z, s); };
  /* foundation planting */
  wallBush(mainHouse, -3.3, -1.0, 0.7); wallBush(mainHouse, -3.35, 0.9, 0.55); wallBush(mainHouse, 3.4, -0.8, 0.65); wallBush(mainHouse, 3.5, 1.2, 0.5);
  wallBush(mainHouse, -1.2, -2.5, 0.8); wallBush(mainHouse, 1.8, -2.55, 0.7);
  wallBush(teaHouse, -2.5, -0.6, 0.6); wallBush(teaHouse, 2.4, -0.4, 0.55); wallBush(teaHouse, 0.2, -2.0, 0.8);
  wallBush(farmHouse, -2.2, -0.9, 0.6); wallBush(farmHouse, 2.1, -0.8, 0.55); wallBush(farmHouse, 0, -1.9, 0.8);
  wallBush(kura, -1.7, 0.5, 0.55); wallBush(kura, 1.7, -0.6, 0.5);
  /* azaleas flanking entrances */
  wallBush(mainHouse, -0.8, 5.5, 0.52, az); wallBush(mainHouse, 2.2, 5.5, 0.5, az); wallBush(mainHouse, -2.9, 4.7, 0.45, az);
  wallBush(teaHouse, -1.35, 3.0, 0.45, az); wallBush(teaHouse, 1.4, 3.1, 0.42, az);
  wallBush(farmHouse, 0.3, 2.9, 0.4, az); wallBush(shrine, 2.0, 1.2, 0.5, az); wallBush(shrine, -2.0, 1.0, 0.5, az);
  for (const [x, z] of scatter(34, (x, z) => groundHeight(x, z) > 0.3, { pathClear: 0.9, river: 0.1, occPad: 0.3 })) place(items, x, z, rr(0.45, 0.85));
  for (const [x, z] of scatter(7, (x, z) => groundHeight(x, z) > 0.3, { pathClear: 1.0, river: 0.2, occPad: 0.3 })) place(az, x, z, rr(0.4, 0.6));
  scene.add(makeInstanced(bushGeo, bushMat, items, { cast: true }));
  scene.add(makeInstanced(azGeo, azMat, az, { cast: true }));
}

/* ferns around tree bases and rocky banks */
{
  const pos = [], col = [], nor = [], idx = [];
  const cb = new THREE.Color('#2d5e2a'), ct = new THREE.Color('#79b24a'), cm = new THREE.Color();
  for (let f = 0; f < 9; f++) {
    const a = f / 9 * TAU + rr(-0.2, 0.2), len = rr(0.42, 0.7), dx = Math.cos(a), dz = Math.sin(a), px = -dz, pz = dx, base = pos.length / 3;
    for (let s = 0; s <= 5; s++) {
      const t = s / 5, r = len * t, y = 0.06 + len * 0.55 * Math.sin(t * Math.PI * 0.9) * (1 - t * 0.2), w = 0.075 * Math.sin(Math.PI * (0.12 + 0.88 * t)) * (1 - 0.2 * t);
      cm.copy(cb).lerp(ct, t);
      for (const sd of [-1, 1]) { pos.push(dx * r + px * w * sd, y, dz * r + pz * w * sd); nor.push(0, 1, 0); col.push(cm.r, cm.g, cm.b); }
    }
    for (let s = 0; s < 5; s++) { const a0 = base + s * 2; idx.push(a0, a0 + 1, a0 + 2, a0 + 1, a0 + 3, a0 + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  const items = [];
  const add = (x, z) => items.push({ x, y: groundHeight(x, z) - 0.02, z, ry: rr(0, TAU), s: rr(0.7, 1.25), c: pick(['#ffffff', '#e6f2c4', '#cfe6a8']) });
  for (const t of treeBases) for (let i = 0; i < 4; i++) { const a = rr(0, TAU), d = rr(0.9, 1.9) * t.s, x = t.x + Math.cos(a) * d, z = t.z + Math.sin(a) * d; if (landOK(x, z, { rim: 0.4, river: 0 }) && pathDist(x, z) > 0.6 && !occupied(x, z, -0.3)) add(x, z); }
  for (const [x, z] of scatter(22, (x, z) => { riverQuery(x, z); return RQ.d < RQ.w * 1.6 + 2.2; }, { river: -0.3 })) add(x, z);
  scene.add(makeInstanced(g, matVeg, items));
}

/* =====================================================================
   Soft contact shadows under buildings, trees and props
   ===================================================================== */
{
  const geo = new THREE.PlaneGeometry(1, 1); geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4, opacity: 0.6 });
  const items = [];
  for (const [h, sx, sz] of [[mainHouse, 8.4, 7.0], [teaHouse, 6.2, 5.2], [farmHouse, 5.8, 4.8], [kura, 4.2, 4.2]]) {
    const cfg = h.userData.cfg, fz = (cfg.porch || 0) * 0.5;
    const p = houseWorld(h, 0, fz);
    items.push({ x: p.x, y: groundHeight(p.x, p.z) + 0.06, z: p.z, ry: h.rotation.y, sx, sz, sy: 1 });
  }
  for (const t of treeBases) items.push({ x: t.x, y: groundHeight(t.x, t.z) + 0.06, z: t.z, ry: 0, sx: 4.2 * t.s, sz: 4.2 * t.s, sy: 1 });
  items.push({ x: shrine.position.x, y: shrine.position.y + 0.06, z: shrine.position.z, ry: 0, sx: 4.4, sz: 4.4, sy: 1 });
  const dm = makeInstanced(geo, mat, items, { receive: false }); dm.renderOrder = 1;
  scene.add(dm);
}

/* fallen petals on the ground */
{
  const geo = new THREE.CircleGeometry(0.06, 5); geo.rotateX(-Math.PI / 2);
  const items = [];
  for (const t of treeBases) for (let i = 0; i < 38; i++) {
    const a = rr(0, TAU), d = Math.sqrt(rand()) * 2.4 * t.s, x = t.x + Math.cos(a) * d, z = t.z + Math.sin(a) * d, h = groundHeight(x, z);
    if (h < 0.3 || !landOK(x, z, { rim: 0.3, river: -0.4 }) || occupied(x, z, -0.2) && Math.hypot(x - t.x, z - t.z) > 0.7 * t.s) continue;
    const s = rr(0.7, 1.5);
    items.push({ x, y: h + 0.045, z, ry: rr(0, TAU), sx: s, sz: s, sy: 1, c: pick(['#ffc9dc', '#ffdbe8', '#ffb7d0', '#fff0f5']) });
  }
  scene.add(makeInstanced(geo, new THREE.MeshStandardMaterial({ roughness: 0.9, emissive: 0x552233, emissiveIntensity: 0.2 }), items));
}

/* =====================================================================
   Falling cherry petals + fireflies
   ===================================================================== */
const PETALS = 280;
const petalGeo = (() => {
  const g = new THREE.PlaneGeometry(0.13, 0.17, 2, 2), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); p.setZ(i, x * x * 3.2 + y * y * 1.2); p.setX(i, x * (1 - Math.abs(y) * 2.2 * 0.5)); }
  g.computeVertexNormals(); return g;
})();
const petalMesh = new THREE.InstancedMesh(petalGeo, new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.7, emissive: 0xff9ab8, emissiveIntensity: 0.22 }), PETALS);
petalMesh.frustumCulled = false; petalMesh.castShadow = false;
const pPos = new Float32Array(PETALS * 3), pFall = new Float32Array(PETALS), pPh = new Float32Array(PETALS), pSp = new Float32Array(PETALS);
function respawnPetal(i, initial) {
  const c = canopySources[Math.floor(rand() * canopySources.length)], a = rr(0, TAU), r = Math.sqrt(rand()) * c.r;
  pPos[i * 3] = c.x + Math.cos(a) * r; pPos[i * 3 + 2] = c.z + Math.sin(a) * r;
  pPos[i * 3 + 1] = initial ? rr(0.3, c.y + 0.6) : c.y + rr(-0.4, 0.6);
  pFall[i] = rr(0.28, 0.6); pPh[i] = rr(0, TAU); pSp[i] = rr(0.8, 1.9);
}
for (let i = 0; i < PETALS; i++) {
  respawnPetal(i, true);
  _c.set(pick(['#ffc6da', '#ffd9e6', '#ffb3cc', '#fff0f5'])); petalMesh.setColorAt(i, _c);
}
scene.add(petalMesh);
const WIND_X = -0.2, WIND_Z = 0.12;
function updatePetals(dt) {
  for (let i = 0; i < PETALS; i++) {
    const ph = (pPh[i] += dt * pSp[i]);
    let x = pPos[i * 3] + (WIND_X + Math.sin(ph) * 0.3) * dt, z = pPos[i * 3 + 2] + (WIND_Z + Math.cos(ph * 0.8) * 0.24) * dt;
    let y = pPos[i * 3 + 1] - pFall[i] * dt * (0.85 + 0.15 * Math.sin(ph * 2.0));
    const gy = Math.max(groundFast(x, z), 0.0) + 0.05;
    if (y < gy || x * x + z * z > 17 * 17) { respawnPetal(i, false); x = pPos[i * 3]; y = pPos[i * 3 + 1]; z = pPos[i * 3 + 2]; }
    else { pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z; }
    _o3.position.set(x, y, z); _o3.rotation.set(ph * 1.3, ph * 0.9, ph * 0.6); _o3.scale.setScalar(1); _o3.updateMatrix();
    petalMesh.setMatrixAt(i, _o3.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}
updatePetals(0);

const FLY = 64;
const flyBase = new Float32Array(FLY * 3), flyPos = new Float32Array(FLY * 3), flyPh = new Float32Array(FLY);
for (let i = 0; i < FLY; i++) {
  const fr = riverFrame(rand()), off = rr(-4, 4), x = fr.x - fr.tz * off, z = fr.z + fr.tx * off;
  const inside = Math.hypot(x, z) < rimRadius(Math.atan2(z, x)) - 1.8;
  flyBase[i * 3] = inside ? x : fr.x * 0.6; flyBase[i * 3 + 1] = rr(0.7, 2.6); flyBase[i * 3 + 2] = inside ? z : fr.z * 0.6; flyPh[i] = rand();
}
const flyGeo = new THREE.BufferGeometry();
flyGeo.setAttribute('position', new THREE.BufferAttribute(flyPos, 3));
flyGeo.setAttribute('aPh', new THREE.BufferAttribute(flyPh, 1));
const flyUniforms = { uTime: waterUniforms.uTime, uSize: { value: 520 }, uPx: { value: renderer.getPixelRatio() } };
const flies = new THREE.Points(flyGeo, new THREE.ShaderMaterial({
  uniforms: flyUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute float aPh; uniform float uTime, uSize, uPx; varying float vA;
    void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); float pulse = 0.5 + 0.5 * sin(uTime * 1.5 + aPh * 6.2831); vA = 0.25 + 0.75 * pulse;
      gl_PointSize = uSize * (0.5 + 0.5 * pulse) * uPx / -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); a *= a;
    gl_FragColor = vec4(vec3(1.0, 0.86, 0.45) * a * 1.4, a * vA); }`
}));
flies.frustumCulled = false; scene.add(flies);
function updateFlies(t) {
  for (let i = 0; i < FLY; i++) {
    const p = flyPh[i] * 17.0;
    flyPos[i * 3] = flyBase[i * 3] + Math.sin(t * 0.37 + p) * 0.7 + Math.sin(t * 0.91 + p * 2) * 0.2;
    flyPos[i * 3 + 1] = flyBase[i * 3 + 1] + Math.sin(t * 0.5 + p * 1.3) * 0.35;
    flyPos[i * 3 + 2] = flyBase[i * 3 + 2] + Math.cos(t * 0.41 + p) * 0.7 + Math.cos(t * 0.83 + p * 3) * 0.2;
  }
  flyGeo.attributes.position.needsUpdate = true;
}
updateFlies(0);

/* gentle mist at the foot of the waterfall (few soft sprites) */
const mistMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xfff6ee, transparent: true, opacity: 0.22, depthWrite: false, fog: true });
const mistSprites = [];
if (fallSpout.nx || fallSpout.nz) for (let i = 0; i < 5; i++) {
  const sp = new THREE.Sprite(mistMat);
  sp.position.set(fallSpout.x + fallSpout.nx * (1.0 + i * 0.15), -8.3 + i * 0.25, fallSpout.z + fallSpout.nz * (1.0 + i * 0.15));
  sp.scale.set(2.4 + i * 0.4, 1.6, 1); sp.userData.ph = i * 1.7; scene.add(sp); mistSprites.push(sp);
}

/* warm practical lights for the porches */
for (const [h, lx, lz, I] of [[mainHouse, 0.7, 2.7, 6.5], [teaHouse, 0, 2.0, 5]]) {
  const p = houseWorld(h, lx, lz), pl = new THREE.PointLight(0xffa24d, I, 7.5, 2);
  pl.position.set(p.x, p.y + 1.7, p.z); scene.add(pl); lampLights.push(pl);
}

/* =====================================================================
   Camera, controls, resize
   ===================================================================== */
const CAM_DIR = new THREE.Vector3(18, 21, 22).normalize();
const CAM_TARGET = new THREE.Vector3(0, -0.5, 0);
const BASE_DIST = 44, REF_ASPECT = 1.6;
const fitDist = (aspect) => BASE_DIST * Math.max(1, REF_ASPECT / aspect * 0.9);
let lastAspect = window.innerWidth / window.innerHeight;
camera.position.copy(CAM_TARGET).addScaledVector(CAM_DIR, fitDist(lastAspect));
camera.lookAt(CAM_TARGET);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CAM_TARGET);
controls.enableDamping = true; controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.7;
controls.enablePan = false;
controls.minDistance = 13; controls.maxDistance = fitDist(lastAspect) * 1.55;
controls.minPolarAngle = 0.32; controls.maxPolarAngle = 1.4;
controls.update();

function onResize() {
  const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  camera.aspect = aspect; camera.updateProjectionMatrix();
  flyUniforms.uPx.value = renderer.getPixelRatio();
  const ratio = fitDist(aspect) / fitDist(lastAspect);
  if (ratio !== 1) {
    _v1.subVectors(camera.position, controls.target).multiplyScalar(ratio);
    camera.position.copy(controls.target).add(_v1);
  }
  controls.maxDistance = fitDist(aspect) * 1.55;
  lastAspect = aspect;
}
window.addEventListener('resize', onResize);

/* =====================================================================
   Animation loop (no per-frame allocations)
   ===================================================================== */
const clock = new THREE.Clock();
const boatBase = boat.position.clone();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  timeU.value = t; waterUniforms.uTime.value = t;

  updatePetals(dt);
  updateFlies(t);

  const breathe = 0.93 + 0.05 * Math.sin(t * 0.7) + 0.025 * Math.sin(t * 1.9 + 1.0);
  matShoji.emissiveIntensity = breathe;
  matLantern.emissiveIntensity = 1.5 * (0.94 + 0.06 * Math.sin(t * 1.3 + 0.5));
  matChochin.emissiveIntensity = 0.9 * (0.94 + 0.06 * Math.sin(t * 1.1 + 2.0));
  glowMat.opacity = 0.34 + 0.06 * Math.sin(t * 0.7);
  lanternGlowMat.opacity = 0.5 + 0.07 * Math.sin(t * 1.3 + 0.5);
  for (let i = 0; i < lampLights.length; i++) {
    const l = lampLights[i];
    if (l.userData.base === undefined) l.userData.base = l.intensity;
    l.intensity = l.userData.base * (0.95 + 0.05 * Math.sin(t * 1.2 + i));
  }

  boat.position.y = boatBase.y + Math.sin(t * 1.1) * 0.025;
  boat.rotation.z = Math.sin(t * 0.9) * 0.02; boat.rotation.x = Math.sin(t * 0.7 + 1.0) * 0.015;
  boat.rotation.y = boat.userData.yaw + Math.sin(t * 0.35) * 0.04;

  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i]; c.position.x += clouds[i].userData.speed * dt; if (c.position.x > 110) c.position.x = -110;
  }
  for (let i = 0; i < mistSprites.length; i++) mistSprites[i].material.opacity = 0.22;

  controls.update();
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
}

frame();
requestAnimationFrame(() => {
  const loader = document.getElementById('loader');
  loader.classList.add('done');
  setTimeout(() => loader.remove(), 1400);
  setTimeout(() => { document.getElementById('caption').style.opacity = '0'; }, 7000);
});
window.__village = { THREE, scene, camera, controls, renderer, buildMs: performance.now() - T0 };
</script>
