<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chladni Plate // 36</title>
<style>
  :root { --bg: #0f1012; --ink: #ddd5c6; --line: rgba(221, 213, 198, 0.28); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .label, .controls {
    position: fixed; user-select: none; -webkit-user-select: none;
    font: 500 11px/1.7 "Helvetica Neue", Helvetica, Inter, system-ui, sans-serif;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink);
  }
  .label { pointer-events: none; }
  .label.left { left: 28px; bottom: 26px; }
  .label.right { left: 28px; top: 24px; font-variant-numeric: tabular-nums; }
  .label.visits { top: 24px; right: 28px; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .label.visits[hidden] { display: none; }
  .label.visits::before { content: ""; width: 6px; height: 6px; background: var(--ink); }
  .label .hint { opacity: 0.55; }
  .label .touch { display: none; }
  .controls { right: 28px; bottom: 26px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .controls .row { display: flex; gap: 8px; }
  .controls button {
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink);
    background: transparent; border: 1px solid var(--line); padding: 5px 11px 4px; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .controls button:hover { border-color: var(--ink); }
  .controls button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .controls button:focus-visible, .controls input:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  .freq { display: flex; align-items: center; gap: 12px; }
  .freq span { opacity: 0.55; }
  .controls input[type="range"] { -webkit-appearance: none; appearance: none; width: 240px; height: 18px; background: transparent; cursor: pointer; }
  .controls input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--line); }
  .controls input[type="range"]::-moz-range-track { height: 1px; background: var(--line); }
  .controls input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; margin-top: -4px; background: var(--ink); border: 0; border-radius: 0; }
  .controls input[type="range"]::-moz-range-thumb { width: 9px; height: 9px; background: var(--ink); border: 0; border-radius: 0; }
  .controls input[type="range"]:disabled { opacity: 0.4; cursor: default; }
  @media (hover: none) {
    .label .mouse { display: none; }
    .label .touch { display: inline; }
  }
  @media (max-width: 720px) {
    .label, .controls { font-size: 10px; }
    .label.left { left: 18px; right: 18px; bottom: 112px; }
    .label.right { top: 16px; left: 18px; }
    .label.visits { top: 16px; right: 18px; }
    .controls { left: 18px; right: 18px; bottom: 18px; align-items: stretch; }
    .controls .row { justify-content: space-between; }
    .controls .row button { flex: 1; }
    .freq input[type="range"] { flex: 1; width: auto; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="label left">
  <div>Chladni Plate // 36</div>
  <div class="hint">
    <span class="mouse">Sing or whistle with the mic on / Drag the frequency<br>Click the plate to scatter sand / Arrow keys step a semitone</span>
    <span class="touch">Sing or whistle with the mic on<br>Drag the frequency / Tap the plate to scatter sand</span>
  </div>
</div>
<div class="label right" id="status"></div>
<div class="label visits" id="visits" title="Total visits" hidden></div>
<div class="controls">
  <div class="freq">
    <span>Hz</span>
    <input type="range" id="freq" min="0" max="1000" step="1" aria-label="Plate frequency">
  </div>
  <div class="row">
    <button type="button" id="mic" aria-pressed="false">Use mic</button>
    <button type="button" id="tone" aria-pressed="false">Tone</button>
    <button type="button" id="reset">Reset sand</button>
  </div>
</div>

<script>
'use strict';

// ───────────────────────────── Config ─────────────────────────────

const F_MIN = 150, F_MAX = 2400;      // slider range, Hz
const F_START = 1044;                 // (2, 5), right on resonance
const F0 = 36;                        // a mode (n, m) rings near F0 · (n² + m²)
const Q = 0.04;                       // resonance width, as a fraction of the mode frequency
const G = 192;                        // displacement field resolution
const KMAX = 9;                       // highest wave number in the lookup tables
const KICK = 0.018;                  // largest random hop a grain makes at an antinode, plate units per frame
const KICK_FLOOR = 0.0003;            // grains never sit perfectly still while the plate rings
const DRIFT = 0.0005;                // pull down the slope of u², toward the still lines
const SCATTER_R = 0.13, SCATTER_V = 0.03;

const mobile = matchMedia('(hover: none)').matches || Math.min(innerWidth, innerHeight) < 600;
const COUNT = mobile ? 12000 : 22000;

// ─────────────────────────── Plate modes ───────────────────────────
// Square plate, approximated by u = cos(nπx)cos(mπy) ± cos(mπx)cos(nπy) on x, y ∈ [0, 1].
// The ± pair share a frequency in theory; the + variant is nudged up so both get a turn.

const MODES = [];
for (let n = 1; n <= 7; n++) {
  for (let m = n + 1; m <= KMAX - 1; m++) {
    const k = n * n + m * m;
    if (k > 70) continue;
    MODES.push({ n, m, s: -1, f: F0 * k });
    MODES.push({ n, m, s: 1, f: F0 * k * 1.045 });
  }
}
MODES.sort((a, b) => a.f - b.f);

// Steady-state response of each mode to a drive at frequency f; the two loudest are kept.
function modeMix(f) {
  let a = null, b = null, ra = 0, rb = 0;
  for (const md of MODES) {
    const x = (f - md.f) / (Q * md.f);
    const r = 1 / (1 + x * x);
    if (r > ra) { b = a; rb = ra; a = md; ra = r; }
    else if (r > rb) { b = md; rb = r; }
  }
  const total = ra + rb;
  return { a, b, wa: ra / total, wb: rb / total, level: Math.min(1, total) };
}

// ───────────────────────── Displacement field ─────────────────────────
// u and its gradient on a G×G grid, rebuilt from cos/sin tables whenever the drive moves.

const cosT = new Float32Array((KMAX + 1) * G), sinT = new Float32Array((KMAX + 1) * G);
for (let k = 0; k <= KMAX; k++) {
  for (let i = 0; i < G; i++) {
    const t = Math.PI * k * i / (G - 1);
    cosT[k * G + i] = Math.cos(t);
    sinT[k * G + i] = Math.sin(t);
  }
}
const fieldU = new Float32Array(G * G), fieldX = new Float32Array(G * G), fieldY = new Float32Array(G * G);

function addMode(md, w, first) {
  const { n, m, s } = md;
  const cn = n * G, cm = m * G, pn = Math.PI * n, pm = Math.PI * m;
  const h = 0.5 * w;                  // each mode peaks at 2; the field is normalised to ±1
  for (let j = 0; j < G; j++) {
    const cnj = cosT[cn + j], cmj = cosT[cm + j], snj = sinT[cn + j], smj = sinT[cm + j];
    const row = j * G;
    for (let i = 0; i < G; i++) {
      const cni = cosT[cn + i], cmi = cosT[cm + i], sni = sinT[cn + i], smi = sinT[cm + i];
      const u = h * (cni * cmj + s * cmi * cnj);
      const gx = -h * (pn * sni * cmj + s * pm * smi * cnj);
      const gy = -h * (pm * cni * smj + s * pn * cmi * snj);
      const idx = row + i;
      if (first) { fieldU[idx] = u; fieldX[idx] = gx; fieldY[idx] = gy; }
      else { fieldU[idx] += u; fieldX[idx] += gx; fieldY[idx] += gy; }
    }
  }
}

let mix = null;
function buildField(f) {
  mix = modeMix(f);
  addMode(mix.a, mix.wa, true);
  if (mix.wb > 0.002) addMode(mix.b, mix.wb, false);
}

// ─────────────────────────────── Sand ───────────────────────────────

const grains = new Float32Array(COUNT * 3);    // x, y, lift (how hard the grain is bouncing)
const vel = new Float32Array(COUNT * 2);       // only from scatter impulses; hops are positional
const shade = new Float32Array(COUNT);
for (let i = 0; i < COUNT; i++) shade[i] = 0.78 + Math.random() * 0.3;

function resetSand() {
  for (let i = 0; i < COUNT; i++) {
    grains[i * 3] = Math.random();
    grains[i * 3 + 1] = Math.random();
    grains[i * 3 + 2] = 0;
    vel[i * 2] = vel[i * 2 + 1] = 0;
  }
}
resetSand();

function stepSand(drive) {
  const kick = KICK * drive, floor = KICK_FLOOR * drive, drift = DRIFT * drive, last = G - 1;
  for (let i = 0; i < COUNT; i++) {
    const p = i * 3, v = i * 2;
    let x = grains[p], y = grains[p + 1];

    const fx = x * last, fy = y * last;
    let ix = fx | 0, iy = fy | 0;
    if (ix > last - 1) ix = last - 1;
    if (iy > last - 1) iy = last - 1;
    const tx = fx - ix, ty = fy - iy, k = iy * G + ix;
    const w00 = (1 - tx) * (1 - ty), w10 = tx * (1 - ty), w01 = (1 - tx) * ty, w11 = tx * ty;
    const u = fieldU[k] * w00 + fieldU[k + 1] * w10 + fieldU[k + G] * w01 + fieldU[k + G + 1] * w11;
    const gx = fieldX[k] * w00 + fieldX[k + 1] * w10 + fieldX[k + G] * w01 + fieldX[k + G + 1] * w11;
    const gy = fieldY[k] * w00 + fieldY[k + 1] * w10 + fieldY[k + G] * w01 + fieldY[k + G + 1] * w11;

    // Where the plate moves, sand is tossed about; where it is still, sand stays.
    const hop = kick * Math.abs(u) + floor;
    x += (Math.random() - 0.5) * 2 * hop - drift * u * gx + vel[v];
    y += (Math.random() - 0.5) * 2 * hop - drift * u * gy + vel[v + 1];
    vel[v] *= 0.86; vel[v + 1] *= 0.86;

    if (x < 0) { x = -x; vel[v] = -vel[v] * 0.4; } else if (x > 1) { x = 2 - x; vel[v] = -vel[v] * 0.4; }
    if (y < 0) { y = -y; vel[v + 1] = -vel[v + 1] * 0.4; } else if (y > 1) { y = 2 - y; vel[v + 1] = -vel[v + 1] * 0.4; }
    grains[p] = x; grains[p + 1] = y;
    const lift = Math.min(1, hop / KICK + Math.hypot(vel[v], vel[v + 1]) * 40);
    grains[p + 2] += (lift - grains[p + 2]) * 0.25;
  }
}

function scatter(px, py, strength) {
  for (let i = 0; i < COUNT; i++) {
    const dx = grains[i * 3] - px, dy = grains[i * 3 + 1] - py;
    const d = Math.hypot(dx, dy);
    if (d > SCATTER_R || d < 1e-5) continue;
    const f = strength * (1 - d / SCATTER_R) * (0.6 + Math.random() * 0.8);
    vel[i * 2] += dx / d * f + (Math.random() - 0.5) * f * 0.6;
    vel[i * 2 + 1] += dy / d * f + (Math.random() - 0.5) * f * 0.6;
  }
}

// ────────────────────────────── WebGL ──────────────────────────────

const canvas = document.getElementById('stage');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: false });
const statusEl = document.getElementById('status');
if (!gl) statusEl.textContent = 'This needs WebGL2';

function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const uni = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; uni[name] = gl.getUniformLocation(p, name); }
  return { p, uni };
}

// The plate: brushed steel, a bevelled rim, the centre bolt it is clamped by, and a faint
// shimmer over the antinodes while it rings.
const plateProg = gl && program(`#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`, `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec4 uRect;      // plate x, y, w, h in device pixels, top-left origin
uniform float uDpr, uTime, uAmp;
uniform vec4 uA, uB;     // n, m, sign, weight of the two ringing modes
out vec4 outColor;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float sdBox(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
float mode(vec4 m, vec2 q) {
  const float PI = 3.14159265;
  return 0.5 * m.w * (cos(m.x * PI * q.x) * cos(m.y * PI * q.y) + m.z * cos(m.y * PI * q.x) * cos(m.x * PI * q.y));
}

void main() {
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 centre = uRect.xy + uRect.zw * 0.5, size = uRect.zw * 0.5;
  float r = 5.0 * uDpr;

  // Room: near-black, lit from above-left, with the plate's soft shadow on the bench.
  vec2 uv = px / uRes;
  vec3 col = vec3(0.058, 0.062, 0.07) * (1.15 - 0.55 * length(uv - vec2(0.42, 0.38)));
  float sh = sdBox(px - centre - vec2(10.0, 22.0) * uDpr, size, r);
  col *= 1.0 - 0.55 * (1.0 - smoothstep(-20.0 * uDpr, 60.0 * uDpr, sh));

  float d = sdBox(px - centre, size, r);
  if (d < 1.0) {
    vec2 q = (px - uRect.xy) / uRect.zw;
    float grain = noise(vec2(q.x * 3.0, q.y * 1400.0)) * 0.6 + noise(vec2(q.x * 11.0, q.y * 420.0)) * 0.4;
    float base = mix(0.15, 0.215, grain);
    // Brushed metal smears its highlight across the brushing direction.
    float band = exp(-pow((q.x * 0.85 + q.y * 0.35 - 0.42) * 2.6, 2.0));
    float spec = band * (0.10 + 0.12 * grain);
    vec3 steel = vec3(0.86, 0.9, 0.97) * base + vec3(0.9, 0.93, 1.0) * spec;
    steel *= 1.0 - 0.18 * length(q - vec2(0.35, 0.3));

    // Shimmer: the ringing blurs the brushing a little where the plate moves most.
    float u = mode(uA, q) + mode(uB, q);
    steel += vec3(0.035) * uAmp * abs(u) * (0.6 + 0.4 * sin(uTime * 40.0 + q.y * 80.0));

    // Bevelled rim, lit from the top left.
    float e = -d;
    float rim = 1.0 - smoothstep(0.0, 3.5 * uDpr, e);
    vec2 n = normalize(px - centre + 1e-4);
    steel += rim * (0.16 * max(0.0, dot(n, normalize(vec2(-0.6, -0.8)))) - 0.06);

    // Centre bolt.
    float b = length((q - 0.5) * uRect.zw) / uDpr;
    float bolt = 1.0 - smoothstep(8.0, 9.2, b);
    float ring = smoothstep(5.0, 7.5, b) * (1.0 - smoothstep(7.5, 9.2, b));
    vec3 boltCol = vec3(0.11, 0.115, 0.125) + 0.12 * ring * max(0.0, -dot(normalize(q - 0.5 + 1e-4), vec2(0.6, 0.8)));
    steel = mix(steel, boltCol, bolt);

    col = mix(col, steel, clamp(1.0 - d, 0.0, 1.0));
  }
  // Fine film grain keeps the dark gradients from banding.
  col += (hash(px + fract(uTime)) - 0.5) / 255.0;
  outColor = vec4(col, 1.0);
}`);

// Sand: one point per grain, drawn twice. The shadow falls further as a grain bounces higher.
const sandProg = gl && program(`#version 300 es
layout(location = 0) in vec3 aP;
layout(location = 1) in float aShade;
uniform vec2 uRes;
uniform vec4 uRect;
uniform float uSize, uDpr, uShadow;
out float vShade, vLift;
void main() {
  vec2 px = uRect.xy + aP.xy * uRect.zw;
  px += uShadow * vec2(0.5, 0.9) * uDpr * (1.0 + aP.z * 3.5);
  gl_Position = vec4(px.x / uRes.x * 2.0 - 1.0, 1.0 - px.y / uRes.y * 2.0, 0.0, 1.0);
  gl_PointSize = uSize * (1.0 + 0.35 * uShadow) * (1.0 + 0.2 * aP.z);
  vShade = aShade;
  vLift = aP.z;
}`, `#version 300 es
precision highp float;
uniform float uShadow;
in float vShade, vLift;
out vec4 outColor;
void main() {
  float d = length(gl_PointCoord - 0.5);
  float a = 1.0 - smoothstep(0.32, 0.5, d);
  if (a <= 0.0) discard;
  if (uShadow > 0.5) { outColor = vec4(0.0, 0.0, 0.0, a * 0.42); return; }
  vec3 sand = vec3(0.93, 0.85, 0.7) * vShade;
  sand += 0.07 * vLift;
  // A touch of shading across each grain so the drift reads as texture, not dots.
  sand *= 1.0 - 0.18 * smoothstep(0.0, 0.5, dot(gl_PointCoord - 0.5, vec2(0.7, 0.7)) + 0.25);
  outColor = vec4(sand, a);
}`);

let posBuf, vao;
if (gl) {
  vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, grains.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const shadeBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, shadeBuf);
  gl.bufferData(gl.ARRAY_BUFFER, shade, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
}

// ───────────────────────────── Layout ─────────────────────────────

let dpr = 1, W = 0, H = 0;
const rect = { x: 0, y: 0, s: 0 };     // plate square in CSS pixels
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  const narrow = W < 720;
  const top = narrow ? 64 : 70, bottom = narrow ? 170 : 100;
  rect.s = Math.max(120, Math.min(W * (narrow ? 0.9 : 0.8), H - top - bottom));
  rect.x = (W - rect.s) / 2;
  rect.y = top + (H - top - bottom - rect.s) / 2;
}
addEventListener('resize', resize);
resize();

// ───────────────────────────── Sound ─────────────────────────────

const slider = document.getElementById('freq');
const micBtn = document.getElementById('mic'), toneBtn = document.getElementById('tone');
const toSlider = f => Math.round(1000 * Math.log(f / F_MIN) / Math.log(F_MAX / F_MIN));
const fromSlider = v => F_MIN * Math.pow(F_MAX / F_MIN, v / 1000);

let target = F_START, freq = F_START, drive = 1, driveTarget = 1;
slider.value = toSlider(F_START);

let audio = null, osc = null, oscGain = null, analyser = null, micStream = null, spectrum = null;
let micOn = false, toneOn = false, heard = 0;

function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') audio.resume();
  return audio;
}

function setTone(on) {
  toneOn = on;
  toneBtn.setAttribute('aria-pressed', String(on));
  if (on) {
    const ctx = ensureAudio();
    if (!osc) {
      osc = ctx.createOscillator();
      oscGain = ctx.createGain();
      oscGain.gain.value = 0;
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(oscGain).connect(ctx.destination);
      osc.start();
    }
    oscGain.gain.setTargetAtTime(0.035, ctx.currentTime, 0.08);
  } else if (oscGain) {
    oscGain.gain.setTargetAtTime(0, audio.currentTime, 0.05);
  }
}

async function setMic(on) {
  if (on) {
    const ctx = ensureAudio();
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
    } catch {
      micBtn.textContent = 'Mic blocked';
      setTimeout(() => { micBtn.textContent = 'Use mic'; }, 2400);
      return;
    }
    analyser = ctx.createAnalyser();
    analyser.fftSize = 8192;
    analyser.smoothingTimeConstant = 0.25;
    spectrum = new Float32Array(analyser.frequencyBinCount);
    ctx.createMediaStreamSource(micStream).connect(analyser);
    if (toneOn) setTone(false);       // the tone would only hear itself
    micOn = true;
    driveTarget = 0;
  } else {
    micOn = false;
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    micStream = null; analyser = null;
    driveTarget = 1;
  }
  micBtn.setAttribute('aria-pressed', String(micOn));
  toneBtn.disabled = micOn;
  slider.disabled = micOn;
}

// The loudest spectral peak between 80 Hz and F_MAX, refined by a parabola through its neighbours.
function listen() {
  analyser.getFloatFrequencyData(spectrum);
  const bin = audio.sampleRate / analyser.fftSize;
  const lo = Math.ceil(80 / bin), hi = Math.min(spectrum.length - 2, Math.floor(F_MAX / bin));
  let best = lo, peak = -Infinity;
  for (let i = lo; i <= hi; i++) if (spectrum[i] > peak) { peak = spectrum[i]; best = i; }
  const level = Math.max(0, Math.min(1, (peak + 68) / 38));
  if (level > 0.12) {
    const a = spectrum[best - 1], b = spectrum[best], c = spectrum[best + 1];
    const off = 0.5 * (a - c) / (a - 2 * b + c || 1);
    target = Math.max(F_MIN, Math.min(F_MAX, (best + off) * bin));
    slider.value = toSlider(target);
    driveTarget = Math.min(1, 0.35 + level);
    heard = performance.now();
  } else if (performance.now() - heard > 250) {
    driveTarget = 0;
  }
}

// ──────────────────────────── Controls ────────────────────────────

slider.addEventListener('input', () => { target = fromSlider(+slider.value); });
micBtn.addEventListener('click', () => setMic(!micOn));
toneBtn.addEventListener('click', () => setTone(!toneOn));
document.getElementById('reset').addEventListener('click', resetSand);

addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) return;
  const k = e.key.toLowerCase();
  if ((k === 'arrowright' || k === 'arrowup') && !micOn) { target = Math.min(F_MAX, target * 2 ** (1 / 12)); slider.value = toSlider(target); e.preventDefault(); }
  else if ((k === 'arrowleft' || k === 'arrowdown') && !micOn) { target = Math.max(F_MIN, target / 2 ** (1 / 12)); slider.value = toSlider(target); e.preventDefault(); }
  else if (k === 'r') resetSand();
  else if (k === 'm') setMic(!micOn);
  else if (k === 't' && !micOn) setTone(!toneOn);
});

const toPlate = e => [(e.clientX - rect.x) / rect.s, (e.clientY - rect.y) / rect.s];
const onPlate = ([x, y]) => x > -0.05 && x < 1.05 && y > -0.05 && y < 1.05;
let dragging = false, lastPt = null;
canvas.addEventListener('pointerdown', e => {
  const p = toPlate(e);
  if (!onPlate(p)) return;
  dragging = true; lastPt = p;
  canvas.setPointerCapture(e.pointerId);
  scatter(p[0], p[1], SCATTER_V);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const p = toPlate(e);
  const moved = Math.hypot(p[0] - lastPt[0], p[1] - lastPt[1]);
  if (moved > 0.015) { scatter(p[0], p[1], SCATTER_V * 0.45); lastPt = p; }
});
const endDrag = () => { dragging = false; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ───────────────────────────── Frame ─────────────────────────────

let builtFreq = -1, lastStatus = '', lastT = performance.now();
const sim = new URLSearchParams(location.search).get('settle');   // ?settle=N runs N steps up front (previews)
buildField(freq); builtFreq = freq;
if (sim) for (let i = 0; i < Math.min(+sim, 3000); i++) stepSand(1);

function frame(now) {
  const dt = Math.min(50, now - lastT); lastT = now;
  const steps = 2 * Math.max(1, Math.min(3, Math.round(dt / 16.7)));   // two sand steps per 60 Hz frame

  if (micOn && analyser) listen();
  freq += (target - freq) * (micOn ? 0.18 : 0.12);
  drive += (driveTarget - drive) * (driveTarget > drive ? 0.15 : 0.04);
  if (Math.abs(freq - builtFreq) > 0.04 * Math.max(1, freq / 400)) { buildField(freq); builtFreq = freq; }
  if (osc) osc.frequency.setTargetAtTime(freq, audio.currentTime, 0.03);

  const ring = drive * (0.35 + 0.65 * mix.level);
  if (ring > 0.01) for (let s = 0; s < steps; s++) stepSand(ring);
  else stepSand(0);

  const dom = mix.wa >= mix.wb ? mix.a : mix.b;
  const text = `${Math.round(freq)} Hz / Mode (${dom.n}, ${dom.m})${micOn ? (driveTarget > 0 ? ' / Hearing you' : ' / Listening') : ''}`;
  if (text !== lastStatus) statusEl.textContent = lastStatus = text;

  if (gl) {
    gl.viewport(0, 0, canvas.width, canvas.height);
    const R = [rect.x * dpr, rect.y * dpr, rect.s * dpr, rect.s * dpr];

    gl.disable(gl.BLEND);
    gl.useProgram(plateProg.p);
    gl.uniform2f(plateProg.uni.uRes, canvas.width, canvas.height);
    gl.uniform4f(plateProg.uni.uRect, ...R);
    gl.uniform1f(plateProg.uni.uDpr, dpr);
    gl.uniform1f(plateProg.uni.uTime, now / 1000);
    gl.uniform1f(plateProg.uni.uAmp, ring);
    gl.uniform4f(plateProg.uni.uA, mix.a.n, mix.a.m, mix.a.s, mix.wa);
    gl.uniform4f(plateProg.uni.uB, mix.b.n, mix.b.m, mix.b.s, mix.wb);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(sandProg.p);
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, grains);
    gl.uniform2f(sandProg.uni.uRes, canvas.width, canvas.height);
    gl.uniform4f(sandProg.uni.uRect, ...R);
    gl.uniform1f(sandProg.uni.uDpr, dpr);
    gl.uniform1f(sandProg.uni.uSize, Math.max(1.6, rect.s * dpr / 420) * (mobile ? 1.25 : 1));
    gl.uniform1f(sandProg.uni.uShadow, 1);
    gl.drawArrays(gl.POINTS, 0, COUNT);
    gl.uniform1f(sandProg.uni.uShadow, 0);
    gl.drawArrays(gl.POINTS, 0, COUNT);
    gl.bindVertexArray(null);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
