<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chladni Plate // 36</title>
<style>
  :root { --bg: #0d0e10; --ink: #ddd5c6; --line: rgba(221, 213, 198, 0.28); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#stage.dragging { cursor: grabbing; }
  .label, .controls {
    position: fixed; user-select: none; -webkit-user-select: none;
    font: 500 11px/1.7 "Helvetica Neue", Helvetica, Inter, system-ui, sans-serif;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink);
  }
  .label { pointer-events: none; }
  .label.left { left: 28px; bottom: 26px; }
  .label.right { left: 28px; top: 24px; font-variant-numeric: tabular-nums; }
  .label.visits { top: 24px; right: 28px; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .label.visits[hidden] { display: none; }
  .label.visits::before { content: ""; width: 6px; height: 6px; background: var(--ink); }
  .label .hint { opacity: 0.55; }
  .label .touch { display: none; }
  .controls { right: 28px; bottom: 26px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .controls .row { display: flex; gap: 8px; }
  .controls button {
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink);
    background: rgba(13, 14, 16, 0.55); border: 1px solid var(--line); padding: 5px 11px 4px; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .controls button:hover { border-color: var(--ink); }
  .controls button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .controls button:disabled { opacity: 0.4; cursor: default; }
  .controls button:focus-visible, .controls input:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  .freq { display: flex; align-items: center; gap: 12px; }
  .freq span { opacity: 0.55; }
  .controls input[type="range"] { -webkit-appearance: none; appearance: none; width: 260px; height: 18px; background: transparent; cursor: pointer; }
  .controls input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--line); }
  .controls input[type="range"]::-moz-range-track { height: 1px; background: var(--line); }
  .controls input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; margin-top: -4px; background: var(--ink); border: 0; border-radius: 0; }
  .controls input[type="range"]::-moz-range-thumb { width: 9px; height: 9px; background: var(--ink); border: 0; border-radius: 0; }
  .controls input[type="range"]:disabled { opacity: 0.4; cursor: default; }
  @media (hover: none) {
    .label .mouse { display: none; }
    .label .touch { display: inline; }
  }
  @media (max-width: 720px) {
    .label, .controls { font-size: 10px; }
    .label.left { left: 18px; right: 18px; bottom: 112px; }
    .label.right { top: 16px; left: 18px; }
    .label.visits { top: 16px; right: 18px; }
    .controls { left: 18px; right: 18px; bottom: 18px; align-items: stretch; }
    .controls .row { justify-content: space-between; gap: 6px; }
    .controls .row button { flex: 1; padding-left: 4px; padding-right: 4px; }
    .freq input[type="range"] { flex: 1; width: auto; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="label left">
  <div>Chladni Plate // 36</div>
  <div class="hint">
    <span class="mouse">Sing or whistle with the mic on / Arrow keys step a semitone<br>Drag to orbit / Click the plate to scatter sand</span>
    <span class="touch">Sing or whistle with the mic on<br>Drag to orbit / Tap the plate to scatter sand</span>
  </div>
</div>
<div class="label right" id="status"></div>
<div class="label visits" id="visits" title="Total visits" hidden></div>
<div class="controls">
  <div class="freq">
    <span>Hz</span>
    <input type="range" id="freq" min="0" max="1000" step="1" aria-label="Plate frequency">
  </div>
  <div class="row">
    <button type="button" id="mic" aria-pressed="false">Use mic</button>
    <button type="button" id="tone" aria-pressed="false">Tone</button>
    <button type="button" id="wave" aria-pressed="false">Wave</button>
    <button type="button" id="reset" aria-label="Reset sand">Reset</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ───────────────────────────── Config ─────────────────────────────

const F_MIN = 150, F_MAX = 2400;      // slider range, Hz
const F_START = 1044;                 // (2, 5), right on resonance
const F0 = 36;                        // a mode (n, m) rings near F0 · (n² + m²)
const Q = 0.04;                       // resonance width, as a fraction of the mode frequency
const G = 192;                        // displacement field resolution
const KMAX = 9;                       // highest wave number in the lookup tables
const KICK = 0.018;                   // largest random hop a grain makes at an antinode, plate units per frame
const KICK_FLOOR = 0.0003;            // grains never sit perfectly still while the plate rings
const DRIFT = 0.0005;                 // pull down the slope of u², toward the still lines
const SCATTER_R = 0.13, SCATTER_V = 0.03;

// The plate is one unit across in the scene. Its motion is far too small and fast to see, so
// it is drawn exaggerated and slowed down: a visible flex at a visible beat.
const PLATE_T = 0.012;                // plate thickness
const STAND = 0.42;                   // height of the post the plate is clamped to
const FLEX = 0.008;                   // drawn peak displacement at full drive
const BEAT = 15;                      // drawn oscillation, rad/s
const HOP = 0.022;                    // how high a grain flies at an antinode
const GRAIN = 0.0028;                 // grain diameter

const mobile = matchMedia('(hover: none)').matches || Math.min(innerWidth, innerHeight) < 600;
const COUNT = mobile ? 12000 : 22000;

// ─────────────────────────── Plate modes ───────────────────────────
// Square plate, approximated by u = cos(nπx)cos(mπy) ± cos(mπx)cos(nπy) on x, y ∈ [0, 1].
// The ± pair share a frequency in theory; the + variant is nudged up so both get a turn.

const MODES = [];
for (let n = 1; n <= 7; n++) {
  for (let m = n + 1; m <= KMAX - 1; m++) {
    const k = n * n + m * m;
    if (k > 70) continue;
    MODES.push({ n, m, s: -1, f: F0 * k });
    MODES.push({ n, m, s: 1, f: F0 * k * 1.045 });
  }
}
MODES.sort((a, b) => a.f - b.f);

// Steady-state response of each mode to a drive at frequency f; the two loudest are kept.
function modeMix(f) {
  let a = null, b = null, ra = 0, rb = 0;
  for (const md of MODES) {
    const x = (f - md.f) / (Q * md.f);
    const r = 1 / (1 + x * x);
    if (r > ra) { b = a; rb = ra; a = md; ra = r; }
    else if (r > rb) { b = md; rb = r; }
  }
  const total = ra + rb;
  return { a, b, wa: ra / total, wb: rb / total, level: Math.min(1, total) };
}

// ───────────────────────── Displacement field ─────────────────────────
// u and its gradient on a G×G grid, rebuilt from cos/sin tables whenever the drive moves.

const cosT = new Float32Array((KMAX + 1) * G), sinT = new Float32Array((KMAX + 1) * G);
for (let k = 0; k <= KMAX; k++) {
  for (let i = 0; i < G; i++) {
    const t = Math.PI * k * i / (G - 1);
    cosT[k * G + i] = Math.cos(t);
    sinT[k * G + i] = Math.sin(t);
  }
}
const fieldU = new Float32Array(G * G), fieldX = new Float32Array(G * G), fieldY = new Float32Array(G * G);

function addMode(md, w, first) {
  const { n, m, s } = md;
  const cn = n * G, cm = m * G, pn = Math.PI * n, pm = Math.PI * m;
  const h = 0.5 * w;                  // each mode peaks at 2; the field is normalised to ±1
  for (let j = 0; j < G; j++) {
    const cnj = cosT[cn + j], cmj = cosT[cm + j], snj = sinT[cn + j], smj = sinT[cm + j];
    const row = j * G;
    for (let i = 0; i < G; i++) {
      const cni = cosT[cn + i], cmi = cosT[cm + i], sni = sinT[cn + i], smi = sinT[cm + i];
      const u = h * (cni * cmj + s * cmi * cnj);
      const gx = -h * (pn * sni * cmj + s * pm * smi * cnj);
      const gy = -h * (pm * cni * smj + s * pn * cmi * snj);
      const idx = row + i;
      if (first) { fieldU[idx] = u; fieldX[idx] = gx; fieldY[idx] = gy; }
      else { fieldU[idx] += u; fieldX[idx] += gx; fieldY[idx] += gy; }
    }
  }
}

let mix = null;
function buildField(f) {
  mix = modeMix(f);
  addMode(mix.a, mix.wa, true);
  if (mix.wb > 0.002) addMode(mix.b, mix.wb, false);
}

// ─────────────────────────────── Sand ───────────────────────────────

const grains = new Float32Array(COUNT * 3);    // x, y on the plate, lift (how hard the grain is bouncing)
const vel = new Float32Array(COUNT * 2);       // only from scatter impulses; hops are positional
const grainU = new Float32Array(COUNT);        // plate displacement under each grain, so it rides the flex
const seed = new Float32Array(COUNT);
for (let i = 0; i < COUNT; i++) seed[i] = Math.random();

function resetSand() {
  for (let i = 0; i < COUNT; i++) {
    grains[i * 3] = Math.random();
    grains[i * 3 + 1] = Math.random();
    grains[i * 3 + 2] = 0;
    vel[i * 2] = vel[i * 2 + 1] = 0;
  }
}
resetSand();

function stepSand(drive) {
  const kick = KICK * drive, floor = KICK_FLOOR * drive, drift = DRIFT * drive, last = G - 1;
  for (let i = 0; i < COUNT; i++) {
    const p = i * 3, v = i * 2;
    let x = grains[p], y = grains[p + 1];

    const fx = x * last, fy = y * last;
    let ix = fx | 0, iy = fy | 0;
    if (ix > last - 1) ix = last - 1;
    if (iy > last - 1) iy = last - 1;
    const tx = fx - ix, ty = fy - iy, k = iy * G + ix;
    const w00 = (1 - tx) * (1 - ty), w10 = tx * (1 - ty), w01 = (1 - tx) * ty, w11 = tx * ty;
    const u = fieldU[k] * w00 + fieldU[k + 1] * w10 + fieldU[k + G] * w01 + fieldU[k + G + 1] * w11;
    const gx = fieldX[k] * w00 + fieldX[k + 1] * w10 + fieldX[k + G] * w01 + fieldX[k + G + 1] * w11;
    const gy = fieldY[k] * w00 + fieldY[k + 1] * w10 + fieldY[k + G] * w01 + fieldY[k + G + 1] * w11;
    grainU[i] = u;

    // Where the plate moves, sand is tossed about; where it is still, sand stays.
    const hop = kick * Math.abs(u) + floor;
    x += (Math.random() - 0.5) * 2 * hop - drift * u * gx + vel[v];
    y += (Math.random() - 0.5) * 2 * hop - drift * u * gy + vel[v + 1];
    vel[v] *= 0.86; vel[v + 1] *= 0.86;

    if (x < 0) { x = -x; vel[v] = -vel[v] * 0.4; } else if (x > 1) { x = 2 - x; vel[v] = -vel[v] * 0.4; }
    if (y < 0) { y = -y; vel[v + 1] = -vel[v + 1] * 0.4; } else if (y > 1) { y = 2 - y; vel[v + 1] = -vel[v + 1] * 0.4; }
    grains[p] = x; grains[p + 1] = y;
    const lift = Math.min(1, hop / KICK + Math.hypot(vel[v], vel[v + 1]) * 40);
    grains[p + 2] += (lift - grains[p + 2]) * 0.25;
  }
}

function scatter(px, py, strength) {
  for (let i = 0; i < COUNT; i++) {
    const dx = grains[i * 3] - px, dy = grains[i * 3 + 1] - py;
    const d = Math.hypot(dx, dy);
    if (d > SCATTER_R || d < 1e-5) continue;
    const f = strength * (1 - d / SCATTER_R) * (0.6 + Math.random() * 0.8);
    vel[i * 2] += dx / d * f + (Math.random() - 0.5) * f * 0.6;
    vel[i * 2 + 1] += dy / d * f + (Math.random() - 0.5) * f * 0.6;
  }
}

// ────────────────────────────── Scene ──────────────────────────────

const canvas = document.getElementById('stage');
const statusEl = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e10);
scene.fog = new THREE.Fog(0x0d0e10, 3.2, 7);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 20);
camera.position.set(0.35, 0.82, 1.3);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, -0.06, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = 1.32;
controls.minDistance = 0.9;
controls.maxDistance = 4.2;
controls.rotateSpeed = 0.6;

// Lights: a warm key from above-left that throws the plate's shadow on the bench, a cool rim behind.
const key = new THREE.SpotLight(0xfff1dc, 16, 8, 0.55, 0.6, 1.2);
key.position.set(-1.4, 2.6, 1.1);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xb9cbff, 1.4);
rim.position.set(1.2, 0.9, -2);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0x8090a0, 0x101010, 0.25));

// Brushed steel: fine streaks along x, drawn once into a canvas and used for roughness and bump.
function brushedTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#808080';
  g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 9000; i++) {
    const y = Math.random() * 1024, x = Math.random() * 1024, len = 80 + Math.random() * 600;
    const v = 100 + Math.random() * 60;
    g.strokeStyle = `rgba(${v},${v},${v},${0.15 + Math.random() * 0.3})`;
    g.lineWidth = Math.random() < 0.85 ? 1 : 2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (Math.random() - 0.5) * 2); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const brushed = brushedTexture();

// The plate's top face flexes with the ringing modes: a few uniforms drive both the shape and its
// normals, so reflections ripple across the steel exactly where the sand is being thrown.
const plateUniforms = {
  uA: { value: new THREE.Vector4() }, uB: { value: new THREE.Vector4() },
  uFlex: { value: 0 }, uWave: { value: 0 },
};
const MODE_GLSL = `
uniform vec4 uA, uB;
uniform float uFlex, uWave;
varying float vU;
float modeU(vec4 m, vec2 q) {
  const float PI = 3.14159265;
  return 0.5 * m.w * (cos(m.x * PI * q.x) * cos(m.y * PI * q.y) + m.z * cos(m.y * PI * q.x) * cos(m.x * PI * q.y));
}
vec2 modeG(vec4 m, vec2 q) {
  const float PI = 3.14159265;
  float a = m.x * PI, b = m.y * PI;
  return -0.5 * m.w * vec2(
    a * sin(a * q.x) * cos(b * q.y) + m.z * b * sin(b * q.x) * cos(a * q.y),
    b * cos(a * q.x) * sin(b * q.y) + m.z * a * cos(b * q.x) * sin(a * q.y));
}
`;
const plateMat = new THREE.MeshPhysicalMaterial({
  color: 0x80868f, metalness: 1, roughness: 0.28, envMapIntensity: 0.5,
  roughnessMap: brushed, bumpMap: brushed, bumpScale: 0.35,
  clearcoat: 0.25, clearcoatRoughness: 0.4,
});
plateMat.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, plateUniforms);
  // The whole slab bends: every vertex rides the displacement at its (x, z); the top face also
  // tilts its normal with the slope.
  shader.vertexShader = MODE_GLSL + shader.vertexShader
    .replace('#include <beginnormal_vertex>', `
      vec2 q = position.xz + 0.5;
      vU = modeU(uA, q) + modeU(uB, q);
      vec2 du = (modeG(uA, q) + modeG(uB, q)) * uFlex;
      vec3 objectNormal = normal.y > 0.5 ? normalize(vec3(-du.x, 1.0, -du.y)) : normal;
      #ifdef USE_TANGENT
        vec3 objectTangent = vec3(tangent.xyz);
      #endif`)
    .replace('#include <begin_vertex>', `vec3 transformed = position + vec3(0.0, vU * uFlex, 0.0);`);
  shader.fragmentShader = `uniform float uWave;\nvarying float vU;\n` + shader.fragmentShader
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      // Wave view: antinodes glow warm or cool by the sign of the motion, the still lines stay dark.
      float aw = clamp(abs(vU), 0.0, 1.0);
      vec3 waveCol = vU > 0.0 ? vec3(1.0, 0.42, 0.16) : vec3(0.2, 0.5, 1.0);
      totalEmissiveRadiance += uWave * waveCol * pow(aw, 1.6) * 0.55;`);
};
const SEG = mobile ? 128 : 180;
const plate = new THREE.Mesh(new THREE.BoxGeometry(1, PLATE_T, 1, SEG, 1, SEG), plateMat);
plate.geometry.translate(0, -PLATE_T / 2, 0);     // top face at y = 0, where the sand sits
plate.castShadow = true;
plate.receiveShadow = true;
scene.add(plate);

const edgeMat = new THREE.MeshStandardMaterial({ color: 0x8b9099, metalness: 1, roughness: 0.28, envMapIntensity: 0.4 });

// The rig: a centre bolt, the post, and the vibration driver sitting on the bench.
const darkMetal = new THREE.MeshStandardMaterial({ color: 0x2a2d32, metalness: 0.85, roughness: 0.32, envMapIntensity: 0.45 });
const blackMat = new THREE.MeshStandardMaterial({ color: 0x111215, metalness: 0.2, roughness: 0.6 });
const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.008, 6), darkMetal);
bolt.position.y = 0.004;
const washer = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.002, 40), edgeMat);
washer.position.y = 0.001;
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, STAND, 24), darkMetal);
post.position.y = -PLATE_T - STAND / 2;
const driver = new THREE.Group();
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.145, 0.11, 64), blackMat);
body.position.y = 0.055;
const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.02, 48), darkMetal);
cap.position.y = 0.12;
const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.004, 12, 80), edgeMat);
ringMesh.rotation.x = Math.PI / 2;
ringMesh.position.y = 0.09;
driver.add(body, cap, ringMesh);
driver.position.y = -PLATE_T - STAND - 0.13;      // cap top meets the foot of the post
for (const m of [bolt, washer, post, body, cap]) { m.castShadow = true; m.receiveShadow = true; }
scene.add(bolt, washer, post, driver);
const BENCH = driver.position.y;

const bench = new THREE.Mesh(
  new THREE.CircleGeometry(4, 64),
  new THREE.MeshStandardMaterial({ color: 0x0b0c0e, roughness: 0.92, metalness: 0, envMapIntensity: 0.1 }));
bench.rotation.x = -Math.PI / 2;
bench.position.y = BENCH;
bench.receiveShadow = true;
scene.add(bench);

// Sand: points shaded as tiny spheres, plus a soft contact shadow under each grain that fades as it flies.
const sandPos = new Float32Array(COUNT * 3), shadowPos = new Float32Array(COUNT * 3);
const lift = new Float32Array(COUNT);
const sandGeo = new THREE.BufferGeometry();
sandGeo.setAttribute('position', new THREE.BufferAttribute(sandPos, 3).setUsage(THREE.DynamicDrawUsage));
sandGeo.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
const shadowGeo = new THREE.BufferGeometry();
shadowGeo.setAttribute('position', new THREE.BufferAttribute(shadowPos, 3).setUsage(THREE.DynamicDrawUsage));
shadowGeo.setAttribute('lift', new THREE.BufferAttribute(lift, 1).setUsage(THREE.DynamicDrawUsage));
for (const g of [sandGeo, shadowGeo]) g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1);

const pointScale = { value: 1 };
const sandMat = new THREE.ShaderMaterial({
  uniforms: { uScale: pointScale, uSize: { value: GRAIN }, uLight: { value: new THREE.Vector3() } },
  vertexShader: `
    attribute float seed;
    uniform float uScale, uSize;
    varying float vShade;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(1.2, uSize * (0.75 + 0.5 * seed) * uScale / -mv.z);
      vShade = 0.82 + 0.3 * seed;
    }`,
  fragmentShader: `
    uniform vec3 uLight;
    varying float vShade;
    void main() {
      vec2 c = gl_PointCoord * 2.0 - 1.0;
      float r2 = dot(c, c);
      if (r2 > 1.0) discard;
      vec3 n = vec3(c.x, -c.y, sqrt(1.0 - r2));
      float lit = 0.35 + 0.75 * max(0.0, dot(n, uLight));
      vec3 sand = vec3(0.86, 0.74, 0.55) * vShade * lit;
      gl_FragColor = vec4(sand, 1.0);
      #include <colorspace_fragment>
    }`,
});
const shadowMat = new THREE.ShaderMaterial({
  uniforms: { uScale: pointScale, uSize: { value: GRAIN * 2.1 } },
  vertexShader: `
    attribute float lift;
    uniform float uScale, uSize;
    varying float vA;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(1.5, uSize * (1.0 + lift) * uScale / -mv.z);
      vA = 0.5 * (1.0 - 0.7 * lift);
    }`,
  fragmentShader: `
    varying float vA;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      gl_FragColor = vec4(0.0, 0.0, 0.0, vA * (1.0 - smoothstep(0.2, 1.0, d)));
    }`,
  transparent: true, depthWrite: false,
});
const shadowPts = new THREE.Points(shadowGeo, shadowMat);
const sandPts = new THREE.Points(sandGeo, sandMat);
shadowPts.renderOrder = 1;
sandPts.renderOrder = 2;
scene.add(shadowPts, sandPts);

// ───────────────────────────── Layout ─────────────────────────────

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // Keep the whole plate in frame: pull back on narrow screens.
  const fit = Math.max(1, 1.12 / camera.aspect);
  camera.updateProjectionMatrix();
  const dist = 2.05 * fit;
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0.35, 0.82, 1.3);
  camera.position.copy(controls.target).add(dir.setLength(dist));
  controls.maxDistance = Math.max(4.2, dist * 1.6);
  pointScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
addEventListener('resize', resize);
resize();

// ───────────────────────────── Sound ─────────────────────────────

const slider = document.getElementById('freq');
const micBtn = document.getElementById('mic'), toneBtn = document.getElementById('tone'), waveBtn = document.getElementById('wave');
const toSlider = f => Math.round(1000 * Math.log(f / F_MIN) / Math.log(F_MAX / F_MIN));
const fromSlider = v => F_MIN * Math.pow(F_MAX / F_MIN, v / 1000);

let target = F_START, freq = F_START, drive = 1, driveTarget = 1;
slider.value = toSlider(F_START);

let audio = null, osc = null, oscGain = null, analyser = null, micStream = null, spectrum = null;
let micOn = false, toneOn = false, heard = 0;

function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') audio.resume();
  return audio;
}

function setTone(on) {
  toneOn = on;
  toneBtn.setAttribute('aria-pressed', String(on));
  if (on) {
    const ctx = ensureAudio();
    if (!osc) {
      osc = ctx.createOscillator();
      oscGain = ctx.createGain();
      oscGain.gain.value = 0;
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(oscGain).connect(ctx.destination);
      osc.start();
    }
    oscGain.gain.setTargetAtTime(0.035, ctx.currentTime, 0.08);
  } else if (oscGain) {
    oscGain.gain.setTargetAtTime(0, audio.currentTime, 0.05);
  }
}

async function setMic(on) {
  if (on) {
    const ctx = ensureAudio();
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
    } catch {
      micBtn.textContent = 'Mic blocked';
      setTimeout(() => { micBtn.textContent = 'Use mic'; }, 2400);
      return;
    }
    analyser = ctx.createAnalyser();
    analyser.fftSize = 8192;
    analyser.smoothingTimeConstant = 0.25;
    spectrum = new Float32Array(analyser.frequencyBinCount);
    ctx.createMediaStreamSource(micStream).connect(analyser);
    if (toneOn) setTone(false);       // the tone would only hear itself
    micOn = true;
    driveTarget = 0;
  } else {
    micOn = false;
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    micStream = null; analyser = null;
    driveTarget = 1;
  }
  micBtn.setAttribute('aria-pressed', String(micOn));
  toneBtn.disabled = micOn;
  slider.disabled = micOn;
}

// The loudest spectral peak between 80 Hz and F_MAX, refined by a parabola through its neighbours.
function listen() {
  analyser.getFloatFrequencyData(spectrum);
  const bin = audio.sampleRate / analyser.fftSize;
  const lo = Math.ceil(80 / bin), hi = Math.min(spectrum.length - 2, Math.floor(F_MAX / bin));
  let best = lo, peak = -Infinity;
  for (let i = lo; i <= hi; i++) if (spectrum[i] > peak) { peak = spectrum[i]; best = i; }
  const level = Math.max(0, Math.min(1, (peak + 68) / 38));
  if (level > 0.12) {
    const a = spectrum[best - 1], b = spectrum[best], c = spectrum[best + 1];
    const off = 0.5 * (a - c) / (a - 2 * b + c || 1);
    target = Math.max(F_MIN, Math.min(F_MAX, (best + off) * bin));
    slider.value = toSlider(target);
    driveTarget = Math.min(1, 0.35 + level);
    heard = performance.now();
  } else if (performance.now() - heard > 250) {
    driveTarget = 0;
  }
}

// ──────────────────────────── Controls ────────────────────────────

let waveOn = false;
slider.addEventListener('input', () => { target = fromSlider(+slider.value); });
micBtn.addEventListener('click', () => setMic(!micOn));
toneBtn.addEventListener('click', () => setTone(!toneOn));
waveBtn.addEventListener('click', () => { waveOn = !waveOn; waveBtn.setAttribute('aria-pressed', String(waveOn)); });
document.getElementById('reset').addEventListener('click', resetSand);

addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) return;
  const k = e.key.toLowerCase();
  if ((k === 'arrowright' || k === 'arrowup') && !micOn) { target = Math.min(F_MAX, target * 2 ** (1 / 12)); slider.value = toSlider(target); e.preventDefault(); }
  else if ((k === 'arrowleft' || k === 'arrowdown') && !micOn) { target = Math.max(F_MIN, target / 2 ** (1 / 12)); slider.value = toSlider(target); e.preventDefault(); }
  else if (k === 'r') resetSand();
  else if (k === 'm') setMic(!micOn);
  else if (k === 't' && !micOn) setTone(!toneOn);
  else if (k === 'w') waveBtn.click();
});

// A press that barely moves is a tap on the plate; anything longer is the camera orbiting.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let press = null;
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, t: performance.now() }; canvas.classList.add('dragging'); });
addEventListener('pointerup', e => {
  canvas.classList.remove('dragging');
  if (!press) return;
  const still = Math.hypot(e.clientX - press.x, e.clientY - press.y) < 6 && performance.now() - press.t < 450;
  press = null;
  if (!still) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(plate)[0];
  if (hit && hit.face.normal.y > 0.5) scatter(hit.point.x + 0.5, hit.point.z + 0.5, SCATTER_V);
});

// ───────────────────────────── Frame ─────────────────────────────

let builtFreq = -1, lastStatus = '', lastT = performance.now(), wave = 0;
const settle = new URLSearchParams(location.search).get('settle');   // ?settle=N runs N steps up front (previews)
buildField(freq); builtFreq = freq;
if (settle) for (let i = 0; i < Math.min(+settle, 3000); i++) stepSand(1);
const lightView = new THREE.Vector3();

function frame(now) {
  const dt = Math.min(50, now - lastT); lastT = now;
  const steps = 2 * Math.max(1, Math.min(3, Math.round(dt / 16.7)));   // two sand steps per 60 Hz frame

  if (micOn && analyser) listen();
  freq += (target - freq) * (micOn ? 0.18 : 0.12);
  drive += (driveTarget - drive) * (driveTarget > drive ? 0.15 : 0.04);
  if (Math.abs(freq - builtFreq) > 0.04 * Math.max(1, freq / 400)) { buildField(freq); builtFreq = freq; }
  if (osc) osc.frequency.setTargetAtTime(freq, audio.currentTime, 0.03);

  const ring = drive * (0.35 + 0.65 * mix.level);
  if (ring > 0.01) for (let s = 0; s < steps; s++) stepSand(ring);
  else stepSand(0);

  // Plate shape this frame, and every grain riding (or flying off) it.
  const t = now / 1000;
  const flex = FLEX * ring * Math.sin(t * BEAT);
  plateUniforms.uA.value.set(mix.a.n, mix.a.m, mix.a.s, mix.wa);
  plateUniforms.uB.value.set(mix.b.n, mix.b.m, mix.b.s, mix.wb);
  plateUniforms.uFlex.value = flex;
  wave += ((waveOn ? 1 : 0) - wave) * 0.12;
  plateUniforms.uWave.value = wave;

  const bounce = t * 21;
  for (let i = 0; i < COUNT; i++) {
    const p = i * 3, l = grains[p + 2];
    const x = grains[p] - 0.5, z = grains[p + 1] - 0.5;
    const surf = grainU[i] * flex + GRAIN * 0.45;
    const air = l > 0.05 ? l * HOP * Math.abs(Math.sin(bounce * (0.8 + 0.4 * seed[i]) + seed[i] * 40)) : 0;
    sandPos[p] = x; sandPos[p + 1] = surf + air; sandPos[p + 2] = z;
    shadowPos[p] = x; shadowPos[p + 1] = surf - GRAIN * 0.4; shadowPos[p + 2] = z;
    lift[i] = Math.min(1, air / HOP);
  }
  sandGeo.attributes.position.needsUpdate = true;
  shadowGeo.attributes.position.needsUpdate = true;
  shadowGeo.attributes.lift.needsUpdate = true;

  const dom = mix.wa >= mix.wb ? mix.a : mix.b;
  const text = `${Math.round(freq)} Hz / Mode (${dom.n}, ${dom.m})${micOn ? (driveTarget > 0 ? ' / Hearing you' : ' / Listening') : ''}`;
  if (text !== lastStatus) statusEl.textContent = lastStatus = text;

  controls.update();
  lightView.copy(key.position).normalize().transformDirection(camera.matrixWorldInverse);
  sandMat.uniforms.uLight.value.copy(lightView);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script defer src="/visit-counter.js" data-project="chladni-plate"></script>
</body>
</html>
