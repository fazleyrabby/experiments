    <title>Simulation Lab — Cube Solver</title>
    <meta name="description" content="A rig with a spindle on every face scrambles a cube and solves it, for any size from 2×2×2 to 7×7×7. The solver is real: it reads the stickers, fixes the parity of each kind of piece with single turns, then places pieces three at a time using commutators, short sequences that cycle three pieces and leave everything else untouched. Centres go first, then edges, then corners. Turn the faces yourself by dragging and it will solve from wherever you leave it." />
