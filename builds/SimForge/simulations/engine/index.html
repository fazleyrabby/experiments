    <meta name="description" content="An inline petrol engine with the front of the block cut away. Each cylinder carries its own gas through intake, compression, combustion and exhaust, and that pressure pushing the pistons is the only thing that turns the crank. Idle, stalling, the rev limiter and the effect of spark timing all come out of the model rather than being drawn in. The playback control slows what you see without slowing the engine, and the screen plots cylinder pressure against volume as a test cell would." />
