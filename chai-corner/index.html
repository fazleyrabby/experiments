<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chai Corner</title>
<meta name="description" content="A cozy pixel-art isometric diorama: a little tea stall by a lake. People stroll by, stop for a cup, sit and sip; rickshaws, CNGs and buses roll past and a boat drifts on the water. Rotate it, run the clock and click anything.">
<meta name="theme-color" content="#1a1420">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23f2c14e'/%3E%3Crect x='3' y='6' width='8' height='7' fill='%23fff'/%3E%3Crect x='11' y='7' width='2' height='4' fill='%23fff'/%3E%3Crect x='4' y='7' width='6' height='2' fill='%23b5651d'/%3E%3Crect x='5' y='2' width='1' height='3' fill='%23fff'/%3E%3Crect x='8' y='2' width='1' height='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@500;700&family=Noto+Sans+Bengali:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b1d14;--paper:#fff4dc;--paper2:#f3e3bf;--accent:#e0433a;--gold:#f2c14e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1420;color:var(--ink);font-family:"Pixelify Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #stage,#stage canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;touch-action:none}
  .ui{transition:opacity .3s}
  body.hide-ui .ui{opacity:0;pointer-events:none}
  .card{position:fixed;left:16px;top:16px;background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 14px 9px;max-width:min(340px,calc(100vw - 32px))}
  .logo{display:flex;align-items:baseline;gap:10px}
  .logo b{font-family:Silkscreen,monospace;font-size:22px;letter-spacing:1px;color:var(--accent);text-shadow:2px 2px 0 var(--gold)}
  .logo span{font-family:"Noto Sans Bengali",sans-serif;font-weight:700;font-size:17px}
  .card p{margin:4px 0 0;font-size:14px;line-height:1.3;opacity:.85}
  .clock{position:fixed;right:16px;top:16px;background:var(--ink);color:var(--gold);font-family:Silkscreen,monospace;font-size:18px;padding:6px 12px;border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
  .bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}
  .bar button{font-family:Silkscreen,monospace;font-size:13px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:7px 11px;cursor:pointer;min-height:40px}
  .bar button:hover{background:#fff}
  .bar button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .bar button.on{background:var(--gold)}
  .bar #rec{background:var(--accent);color:#fff}
  .bar #rec.live{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{background:#7a1d18}}
  .hint{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);font-size:13px;color:#fff4dc;text-shadow:2px 2px 0 #2b1d14;white-space:nowrap;opacity:.9}
  .style{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 12px;display:grid;gap:8px;width:min(400px,calc(100vw - 32px));font-family:Silkscreen,monospace;font-size:12px;z-index:3}
  .style[hidden]{display:none}
  .style .row{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:8px}
  .style .row .seg{grid-column:2/4}
  .style input[type=range]{width:100%;accent-color:var(--accent)}
  .style b{min-width:40px;text-align:right}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button,.seg .sw{font:inherit;font-size:11px;background:#fff;border:2px solid var(--ink);padding:3px 7px;cursor:pointer;min-height:26px;color:var(--ink)}
  .seg .sw{width:28px;padding:0;background:var(--c)}
  .seg .pick{position:relative;background:conic-gradient(#e0433a,#f2c14e,#5bb06f,#3d8fd1,#9b59b6,#e0433a);display:inline-block}
  .seg .pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .seg .on{background:var(--gold);box-shadow:inset 0 0 0 2px var(--ink)}
  .seg .sw.on{outline:3px solid var(--gold);outline-offset:1px;box-shadow:none}
  body.style-open .hint{display:none}
  .toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:Silkscreen,monospace;font-size:14px;padding:8px 14px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:640px){.hint{display:none}.card p{font-size:12px}.logo b{font-size:18px}.clock{top:auto;bottom:74px;right:16px;font-size:14px}}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="stage"></div>
<header class="card ui">
  <div class="logo"><b>CHAI CORNER</b><span>চা ঘর</span></div>
  <p>A tiny tea stall by the lake. Click anything.</p>
</header>
<div class="clock ui" id="clock">17:00</div>
<div class="hint ui">Drag or Q / E to rotate · scroll to zoom · shift-drag to pan · S style · H hides the UI</div>
<nav class="bar ui">
  <button id="rotL" title="Rotate left (Q)">&larr; Turn</button>
  <button id="rotR" title="Rotate right (E)">Turn &rarr;</button>
  <button id="zoomBtn" title="Zoom (scroll)">Zoom 1x</button>
  <button id="timeBtn" title="Time of day (T)">Auto</button>
  <button id="sndBtn" class="on" title="Sound (M)">Sound on</button>
  <button id="styleBtn" title="Pixel style (S)">Style</button>
  <button id="rec" title="Record a 14 second clip (R)">&#9679; Record</button>
</nav>
<section class="style ui" id="stylePanel" hidden>
  <div class="row"><span>Pixel size</span><input type="range" id="sPx" min="0" max="6" step="1"><b id="vPx">Auto</b></div>
  <div class="row"><span>Outline</span><div class="seg" id="sOut"><button data-v="0">Off</button><button data-v="1">Thin</button><button data-v="2">Bold</button></div></div>
  <div class="row"><span>Line color</span><div class="seg" id="sCol"><button data-v="auto">Auto</button><button data-v="#1a1018" class="sw" style="--c:#1a1018"></button><button data-v="#5a2e1a" class="sw" style="--c:#5a2e1a"></button><button data-v="#1f2a5a" class="sw" style="--c:#1f2a5a"></button><label class="sw pick" title="Custom color"><input type="color" id="sPick" value="#2b1d14"></label></div></div>
  <div class="row"><span>Colors</span><div class="seg" id="sDepth"><button data-v="0">Full</button><button data-v="24">24</button><button data-v="12">12</button><button data-v="6">6</button></div></div>
  <div class="row"><span>Edge shine</span><div class="seg" id="sHi"><button data-v="1">On</button><button data-v="0">Off</button></div></div>
</section>
<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';

/* ================================================================ utils */
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const angDiff=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));
const HALF=18, N=36, PI=Math.PI;
const _v=new THREE.Vector3(), _v2=new THREE.Vector3(), _q=new THREE.Quaternion(), _e=new THREE.Euler(), _s=new THREE.Vector3(), _c=new THREE.Color(), _m=new THREE.Matrix4(), _n3=new THREE.Matrix3();
let TIME=0;

/* ================================================================ renderer */
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.BasicShadowMap;
renderer.shadowMap.autoUpdate=false;
document.getElementById('stage').appendChild(renderer.domElement);

const clipPlanes=[
  new THREE.Plane(new THREE.Vector3(1,0,0),HALF+0.02), new THREE.Plane(new THREE.Vector3(-1,0,0),HALF+0.02),
  new THREE.Plane(new THREE.Vector3(0,0,1),HALF+0.02), new THREE.Plane(new THREE.Vector3(0,0,-1),HALF+0.02)];
renderer.clippingPlanes=clipPlanes;

const scene=new THREE.Scene();

/* ================================================================ materials & builders */
const gradTex=new THREE.DataTexture(new Uint8Array([72,140,205,255]),4,1,THREE.RedFormat);
gradTex.minFilter=gradTex.magFilter=THREE.NearestFilter; gradTex.generateMipmaps=false; gradTex.needsUpdate=true;
const vcMat=new THREE.MeshToonMaterial({vertexColors:true,gradientMap:gradTex});
const matCache=new Map();
function M(color){let m=matCache.get(color);if(!m){m=new THREE.MeshToonMaterial({color,gradientMap:gradTex});matCache.set(color,m)}return m}
function basic(color,o={}){return new THREE.MeshBasicMaterial({color,...o})}
const BOXG=new THREE.BoxGeometry(1,1,1);
const CYLG=new THREE.CylinderGeometry(0.5,0.5,1,8);
const CYL6=new THREE.CylinderGeometry(0.5,0.5,1,6);

function G(parent,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g}
function B(parent,w,h,d,color,x=0,y=0,z=0,o={}){
  const m=new THREE.Mesh(o.geo||BOXG,o.mat||M(color));m.scale.set(w,h,d);m.position.set(x,y+h/2,z);
  if(o.rx||o.ry||o.rz)m.rotation.set(o.rx||0,o.ry||0,o.rz||0);
  m.castShadow=o.cast!==false;m.receiveShadow=true;parent.add(m);return m}

/* merges many boxes into one vertex-coloured mesh (one draw call) */
class Batch{
  constructor(){this.p=[];this.n=[];this.c=[];this.i=[];this.v=0;this.base=new THREE.Matrix4()}
  at(x,y,z,ry=0){this.base.compose(_v.set(x,y,z),_q.setFromEuler(_e.set(0,ry,0)),_s.set(1,1,1));return this}
  reset(){this.base.identity();return this}
  add(geo,w,h,d,color,x,y,z,rx=0,ry=0,rz=0){
    const m=new THREE.Matrix4().compose(_v.set(x,y+h/2,z),_q.setFromEuler(_e.set(rx,ry,rz)),_s.set(w,h,d)).premultiply(this.base);
    _n3.getNormalMatrix(m);
    const P=geo.attributes.position,Nn=geo.attributes.normal,I=geo.index;_c.set(color);
    for(let k=0;k<P.count;k++){
      _v2.fromBufferAttribute(P,k).applyMatrix4(m);this.p.push(_v2.x,_v2.y,_v2.z);
      _v2.fromBufferAttribute(Nn,k).applyMatrix3(_n3).normalize();this.n.push(_v2.x,_v2.y,_v2.z);
      this.c.push(_c.r,_c.g,_c.b)}
    for(let k=0;k<I.count;k++)this.i.push(this.v+I.getX(k));
    this.v+=P.count;return this}
  box(w,h,d,color,x=0,y=0,z=0,rx,ry,rz){return this.add(BOXG,w,h,d,color,x,y,z,rx,ry,rz)}
  cyl(r,h,color,x=0,y=0,z=0,rx,ry,rz,seg8=true){return this.add(seg8?CYLG:CYL6,r*2,h,r*2,color,x,y,z,rx,ry,rz)}
  build(parent,cast=true){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3));
    g.setIndex(this.i);g.computeBoundingSphere();
    const m=new THREE.Mesh(g,vcMat);m.castShadow=cast;m.receiveShadow=true;parent.add(m);return m}
}

/* ================================================================ clicking registry */
const clickTargets=[];
function clickable(obj,fn,hover=true){obj.userData.onClick=fn;obj.userData.hover=hover;clickTargets.push(obj);return obj}
function unclick(obj){const k=clickTargets.indexOf(obj);if(k>=0)clickTargets.splice(k,1)}
function disposeTree(o){o.traverse(c=>{if(c.geometry&&c.geometry!==BOXG&&c.geometry!==CYLG&&c.geometry!==CYL6)c.geometry.dispose()})}

/* ================================================================ ground grid */
const TOP={grass:0,road:-0.06,walk:0.14,dirt:0.02,sand:-0.04,bed:-0.75,brick:0.12,bazaar:0.04,field:0.0,paddy:-0.16,bund:0.06};
const PAL={
  grass:[0x7cb342,0x86bd4a,0x74ab3d,0x80b845],road:[0x4b4b57,0x474753,0x4f4f5b],walk:[0xcfc6b4,0xc3b9a6,0xd6cebd],
  dirt:[0xc99c66,0xc0925b,0xd1a670],sand:[0xe4cb90,0xdac084,0xe9d39c],bed:[0x2f5a5c,0x2b5456],
  brick:[0xb8664a,0xa95c42,0xc27052],bazaar:[0xb88a5a,0xae8050,0xc29464],field:[0x82c24c,0x74b443],paddy:[0x6f9f86,0x679a7e,0x77a88c],bund:[0x9a7a4a,0x8f7044]};
const WATER_Y=-0.22;
function lakeR(x,z){const dx=(x+6.4)/5.1,dz=(z-6.5)/4.9;return dx*dx+dz*dz+0.10*Math.sin(x*1.3+z*0.7)+0.07*Math.cos(z*1.9-x*0.4)}
const CELL=new Array(N*N);
for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const x=i-HALF+0.5,z=j-HALF+0.5;let t='grass';
  if(z<-8){if(x<4.5){t=z>=-10.5?'brick':z>=-13.5?'bazaar':'grass'}else t=z<-10.5?'field':'grass'}
  else if(z<-4)t='road';else if(z<-1)t='walk';
  else if(x<-12.5&&z>=3)t=(j%4===0||i===4)?'bund':'paddy';
  else{const r=lakeR(x,z);if(r<1)t='bed';else if(r<1.38)t='sand';else if(x>=0&&x<11&&z<2.5)t='dirt'}
  CELL[i+j*N]=t}
const cellAt=(x,z)=>{const i=clamp(Math.floor(x+HALF),0,N-1),j=clamp(Math.floor(z+HALF),0,N-1);return CELL[i+j*N]};
const groundY=(x,z)=>TOP[cellAt(x,z)];
const isWater=(x,z)=>Math.abs(x)<HALF&&Math.abs(z)<HALF&&cellAt(x,z)==='bed';
const deepWater=(x,z,m=0.8)=>isWater(x,z)&&isWater(x+m,z)&&isWater(x-m,z)&&isWater(x,z+m)&&isWater(x,z-m)&&isWater(x+m*.7,z+m*.7)&&isWater(x-m*.7,z-m*.7)&&isWater(x+m*.7,z-m*.7)&&isWater(x-m*.7,z+m*.7);

const groundMat=new THREE.MeshToonMaterial({color:0xffffff,gradientMap:gradTex});
const groundMeshes=[];
for(const type of Object.keys(TOP)){
  const cells=[];for(let k=0;k<N*N;k++)if(CELL[k]===type)cells.push(k);
  if(!cells.length)continue;
  const im=new THREE.InstancedMesh(BOXG,groundMat,cells.length);
  const top=TOP[type],bot=-0.9;
  cells.forEach((k,n)=>{const i=k%N,j=Math.floor(k/N);
    _m.compose(_v.set(i-HALF+0.5,(top+bot)/2,j-HALF+0.5),_q.identity(),_s.set(1,top-bot,1));im.setMatrixAt(n,_m);
    const pal=PAL[type];im.setColorAt(n,_c.set(pal[type==='field'?i%2:(i*7+j*13+((i*j)%5))%pal.length]))});
  im.receiveShadow=true;im.castShadow=type!=='bed'&&type!=='paddy';im.userData.type=type;scene.add(im);groundMeshes.push(im);
  clickable(im,(hit)=>groundClick(type,hit),false)}

/* static world batch */
const S=new Batch();
// floating slab
S.box(N,2.1,N,0x8a5a34,0,-3.0,0);
S.box(N+0.01,0.14,N+0.01,0x6b4329,0,-1.55,0);
S.box(N+0.01,0.1,N+0.01,0x6b4329,0,-2.35,0);
S.box(N+0.012,0.25,N+0.012,0x4a3328,0,-3.0,0);
// road markings
for(let x=-HALF+0.5;x<HALF;x+=2){if(x>-4.2&&x<-0.4)continue;S.box(0.9,0.02,0.1,0xf3e6c4,x,-0.06,-6)}
for(let k=0;k<6;k++)S.box(0.36,0.02,3.7,0xf3f0e6,-3.7+k*0.62,-0.06,-6);
// curbs, painted like the ones back home
for(let x=-HALF;x<HALF;x+=1){const col=(x+HALF)%2?0xf2c14e:0x34343c;
  S.box(1,0.24,0.2,col,x+0.5,-0.06,-3.9);S.box(1,0.16,0.16,col,x+0.5,-0.06,-8.08)}
// grass tufts & tiny flowers
{const FL=[0xff8fb1,0xf6c945,0xffffff,0xb07cff,0xff6b4a];
 for(let k=0;k<1100;k++){const x=rand(-HALF+0.2,HALF-0.2),z=rand(-HALF+0.2,HALF-0.2);const ct=cellAt(x,z);if(ct!=='grass'&&!(ct==='field'&&Math.random()<0.4))continue;
   if(Math.random()<0.75)S.box(0.07,0.16,0.07,0x5f9a32,x,0,z);else{S.box(0.04,0.14,0.04,0x4f8a2a,x,0,z);S.box(0.11,0.08,0.11,pick(FL),x,0.14,z)}}}

/* ================================================================ lighting */
const hemi=new THREE.HemisphereLight(0xcfe3ff,0x8a6a48,1.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.castShadow=true;
sun.shadow.mapSize.set(3072,3072);Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:110});
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;scene.add(sun);scene.add(sun.target);
const LIGHTS=[];// {light, base, on, kind}
function pointLight(x,y,z,color,base,dist=7){const l=new THREE.PointLight(color,0,dist,1.6);l.position.set(x,y,z);scene.add(l);const o={light:l,base,on:true};LIGHTS.push(o);return o}
const glowMats=[];// emissive bits that brighten at night {mat, day, night, ref}
function glowMat(day,night,ref){const m=basic(day);glowMats.push({mat:m,day:new THREE.Color(day),night:new THREE.Color(night),ref});return m}
const POOLS=[];// light pools on the ground
const poolGeo=new THREE.CircleGeometry(1,12);
function lightPool(x,y,z,r,color,ref){const m=new THREE.Mesh(poolGeo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
  m.rotation.x=-PI/2;m.position.set(x,y+0.015,z);m.scale.setScalar(r);m.layers.set(1);scene.add(m);POOLS.push({m,ref});return m}

/* ================================================================ bubbles (pixel speech icons) */
const ICONS={
 tea:["..g.g.....",".g.g......","kkkkkkk...","kooooookk.","kwwwwwk.k.","kwwwwwk.k.",".kwwwkkk..","kkkkkkkk..",".........."],
 heart:[".kk...kk..","krrk.krrk.","krrrkrrrk.","krrrrrrrk.",".krrrrrk..","..krrrk...","...krk....","....k.....",".........."],
 bang:["...krk....","...krk....","...krk....","...krk....","...krk....","....k.....","...krk....","....k.....",".........."],
 note:["....kkkkkk","....k....k","....k....k","....k....k","..kkk..kkk",".kkkk.kkkk",".kkk..kkk.","..........",".........."],
 zzz:["kkkkk.....","...k......","..k.......",".k........","kkkkk.kkk.",".......k..","......k...","......kkk.",".........."],
 fish:["..........","..kkkk..k.",".kcccck.kk","kckcccckck","kcccccccck",".kcccck.kk","..kkkk..k.","..........",".........."],
 smile:["..kkkkkk..",".kyyyyyyk.","kyykyykyyk","kyyyyyyyyk","kykyyyykyk","kyykkkkyyk",".kyyyyyyk.","..kkkkkk..",".........."],
 q:["...kkkk...","..k....k..",".......k..","......k...",".....k....",".....k....","..........",".....k....",".........."],
 sun:["....y.....",".y..y..y..","..yyyyy...","..yyyyy...","yyyyyyyyy.","..yyyyy...","..yyyyy...",".y..y..y..","....y....."],
 moon:["...kkk....","..kyyk....",".kyyk.....",".kyyk.....",".kyyk.....",".kyyyk....","..kyyykk..","...kkkk...",".........."]};
const ICOL={k:'#2b1d14',r:'#e0433a',y:'#f6c945',o:'#c8743a',g:'#9aa4ab',w:'#ffffff',c:'#4fb3d9'};
const bubbleMats={};
for(const [name,rows] of Object.entries(ICONS)){
  const cv=document.createElement('canvas');cv.width=16;cv.height=16;const x=cv.getContext('2d');
  x.fillStyle=ICOL.k;x.fillRect(1,0,14,13);x.fillRect(0,1,16,11);
  x.fillStyle='#fff8ea';x.fillRect(2,1,12,11);x.fillRect(1,2,14,9);x.fillRect(7,12,2,1);
  x.fillStyle=ICOL.k;x.fillRect(7,13,2,1);
  rows.forEach((r,yy)=>[...r].forEach((ch,xx)=>{if(ch!=='.'){x.fillStyle=ICOL[ch];x.fillRect(3+xx,2+yy,1,1)}}));
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
  bubbleMats[name]=new THREE.SpriteMaterial({map:t,depthTest:false,depthWrite:false,transparent:true})}
const BUBBLES=[];
function bubble(target,icon,dur=1.8,yOff=1.75){

class Vehicle{
  constructor(type,lane){this.type=type;this.lane=lane;const T=VT[type];this.len=T.len;this.vmax=rand(...T.sp);this.v=this.vmax*0.8;
    this.g=G(scene);this.body=G(this.g);this.wheels=[];T.build(this);
    this.g.position.set(-lane.dir*(HALF+this.len/2+0.6),TOP.road,lane.z);this.g.rotation.y=lane.dir>0?0:PI;
    this.dist=0;this.by=0;this.bv=0;this.stopT=0;this.stopped=false;
    clickable(this.g,()=>this.poke());VEH.push(this)}
  poke(){SFX[VT[this.type].sfx]();this.bv=3.2;bubble(this.g,'bang',1.2,this.type==='bus'||this.type==='truck'?2.3:1.7);
    for(const p of PEOPLE){if(p.seat||p===shopkeeper)continue;if(p.g.position.distanceTo(this.g.position)<4){p.jv=3.8;if(Math.random()<0.5)bubble(p.g,pick(['bang','q']),1.2,1.75*p.s)}}}
  update(dt){const x=this.g.position.x,dir=this.lane.dir;let gap=Infinity;
    for(const o of VEH){if(o===this||o.lane!==this.lane)continue;const d=(o.g.position.x-x)*dir;if(d>0){const gp=d-(o.len+this.len)/2;if(gp<gap)gap=gp}}
    let want=this.vmax;if(gap<7)want=Math.min(want,Math.max(0,gap-0.8)*1.3);
    if(this.type==='bus'&&dir>0&&!this.stopped){const toStop=8.6-x;if(toStop<5&&toStop>-0.5)want=Math.min(want,Math.max(0.35,toStop*0.9));if(toStop<0.15){this.stopped=true;this.stopT=3.6;busStop.arrive(this)}}
    if(this.stopT>0){this.stopT-=dt;want=0}
    this.v+=clamp(want-this.v,-7*dt,2.6*dt);if(this.v<0)this.v=0;
    const dx=this.v*dt;this.g.position.x+=dx*dir;this.dist+=dx;
    for(const w of this.wheels)w.rotation.z=-this.dist/w.userData.r;
    if(this.rider)this.rider.pedal=this.dist*3,this.rider.pose(dt,false);
    this.bv-=22*dt;this.by+=this.bv*dt;if(this.by<0){this.by=0;this.bv=0}
    this.body.position.y=this.by+(this.v>0.1?Math.abs(Math.sin(this.dist*2.2))*0.015:0);
    if(this.beam)this.beam.material.opacity=LAMP*0.3;
    if(x*dir>HALF+this.len/2+1)this.remove()}
  remove(){scene.remove(this.g);unclick(this.g);disposeTree(this.g);if(this.g.userData.bub)killBubble(this.g.userData.bub);VEH.splice(VEH.indexOf(this),1)}
}

  let tot=0;for(const t of types)tot+=VT[t].w;let r=Math.random()*tot,type=types[0];for(const t of types){r-=VT[t].w;if(r<=0){type=t;break}}

  tex.magFilter=tex.minFilter=THREE.NearestFilter;tex.generateMipmaps=false;
  const bc=[(bg>>16)&255,(bg>>8)&255,bg&255],fc=[(fg>>16)&255,(fg>>8)&255,fg&255];

  else if(k==='r')record();else if(k==='h')document.body.classList.toggle('hide-ui');else if(k==='s')toggleStyle();else if(k==='='||k==='+')setZoom(zoomI+1);else if(k==='-')setZoom(zoomI-1)});

/* ================================================================ recording a clip for sharing */

  const types=['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm'];const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!mime){toast('Recording not supported here');return}
  const stream=cvs.captureStream(60);if(AU.dest&&AU.on)stream.addTrack(AU.dest.stream.getAudioTracks()[0]);
  const chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14e6});recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  recorder.onstop=()=>{const blob=new Blob(chunks,{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chai-corner.'+(mime.includes('mp4')?'mp4':'webm');a.click();recorder=null;tour=null;
    document.getElementById('rec').classList.remove('live');document.getElementById('rec').innerHTML='&#9679; Record';document.body.classList.remove('hide-ui')};
  tour={t:0,dur:14,az0:Math.round((az-PI/4)/(PI/2))*(PI/2)+PI/4,h0:15.6,h1:21.2};
  document.body.classList.add('hide-ui');document.getElementById('rec').classList.add('live');document.getElementById('rec').textContent='REC';
  recorder.start();setTimeout(()=>recorder&&recorder.stop(),tour.dur*1000)}

/* ================================================================ main loop */
resize();
const staticMesh=S.build(scene);
let last=performance.now(),hoverFrame=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;TIME+=dt;
  // time of day
  if(tour){tour.t+=dt;H=lerp(tour.h0,tour.h1,clamp(tour.t/tour.dur,0,1));const seg=Math.floor(tour.t/3.5);const want=tour.az0+Math.min(seg,3)*PI/2;if(Math.abs(want-ROT.to)>1e-3)rotateTo(want)}
  else if(tTarget!==null){let d=tTarget-H;if(d<0)d+=24;if(d>0.02){H+=Math.min(d,dt*Math.max(1.2,d*1.8))}else H=tTarget;H%=24}
  else H=(H+dt*0.12)%24;
  applyTime();
  if(ROT.t<1){ROT.t=Math.min(1,ROT.t+dt/0.6);az=lerp(ROT.from,ROT.to,ease(ROT.t))}
  if(ZM.t<1){ZM.t=Math.min(1,ZM.t+dt/0.35);zoom=lerp(ZM.from,ZM.to,ease(ZM.t))}
  for(let k=TIMERS.length-1;k>=0;k--){const T=TIMERS[k];T.t-=dt;if(T.t<=0){TIMERS.splice(k,1);T.fn()}}
  updateCamera();

  // spawns
  walkT-=dt;if(walkT<0){walkT=rand(1.0,2.2);if(PEOPLE.filter(p=>p.walker).length<20)spawnWalker()}
  vehT-=dt;if(vehT<0){vehT=rand(1.2,3.2);if(VEH.length<9)spawnVehicle()}
  if(!busStop.rider){busStop.cool-=dt;if(busStop.cool<0)busStop.spawn()}

  for(const p of[...PEOPLE]){p.update(dt);
    if(p.walker&&p.mayOrder&&!p.decided){const ahead=(SX-p.g.position.x)*p.dir;if(ahead<2.6&&ahead>0.6){p.decided=true;if(p.forced||Math.random()<0.75)tryOrder(p)}}
    if(p.walker&&p.stops)for(const st of p.stops){if(st.done)continue;const ah=(st.c.x-p.g.position.x)*p.dir;if(ah<1.0&&ah>0.15){st.done=true;browse(p,st.c);break}}}
  fisher.update(dt);rower.update(dt);updateZones(dt);
  for(const v of[...VEH])v.update(dt);

  // stall life
  flame.scale.y=0.08*(0.7+Math.random()*0.6);
  if(Math.random()<dt*(kettle.userData.burst>0?40:4))emit({x:spout.x+rand(-.03,.03),y:spout.y,z:spout.z,vx:rand(-.1,.1),vy:rand(0.5,0.9),vz:-0.15,life:rand(1,1.6),size:rand(0.08,0.13),color:0xf6f6f6,sway:0.12,grow:0.6});
  if(kettle.userData.burst>0){kettle.userData.burst-=dt;kettle.position.y=1.22+Math.abs(Math.sin(TIME*40))*0.03}else kettle.position.y=1.22;
  for(const j of jars){if(j.userData.w>0){j.userData.w-=dt;j.rotation.z=Math.sin(TIME*25+j.position.x*5)*0.15*j.userData.w}else j.rotation.z=0}
  {const u=bananas.userData;u.v+=(-u.a*14-u.v*0.9)*dt;u.a+=u.v*dt;bananas.rotation.x=u.a*0.4;bananas.rotation.z=Math.sin(TIME*0.9)*0.04+u.a*0.2}
  if(sign.userData.jig>0){sign.userData.jig-=dt;sign.position.y=3.07+Math.abs(Math.sin(TIME*30))*0.06*sign.userData.jig}
  if(AU.radio&&Math.random()<dt*2){radio.getWorldPosition(_v);if(Math.random()<0.3)bubble(radio,'note',1.0,0.3);emit({x:_v.x,y:_v.y+0.25,z:_v.z,vy:0.6,vx:rand(-.2,.2),life:1.2,size:0.07,color:pick([0xf2c14e,0xff8fb1,0x6fc3ff])})}

  // trees, clothes
  for(const t of TREES){t.shake=Math.max(0,t.shake-dt*1.2);t.g.rotation.z=Math.sin(TIME*0.9+t.ph)*0.018+Math.sin(TIME*38)*0.06*t.shake;t.g.rotation.x=Math.cos(TIME*0.7+t.ph)*0.012}
  for(const c of clothes){c.userData.f=Math.max(0,(c.userData.f||0)-dt);c.rotation.z=Math.sin(TIME*2.2+c.position.z)*0.12+Math.sin(TIME*14+c.position.z)*0.35*c.userData.f}
  for(let k=BIRDS.length-1;k>=0;k--){const b=BIRDS[k];b.t+=dt;b.g.position.x+=b.vx*dt;b.g.position.z+=b.vz*dt;b.g.position.y+=b.vy*dt;const f=Math.sin(b.t*28)*0.9;b.wl.rotation.z=f;b.wr.rotation.z=-f;
    if(b.t>4){scene.remove(b.g);disposeTree(b.g);BIRDS.splice(k,1)}}
  for(let k=FLOWERS.length-1;k>=0;k--){const f=FLOWERS[k];if(f.t<1){f.t+=dt*2.5;const s=f.t<1?Math.min(1.25,f.t*1.3):1;f.g.scale.setScalar(Math.max(0.01,Math.round(s*5)/5))}}

  // boat
  boatA+=dt*0.1;const bx=-6.4+Math.cos(boatA)*2.6,bz=6.6+Math.sin(boatA)*2.3;const tx=-Math.sin(boatA)*2.6,tz=Math.cos(boatA)*2.3;
  boat.position.set(bx,WATER_Y+0.04+Math.sin(TIME*1.6)*0.03,bz);boatSpin=Math.max(0,boatSpin-dt*0.7);boat.rotation.y=Math.atan2(-tz,tx)+Math.sin(boatSpin*PI*2)*0.5*boatSpin;boat.rotation.z=Math.sin(TIME*1.3)*0.04;
  const stroke=TIME*2.4;rower.rowing=stroke;oars.forEach((o,i)=>{const s=i?1:-1;o.rotation.y=Math.sin(stroke)*0.5*s;o.rotation.x=(Math.cos(stroke)*0.25+0.2)*s});
  if(Math.random()<dt*3)emit({x:bx-tx/3.5*0.9,y:WATER_Y+0.02,z:bz-tz/3.5*0.9,vx:rand(-.2,.2),vz:rand(-.2,.2),life:1.2,size:0.08,color:0xe8fbff});
  // ducks: mother wanders, ducklings follow in a line
  {const m=DUCKS[0];const dx=m.tx-m.g.position.x,dz=m.tz-m.g.position.z,d=Math.hypot(dx,dz);
   if(d<0.3){for(let k=0;k<30;k++){const x=rand(-11,-2),z=rand(2,11.5);if(deepWater(x,z,0.9)&&Math.hypot(x-bx,z-bz)>1.5){m.tx=x;m.tz=z;break}}}
   else{m.g.position.x+=dx/d*dt*0.45;m.g.position.z+=dz/d*dt*0.45;m.g.rotation.y+=angDiff(m.g.rotation.y,Math.atan2(dx,dz))*Math.min(1,dt*4)}
   for(let k=1;k<DUCKS.length;k++){const a=DUCKS[k-1].g.position,g=DUCKS[k].g;const ex=a.x-g.position.x,ez=a.z-g.position.z,ed=Math.hypot(ex,ez);
     if(ed>0.42){g.position.x+=ex/ed*(ed-0.42)*Math.min(1,dt*4);g.position.z+=ez/ed*(ed-0.42)*Math.min(1,dt*4);g.rotation.y+=angDiff(g.rotation.y,Math.atan2(ex,ez))*Math.min(1,dt*5)}}
   for(const q of DUCKS){q.hv-=14*dt;q.hop=Math.max(0,q.hop+q.hv*dt);if(q.hop===0)q.hv=Math.max(q.hv,0);q.g.position.y=WATER_Y+0.04+Math.sin(TIME*2+q.ph)*0.02+q.hop}}
  // fisherman line & catch
  {let ry=-0.55;
   if(fishState){fishState.t+=dt;const t=fishState.t;ry=-0.55-Math.min(1,t*3)*0.6;if(t>0.25&&!fishState.j){fishState.j=1;fishJump(-6.1,3.4,-4.4,3.4);ripple(-6.1,3.4)}if(t>1.0&&!fishState.b){fishState.b=1;bubble(fisher.g,'fish',1.6,1.45)}if(t>2.2)fishState=null}
   rod.rotation.x=lerp(rod.rotation.x,ry,Math.min(1,dt*8));
   rod.updateMatrixWorld(true);_v.set(0,0,2.1);rod.localToWorld(_v);const bob=Math.sin(TIME*1.3)*0.04;
   lineM.position.set(_v.x,(_v.y+WATER_Y+bob)/2,_v.z);lineM.scale.y=Math.max(0.05,_v.y-WATER_Y-bob)}
  for(let k=FISH.length-1;k>=0;k--){const f=FISH[k];f.t+=dt;const u=f.t/f.dur;if(u>=1){splash(f.x1,f.z1,10);ripple(f.x1,f.z1);scene.remove(f.g);disposeTree(f.g);FISH.splice(k,1);continue}
    f.g.position.set(lerp(f.x0,f.x1,u),WATER_Y+Math.sin(u*PI)*f.h,lerp(f.z0,f.z1,u));f.g.rotation.y=Math.atan2(f.x1-f.x0,f.z1-f.z0);f.g.rotation.x=lerp(-1.1,1.1,u)}
  // cat
  catAwake-=dt;{const aw=catAwake>0;catHead.rotation.x=lerp(catHead.rotation.x,aw?-0.3:0.45,Math.min(1,dt*6));catHead.position.y=aw?0.16:0.06;
   catTail.rotation.y=aw?Math.sin(TIME*8)*0.6:1.2;catTail.rotation.x=aw?-0.8:0.1;catZ-=dt;if(!aw&&catZ<0){catZ=rand(5,9);bubble(cat,'zzz',1.6,0.6)}}
  // ripples
  for(let k=RIPPLES.length-1;k>=0;k--){const r=RIPPLES[k];r.t+=dt;const s=0.2+r.t*1.4*r.big;r.m.scale.setScalar(Math.round(s*6)/6);r.m.material.opacity=1-r.t;if(r.t>=1){scene.remove(r.m);RIPPLES.splice(k,1)}}
  // fireflies at night
  for(let k=0;k<FF;k++){const f=ffs[k];const x=f.x+Math.sin(TIME*f.sp+f.ph)*0.8,z=f.z+Math.cos(TIME*f.sp*0.8+f.ph*1.3)*0.8,y=f.y+Math.sin(TIME*1.3+f.ph)*0.25;
    const on=NIGHT>0.4&&Math.sin(TIME*2+f.ph*3)>0.2;_m.compose(_v.set(x,y,z),_q.identity(),_s.setScalar(on?0.07:0));ffMesh.setMatrixAt(k,_m)}ffMesh.instanceMatrix.needsUpdate=true;
  pMesh.material.color.setRGB(1,1,1).lerp(_c.set(0x8a93c0),NIGHT*0.7);updateParticles(dt);waterU.time.value=TIME;

  // bubbles follow, pixel-snapped
  for(let k=BUBBLES.length-1;k>=0;k--){const b=BUBBLES[k];b.t+=dt;if(b.t>b.dur||!b.target.parent){killBubble(b);continue}
    b.target.getWorldPosition(b.s.position);b.s.position.y+=b.yOff;snapSprite(b.s.position);const sc=(b.t<0.08||b.t>b.dur-0.08?0.5:1)*16*wpp;b.s.scale.set(sc,sc,1)}

  // hover cursor

  fsU.time.value=TIME;fsU.starAmt.value=NIGHT;fsU.cloudAmt.value=0.35+DAY*0.65;
  // passes

  cam.layers.enableAll();renderer.setRenderTarget(rtColor);renderer.setClearColor(0x000000,0);renderer.clear();renderer.render(scene,cam);
  cam.layers.disable(1);scene.overrideMaterial=normalMat;renderer.setRenderTarget(rtNormal);renderer.setClearColor(0x000000,0);renderer.clear();renderer.render(scene,cam);scene.overrideMaterial=null;cam.layers.enableAll();
  renderer.setRenderTarget(null);renderer.render(fsScene,fsCam);
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.__chai={scene,cam,PEOPLE,VEH,SEATS,QUEUE,setH:h=>{H=h;tTarget=null;tmode=0}};
