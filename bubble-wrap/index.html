<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Wrap // 02</title>
<style>
  :root { --bg: #E4572E; --cream: #FFF1E3; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  .label {
    position: fixed; bottom: 26px; pointer-events: none; user-select: none; -webkit-user-select: none;
    font: 500 11px/1.7 "Helvetica Neue", Helvetica, Inter, system-ui, sans-serif;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--cream);
  }
  .label.left { left: 28px; }
  .label.right { right: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  .label.visits { top: 24px; bottom: auto; right: 28px; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .label.visits[hidden] { display: none; }
  .label.visits::before { content: ""; width: 6px; height: 6px; background: var(--cream); }
  .label .hint { opacity: 0.6; }
  @media (max-width: 520px) {
    .label { bottom: 18px; font-size: 10px; }
    .label.left { left: 18px; }
    .label.right { right: 18px; }
    .label.visits { top: 16px; right: 18px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="label left">
  <div>Bubble Wrap // 02</div>
  <div class="hint">Press to pop / Drag to pop a row</div>
</div>
<div class="label right" id="status"></div>
<div class="label visits" id="visits" title="Total visits" hidden></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ───────────────────────────── Config ─────────────────────────────

const BG = '#E4572E';
const INK = '#C8421D';            // counter printed on the surface under the sheet

const BUBBLE_RADIUS = 0.3;
const DOME_HEIGHT = 0.62;         // relative to radius
const PITCH = 0.66;               // centre-to-centre spacing
const LAYOUTS = { landscape: [16, 11], portrait: [9, 17] };   // [columns, rows]

const BASE_TILT = -0.3;           // sheet leans back like it is lying on a desk
const PRESS_TIME = 0.07;          // seconds a bubble squishes before it bursts
const POP_TIME = 0.14;
const INFLATE_TIME = 0.32;
const RARE_CHANCE = 1 / 36;       // bubbles that burst into confetti
const CONFETTI_COLORS = [0xFFF1E3, 0x1238FF, 0xFFD23F, 0x7CE0C3];

// ───────────────────────────── Renderer & scene ─────────────────────────────

const canvas = document.getElementById('stage');
const statusEl = document.getElementById('status');

// No tone mapping: the backdrop seen through the plastic must match the
// backdrop seen directly, and blown-out highlights suit glossy film.
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

const key = new THREE.DirectionalLight(0xFFFFFF, 1.2);
key.position.set(-4, 6, 8);
scene.add(key);

const root = new THREE.Group();   // tilts with the pointer; holds surface + sheet
root.rotation.x = BASE_TILT;
scene.add(root);

// ───────────────────────────── Bubble geometry & material ─────────────────────────────

function fixWinding(geometry) {
  // LatheGeometry's winding depends on profile direction; make front faces agree with the normals.
  const p = geometry.attributes.position, n = geometry.attributes.normal, idx = geometry.index;
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), vn = new THREE.Vector3();
  for (let t = 0; t < idx.count; t += 3) {
    a.fromBufferAttribute(p, idx.getX(t)); b.fromBufferAttribute(p, idx.getX(t + 1)); c.fromBufferAttribute(p, idx.getX(t + 2));
    const face = b.sub(a).cross(c.sub(a));
    if (face.lengthSq() < 1e-12) continue;
    vn.fromBufferAttribute(n, idx.getX(t));
    if (face.dot(vn) < 0) {
      for (let k = 0; k < idx.count; k += 3) {
        const tmp = idx.getX(k + 1); idx.setX(k + 1, idx.getX(k + 2)); idx.setX(k + 2, tmp);
      }
    }
    return;
  }
}

function createDomeGeometry() {
  // Superellipse profile: upright wall at the rim, flat-ish top. Unit radius, +Z up.
  const points = [], power = 2 / 2.6, steps = 26;
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * Math.PI / 2;
    points.push(new THREE.Vector2(
      Math.max(1e-4, Math.pow(Math.cos(a), power)),
      DOME_HEIGHT * Math.pow(Math.sin(a), power)
    ));
  }
  const geometry = new THREE.LatheGeometry(points, 56);
  geometry.rotateX(Math.PI / 2);
  fixWinding(geometry);
  return geometry;
}

// Per-instance pop / press state drives a squash-and-crumple in the vertex shader.
const BUBBLE_VERTEX_PARS = /* glsl */`
  attribute float aPop;     // 0 inflated .. 1 burst (overshoots slightly)
  attribute float aPress;   // 0 .. 1 squish under the finger
  attribute float aSeed;
  varying float vPop;

  float bubbleHeight() {
    return mix(1.0, 0.1, clamp(aPop, -0.25, 1.15)) * (1.0 - 0.42 * aPress);
  }
  // Random overlapping folds: xy = gradient, z = height
  vec3 bubbleCrease(vec2 p) {
    vec3 acc = vec3(0.0);
    for (int i = 0; i < 4; i++) {
      float fi = float(i);
      float angle = aSeed * 6.2831 + fi * 2.1 + sin(aSeed * 40.0 + fi);
      vec2 dir = vec2(cos(angle), sin(angle));
      float freq = 3.0 + fi * 1.7;
      float phase = dot(p, dir) * freq + aSeed * 44.0 + fi * 2.3;
      acc.z += (0.5 + 0.5 * cos(phase)) / freq;
      acc.xy -= sin(phase) * dir * 0.5;
    }
    return acc;
  }
  float bubbleRimFade(vec2 p) { return 1.0 - smoothstep(0.65, 1.0, length(p)); }
`;

function createBubbleMaterial() {
  const material = new THREE.MeshPhysicalMaterial({
    color: 0xFFFFFF,
    transmission: 1,
    roughness: 0.1,
    ior: 1.45,
    thickness: 0.3,
    clearcoat: 1,
    clearcoatRoughness: 0.06,
    envMapIntensity: 0.8,
  });
  material.onBeforeCompile = (shader) => {
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + BUBBLE_VERTEX_PARS)
      .replace('#include <beginnormal_vertex>', /* glsl */`
        #include <beginnormal_vertex>
        {
          float crumple = clamp(aPop, 0.0, 1.0);
          vec3 squashed = normalize(vec3(objectNormal.xy * bubbleHeight(), objectNormal.z));
          vec3 folded = normalize(vec3(-bubbleCrease(position.xy).xy * 0.7 * bubbleRimFade(position.xy), 1.0));
          objectNormal = normalize(mix(squashed, folded, crumple * 0.85));
        }
      `)
      .replace('#include <begin_vertex>', /* glsl */`
        #include <begin_vertex>
        {
          float crumple = clamp(aPop, 0.0, 1.0);
          transformed.z = transformed.z * bubbleHeight()
            + crumple * bubbleCrease(position.xy).z * 0.12 * bubbleRimFade(position.xy);
          transformed.xy *= 1.0 + 0.05 * aPress;
          vPop = crumple;
        }
      `);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vPop;')
      .replace('#include <roughnessmap_fragment>', /* glsl */`
        #include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.38, vPop);
      `);
  };
  return material;
}

const domeGeometry = createDomeGeometry();
const bubbleMaterial = createBubbleMaterial();
const filmMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xF6F9FF, transmission: 1, roughness: 0.3, ior: 1.45, thickness: 0.02,
  envMapIntensity: 0.3,
});

// ───────────────────────────── Sheet ─────────────────────────────

let sheet = null;
let layoutName = '';

function buildSheet(cols, rows) {
  const count = cols * rows;
  const rowStep = PITCH * Math.sqrt(3) / 2;
  const width = (cols + 0.5) * PITCH, height = (rows - 1) * rowStep + PITCH;

  const geometry = domeGeometry.clone();
  const aPop = new THREE.InstancedBufferAttribute(new Float32Array(count), 1).setUsage(THREE.DynamicDrawUsage);
  const aPress = new THREE.InstancedBufferAttribute(new Float32Array(count), 1).setUsage(THREE.DynamicDrawUsage);
  const aSeed = new THREE.InstancedBufferAttribute(new Float32Array(count), 1);
  geometry.setAttribute('aPop', aPop);
  geometry.setAttribute('aPress', aPress);
  geometry.setAttribute('aSeed', aSeed);

  const bubbles = new THREE.InstancedMesh(geometry, bubbleMaterial, count);
  bubbles.frustumCulled = false;
  const centers = new Float32Array(count * 2);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  const zAxis = new THREE.Vector3(0, 0, 1);
  for (let r = 0, i = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++, i++) {
      const x = (c + (r % 2 ? 0.75 : 0.25) + 0.25) * PITCH - width / 2;
      const y = height / 2 - PITCH / 2 - r * rowStep;
      centers[i * 2] = x; centers[i * 2 + 1] = y;
      const size = BUBBLE_RADIUS * (0.97 + Math.random() * 0.05);
      q.setFromAxisAngle(zAxis, Math.random() * Math.PI * 2);
      bubbles.setMatrixAt(i, m.compose(p.set(x, y, 0.01), q, s.setScalar(size)));
      aSeed.array[i] = Math.random();
    }
  }

  // Neighbours share a little wobble when a bubble bursts
  const neighbours = [];
  for (let i = 0; i < count; i++) {
    const list = [];
    for (let j = 0; j < count; j++) {
      if (i !== j && Math.hypot(centers[i * 2] - centers[j * 2], centers[i * 2 + 1] - centers[j * 2 + 1]) < PITCH * 1.1) list.push(j);
    }
    neighbours.push(list);
  }

  // Backing film, gently uneven so reflections are not CAD-flat
  const filmGeometry = new THREE.PlaneGeometry(width + 0.4, height + 0.4, 56, 56);
  const fp = filmGeometry.attributes.position;
  for (let i = 0; i < fp.count; i++) {
    const x = fp.getX(i), y = fp.getY(i);
    fp.setZ(i, 0.012 * Math.sin(x * 1.3 + 1) * Math.sin(y * 1.7) + 0.006 * Math.sin(x * 3.1 + y * 2.3));
  }
  filmGeometry.computeVertexNormals();
  const film = new THREE.Mesh(filmGeometry, filmMaterial);
  film.position.z = -0.03;   // stays below the flattened bubbles

  // Opaque surface under the sheet: backdrop colour, soft sheet shadow, giant counter.
  // Opaque so the bubbles refract it (transparent meshes are skipped by the transmission pass).
  const surfaceW = width + 5, surfaceH = height + 5;
  const pxPerUnit = 1024 / Math.max(surfaceW, surfaceH);
  const cnv = document.createElement('canvas');
  cnv.width = Math.round(surfaceW * pxPerUnit); cnv.height = Math.round(surfaceH * pxPerUnit);
  const texture = new THREE.CanvasTexture(cnv);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 4;
  const surface = new THREE.Mesh(
    new THREE.PlaneGeometry(surfaceW, surfaceH),
    new THREE.MeshBasicMaterial({ map: texture })
  );
  surface.position.z = -0.1;

  const group = new THREE.Group();
  group.add(surface, film, bubbles);

  return {
    group, bubbles, geometry, filmGeometry, texture, surface, cnv, pxPerUnit,
    cols, rows, count, width, height, centers, neighbours, aPop, aPress,
    popped: new Uint8Array(count),
    pressing: new Uint8Array(count),
    rare: new Uint8Array(count).map(() => (Math.random() < RARE_CHANCE ? 1 : 0)),
    press: new Float32Array(count),
    jiggle: new Float32Array(count),
    progress: new Float32Array(count).fill(1),   // animation progress of the current pop / inflate
    inflating: new Uint8Array(count),
    inflateAt: new Float32Array(count),          // scheduled re-inflation time (0 = none)
    poppedCount: 0,
    startTime: 0,
    surfaceDirty: true,
  };
}

function disposeSheet(s) {
  root.remove(s.group);
  s.geometry.dispose(); s.filmGeometry.dispose(); s.texture.dispose();
  s.surface.geometry.dispose(); s.surface.material.dispose();
  s.bubbles.dispose();
}

function drawSurface(s) {
  const ctx = s.cnv.getContext('2d');
  const w = s.cnv.width, h = s.cnv.height, k = s.pxPerUnit;
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, w, h);

  // Soft shadow of the sheet: fill the sheet rect in backdrop colour, keep only its shadow
  const sw = (s.width + 0.4) * k, sh = (s.height + 0.4) * k;
  ctx.save();
  ctx.shadowColor = 'rgba(70, 14, 0, 0.42)';
  ctx.shadowBlur = 0.55 * k;
  ctx.shadowOffsetY = 0.2 * k;
  ctx.fillRect((w - sw) / 2, (h - sh) / 2, sw, sh);
  ctx.restore();

  const text = String(s.poppedCount).padStart(3, '0');
  ctx.font = '900 100px "Helvetica Neue", "Arial Black", Arial, sans-serif';
  const scale = (s.width * k * 0.9) / ctx.measureText(text).width;
  ctx.font = `900 ${100 * scale}px "Helvetica Neue", "Arial Black", Arial, sans-serif`;
  ctx.fillStyle = INK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2 + 4 * scale);

  s.texture.needsUpdate = true;
  s.surfaceDirty = false;
}

// ───────────────────────────── Sound ─────────────────────────────
// Real bubble wrap: single pops cut from "Bubble wrap" by Macif
// (freesound.org/people/Macif/sounds/214675, CC0), embedded at the bottom of
// this file as one WAV of equal-length slots. Each pop plays a random slot with
// slight pitch and level variation so no two match.

const POP_SLOT_SECONDS = 0.13;
let audio = null, master = null, popBuffers = [];

async function loadPops() {
  const base64 = document.getElementById('pop-samples').textContent.trim();
  const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  const decoded = await audio.decodeAudioData(bytes.buffer);
  const data = decoded.getChannelData(0);
  const slot = Math.round(POP_SLOT_SECONDS * decoded.sampleRate);
  for (let start = 0; start + slot <= data.length; start += slot) {
    const buffer = audio.createBuffer(1, slot, decoded.sampleRate);
    buffer.getChannelData(0).set(data.subarray(start, start + slot));
    popBuffers.push(buffer);
  }
}

function initAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audio = new Ctx();
  master = audio.createGain();
  master.gain.value = 0.9;
  master.connect(audio.destination);
  loadPops().catch(() => { /* stay silent if the samples cannot be decoded */ });
}

function playPop(pan) {
  if (!audio || popBuffers.length === 0) return;
  const src = audio.createBufferSource();
  src.buffer = popBuffers[Math.floor(Math.random() * popBuffers.length)];
  src.playbackRate.value = 0.93 + Math.random() * 0.16;
  const gain = audio.createGain();
  gain.gain.value = 0.6 + Math.random() * 0.4;
  let out = gain;
  if (audio.createStereoPanner) {
    out = audio.createStereoPanner();
    out.pan.value = pan;
    gain.connect(out);
  }
  src.connect(gain);
  out.connect(master);
  src.start();
}

function playChime() {
  if (!audio) return;
  const t = audio.currentTime;
  [1318.5, 1975.5].forEach((freq, i) => {
    const start = t + i * 0.07;
    const osc = audio.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const gain = audio.createGain();
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.2, start + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
    osc.connect(gain).connect(master);
    osc.start(start); osc.stop(start + 0.6);
  });
}

// ───────────────────────────── Confetti ─────────────────────────────

const CONFETTI_MAX = 160;
const confetti = (() => {
  const positions = new Float32Array(CONFETTI_MAX * 3).fill(999);
  const colors = new Float32Array(CONFETTI_MAX * 3);
  const velocity = new Float32Array(CONFETTI_MAX * 3);
  const life = new Float32Array(CONFETTI_MAX);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3).setUsage(THREE.DynamicDrawUsage));
  const points = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.11, vertexColors: true, depthWrite: false }));
  points.frustumCulled = false;
  scene.add(points);
  const color = new THREE.Color();
  let cursor = 0, alive = 0;

  function burst(origin, amount = 30) {
    for (let n = 0; n < amount; n++) {
      const i = cursor; cursor = (cursor + 1) % CONFETTI_MAX;
      const angle = Math.random() * Math.PI * 2, speed = 1.5 + Math.random() * 3;
      positions[i * 3] = origin.x; positions[i * 3 + 1] = origin.y; positions[i * 3 + 2] = origin.z + 0.2;
      velocity[i * 3] = Math.cos(angle) * speed;
      velocity[i * 3 + 1] = Math.sin(angle) * speed + 1.5;
      velocity[i * 3 + 2] = 1 + Math.random() * 2.5;
      color.setHex(CONFETTI_COLORS[n % CONFETTI_COLORS.length]);
      colors[i * 3] = color.r; colors[i * 3 + 1] = color.g; colors[i * 3 + 2] = color.b;
      life[i] = 0.7 + Math.random() * 0.5;
    }
    geometry.attributes.color.needsUpdate = true;
    alive = 1.3;
  }

  function update(dt) {
    if (alive <= 0) return;
    alive -= dt;
    const drag = Math.exp(-2.2 * dt);
    for (let i = 0; i < CONFETTI_MAX; i++) {
      if (life[i] <= 0) continue;
      life[i] -= dt;
      if (life[i] <= 0) { positions[i * 3] = 999; continue; }
      velocity[i * 3] *= drag; velocity[i * 3 + 2] *= drag;
      velocity[i * 3 + 1] = velocity[i * 3 + 1] * drag - 9 * dt;
      positions[i * 3] += velocity[i * 3] * dt;
      positions[i * 3 + 1] += velocity[i * 3 + 1] * dt;
      positions[i * 3 + 2] += velocity[i * 3 + 2] * dt;
    }
    geometry.attributes.position.needsUpdate = true;
  }

  return { burst, update };
})();

// ───────────────────────────── Popping ─────────────────────────────

const easeOutBack = (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2;
const tmpV = new THREE.Vector3();
let clearedAt = 0;   // time the sheet was fully popped (0 = still in play)

function setStatus(text) { statusEl.textContent = text; }
function showCount() { setStatus(`${String(sheet.poppedCount).padStart(3, '0')} / ${sheet.count}`); }

function burst(i, now) {
  const s = sheet;
  s.pressing[i] = 0;
  s.popped[i] = 1;
  s.progress[i] = 0;
  s.inflating[i] = 0;
  if (s.poppedCount === 0) s.startTime = now;
  s.poppedCount++;
  s.surfaceDirty = true;
  for (const n of s.neighbours[i]) s.jiggle[n] = 0.32;

  playPop((s.centers[i * 2] / (s.width / 2)) * 0.6);
  if (navigator.vibrate) navigator.vibrate(8);
  if (s.rare[i]) {
    playChime();
    confetti.burst(root.localToWorld(tmpV.set(s.centers[i * 2], s.centers[i * 2 + 1], 0.1)));
  }

  if (s.poppedCount === s.count) {
    clearedAt = now;
    setStatus(`Cleared in ${(now - s.startTime).toFixed(1)}s`);
  } else {
    showCount();
  }
}

function refillSheet(now) {
  // Re-inflate in a diagonal wave from the top-left corner
  const s = sheet;
  for (let i = 0; i < s.count; i++) {
    const dx = s.centers[i * 2] + s.width / 2, dy = s.height / 2 - s.centers[i * 2 + 1];
    s.inflateAt[i] = now + 0.02 + (dx + dy) * 0.045;
    s.rare[i] = Math.random() < RARE_CHANCE ? 1 : 0;
  }
  s.poppedCount = 0;
  s.surfaceDirty = true;
  clearedAt = 0;
  showCount();
}

function updateBubbles(dt, now) {
  const s = sheet;
  if (clearedAt && now - clearedAt > 2.2) refillSheet(now);

  const jiggleDecay = Math.exp(-11 * dt);
  for (let i = 0; i < s.count; i++) {
    if (s.pressing[i]) {
      s.press[i] += dt / PRESS_TIME;
      if (s.press[i] >= 1) { s.press[i] = 1; burst(i, now); }
    } else if (s.press[i] > 0) {
      s.press[i] = Math.max(0, s.press[i] - dt / 0.06);
    }
    s.jiggle[i] *= jiggleDecay;

    if (s.inflateAt[i] && now >= s.inflateAt[i]) {
      s.inflateAt[i] = 0; s.popped[i] = 0; s.inflating[i] = 1; s.progress[i] = 0;
    }
    if (s.progress[i] < 1) s.progress[i] = Math.min(1, s.progress[i] + dt / (s.inflating[i] ? INFLATE_TIME : POP_TIME));
    const eased = easeOutBack(s.progress[i]);
    s.aPop.array[i] = s.inflating[i] ? 1 - eased : (s.popped[i] ? eased : 0);
    s.aPress.array[i] = Math.max(s.press[i], s.jiggle[i]);
  }
  s.aPop.needsUpdate = true;
  s.aPress.needsUpdate = true;
  if (s.surfaceDirty) drawSurface(s);
}

// ───────────────────────────── Interaction ─────────────────────────────

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const localRay = new THREE.Ray();
const inverseRoot = new THREE.Matrix4();
const hit = new THREE.Vector3();
const pointerNdc = new THREE.Vector2();   // drives the parallax tilt
const activePointers = new Set();

function bubbleAt(clientX, clientY) {
  ndc.set((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  localRay.copy(raycaster.ray).applyMatrix4(inverseRoot.copy(root.matrixWorld).invert());
  // Intersect the plane halfway up the domes
  const z = BUBBLE_RADIUS * DOME_HEIGHT * 0.5;
  const t = (z - localRay.origin.z) / localRay.direction.z;
  if (!(t > 0)) return -1;
  localRay.at(t, hit);
  const s = sheet;
  let best = -1, bestDist = BUBBLE_RADIUS * 1.08;
  for (let i = 0; i < s.count; i++) {
    const d = Math.hypot(hit.x - s.centers[i * 2], hit.y - s.centers[i * 2 + 1]);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}

function pressAt(e) {
  const i = bubbleAt(e.clientX, e.clientY);
  if (i >= 0 && !sheet.popped[i] && !sheet.pressing[i] && !sheet.inflateAt[i]) sheet.pressing[i] = 1;
}

canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  activePointers.add(e.pointerId);
  canvas.setPointerCapture(e.pointerId);
  pressAt(e);
});
canvas.addEventListener('pointermove', (e) => {
  pointerNdc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  if (activePointers.has(e.pointerId)) pressAt(e);
});
const releasePointer = (e) => activePointers.delete(e.pointerId);
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ───────────────────────────── Resize ─────────────────────────────

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  const name = camera.aspect >= 1 ? 'landscape' : 'portrait';
  if (name !== layoutName) {
    if (sheet) disposeSheet(sheet);
    layoutName = name;
    sheet = buildSheet(...LAYOUTS[name]);
    root.add(sheet.group);
    clearedAt = 0;
    showCount();
  }

  // Fit the tilted sheet in view with some breathing room
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const fitH = (sheet.height * Math.cos(BASE_TILT) * 0.5 + 1.3) / Math.tan(halfFov);
  const fitW = (sheet.width * 0.5 + 0.9) / (Math.tan(halfFov) * camera.aspect);
  const nearEdge = sheet.height * 0.5 * Math.sin(-BASE_TILT);   // the leaning sheet's front edge is closer
  camera.position.set(0, 0, Math.max(fitH, fitW) + nearEdge);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ───────────────────────────── Loop ─────────────────────────────

const clock = new THREE.Clock();

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = clock.elapsedTime;

  // Sheet leans a touch toward the pointer so the highlights stay alive
  const ease = 1 - Math.exp(-5 * dt);
  root.rotation.x += (BASE_TILT - pointerNdc.y * 0.05 - root.rotation.x) * ease;
  root.rotation.y += (pointerNdc.x * 0.09 - root.rotation.y) * ease;
  root.updateMatrixWorld();

  updateBubbles(dt, now);
  confetti.update(dt);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
</script>
