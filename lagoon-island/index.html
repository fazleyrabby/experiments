<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Little Lagoon</title>
  <meta name="description" content="A fully procedural, interactive tropical island diorama.">
  <style>
    :root {
      --ink: #f3ecdf;
      --dim: rgba(243, 236, 223, 0.62);
      --line: rgba(243, 236, 223, 0.24);
      --accent: #e7b877;
      --bg: #0d0b09;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
    body { font: 400 13px/1.35 ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; outline: none; }
    canvas#scene.dragging { cursor: grabbing; }

    .title { position: fixed; top: max(22px, env(safe-area-inset-top)); left: 26px; pointer-events: none; opacity: 0; transition: opacity 1.4s 0.5s; text-shadow: 0 1px 14px rgba(0,0,0,.45); }
    .title h1 { margin: 0; font: 400 25px/1.05 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: .005em; }
    .title p { margin: 5px 0 0; color: var(--dim); font-size: 12px; }

    .panel { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(620px, calc(100vw - 32px)); display: grid; grid-template-columns: 1.55fr 1fr; gap: 26px; padding: 13px 18px 14px; background: rgba(16, 13, 10, .46); border: 1px solid rgba(243, 236, 223, .13); border-radius: 12px; -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); opacity: 0; transition: opacity 1.2s .8s; }
    #sound { position: fixed; top: max(22px, env(safe-area-inset-top)); right: 22px; min-height: 34px; padding: 0 13px; color: var(--ink); background: rgba(16, 13, 10, .46); border: 1px solid rgba(243, 236, 223, .16); border-radius: 8px; font: inherit; font-size: 12px; cursor: pointer; opacity: 0; transition: opacity 1.2s .8s, background .2s; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    #sound:hover { background: rgba(38, 31, 24, .68); }
    #sound[aria-pressed="false"] { color: var(--dim); }
    #sound:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ready .title, .ready .panel, .ready #sound { opacity: 1; }
    .clean .title, .clean .panel, .clean #sound { opacity: 0 !important; pointer-events: none; transition: opacity .3s; }

    .ctl header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
    .ctl label { color: var(--dim); font-size: 11.5px; }
    .ctl output { font-variant-numeric: tabular-nums; font-size: 12.5px; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; margin: 0; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line); border-radius: 2px; }
    input[type=range]::-moz-range-track { height: 2px; background: var(--line); border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -6.5px; border-radius: 50%; background: var(--ink); border: 3px solid #2a2118; box-shadow: 0 0 0 1px var(--ink); }
    input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); border: 3px solid #2a2118; box-shadow: 0 0 0 1px var(--ink); }
    input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .marks { display: flex; justify-content: space-between; margin-top: -1px; }
    .marks button { appearance: none; border: 0; padding: 3px 5px; margin: 0 -5px; background: none; color: var(--dim); font: inherit; font-size: 11px; cursor: pointer; border-radius: 4px; }
    .marks button:hover { color: var(--ink); }
    .marks button:focus-visible { outline: 2px solid var(--accent); }
    .hint { color: var(--dim); font-size: 11px; margin-top: 3px; padding-top: 3px; }

    #loader { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 13px; background: var(--bg); transition: opacity 1.1s ease; z-index: 5; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader h2 { margin: 0; font: 400 27px/1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    #loadLabel { color: var(--dim); font-size: 12px; min-height: 16px; text-align: center; max-width: 280px; }
    .track { width: 172px; height: 1px; background: var(--line); overflow: hidden; }
    #loadBar { height: 100%; background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform .45s ease; }

    @media (max-width: 620px) {
      .title { left: 18px; }
      .title h1 { font-size: 21px; }
      .panel { grid-template-columns: 1fr; gap: 6px; padding: 10px 14px 11px; }
      .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .title, .panel, #loader { transition-duration: .01s; transition-delay: 0s; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="Interactive 3D island diorama. Drag to orbit, scroll to zoom, click the water to make ripples."></canvas>

  <div class="title">
    <h1>Little Lagoon</h1>
    <p>Every leaf, plank and ripple is generated</p>
  </div>

  <button id="sound" type="button" aria-pressed="true">Sound on</button>

  <section class="panel" aria-label="Scene controls">
    <div class="ctl">
      <header><label for="hour">Time of day</label><output id="hourValue" for="hour">5:09 PM</output></header>
      <input id="hour" type="range" min="5.5" max="20.5" step="0.01" value="17.15">
      <div class="marks">
        <button type="button" data-hour="6.45">Dawn</button>
        <button type="button" data-hour="10.5">Morning</button>
        <button type="button" data-hour="13">Noon</button>
        <button type="button" data-hour="17.15">Golden</button>
        <button type="button" data-hour="20.2">Night</button>
      </div>
    </div>
    <div class="ctl">
      <header><label for="wind">Breeze</label><output id="windValue" for="wind">Light</output></header>
      <input id="wind" type="range" min="0" max="1" step="0.01" value="0.42">
      <div class="hint">Drag to orbit · Scroll to zoom · Click water</div>
    </div>
  </section>

  <div id="loader" role="status">
    <h2>Little Lagoon</h2>
    <div class="track"><div id="loadBar"></div></div>
    <div id="loadLabel">Preparing</div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
