<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Highland Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html,body{margin:0;height:100%;background:#0d1117;overflow:hidden;font-family:'IBM Plex Mono',ui-monospace,monospace;color:#e9dcc3}
    #app{position:fixed;inset:0}
    canvas{display:block;touch-action:none;-webkit-touch-callout:none;user-select:none}
    #loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#2a2f33,#0b0d10);z-index:20;transition:opacity 1.2s ease}
    #loader h1{font:600 clamp(26px,6vw,64px)/1.1 'Cormorant Garamond',Georgia,serif;letter-spacing:.16em;text-indent:.16em;text-transform:uppercase;margin:0 0 14px;color:#f1e3c3;text-align:center;max-width:92vw}
    #loader p{margin:0 0 28px;font-size:11px;letter-spacing:.22em;text-align:center;padding:0 12px;text-transform:uppercase;color:#a99a7a}
    #bar{width:min(320px,60vw);height:2px;background:#ffffff1c;overflow:hidden}
    #bar i{display:block;height:100%;width:0;background:#c79a4b;transition:width .25s}
    #status{margin-top:14px;font-size:11px;letter-spacing:.18em;color:#8c8068;text-transform:uppercase;min-height:14px}

    #hud{position:fixed;inset:0;pointer-events:none;z-index:10;transition:opacity .4s}
    #hud.off{opacity:0}
    #hud button,#hud .hud-bar{pointer-events:auto}
    .hud-title{position:absolute;left:28px;top:24px;display:flex;flex-direction:column;gap:4px;text-shadow:0 1px 10px #0009}
    .hud-title .t1{font:600 18px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.32em;text-transform:uppercase;color:#f3e7c9}
    .hud-title .t2{font:400 10px/1.2 'IBM Plex Mono',monospace;letter-spacing:.24em;text-transform:uppercase;color:#d8c9a4aa}
    .hud-cap{position:absolute;left:28px;bottom:104px;opacity:0;transition:opacity .2s,transform .2s;text-shadow:0 2px 18px #000b,0 0 2px #0008;max-width:60vw}
    .hud-cap .c1{font:600 clamp(22px,3vw,34px)/1.1 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;color:#f6ead0}
    .hud-cap .c2{margin-top:6px;font:400 11px/1.4 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#e2d3ac}
    .hud-stat{position:absolute;right:20px;top:20px;font:400 10px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#d8c9a488;text-transform:uppercase}
    .hud-bar{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:linear-gradient(180deg,#1c2024d9,#101316d9);backdrop-filter:blur(14px) saturate(1.2);border:1px solid #ffffff1c;box-shadow:0 10px 36px #0008,inset 0 1px 0 #ffffff14;transition:opacity .5s,transform .5s;color:#eadcb8;max-width:96vw;flex-wrap:nowrap}
    .hud-bar.idle{opacity:.0;transform:translateX(-50%) translateY(10px)}
    .hud-bar:hover{opacity:1!important;transform:translateX(-50%)!important}
    .hud-bar button{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#eadcb8;transition:background .15s,color .15s,transform .1s}
    .hud-bar button svg{width:20px;height:20px;fill:currentColor}
    .hud-bar button:hover{background:#ffffff16;color:#fff6dc}
    .hud-bar button:active{transform:scale(.92)}
    .hud-bar button.on{background:#c79a4b33;color:#ffd98a;box-shadow:inset 0 0 0 1px #c79a4b66}
    .hud-bar button:focus-visible{outline:2px solid #ffd98a;outline-offset:2px}
    .hud-bar .sep{width:1px;height:20px;background:#ffffff1f;margin:0 4px}
    .hud-bar .speed{min-width:78px;text-align:center;font:500 15px 'IBM Plex Mono',monospace;color:#fff1cf;letter-spacing:.04em}
    .hud-bar .speed small{font-size:9px;opacity:.6;letter-spacing:.14em;text-transform:uppercase}
    .hud-bar .camlabel{font:400 10px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#d8c9a4;min-width:92px}
    .hud-bar .qlabel{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.1em}
    .hud-bar{bottom:calc(26px + env(safe-area-inset-bottom,0px))}
    @media (pointer:coarse){.hud-bar button{width:44px;height:44px}.hud-bar{gap:4px}.hud-bar.idle{opacity:.0}}
    @media (max-width:760px){.hud-bar .camlabel{display:none}.hud-bar .speed{min-width:62px;font-size:13px}.hud-bar{gap:1px;padding:5px 6px}.hud-bar button{width:34px;height:34px}.hud-bar .sep{margin:0 1px}.hud-title{left:16px;top:16px}.hud-cap{left:16px;bottom:88px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loader">
    <h1>Highland Express</h1>
    <p>A procedural steam railway</p>
    <div id="bar"><i></i></div>
    <div id="status">Surveying the glen…</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
