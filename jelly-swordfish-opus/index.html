{

<body>
<canvas id="stage" tabindex="0" aria-label="Jelly swordfish. Drag to lift and toss, tap to poke. Space to jump, R to reset, arrow keys to shove, P to poke."></canvas>

  <div>Jelly Swordfish // 13</div>
  <div class="hint">Drag to lift &amp; toss<br>Tap to poke<span class="keys">Space jump / R reset / Arrows shove</span></div>
</div>

  <button type="button" id="jump" aria-keyshortcuts="Space">Jump</button>

<div class="label visits" id="visits" title="Total visits" hidden></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ───────────────────────────── Config ─────────────────────────────

const BG = '#F1E7DA';
const FISH_SCALE = 0.86;          // the fish is modelled in its own units, then scaled
const MESH_CELL = 0.034;          // surface resolution of the visible skin
const LATTICE_CELL = 0.2;         // physics particle spacing
const STEP = 1 / 120;
const GRAVITY = 14;
const DAMPING = 0.6;              // velocity lost per second
const GLOBAL_STIFFNESS = 0.12;    // pull toward the whole-body match, per step
const LOCAL_STIFFNESS = 0.11;     // pull toward each little neighbourhood's match, per step
const GLOBAL_STRETCH = 0.6;       // how much whole-body squash/shear persists (0 rigid .. 1 floppy)
const LOCAL_STRETCH = 0.35;       // the same, for local dents
const SEGMENT_STIFFNESS = 0.06;   // pull toward each body segment's match, per step
const SEGMENT_STRETCH = 0.5;
const FLOOR_FRICTION = 0.5;
const PRESS_DEPTH = 0.36;         // how far a held finger sinks in
const GRAB_RADIUS = 0.78;
const GRAB_FOLLOW = 0.007;        // while carried, the rest of the body is gently led along too
const POKE_SPEED = 4.5;
const JUMP_SPEED = 6.2;
const MAX_SPEED = 26;
const CEILING = 7;
const JELLY = 0x1F6FEB;

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const motion = () => reducedMotion.matches
  ? { damping: 2.6, jump: 0.7, poke: 0.55, drop: 0 }
  : { damping: DAMPING, jump: 1, poke: 1, drop: 2.2 };

// ───────────────────────────── Renderer & scene ─────────────────────────────

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 16, 38);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 120);
const key = new THREE.DirectionalLight(0xFFF6EA, 2.2);
key.position.set(-4, 9, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 7;
key.shadow.bias = -0.0006;
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 });
scene.add(key, new THREE.HemisphereLight(0xFFFFFF, 0xE8DCCB, 0.55));

function buildFloor() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#F4EBDD';
  ctx.fillRect(0, 0, 128, 128);
  ctx.fillStyle = '#E3D5BF';
  ctx.fillRect(0, 0, 64, 64);
  ctx.fillRect(64, 64, 64, 64);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(50, 50);
  texture.anisotropy = 8;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ map: texture, roughness: 0.9 }));
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  return mesh;
}
scene.add(buildFloor());

// ───────────────────────────── Fish shape ─────────────────────────────
// One signed distance field, smooth-unioned from simple parts, so the fins and
// bill grow out of the body like a single moulded piece of jelly. Modelled in
// fish units with the bill pointing down +x.

const smin = (a, b, k) => {
  const h = Math.max(k - Math.abs(a - b), 0) / k;
  return Math.min(a, b) - h * h * k * 0.25;
};

function ellipsoid(x, y, z, rx, ry, rz) {
  const ax = x / rx, ay = y / ry, az = z / rz;
  const k0 = Math.sqrt(ax * ax + ay * ay + az * az);
  const bx = ax / rx, by = ay / ry, bz = az / rz;
  const k1 = Math.sqrt(bx * bx + by * by + bz * bz);
  return k1 > 1e-9 ? k0 * (k0 - 1) / k1 : -Math.min(rx, ry, rz);
}

// A tapered capsule from a to b, optionally flattened across its axis
function makeCone(a, b, r1, r2, up, flatUp = 1, flatSide = 1) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const u = B.clone().sub(A), h = u.length();
  u.normalize();
  const w = new THREE.Vector3().crossVectors(u, new THREE.Vector3(...up)).normalize();
  const v = new THREE.Vector3().crossVectors(w, u);
  const sb = (r1 - r2) / h;
  return { A, u, v, w, h, r1, r2, sa: Math.sqrt(1 - sb * sb), sb, fv: flatUp, fw: flatSide, k: 1 / Math.max(flatUp, flatSide) };
}

function cone(c, x, y, z) {
  const px = x - c.A.x, py = y - c.A.y, pz = z - c.A.z;
  const qy = px * c.u.x + py * c.u.y + pz * c.u.z;
  const rv = (px * c.v.x + py * c.v.y + pz * c.v.z) * c.fv;
  const rw = (px * c.w.x + py * c.w.y + pz * c.w.z) * c.fw;
  const qx = Math.sqrt(rv * rv + rw * rw);
  const k = -c.sb * qx + c.sa * qy;
  let d;
  if (k < 0) d = Math.sqrt(qx * qx + qy * qy) - c.r1;
  else if (k > c.sa * c.h) d = Math.sqrt(qx * qx + (qy - c.h) * (qy - c.h)) - c.r2;
  else d = qx * c.sa + qy * c.sb - c.r1;
  return d * c.k;
}

function triangle(px, py, x0, y0, x1, y1, x2, y2) {
  const e0x = x1 - x0, e0y = y1 - y0, e1x = x2 - x1, e1y = y2 - y1, e2x = x0 - x2, e2y = y0 - y2;
  const v0x = px - x0, v0y = py - y0, v1x = px - x1, v1y = py - y1, v2x = px - x2, v2y = py - y2;
  const t0 = Math.min(1, Math.max(0, (v0x * e0x + v0y * e0y) / (e0x * e0x + e0y * e0y)));
  const t1 = Math.min(1, Math.max(0, (v1x * e1x + v1y * e1y) / (e1x * e1x + e1y * e1y)));
  const t2 = Math.min(1, Math.max(0, (v2x * e2x + v2y * e2y) / (e2x * e2x + e2y * e2y)));
  const q0x = v0x - e0x * t0, q0y = v0y - e0y * t0;
  const q1x = v1x - e1x * t1, q1y = v1y - e1y * t1;
  const q2x = v2x - e2x * t2, q2y = v2y - e2y * t2;
  const s = Math.sign(e0x * e2y - e0y * e2x);
  const d = Math.min(q0x * q0x + q0y * q0y, q1x * q1x + q1y * q1y, q2x * q2x + q2y * q2y);
  const inside = Math.min(s * (v0x * e0y - v0y * e0x), s * (v1x * e1y - v1y * e1x), s * (v2x * e2y - v2y * e2x));
  return -Math.sqrt(d) * Math.sign(inside);
}

// A flat 2D outline given thickness, with rounded edges
function extrude(d2, z, half, round) {
  const wx = d2 + round, wy = Math.abs(z) - half;
  const ox = Math.max(wx, 0), oy = Math.max(wy, 0);
  return Math.min(Math.max(wx, wy), 0) + Math.sqrt(ox * ox + oy * oy) - round;
}

const PEDUNCLE = makeCone([-0.45, 0.0, 0], [-1.5, 0.02, 0], 0.37, 0.11, [0, 1, 0], 1, 1.12);
const BILL = makeCone([1.22, 0.07, 0], [2.86, 0.13, 0], 0.15, 0.028, [0, 1, 0], 1.4, 1);
const JAW = makeCone([1.08, -0.14, 0], [1.6, -0.08, 0], 0.13, 0.045, [0, 1, 0], 1.15, 1);
const PEC_L = makeCone([0.6, -0.2, 0.25], [-0.12, -0.47, 0.8], 0.13, 0.04, [0, 1, 0.5], 2.6, 1);
const PEC_R = makeCone([0.6, -0.2, -0.25], [-0.12, -0.47, -0.8], 0.13, 0.04, [0, 1, -0.5], 2.6, 1);

function dorsalFin(x, y, z) {
  if (x < -0.7 || x > 1 || y < 0.1 || y > 1.5) return 1;
  let d = triangle(x, y, 0.66, 0.28, 0.0, 0.36, -0.22, 1.34);
  d = Math.max(d, 0.5 - Math.hypot(x + 0.55, y - 0.76));    // concave trailing edge
  const half = 0.065 - 0.035 * Math.min(1, Math.max(0, (y - 0.4) / 0.9));
  return extrude(d, z, half, 0.035);
}

function tailFin(x, y, z) {
  if (x > -1.1 || Math.abs(y) > 1.1) return 1;
  const ys = y / 1.38;
  const front = Math.hypot(x + 2.04, ys) - 0.62;    // lunate: one disc minus another
  const back = Math.hypot(x + 2.32, ys) - 0.62;
  const d = Math.max(front, -back) * 0.85;
  return extrude(d, z, 0.05, 0.035);
}

function finlets(x, y, z) {
  if (x > -0.8 || x < -1.6) return 1;
  const top = triangle(x, y, -1.0, 0.1, -1.3, 0.08, -1.36, 0.33);
  const bottom = triangle(x, y, -1.0, -0.1, -1.3, -0.08, -1.36, -0.33);
  return extrude(Math.min(top, bottom), z, 0.025, 0.025);
}

function bodyRaw(x, y, z) {
  let d = ellipsoid(x - 0.05, y, z, 1.22, 0.5, 0.41);
  d = smin(d, ellipsoid(x - 0.12, y + 0.22, z, 1.05, 0.28, 0.5), 0.2);    // a broad belly it can sit on
  d = smin(d, ellipsoid(x - 0.82, y - 0.03, z, 0.62, 0.41, 0.34), 0.25);
  return smin(d, cone(PEDUNCLE, x, y, z), 0.3);
}

function fishRaw(x, y, z) {
  let d = bodyRaw(x, y, z);
  d = smin(d, cone(BILL, x, y, z), 0.22);
  d = smin(d, cone(JAW, x, y, z), 0.12);
  d = smin(d, dorsalFin(x, y, z), 0.12);
  d = smin(d, tailFin(x, y, z), 0.16);
  d = smin(d, z > 0 ? cone(PEC_L, x, y, z) : cone(PEC_R, x, y, z), 0.12);
  return smin(d, finlets(x, y, z), 0.07);
}

const S = FISH_SCALE;
const fishSDF = (x, y, z) => fishRaw(x / S, y / S, z / S) * S;
const bodySDF = (x, y, z) => bodyRaw(x / S, y / S, z / S) * S;
const FISH_LO = [-2.35 * S, -0.95 * S, -1.0 * S], FISH_HI = [2.95 * S, 1.45 * S, 1.0 * S];
const FISH_LENGTH = 5.15 * S;

function gradient(x, y, z, out) {
  const e = 0.003;
  out[0] = fishSDF(x + e, y, z) - fishSDF(x - e, y, z);
  out[1] = fishSDF(x, y + e, z) - fishSDF(x, y - e, z);
  out[2] = fishSDF(x, y, z + e) - fishSDF(x, y, z - e);
  const l = Math.hypot(out[0], out[1], out[2]) || 1;
  out[0] /= l; out[1] /= l; out[2] /= l;
  return l / (2 * e);
}

// ───────────────────────────── Skin mesh ─────────────────────────────
// Surface nets over the distance field, then each vertex is pulled exactly
// onto the surface and told how deep the jelly is behind it.

function buildFishGeometry() {
  const cell = MESH_CELL, lo = FISH_LO;
  const nx = Math.ceil((FISH_HI[0] - lo[0]) / cell) + 1;
  const ny = Math.ceil((FISH_HI[1] - lo[1]) / cell) + 1;
  const nz = Math.ceil((FISH_HI[2] - lo[2]) / cell) + 1;
  const node = (i, j, k) => (k * ny + j) * nx + i;
  const field = new Float32Array(nx * ny * nz);

  // Sample in blocks, skipping blocks that are clearly far from the surface
  const B = 4, reach = B * cell * 1.8;
  for (let bz = 0; bz < nz; bz += B) for (let by = 0; by < ny; by += B) for (let bx = 0; bx < nx; bx += B) {
    const ex = Math.min(bx + B, nx), ey = Math.min(by + B, ny), ez = Math.min(bz + B, nz);
    const dc = fishSDF(lo[0] + (bx + ex - 1) * 0.5 * cell, lo[1] + (by + ey - 1) * 0.5 * cell, lo[2] + (bz + ez - 1) * 0.5 * cell);
    const far = Math.abs(dc) > reach;
    for (let k = bz; k < ez; k++) for (let j = by; j < ey; j++) for (let i = bx; i < ex; i++) {
      field[node(i, j, k)] = far ? dc : fishSDF(lo[0] + i * cell, lo[1] + j * cell, lo[2] + k * cell);
    }
  }

  const cx = nx - 1, cy = ny - 1, cz = nz - 1;
  const cellOf = (i, j, k) => (k * cy + j) * cx + i;
  const cellVert = new Int32Array(cx * cy * cz).fill(-1);
  const verts = [];
  const corner = new Float32Array(8);
  const EDGES = [0, 1, 2, 3, 4, 5, 6, 7, 0, 2, 1, 3, 4, 6, 5, 7, 0, 4, 1, 5, 2, 6, 3, 7];
  for (let k = 0; k < cz; k++) for (let j = 0; j < cy; j++) for (let i = 0; i < cx; i++) {
    let mask = 0;
    for (let c = 0; c < 8; c++) {
      const v = field[node(i + (c & 1), j + ((c >> 1) & 1), k + ((c >> 2) & 1))];
      corner[c] = v;
      if (v < 0) mask |= 1 << c;
    }
    if (mask === 0 || mask === 255) continue;
    let sx = 0, sy = 0, sz = 0, n = 0;
    for (let e = 0; e < 24; e += 2) {
      const a = EDGES[e], b = EDGES[e + 1];
      if ((corner[a] < 0) === (corner[b] < 0)) continue;
      const t = corner[a] / (corner[a] - corner[b]);
      sx += (a & 1) + ((b & 1) - (a & 1)) * t;
      sy += ((a >> 1) & 1) + (((b >> 1) & 1) - ((a >> 1) & 1)) * t;
      sz += ((a >> 2) & 1) + (((b >> 2) & 1) - ((a >> 2) & 1)) * t;
      n++;
    }
    cellVert[cellOf(i, j, k)] = verts.length / 3;
    verts.push(lo[0] + (i + sx / n) * cell, lo[1] + (j + sy / n) * cell, lo[2] + (k + sz / n) * cell);
  }

  const tris = [];
  const quad = (a, b, c, d, outward) => {
    if (a < 0 || b < 0 || c < 0 || d < 0) return;
    if (outward) tris.push(a, b, c, a, c, d); else tris.push(a, c, b, a, d, c);
  };
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const f0 = field[node(i, j, k)], inside = f0 < 0;
    if (i < cx && j > 0 && k > 0 && j < cy && k < cz && (field[node(i + 1, j, k)] < 0) !== inside) {
      quad(cellVert[cellOf(i, j - 1, k - 1)], cellVert[cellOf(i, j, k - 1)], cellVert[cellOf(i, j, k)], cellVert[cellOf(i, j - 1, k)], inside);
    }
    if (j < cy && i > 0 && k > 0 && i < cx && k < cz && (field[node(i, j + 1, k)] < 0) !== inside) {
      quad(cellVert[cellOf(i - 1, j, k - 1)], cellVert[cellOf(i - 1, j, k)], cellVert[cellOf(i, j, k)], cellVert[cellOf(i, j, k - 1)], inside);
    }
    if (k < cz && i > 0 && j > 0 && i < cx && j < cy && (field[node(i, j, k + 1)] < 0) !== inside) {
      quad(cellVert[cellOf(i - 1, j - 1, k)], cellVert[cellOf(i, j - 1, k)], cellVert[cellOf(i, j, k)], cellVert[cellOf(i - 1, j, k)], inside);
    }
  }

  // Snap onto the true surface, then measure the jelly's depth straight in
  const count = verts.length / 3, position = new Float32Array(verts), thickness = new Float32Array(count);
  const g = [0, 0, 0];
  for (let v = 0; v < count; v++) {
    let x = position[v * 3], y = position[v * 3 + 1], z = position[v * 3 + 2];
    for (let it = 0; it < 2; it++) {
      const d = fishSDF(x, y, z), slope = gradient(x, y, z, g);
      const s = d / Math.max(slope, 0.3);
      x -= g[0] * s; y -= g[1] * s; z -= g[2] * s;
    }
    position[v * 3] = x; position[v * 3 + 1] = y; position[v * 3 + 2] = z;
    gradient(x, y, z, g);
    let t = 0.02;
    for (let it = 0; it < 40 && t < 1.2; it++) {
      const d = fishSDF(x - g[0] * t, y - g[1] * t, z - g[2] * t);
      if (d > 0) break;
      t += Math.max(-d, 0.025);
    }
    thickness[v] = Math.min(1.25, Math.max(0.12, t / 0.75));
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(position, 3).setUsage(THREE.DynamicDrawUsage));
  geometry.setAttribute('jellyThickness', new THREE.BufferAttribute(thickness, 1));
  geometry.setIndex(tris);
  return geometry;
}

// Find where a ray from inside the fish leaves its surface
function surfacePoint(x, y, z, dx, dy, dz) {
  let t = 0;
  for (let i = 0; i < 200 && fishSDF(x + dx * t, y + dy * t, z + dz * t) < 0; i++) t += 0.005;
  return new THREE.Vector3(x + dx * t, y + dy * t, z + dz * t);
}

const buildStart = performance.now();
const fishGeometry = buildFishGeometry();
const restVerts = fishGeometry.attributes.position.array.slice();
const VERTS = restVerts.length / 3;

// Eyes sit in the head just proud of the surface
const EYE_RADIUS = 0.055;
const eyeRest = [1, -1].map((side) => {
  const p = surfacePoint(1.02 * S, 0.11 * S, 0, 0, 0, side);
  const g = [0, 0, 0];
  gradient(p.x, p.y, p.z, g);
  return p.addScaledVector(new THREE.Vector3(...g), -EYE_RADIUS * 0.45);
});

// Little air bubbles caught in the thick part of the body
const bubbleRest = [], bubbleScale = [];
let seed = 7;
const random = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
while (bubbleRest.length < 30 * 3) {
  const x = (-1.3 + random() * 2.6) * S, y = (-0.4 + random() * 0.8) * S, z = (-0.34 + random() * 0.68) * S;
  if (fishSDF(x, y, z) < -0.07) { bubbleRest.push(x, y, z); bubbleScale.push(0.016 + random() ** 2 * 0.04); }
}
const BUBBLES = bubbleScale.length;

// ───────────────────────────── Soft body ─────────────────────────────
// A lattice of particles fills the fish, cell by cell, down into the bill and
// fins. Each particle's little neighbourhood is shape-matched on its own (so the
// bill and fins can bend and a poke can dent), and the whole lattice is also
// matched as one piece with some squash allowed (so it wobbles like the cube).

const H = LATTICE_CELL;

const fineGroups = buildGroups(neighbours.map((set) => [...set]));
const segmentGroups = buildGroups([

{
  const aqq = [0, 0, 0, 0, 0, 0, 0, 0, 0];

// Skinning: any model-space point becomes a trilinear blend of its cell's 8 particles

const bubbleSkin = buildSkin(bubbleRest);

// Match every group to the particles; each particle collects the sum of its groups' goals

        pos[i + 2] += w * (gz + grabWorld[i + 2] - pos[i + 2]);

    if (pos[i + 2] < -bounds.z) pos[i + 2] = -bounds.z; else if (pos[i + 2] > bounds.z) pos[i + 2] = bounds.z;

  impact = 0;
  push.fill(0);
  let touched = floorPass(contactSkin) | floorPass(eyeSkin, EYE_RADIUS);
  for (let n = 0; n < N; n++) {
    if (pos[n * 3 + 1] >= -clearance[n]) continue;
    impact = Math.max(impact, -vel[n * 3 + 1]);
    pos[n * 3 + 1] = -clearance[n];
    push[n] += 1;
    touched = 1;
  }
  for (let i = 0, n = 0; n < N; i += 3, n++) {
    if (touched && push[n] > 0) {
      const f = FLOOR_FRICTION * Math.min(1, push[n] * 2);
      pos[i] = prev[i] + (pos[i] - prev[i]) * (1 - f);
      pos[i + 2] = prev[i + 2] + (pos[i + 2] - prev[i + 2]) * (1 - f);
    }
    let vx = (pos[i] - prev[i]) / dt, vy = (pos[i + 1] - prev[i + 1]) / dt, vz = (pos[i + 2] - prev[i + 2]) / dt;
    const speed = Math.sqrt(vx * vx + vy * vy + vz * vz);
    if (speed > MAX_SPEED) { const s = MAX_SPEED / speed; vx *= s; vy *= s; vz *= s; }
    vel[i] = vx; vel[i + 1] = vy; vel[i + 2] = vz;
  }
}

// Place the fish at rest, turned a little toward the camera, its lowest point at `height`
function placeFish(height, yaw = -0.36) {
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0));
  const v = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    v.set(rest[i * 3], rest[i * 3 + 1], rest[i * 3 + 2]).applyQuaternion(q);
    pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
  }
  let lowest = Infinity;
  for (let v = 0, o = 0; v < VERTS; v++, o += 8) {
    let y = 0;
    for (let c = o; c < o + 8; c++) y += pos[meshSkin.index[c] * 3 + 1] * meshSkin.weight[c];
    lowest = Math.min(lowest, y);
  }
  for (let i = 0; i < N; i++) {
    pos[i * 3] -= 0.15;                    // centre the bill-to-tail length on screen
    pos[i * 3 + 1] += height - lowest;
  }
  vel.fill(0);
  globalQuat[0] = q.x; globalQuat[1] = q.y; globalQuat[2] = q.z; globalQuat[3] = q.w;
  for (let g = 0; g < fineGroups.size; g++) fineGroups.quat.set(globalQuat, g * 4);
  for (let g = 0; g < segmentGroups.size; g++) segmentGroups.quat.set(globalQuat, g * 4);
  grab.active = false; grab.id = -1; grab.dragging = false;
  canvas.classList.remove('dragging');
}

// ───────────────────────────── Look ─────────────────────────────

const jellyMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xFFFFFF,
  transmission: 1,
  thickness: 1.3,
  ior: 1.36,
  roughness: 0.06,
  clearcoat: 1,
  clearcoatRoughness: 0.05,
  attenuationColor: new THREE.Color(JELLY),
  attenuationDistance: 0.85,   // saturates through the thick body, stays light in the fins and at the edges
  emissive: new THREE.Color(JELLY),
  emissiveIntensity: 0.06,
  specularIntensity: 1,
  envMapIntensity: 1.25,
});
// Per-vertex thickness: the fins and bill really are thinner than the body,
// and the view through a grazing edge is shorter than through the middle.
jellyMaterial.onBeforeCompile = (shader) => {
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nattribute float jellyThickness;\nvarying float vJellyThickness;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvJellyThickness = jellyThickness;');
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying float vJellyThickness;')
    .replace('#include <transmission_fragment>', THREE.ShaderChunk.transmission_fragment.replace(
      'material.thickness = thickness;',
      'material.thickness = thickness * vJellyThickness * ( 0.4 + 0.6 * abs( dot( normal, normalize( vViewPosition ) ) ) );'));
};

const fish = new THREE.Mesh(fishGeometry, jellyMaterial);
fish.frustumCulled = false;
fish.castShadow = true;
scene.add(fish);

const bubbles = new THREE.InstancedMesh(
  new THREE.SphereGeometry(1, 16, 12),
  new THREE.MeshStandardMaterial({ color: new THREE.Color(JELLY).lerp(new THREE.Color(0xFFFFFF), 0.8), roughness: 0.25 }),
  BUBBLES
);
bubbles.frustumCulled = false;
scene.add(bubbles);

const eyes = new THREE.InstancedMesh(
  new THREE.SphereGeometry(EYE_RADIUS, 20, 14),
  new THREE.MeshPhysicalMaterial({ color: 0x0B1426, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.08 }),
  2
);
eyes.frustumCulled = false;
scene.add(eyes);

const tmp = new THREE.Vector3(), tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3();
function skinPoint(skin, v, out) {
  let x = 0, y = 0, z = 0;
  for (let c = v * 8, end = c + 8; c < end; c++) {
    const p = skin.index[c] * 3, w = skin.weight[c];
    x += pos[p] * w; y += pos[p + 1] * w; z += pos[p + 2] * w;
  }
  return out.set(x, y, z);
}

function updateSkin() {
  const p = fishGeometry.attributes.position.array, { index, weight } = meshSkin;
  for (let v = 0, o = 0; v < VERTS; v++, o += 8) {
    let x = 0, y = 0, z = 0;
    for (let c = o; c < o + 8; c++) {
      const n = index[c] * 3, w = weight[c];
      x += pos[n] * w; y += pos[n + 1] * w; z += pos[n + 2] * w;
    }
    p[v * 3] = x; p[v * 3 + 1] = y; p[v * 3 + 2] = z;
  }
  fishGeometry.attributes.position.needsUpdate = true;
  fishGeometry.computeVertexNormals();
  fishGeometry.computeBoundingSphere();   // keeps raycasts against the deformed mesh correct

  for (let b = 0; b < BUBBLES; b++) {
    skinPoint(bubbleSkin, b, tmp);
    bubbles.setMatrixAt(b, tmpM.compose(tmp, tmpQ, tmpS.setScalar(bubbleScale[b])));
  }
  bubbles.instanceMatrix.needsUpdate = true;
  tmpQ.set(globalQuat[0], globalQuat[1], globalQuat[2], globalQuat[3]);
  for (let e = 0; e < 2; e++) eyes.setMatrixAt(e, tmpM.compose(skinPoint(eyeSkin, e, tmp), tmpQ, tmpS.setScalar(1)));
  eyes.instanceMatrix.needsUpdate = true;
  tmpQ.identity();
}

// ───────────────────────────── Sound ─────────────────────────────

let audio = null, lastBlup = 0;

function initAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (Ctx) audio = new Ctx();
}

function playBlup(strength, pitch = 1) {
  if (!audio || audio.currentTime - lastBlup < 0.09) return;
  lastBlup = audio.currentTime;
  const t = audio.currentTime, level = Math.min(0.5, 0.08 + strength * 0.06);
  const osc = audio.createOscillator();
  osc.frequency.setValueAtTime(130 * pitch, t);
  osc.frequency.exponentialRampToValueAtTime(55 * pitch, t + 0.18);
  const wobble = audio.createOscillator(), depth = audio.createGain();
  wobble.frequency.value = 10; depth.gain.value = 12 * pitch;
  wobble.connect(depth).connect(osc.frequency);
  const gain = audio.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(level, t + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.36);
  osc.connect(gain).connect(audio.destination);
  osc.start(t); wobble.start(t); osc.stop(t + 0.38); wobble.stop(t + 0.38);
}

// ───────────────────────────── Interaction ─────────────────────────────

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const viewDir = new THREE.Vector3();

function setRay(x, y) {
  ndc.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}

// Where the ray meets the fish; near misses on the thin bill and fins still count
function pickFish() {
  const hits = raycaster.intersectObject(fish);
  if (hits.length) return hits[0].point.clone();
  const ray = raycaster.ray, p = new THREE.Vector3();
  let best = -1, bestD = 0.28;
  for (let n = 0; n < N; n++) {
    p.set(pos[n * 3], pos[n * 3 + 1], pos[n * 3 + 2]);
    const d = ray.distanceToPoint(p);
    if (d < bestD) { bestD = d; best = n; }
  }
  if (best < 0) return null;
  return ray.closestPointToPoint(p.set(pos[best * 3], pos[best * 3 + 1], pos[best * 3 + 2]), new THREE.Vector3());
}

// Push the jelly in along the ray, strongest right under the finger
function poke(point, dir, strength) {
  for (let n = 0; n < N; n++) {
    const d = Math.hypot(pos[n * 3] - point.x, pos[n * 3 + 1] - point.y, pos[n * 3 + 2] - point.z);
    const w = Math.max(0, 1 - d / GRAB_RADIUS) ** 2;
    vel[n * 3] += dir.x * strength * w;
    vel[n * 3 + 1] += dir.y * strength * w;
    vel[n * 3 + 2] += dir.z * strength * w;
  }
}

function clampTarget(t) {
  t.x = THREE.MathUtils.clamp(t.x, -bounds.x + 0.2, bounds.x - 0.2);
  t.z = THREE.MathUtils.clamp(t.z, -bounds.z + 0.2, bounds.z - 0.2);
  t.y = THREE.MathUtils.clamp(t.y, grab.minY, CEILING - 1.2);
  return t;
}

canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  if (grab.id !== -1 || (e.pointerType === 'mouse' && e.button !== 0)) return;
  setRay(e.clientX, e.clientY);
  const point = pickFish();
  if (!point) return;
  e.preventDefault();

  const r = globalR;
  for (let n = 0; n < N; n++) {
    const dx = pos[n * 3] - point.x, dy = pos[n * 3 + 1] - point.y, dz = pos[n * 3 + 2] - point.z;
    grabWeight[n] = Math.max(0, 1 - Math.hypot(dx, dy, dz) / GRAB_RADIUS) ** 2;
    grabWorld[n * 3] = dx; grabWorld[n * 3 + 1] = dy; grabWorld[n * 3 + 2] = dz;
    grabLocal[n * 3] = r[0] * dx + r[3] * dy + r[6] * dz;
    grabLocal[n * 3 + 1] = r[1] * dx + r[4] * dy + r[7] * dz;
    grabLocal[n * 3 + 2] = r[2] * dx + r[5] * dy + r[8] * dz;
  }
  poke(point, raycaster.ray.direction, POKE_SPEED * motion().poke);
  playBlup(1.5, 1.5);

  // Holding still presses a dent in; dragging carries the grabbed spot on a camera-facing plane
  camera.getWorldDirection(viewDir);
  dragPlane.setFromNormalAndCoplanarPoint(viewDir, point);
  grab.minY = Math.max(0.1, point.y * 0.45);
  grab.point.copy(point);
  grab.target.copy(point).addScaledVector(raycaster.ray.direction, PRESS_DEPTH * motion().poke);
  grab.target.y = Math.max(grab.target.y, Math.min(point.y, 0.12));
  grab.id = e.pointerId; grab.startX = e.clientX; grab.startY = e.clientY;
  grab.active = true; grab.dragging = false; grab.history.length = 0;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== grab.id) return;
  if (!grab.dragging && Math.hypot(e.clientX - grab.startX, e.clientY - grab.startY) > 4) {
    grab.dragging = true;
    canvas.classList.add('dragging');
  }
  if (!grab.dragging) return;
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const last = events.length ? events[events.length - 1] : e;
  setRay(last.clientX, last.clientY);
  if (raycaster.ray.intersectPlane(dragPlane, grab.target)) {
    clampTarget(grab.target);
    grab.history.push({ t: performance.now(), p: grab.target.clone() });
    if (grab.history.length > 12) grab.history.shift();
  }
});

// Throwing: the body keeps the hand's speed and direction at the moment of release
function letGo(e) {
  if (e.pointerId !== grab.id) return;
  if (grab.dragging && e.type === 'pointerup') {
    const now = performance.now(), recent = grab.history.filter((h) => now - h.t < 110);
    if (recent.length >= 2 && now - recent[recent.length - 1].t < 70) {
      const a = recent[0], b = recent[recent.length - 1], dt = Math.max(0.016, (b.t - a.t) / 1000);
      const throwVel = b.p.clone().sub(a.p).divideScalar(dt);
      if (throwVel.length() > 14) throwVel.setLength(14);
      if (throwVel.length() > 1.2) {
        const mean = new THREE.Vector3();
        for (let n = 0; n < N; n++) mean.x += vel[n * 3] * mass[n], mean.y += vel[n * 3 + 1] * mass[n], mean.z += vel[n * 3 + 2] * mass[n];
        mean.divideScalar(totalMass);
        const add = throwVel.multiplyScalar(0.9).sub(mean).multiplyScalar(0.75);
        for (let n = 0; n < N; n++) { vel[n * 3] += add.x; vel[n * 3 + 1] += add.y; vel[n * 3 + 2] += add.z; }
      }
    }
  }
  grab.id = -1; grab.active = false; grab.dragging = false;
  canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', letGo);
canvas.addEventListener('pointercancel', letGo);
canvas.addEventListener('lostpointercapture', letGo);

// A hop that also rights the fish if it has landed on its side
function jump() {
  initAudio();
  if (grab.active) { grab.id = -1; grab.active = false; grab.dragging = false; canvas.classList.remove('dragging'); }
  let meanVy = 0, low = Infinity, high = -Infinity;
  for (let n = 0; n < N; n++) { meanVy += vel[n * 3 + 1]; low = Math.min(low, pos[n * 3 + 1]); high = Math.max(high, pos[n * 3 + 1]); }
  if (meanVy / N > 2.5) return;   // already on the way up
  const speed = JUMP_SPEED * motion().jump, flight = (2 * speed) / GRAVITY;
  const q = new THREE.Quaternion(globalQuat[0], globalQuat[1], globalQuat[2], globalQuat[3]);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
  const spin = new THREE.Vector3().crossVectors(up, new THREE.Vector3(0, 1, 0));
  const angle = Math.atan2(spin.length(), up.y);
  if (spin.lengthSq() > 1e-6) spin.normalize().multiplyScalar((angle / flight) * 0.85); else spin.set(0, 0, 0);
  for (let n = 0; n < N; n++) {
    const rx = pos[n * 3] - centre.x, ry = pos[n * 3 + 1] - centre.y, rz = pos[n * 3 + 2] - centre.z;
    const lift = speed * (1 + 0.3 * (1 - (pos[n * 3 + 1] - low) / Math.max(0.01, high - low)));   // the bottom leaves first
    vel[n * 3] += spin.y * rz - spin.z * ry;
    vel[n * 3 + 1] += lift - vel[n * 3 + 1] * 0.5 + spin.z * rx - spin.x * rz;
    vel[n * 3 + 2] += spin.x * ry - spin.y * rx;
  }
  playBlup(2.5, 1.2);
}

function reset() {
  initAudio();
  placeFish(motion().drop);
}

function shove(x, z) {
  initAudio();
  for (let n = 0; n < N; n++) { vel[n * 3] += x; vel[n * 3 + 1] += 1.6; vel[n * 3 + 2] += z; }
}

function pokeBelly() {
  initAudio();
  // Aim at the side of the belly facing the camera
  const target = new THREE.Vector3(centre.x, Math.max(0.2, centre.y - 0.15), centre.z);
  raycaster.set(camera.position, target.sub(camera.position).normalize());
  const point = pickFish();
  if (!point) return;
  poke(point, raycaster.ray.direction, POKE_SPEED * 1.4 * motion().poke);
  playBlup(1.5, 1.5);
}

document.getElementById('jump').addEventListener('click', jump);
document.getElementById('reset').addEventListener('click', reset);
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = e.target instanceof HTMLButtonElement;
  switch (e.key) {
    case ' ': if (onButton) return; jump(); break;
    case 'r': case 'R': reset(); break;
    case 'p': case 'P': pokeBelly(); break;
    case 'ArrowLeft': shove(-3.2, 0); break;
    case 'ArrowRight': shove(3.2, 0); break;
    case 'ArrowUp': shove(0, -2.4); break;
    case 'ArrowDown': shove(0, 2.4); break;
    default: return;
  }
  e.preventDefault();
});

// ───────────────────────────── Resize ─────────────────────────────

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // Pull back until the whole fish (plus room to toss it) fits across the screen
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const distance = Math.max(9.6, (FISH_LENGTH + 1.3) / 2 / (tanHalf * camera.aspect));
  camera.position.set(0, 1 + distance * 0.205, distance);
  camera.lookAt(0, 1, 0);
  camera.updateProjectionMatrix();
  scene.fog.near = distance + 6.5;
  scene.fog.far = distance + 28.5;
  // Walls sit just inside the edges of the view, but never closer than the fish is long
  bounds.x = Math.max(FISH_LENGTH / 2 + 0.45, tanHalf * distance * camera.aspect - 0.6);
}
window.addEventListener('resize', resize);
resize();

// ───────────────────────────── Loop ─────────────────────────────

const clock = new THREE.Clock();
let accumulator = 0;
placeFish(motion().drop);
console.info(`jelly swordfish: ${VERTS} skin vertices, ${N} particles, ${fineGroups.members.length + segmentGroups.members.length} group links, built in ${Math.round(performance.now() - buildStart)} ms`);

function frame() {
  accumulator += Math.min(clock.getDelta(), 0.05);
  const { damping } = motion();
  let hardest = 0;
  for (let steps = 0; accumulator >= STEP && steps < 6; steps++, accumulator -= STEP) {
    stepBody(STEP, damping);
    hardest = Math.max(hardest, impact);
  }
  if (accumulator > STEP) accumulator = 0;
  if (!Number.isFinite(pos[0] + pos[N * 3 - 1])) placeFish(1);   // never lose the toy
  if (hardest > 2.5) playBlup(hardest);

  // The full skin is checked against the table once more, so no part is ever drawn below it
  push.fill(0);
  floorPass(meshSkin);
  floorPass(eyeSkin, EYE_RADIUS);
  updateSkin();
  renderer.render(scene, camera);
  if (window.__jelly?.onFrame) window.__jelly.onFrame();
}
renderer.setAnimationLoop(frame);
window.__jelly = { pos, vel, rest, N, VERTS, fishGeometry, camera, centre, globalQuat, placeFish, jump, bounds, eyes, eyeSkin, skinPoint, grab, grabWeight, grabLocal, globalR,
  sim(seconds, each) {
    const frames = Math.round(seconds * 60), p = fishGeometry.attributes.position.array; let before = 0, after = 0;
    for (let f = 0; f < frames; f++) {
      if (each) each(f);
      stepBody(STEP, motion().damping); stepBody(STEP, motion().damping);
      updateSkinOnly(); for (let i = 1; i < p.length; i += 3) before = Math.min(before, p[i]);
      push.fill(0); floorPass(meshSkin); floorPass(eyeSkin, EYE_RADIUS);
      updateSkinOnly(); for (let i = 1; i < p.length; i += 3) after = Math.min(after, p[i]);
    }
    return { before, after };
  },
};
function updateSkinOnly() { const p = fishGeometry.attributes.position.array, { index, weight } = meshSkin; for (let v = 0, o = 0; v < VERTS; v++, o += 8) { let x = 0, y = 0, z = 0; for (let c = o; c < o + 8; c++) { const n = index[c] * 3, w = weight[c]; x += pos[n] * w; y += pos[n + 1] * w; z += pos[n + 2] * w; } p[v * 3] = x; p[v * 3 + 1] = y; p[v * 3 + 2] = z; } }
</script>
