<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelly Cube // 05</title>
<style>
  :root { --bg: #F1E7DA; --ink: #2B2722; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#stage.dragging { cursor: grabbing; }
  .label {
    position: fixed; bottom: 26px; pointer-events: none; user-select: none; -webkit-user-select: none;
    font: 500 11px/1.7 "Helvetica Neue", Helvetica, Inter, system-ui, sans-serif;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink);
  }
  .label.left { left: 28px; }
  .label.visits { top: 24px; bottom: auto; right: 28px; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .label.visits[hidden] { display: none; }
  .label.visits::before { content: ""; width: 6px; height: 6px; background: var(--ink); }
  .label .hint { opacity: 0.45; }
  @media (max-width: 520px) {
    .label { bottom: 18px; font-size: 10px; }
    .label.left { left: 18px; }
    .label.visits { top: 16px; right: 18px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div class="label left">
  <div>Jelly Cube // 05</div>
  <div class="hint">Press to squish / Drag to fling<br>Double-click for a new flavour</div>
</div>
<div class="label visits" id="visits" title="Total visits" hidden></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ───────────────────────────── Config ─────────────────────────────

const BG = '#F1E7DA';
const SIZE = 1.7;                 // cube edge
const LATTICE = 5;                // physics particles per edge
const CORNER = 0.2;               // corner rounding
const STEP = 1 / 120;
const GRAVITY = 14;
const STIFFNESS = 0.1;            // pull toward the matched shape, per step (lower = wobblier)
const STRETCH = 0.78;             // how much whole-body squash/shear is allowed to persist (0 rigid .. 1 floppy)
const DAMPING = 0.75;             // velocity lost per second
const FLOOR_FRICTION = 0.5;
const PRESS_DEPTH = 0.42;         // how far a held finger sinks in
const GRAB_RADIUS = 0.9;
const FLAVOURS = [0xFF2D4A, 0x7ADB2C, 0x3D6BFF, 0xFF8A1F, 0x9B4DE8];

// ───────────────────────────── Renderer & scene ─────────────────────────────

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 16, 38);   // the tabletop fades into the backdrop instead of ending

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
const key = new THREE.DirectionalLight(0xFFF6EA, 2.2);
key.position.set(-4, 9, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 7;
key.shadow.bias = -0.0006;
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 30 });
scene.add(key, new THREE.HemisphereLight(0xFFFFFF, 0xE8DCCB, 0.55));

// Tabletop: a quiet check, so there is something to see bending through the jelly.
// An opaque mesh, because transparent ones are skipped by the transmission pass.
function buildFloor() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#F4EBDD';
  ctx.fillRect(0, 0, 128, 128);
  ctx.fillStyle = '#E3D5BF';
  ctx.fillRect(0, 0, 64, 64);
  ctx.fillRect(64, 64, 64, 64);
  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(50, 50);
  texture.anisotropy = 8;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ map: texture, roughness: 0.9 }));
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  return mesh;
}
scene.add(buildFloor());

// ───────────────────────────── Soft body ─────────────────────────────
// A lattice of particles held together by shape matching: each step, find the
// best-fit rotation (plus some stretch) of the rest shape onto the particles
// and pull every particle part-way to where that says it should be.

const COUNT = LATTICE ** 3;
const SPACING = SIZE / (LATTICE - 1);
const rest = new Float32Array(COUNT * 3);    // rest positions, centred on the origin
const pos = new Float32Array(COUNT * 3);
const prev = new Float32Array(COUNT * 3);
const vel = new Float32Array(COUNT * 3);
const grabWeight = new Float32Array(COUNT);
const grabOffset = new Float32Array(COUNT * 3);
let restInertia = 0;                         // sum of q.x^2 (same for y and z by symmetry)
const bodyRotation = new THREE.Quaternion(); // warm start for the rotation fit
const bounds = { x: 4, z: 1.6 };             // invisible walls
let impact = 0;                              // strongest floor hit this frame

for (let k = 0, i = 0; k < LATTICE; k++) for (let j = 0; j < LATTICE; j++) for (let l = 0; l < LATTICE; l++, i++) {
  rest[i * 3] = l * SPACING - SIZE / 2;
  rest[i * 3 + 1] = j * SPACING - SIZE / 2;
  rest[i * 3 + 2] = k * SPACING - SIZE / 2;
  restInertia += rest[i * 3] ** 2;
}

function dropCube() {
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(
    (Math.random() - 0.5) * 0.9, Math.random() * Math.PI, (Math.random() - 0.5) * 0.9));
  const v = new THREE.Vector3();
  for (let i = 0; i < COUNT; i++) {
    v.set(rest[i * 3], rest[i * 3 + 1], rest[i * 3 + 2]).applyQuaternion(q);
    pos[i * 3] = v.x; pos[i * 3 + 1] = v.y + 3.6; pos[i * 3 + 2] = v.z;
  }
  vel.fill(0);
  bodyRotation.copy(q);
}

// Scratch for the shape match
const A = new Float32Array(9), R = new Float32Array(9), T = new Float32Array(9);
const mR = new THREE.Matrix4(), dq = new THREE.Quaternion(), axis = new THREE.Vector3();

function extractRotation() {
  // Mueller et al., "A Robust Method to Extract the Rotational Part of Deformations"
  for (let iter = 0; iter < 4; iter++) {
    mR.makeRotationFromQuaternion(bodyRotation);
    const e = mR.elements;   // column-major
    // omega = sum(R.col x A.col) / |sum(R.col . A.col)|
    let ox = 0, oy = 0, oz = 0, dot = 0;
    for (let c = 0; c < 3; c++) {
      const rx = e[c * 4], ry = e[c * 4 + 1], rz = e[c * 4 + 2];
      const ax = A[c], ay = A[3 + c], az = A[6 + c];   // A is row-major: column c
      ox += ry * az - rz * ay; oy += rz * ax - rx * az; oz += rx * ay - ry * ax;
      dot += rx * ax + ry * ay + rz * az;
    }
    const scale = 1 / (Math.abs(dot) + 1e-9);
    ox *= scale; oy *= scale; oz *= scale;
    const w = Math.hypot(ox, oy, oz);
    if (w < 1e-9) break;
    bodyRotation.premultiply(dq.setFromAxisAngle(axis.set(ox / w, oy / w, oz / w), w)).normalize();
  }
  mR.makeRotationFromQuaternion(bodyRotation);
  const e = mR.elements;
  R[0] = e[0]; R[1] = e[4]; R[2] = e[8];
  R[3] = e[1]; R[4] = e[5]; R[5] = e[9];
  R[6] = e[2]; R[7] = e[6]; R[8] = e[10];
}

const centre = new THREE.Vector3();

function stepBody(dt, grabTarget) {
  const damp = Math.exp(-DAMPING * dt);
  for (let i = 0; i < COUNT * 3; i += 3) {
    prev[i] = pos[i]; prev[i + 1] = pos[i + 1]; prev[i + 2] = pos[i + 2];
    vel[i] *= damp; vel[i + 1] = (vel[i + 1] - GRAVITY * dt) * damp; vel[i + 2] *= damp;
    pos[i] += vel[i] * dt; pos[i + 1] += vel[i + 1] * dt; pos[i + 2] += vel[i + 2] * dt;
  }

  // Shape match
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < COUNT * 3; i += 3) { cx += pos[i]; cy += pos[i + 1]; cz += pos[i + 2]; }
  cx /= COUNT; cy /= COUNT; cz /= COUNT;
  centre.set(cx, cy, cz);
  A.fill(0);
  for (let i = 0; i < COUNT * 3; i += 3) {
    const px = pos[i] - cx, py = pos[i + 1] - cy, pz = pos[i + 2] - cz;
    const qx = rest[i], qy = rest[i + 1], qz = rest[i + 2];
    A[0] += px * qx; A[1] += px * qy; A[2] += px * qz;
    A[3] += py * qx; A[4] += py * qy; A[5] += py * qz;
    A[6] += pz * qx; A[7] += pz * qy; A[8] += pz * qz;
  }
  extractRotation();
  // Linear fit, volume-normalised, blended with the pure rotation
  for (let n = 0; n < 9; n++) A[n] /= restInertia;
  const det = A[0] * (A[4] * A[8] - A[5] * A[7]) - A[1] * (A[3] * A[8] - A[5] * A[6]) + A[2] * (A[3] * A[7] - A[4] * A[6]);
  const norm = det > 0.05 ? 1 / Math.cbrt(det) : 0;
  const blend = norm > 0 ? STRETCH : 0;
  for (let n = 0; n < 9; n++) T[n] = blend * A[n] * norm + (1 - blend) * R[n];

  impact = 0;
  for (let i = 0, n = 0; i < COUNT * 3; i += 3, n++) {
    const qx = rest[i], qy = rest[i + 1], qz = rest[i + 2];
    pos[i] += STIFFNESS * (T[0] * qx + T[1] * qy + T[2] * qz + cx - pos[i]);
    pos[i + 1] += STIFFNESS * (T[3] * qx + T[4] * qy + T[5] * qz + cy - pos[i + 1]);
    pos[i + 2] += STIFFNESS * (T[6] * qx + T[7] * qy + T[8] * qz + cz - pos[i + 2]);

    if (grabTarget && grabWeight[n] > 0) {
      const w = grabWeight[n] * 0.5;
      pos[i] += w * (grabTarget.x + grabOffset[i] - pos[i]);
      pos[i + 1] += w * (grabTarget.y + grabOffset[i + 1] - pos[i + 1]);
      pos[i + 2] += w * (grabTarget.z + grabOffset[i + 2] - pos[i + 2]);
    }

    // Floor (sticky) and invisible walls
    if (pos[i + 1] < 0) {
      impact = Math.max(impact, -vel[i + 1]);
      pos[i + 1] = 0;
      pos[i] = prev[i] + (pos[i] - prev[i]) * (1 - FLOOR_FRICTION);
      pos[i + 2] = prev[i + 2] + (pos[i + 2] - prev[i + 2]) * (1 - FLOOR_FRICTION);
    }
    if (pos[i] < -bounds.x) pos[i] = -bounds.x; else if (pos[i] > bounds.x) pos[i] = bounds.x;
    if (pos[i + 2] < -bounds.z) pos[i + 2] = -bounds.z; else if (pos[i + 2] > bounds.z) pos[i + 2] = bounds.z;

    vel[i] = (pos[i] - prev[i]) / dt; vel[i + 1] = (pos[i + 1] - prev[i + 1]) / dt; vel[i + 2] = (pos[i + 2] - prev[i + 2]) / dt;
  }
}

// ───────────────────────────── Skin ─────────────────────────────
// The visible mesh rides on the lattice: every vertex is a trilinear blend of
// the eight particles around its rest position.

function buildSkin(points) {
  // points: rest positions (flat xyz). Returns particle indices and weights, 8 per point.
  const n = points.length / 3;
  const index = new Uint16Array(n * 8), weight = new Float32Array(n * 8);
  for (let v = 0; v < n; v++) {
    const u = [0, 1, 2].map((a) => (points[v * 3 + a] + SIZE / 2) / SPACING);
    const cell = u.map((x) => Math.min(LATTICE - 2, Math.max(0, Math.floor(x))));
    const f = u.map((x, a) => Math.min(1, Math.max(0, x - cell[a])));
    for (let c = 0; c < 8; c++) {
      const dx = c & 1, dy = (c >> 1) & 1, dz = (c >> 2) & 1;
      index[v * 8 + c] = (cell[2] + dz) * LATTICE * LATTICE + (cell[1] + dy) * LATTICE + (cell[0] + dx);
      weight[v * 8 + c] = (dx ? f[0] : 1 - f[0]) * (dy ? f[1] : 1 - f[1]) * (dz ? f[2] : 1 - f[2]);
    }
  }
  return { index, weight };
}

function skinPoint(skin, v, out) {
  let x = 0, y = 0, z = 0;
  for (let c = v * 8, end = c + 8; c < end; c++) {
    const p = skin.index[c] * 3, w = skin.weight[c];
    x += pos[p] * w; y += pos[p + 1] * w; z += pos[p + 2] * w;
  }
  return out.set(x, y, z);
}

function buildCubeGeometry() {
  let g = new THREE.BoxGeometry(SIZE, SIZE, SIZE, 12, 12, 12);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g, 1e-4);   // weld the faces so normals are smooth round the corners
  const p = g.attributes.position, v = new THREE.Vector3(), inner = new THREE.Vector3();
  const h = SIZE / 2 - CORNER;
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    inner.set(THREE.MathUtils.clamp(v.x, -h, h), THREE.MathUtils.clamp(v.y, -h, h), THREE.MathUtils.clamp(v.z, -h, h));
    v.sub(inner);
    if (v.lengthSq() > 0) v.setLength(CORNER);
    p.setXYZ(i, inner.x + v.x, inner.y + v.y, inner.z + v.z);
  }
  p.setUsage(THREE.DynamicDrawUsage);
  return g;
}

const cubeGeometry = buildCubeGeometry();
const cubeSkin = buildSkin(cubeGeometry.attributes.position.array.slice());
const jellyMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xFFFFFF,
  transmission: 1,
  thickness: 1.5,            // about the cube's own depth, for strong bending of what is behind it
  ior: 1.36,
  roughness: 0.06,
  clearcoat: 1,
  clearcoatRoughness: 0.05,
  attenuationDistance: 1.25, // colour saturates through the thick middle, stays light at the edges
  emissiveIntensity: 0.07,   // a little light held inside, like the real thing
  specularIntensity: 1,
  envMapIntensity: 1.25,
});
const cube = new THREE.Mesh(cubeGeometry, jellyMaterial);
cube.frustumCulled = false;
cube.castShadow = true;
scene.add(cube);

// Tiny bubbles set in the jelly, so you can see the inside move
const BUBBLES = 18;
const bubbleRest = new Float32Array(BUBBLES * 3).map(() => (Math.random() - 0.5) * SIZE * 0.72);
const bubbleSkin = buildSkin(bubbleRest);
const bubbleScale = Array.from({ length: BUBBLES }, () => 0.025 + Math.random() * 0.045);
const bubbles = new THREE.InstancedMesh(
  new THREE.SphereGeometry(1, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.25 }),
  BUBBLES
);
bubbles.frustumCulled = false;
scene.add(bubbles);

let flavour = -1;
function nextFlavour() {
  flavour = (flavour + 1) % FLAVOURS.length;
  const c = new THREE.Color(FLAVOURS[flavour]);
  jellyMaterial.attenuationColor.copy(c);
  jellyMaterial.emissive.copy(c);
  bubbles.material.color.copy(c).lerp(new THREE.Color(0xFFFFFF), 0.8);
}

const tmp = new THREE.Vector3(), tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3();
function updateSkin() {
  const p = cubeGeometry.attributes.position;
  for (let v = 0; v < p.count; v++) { skinPoint(cubeSkin, v, tmp); p.setXYZ(v, tmp.x, tmp.y, tmp.z); }
  p.needsUpdate = true;
  cubeGeometry.computeVertexNormals();
  cubeGeometry.computeBoundingSphere();   // keeps raycasts against the deformed mesh correct

  for (let b = 0; b < BUBBLES; b++) {
    skinPoint(bubbleSkin, b, tmp);
    bubbles.setMatrixAt(b, tmpM.compose(tmp, tmpQ, tmpS.setScalar(bubbleScale[b])));
  }
  bubbles.instanceMatrix.needsUpdate = true;
}

// ───────────────────────────── Sound ─────────────────────────────
// A soft wobbly "blup" when the cube lands or gets poked.

let audio = null, lastBlup = 0;

function initAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (Ctx) audio = new Ctx();
}

function playBlup(strength, pitch = 1) {
  if (!audio || audio.currentTime - lastBlup < 0.09) return;
  lastBlup = audio.currentTime;
  const t = audio.currentTime, level = Math.min(0.5, 0.08 + strength * 0.06);
  const osc = audio.createOscillator();
  osc.frequency.setValueAtTime(150 * pitch, t);
  osc.frequency.exponentialRampToValueAtTime(62 * pitch, t + 0.16);
  // A slow wobble on the pitch, like the cube itself
  const wobble = audio.createOscillator(), depth = audio.createGain();
  wobble.frequency.value = 11; depth.gain.value = 14 * pitch;
  wobble.connect(depth).connect(osc.frequency);
  const gain = audio.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(level, t + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  osc.connect(gain).connect(audio.destination);
  osc.start(t); wobble.start(t); osc.stop(t + 0.36); wobble.stop(t + 0.36);
}

// ───────────────────────────── Interaction ─────────────────────────────

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const grabPoint = new THREE.Vector3();
const viewDir = new THREE.Vector3();
const hand = { id: -1, startX: 0, startY: 0, dragging: false, hasTarget: false };

function setRay(e) {
  ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}

canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  if (hand.id !== -1) return;
  setRay(e);
  const hits = raycaster.intersectObject(cube);
  if (hits.length === 0) return;
  const point = hits[0].point;

  // Poke: push the jelly in along the view ray, strongest right under the finger
  let any = false;
  for (let i = 0; i < COUNT; i++) {
    const d = Math.hypot(pos[i * 3] - point.x, pos[i * 3 + 1] - point.y, pos[i * 3 + 2] - point.z);
    const w = Math.max(0, 1 - d / GRAB_RADIUS);
    grabWeight[i] = w * w;
    grabOffset[i * 3] = pos[i * 3] - point.x; grabOffset[i * 3 + 1] = pos[i * 3 + 1] - point.y; grabOffset[i * 3 + 2] = pos[i * 3 + 2] - point.z;
    if (w > 0) {
      any = true;
      vel[i * 3] += raycaster.ray.direction.x * 4.5 * w;
      vel[i * 3 + 1] += raycaster.ray.direction.y * 4.5 * w;
      vel[i * 3 + 2] += raycaster.ray.direction.z * 4.5 * w;
    }
  }
  if (!any) return;
  playBlup(1.5, 1.5);

  // Holding still presses a dent in; dragging carries the grabbed spot on a camera-facing plane
  camera.getWorldDirection(viewDir);
  dragPlane.setFromNormalAndCoplanarPoint(viewDir, point);
  grabPoint.copy(point).addScaledVector(raycaster.ray.direction, PRESS_DEPTH);
  grabPoint.y = Math.max(0.15, grabPoint.y);
  hand.id = e.pointerId; hand.startX = e.clientX; hand.startY = e.clientY;
  hand.dragging = false; hand.hasTarget = true;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== hand.id) return;
  if (!hand.dragging && Math.hypot(e.clientX - hand.startX, e.clientY - hand.startY) > 4) {
    hand.dragging = true;
    canvas.classList.add('dragging');
  }
  if (!hand.dragging) return;
  setRay(e);
  if (raycaster.ray.intersectPlane(dragPlane, grabPoint)) grabPoint.y = Math.max(0.15, grabPoint.y);
});

const letGo = (e) => {
  if (e.pointerId !== hand.id) return;
  hand.id = -1; hand.dragging = false; hand.hasTarget = false;
  canvas.classList.remove('dragging');
};
canvas.addEventListener('pointerup', letGo);
canvas.addEventListener('pointercancel', letGo);
canvas.addEventListener('dblclick', () => { nextFlavour(); dropCube(); });

// ───────────────────────────── Resize ─────────────────────────────

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const distance = 9.5 * Math.max(1, 0.85 / camera.aspect);
  camera.position.set(0, 3.1, distance);
  camera.lookAt(0, 1.15, 0);
  camera.updateProjectionMatrix();
  // Walls sit just inside the edges of the view
  bounds.x = Math.max(1.2, Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * distance * camera.aspect - 0.35);
}
window.addEventListener('resize', resize);
resize();

// ───────────────────────────── Loop ─────────────────────────────

const clock = new THREE.Clock();
let accumulator = 0;
nextFlavour();
dropCube();

function frame() {
  accumulator += Math.min(clock.getDelta(), 0.05);
  let hardest = 0;
  for (let steps = 0; accumulator >= STEP && steps < 6; steps++, accumulator -= STEP) {
    stepBody(STEP, hand.hasTarget ? grabPoint : null);
    hardest = Math.max(hardest, impact);
  }
  if (accumulator > STEP) accumulator = 0;
  if (hardest > 2.5) playBlup(hardest);

  updateSkin();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
</script>
<script defer src="/visit-counter.js" data-project="jelly-cube"></script>
</body>
</html>
