<style>

  }
  .dock button svg { width: 20px; height: 20px; flex: none; }
  .dock button kbd { font: inherit; opacity: 0.45; }

    <span>New</span><kbd>N</kbd>

<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const mobile = matchMedia('(hover: none)').matches || Math.min(innerWidth, innerHeight) < 600;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;

// ───────────────────────────── The street outside ─────────────────────────────
// A small 3D street across the road at dusk, rendered every frame into a texture: shops and
// flats with lit rooms and neon signs, lamps, cars passing and parked, people walking, and a
// wet road that mirrors it all. The camera is focused on the glass, so the composite pass
// sees the street through a lens blur that opens every light into a bokeh disc.

const SIGNS = ['NOODLES', 'BOOKS', 'LAUNDRY', 'FLOWERS', 'RAMEN', 'OPEN', 'TAILOR', 'VINYL', 'PHARMACY', 'BAR'];
const NEON = ['#ff4d6d', '#4dd2ff', '#ffd24d', '#7dff8a', '#ff8a3d', '#c77dff'];
const pick = a => a[(Math.random() * a.length) | 0];
const canvasTexture = c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };

// One building front: a brick or rendered wall with window frames for the colour map, and
// an emissive map of lit rooms (warm lamps, the blue of a television, blinds and curtains)
// and a glowing shopfront with its neon sign.
function facade(w, h) {
  const PX = 34, cw = Math.round(w * PX), chh = Math.round(h * PX);
  const map = document.createElement('canvas'), em = document.createElement('canvas');
  map.width = em.width = cw; map.height = em.height = chh;
  const g = map.getContext('2d'), e = em.getContext('2d');
  const brick = Math.random() < 0.6, tone = rand(0.75, 1.15);
  g.fillStyle = brick ? `rgb(${118 * tone | 0},${64 * tone | 0},${48 * tone | 0})` : `rgb(${150 * tone | 0},${140 * tone | 0},${124 * tone | 0})`;
  g.fillRect(0, 0, cw, chh);
  if (brick) {
    g.fillStyle = 'rgba(30,20,16,0.28)';
    for (let y = 0; y < chh; y += 6) { g.fillRect(0, y, cw, 1); for (let x = (y / 6) % 2 ? 0 : 7; x < cw; x += 14) g.fillRect(x, y, 1, 6); }
  }
  for (let i = 0; i < cw * chh / 40; i++) { g.fillStyle = `rgba(0,0,0,${rand(0, 0.12)})`; g.fillRect(rand(0, cw), rand(0, chh), 2, 2); }
  e.fillStyle = '#000'; e.fillRect(0, 0, cw, chh);
  const shopH = 4.2 * PX, floorH = 3.1 * PX, cols = Math.max(2, Math.round(w / 2.3));
  for (let fy = chh - shopH - floorH; fy > 0.4 * PX; fy -= floorH) {
    for (let k = 0; k < cols; k++) {
      const ww = (cw / cols) * 0.52, wx = (k + 0.5) * cw / cols - ww / 2, wy = fy + floorH * 0.22, wh = floorH * 0.55;
      g.fillStyle = 'rgba(210,200,185,0.55)'; g.fillRect(wx - 4, wy + wh, ww + 8, 4);            // sill
      g.fillStyle = '#0c0d11'; g.fillRect(wx, wy, ww, wh);
      if (Math.random() < 0.55) {
        const warm = Math.random() < 0.82;
        const grd = e.createLinearGradient(0, wy, 0, wy + wh);
        grd.addColorStop(0, warm ? '#ffb45a' : '#7fa6ff'); grd.addColorStop(1, warm ? '#b8602a' : '#3550c0');
        e.fillStyle = grd; e.fillRect(wx, wy, ww, wh);
        const look = Math.random();
        if (look < 0.35) { e.fillStyle = 'rgba(0,0,0,0.6)'; for (let b = wy; b < wy + wh * rand(0.25, 0.9); b += 4) e.fillRect(wx, b, ww, 2); }
        else if (look < 0.7) { e.fillStyle = 'rgba(70,24,12,0.75)'; e.fillRect(wx, wy, ww * 0.24, wh); e.fillRect(wx + ww * 0.76, wy, ww * 0.24, wh); }
        if (Math.random() < 0.3) { e.fillStyle = 'rgba(0,0,0,0.65)'; e.beginPath(); e.ellipse(wx + ww * rand(0.3, 0.7), wy + wh * 0.78, ww * 0.12, wh * 0.32, 0, 0, 7); e.fill(); }
      }
      e.fillStyle = 'rgba(0,0,0,0.85)'; e.fillRect(wx + ww / 2 - 1, wy, 2, wh); e.fillRect(wx, wy + wh * 0.45, ww, 2);
      g.fillStyle = 'rgba(200,195,185,0.5)'; g.fillRect(wx + ww / 2 - 1, wy, 2, wh);
    }
  }
  // Shopfront: lit window with shelves, a lit door, the sign band and its neon.
  const sy = chh - shopH;
  g.fillStyle = '#17171b'; g.fillRect(0, sy, cw, shopH);
  const glow = e.createLinearGradient(0, sy + shopH * 0.35, 0, chh);
  glow.addColorStop(0, '#ffd294'); glow.addColorStop(1, '#a45a26');
  e.fillStyle = glow; e.fillRect(cw * 0.06, sy + shopH * 0.36, cw * 0.6, shopH * 0.56);
  e.fillStyle = 'rgba(0,0,0,0.45)';
  for (let s = 0; s < 3; s++) e.fillRect(cw * 0.06, sy + shopH * (0.5 + s * 0.13), cw * 0.6, 3);
  for (let s = 1; s < 4; s++) e.fillRect(cw * 0.06 + s * cw * 0.15, sy + shopH * 0.36, 3, shopH * 0.56);
  e.fillStyle = '#e0a060'; e.fillRect(cw * 0.73, sy + shopH * 0.36, cw * 0.14, shopH * 0.64);
  const nc = pick(NEON);
  e.font = `700 ${Math.round(shopH * 0.17)}px "Helvetica Neue", Arial, sans-serif`; e.textAlign = 'center'; e.textBaseline = 'middle';
  e.shadowColor = nc; e.shadowBlur = 14; e.fillStyle = nc;
  e.fillText(pick(SIGNS), cw / 2, sy + shopH * 0.15);
  e.shadowBlur = 0;
  return { map: canvasTexture(map), emissive: canvasTexture(em) };
}

function makeCar(color, lit) {
  const car = new THREE.Group();
  const paint = new THREE.MeshPhysicalMaterial({ color, metalness: 0.5, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.15 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x0b0e12, metalness: 0.3, roughness: 0.08 });
  const tyre = new THREE.MeshStandardMaterial({ color: 0x0c0c0d, roughness: 0.9 });
  const body = new THREE.Mesh(new RoundedBoxGeometry(4.3, 0.8, 1.85, 4, 0.25), paint); body.position.y = 0.68;
  const cabin = new THREE.Mesh(new RoundedBoxGeometry(2.3, 0.62, 1.66, 4, 0.22), glass); cabin.position.set(-0.25, 1.32, 0);
  car.add(body, cabin);
  for (const [x, z] of [[1.35, 0.85], [1.35, -0.85], [-1.35, 0.85], [-1.35, -0.85]]) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 20), tyre);
    wheel.rotation.x = Math.PI / 2; wheel.position.set(x, 0.34, z); car.add(wheel);
  }
  const lamp = (c, i) => new THREE.MeshStandardMaterial({ color: 0x111111, emissive: c, emissiveIntensity: lit ? i : 0 });
  const head = lamp(0xfff2dc, 9), tail = lamp(0xff1a0a, 5);
  for (const z of [0.62, -0.62]) {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.38), head); h.position.set(2.16, 0.74, z); car.add(h);
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.42), tail); t.position.set(-2.16, 0.78, z); car.add(t);
  }
  return car;
}

function buildStreet() {
  const s = new THREE.Scene();
  s.fog = new THREE.Fog(0x2b2840, 35, 120);
  // Dusk sky.
  s.add(new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vD; void main() { vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `varying vec3 vD; void main() { float h = vD.y;
      vec3 c = mix(vec3(0.9, 0.42, 0.26), vec3(0.32, 0.26, 0.42), smoothstep(0.0, 0.18, h));
      c = mix(c, vec3(0.05, 0.08, 0.2), smoothstep(0.15, 0.7, h));
      gl_FragColor = vec4(c, 1.0); }`,
  })));
  s.add(new THREE.HemisphereLight(0x5a6890, 0x1a1410, 0.55));
  const dusk = new THREE.DirectionalLight(0x8090c8, 0.35); dusk.position.set(-10, 20, -30); s.add(dusk);

  // The block across the road.
  const sideMat = new THREE.MeshStandardMaterial({ color: 0x1c1b20, roughness: 0.9 });
  let x = -40;
  while (x < 46) {
    const w = rand(5, 9), h = rand(9, 21), f = facade(w, h);
    const front = new THREE.MeshStandardMaterial({ map: f.map, emissiveMap: f.emissive, emissive: 0xffffff, emissiveIntensity: 1.25, roughness: 0.85 });
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 10), [sideMat, sideMat, sideMat, sideMat, front, sideMat]);
    b.position.set(x + w / 2, h / 2, -12.6 - 5);
    s.add(b);
    // A cornice and an awning to break the silhouettes.
    const cornice = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.35, 0.5), sideMat); cornice.position.set(x + w / 2, h, -12.4); s.add(cornice);
    const awning = new THREE.Mesh(new THREE.BoxGeometry(w * 0.7, 0.08, 1.2), new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(rand(0, 1), 0.5, 0.25), roughness: 0.8 }));
    awning.position.set(x + w * 0.38, 3.1, -12.0); awning.rotation.x = 0.25; s.add(awning);
    x += w + rand(0, 0.3);
  }
  // Far skyline: dark towers with scattered lit windows, faded by the haze.
  const dots = document.createElement('canvas'); dots.width = 128; dots.height = 256;
  const dg = dots.getContext('2d'); dg.fillStyle = '#000'; dg.fillRect(0, 0, 128, 256);
  for (let i = 0; i < 200; i++) { dg.fillStyle = Math.random() < 0.8 ? '#ffc070' : '#90b0ff'; dg.fillRect(((Math.random() * 16) | 0) * 8 + 2, ((Math.random() * 32) | 0) * 8 + 2, 4, 4); }
  const dotTex = canvasTexture(dots); dotTex.wrapS = dotTex.wrapT = THREE.RepeatWrapping;
  for (let k = 0; k < 14; k++) {
    const w = rand(8, 20), h = rand(22, 55), t = dotTex.clone(); t.repeat.set(w / 10, h / 20); t.needsUpdate = true;
    const tower = new THREE.Mesh(new THREE.BoxGeometry(w, h, 10), new THREE.MeshStandardMaterial({ color: 0x15151c, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.9, roughness: 0.9 }));
    tower.position.set(-70 + k * 12 + rand(-3, 3), h / 2, -60 - rand(0, 20));
    s.add(tower);
  }

  // Pavements, kerbs and the road.
  const paveMat = new THREE.MeshStandardMaterial({ color: 0x4a4a50, roughness: 0.45, metalness: 0.1 });
  const near = new THREE.Mesh(new THREE.BoxGeometry(140, 0.15, 2.5), paveMat); near.position.set(0, 0.075, -1.25); s.add(near);
  const far = new THREE.Mesh(new THREE.BoxGeometry(140, 0.15, 1.6), paveMat); far.position.set(0, 0.075, -11.8); s.add(far);
  const road = new Reflector(new THREE.PlaneGeometry(140, 8.5), { clipBias: 0.003, textureWidth: 512, textureHeight: 256, color: 0x6f6f72 });
  road.rotation.x = -Math.PI / 2; road.position.set(0, 0, -6.75); s.add(road);
  // Asphalt over the mirror: mostly opaque, thin where the road is wet, gone in the puddles.
  const pud = document.createElement('canvas'); pud.width = 1024; pud.height = 128;
  const pg = pud.getContext('2d'); pg.fillStyle = 'rgb(150,150,150)'; pg.fillRect(0, 0, 1024, 128);
  for (let i = 0; i < 90; i++) { const r = rand(6, 30); const gr = pg.createRadialGradient(0, 0, 0, 0, 0, r); gr.addColorStop(0, 'rgba(20,20,20,0.95)'); gr.addColorStop(1, 'rgba(20,20,20,0)'); pg.save(); pg.translate(rand(0, 1024), rand(0, 128)); pg.scale(rand(1.5, 3.5), 1); pg.fillStyle = gr; pg.beginPath(); pg.arc(0, 0, r, 0, 7); pg.fill(); pg.restore(); }
  for (let i = 0; i < 4000; i++) { const v = rand(110, 200) | 0; pg.fillStyle = `rgb(${v},${v},${v})`; pg.fillRect(rand(0, 1024), rand(0, 128), 2, 2); }
  const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(140, 8.5), new THREE.MeshStandardMaterial({ color: 0x141418, roughness: 0.8, alphaMap: new THREE.CanvasTexture(pud), transparent: true, depthWrite: false }));
  asphalt.rotation.x = -Math.PI / 2; asphalt.position.set(0, 0.006, -6.75); s.add(asphalt);
  const lineMat = new THREE.MeshStandardMaterial({ color: 0xbdb7a6, roughness: 0.6 });
  for (let lx = -70; lx < 70; lx += 6) { const d = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.13), lineMat); d.rotation.x = -Math.PI / 2; d.position.set(lx, 0.012, -6.75); s.add(d); }

  // Street lamps.
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x18181b, metalness: 0.6, roughness: 0.5 });
  for (let k = 0; k < 5; k++) {
    const lx = -24 + k * 12 + rand(-1, 1);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 5.6, 10), poleMat); pole.position.set(lx, 2.8, -11.7); s.add(pole);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 1.2), poleMat); arm.position.set(lx, 5.55, -11.15); s.add(arm);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 10), new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0xffd2a0, emissiveIntensity: 7 }));
    bulb.position.set(lx, 5.4, -10.6); s.add(bulb);
    const light = new THREE.PointLight(0xffc98a, 40, 18, 2); light.position.copy(bulb.position); s.add(light);
  }

  // Traffic in two lanes, a few parked cars, people on the far pavement.
  const paints = [0x1f2b3a, 0x5a1a1a, 0x2a2a2c, 0x8a8f96, 0x1d3a2c, 0x3a2a4a, 0x0e0e10];
  const cars = [];
  for (let lane = 0; lane < 2; lane++) for (let k = 0; k < 3; k++) {
    const car = makeCar(pick(paints), true);
    const dir = lane ? -1 : 1;
    car.position.set(-45 + k * 33 + rand(-6, 6), 0, lane ? -8.7 : -4.8);
    car.rotation.y = lane ? Math.PI : 0;
    car.userData = { dir, v: rand(7, 10.5) };
    s.add(car); cars.push(car);
  }
  for (const px of [-9, 6, 19]) { const p = makeCar(pick(paints), false); p.position.set(px, 0, -10.35); p.rotation.y = Math.PI; s.add(p); }
  const people = [];
  const coats = [0x1a1a1f, 0x2b2420, 0x3a2a2a, 0x202a33, 0x30302a];
  for (let k = 0; k < 6; k++) {
    const p = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.1, 4, 8), new THREE.MeshStandardMaterial({ color: pick(coats), roughness: 0.9 }));
    p.position.set(rand(-30, 30), 0.78, -11.7 + rand(-0.4, 0.4));
    p.userData = { v: (Math.random() < 0.5 ? -1 : 1) * rand(0.9, 1.4), ph: rand(0, 6) };
    s.add(p); people.push(p);
  }

  const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 400);
  const base = new THREE.Vector3(0, 1.45, 2.2), look = new THREE.Vector3(9, 5.2, -14);
  const rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
  let clock = 0;
  function update(dt, px, py) {
    clock += dt;
    for (const c of cars) {
      c.position.x += c.userData.dir * c.userData.v * dt;
      if (c.position.x > 55) c.position.x = -45; else if (c.position.x < -45) c.position.x = 55;
    }
    for (const p of people) {
      p.position.x += p.userData.v * dt;
      if (p.position.x > 32) p.position.x = -32; else if (p.position.x < -32) p.position.x = 32;
      p.position.y = 0.78 + Math.abs(Math.sin(clock * 5 + p.userData.ph)) * 0.04;
    }
    // Moving your head moves the view: the street shifts against the glass.
    camera.position.set(base.x + px * 0.9, base.y - py * 0.35, base.z);
    camera.lookAt(look);
  }
  return { scene: s, camera, rt, update };
}

// The shop behind you, as the glass reflects it: pendant lamps, a lit pastry case, shelves of
// bread and the chalkboard menu. Blurred, because the eye is on the glass, not the room.
function paintInterior() {
  const W = 1024, H = 576, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const wall = g.createLinearGradient(0, 0, 0, H); wall.addColorStop(0, '#3a2414'); wall.addColorStop(1, '#140b06');
  g.fillStyle = wall; g.fillRect(0, 0, W, H);
  for (const sy of [0.36, 0.5, 0.64]) {
    g.fillStyle = 'rgb(84,56,32)'; g.fillRect(W * 0.04, H * sy, W * 0.42, 8);
    for (let x = W * 0.06; x < W * 0.44; x += rand(34, 52)) {

  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain(), f = rand(1400, 2400);
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.5, t + 0.08);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.04, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.14);
}

// ──────────────────────────── Controls ────────────────────────────

const TOOLS = ['scrub', 'squeegee', 'towel'];
let tool = 'scrub', down = false, hasPointer = false;
const P = { x: 0, y: 0 }, prev = { x: 0, y: 0 };
let bladeAng = 0, speed = 0, bead = 0;
function setTool(name) {
  tool = name;
  for (const b of document.querySelectorAll('.dock [data-tool]')) b.setAttribute('aria-pressed', String(b.dataset.tool === name));
}
for (const b of document.querySelectorAll('.dock button')) b.addEventListener('click', () => b.dataset.tool ? setTool(b.dataset.tool) : newWindow());
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k >= '1' && k <= '3') setTool(TOOLS[+k - 1]); else if (k === 'n') newWindow(); });
canvas.addEventListener('pointerdown', e => { ensureAudio(); down = true; try { canvas.setPointerCapture(e.pointerId); } catch { /* gone */ } move(e); prev.x = P.x; prev.y = P.y; lastSweep = null; });
canvas.addEventListener('pointermove', move);
const release = () => { if (down && tool === 'squeegee') dropBead(); down = false; lastSweep = null; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hasPointer = false; document.body.classList.remove('using'); });
canvas.addEventListener('pointerenter', () => document.body.classList.add('using'));
function move(e) { P.x = e.clientX; P.y = e.clientY; hasPointer = true; document.body.classList.add('using'); }
function newWindow() { makeState(W / H); drips.length = 0; done = false; grimeSet = paintGrime(); grimeTex.image = grimeSet.grime; smearTex.image = grimeSet.smear; grimeTex.needsUpdate = smearTex.needsUpdate = true; }

// ───────────────────────────── Tools on the glass ─────────────────────────────

const toTex = (x, y) => [x / W * SW, y / H * SH];
const texPerPx = () => SW / W;
function disc(cx, cy, r, fn) {
  for (let j = Math.max(0, Math.floor(cy - r)); j <= Math.min(SH - 1, Math.ceil(cy + r)); j++) {
    for (let i = Math.max(0, Math.floor(cx - r)); i <= Math.min(SW - 1, Math.ceil(cx + r)); i++) {
      const d = Math.hypot(i - cx, j - cy) / r;
      if (d < 1) fn(j * SW + i, 1 - d * d);
    }
  }
  dirty = true;
}

// The scrubber lays down suds and works the grime loose; more scrubbing, more loosened.
function scrub(dt) {
  const [cx, cy] = toTex(P.x, P.y), r = Math.min(W, H) * 0.11 * texPerPx(), work = 0.4 + Math.min(1, speed / 900) * 1.6;
  disc(cx, cy, r, (i, f) => {
    soap[i] = clamp01(soap[i] + f * dt * 4);
    wet[i] = clamp01(wet[i] + f * dt * 3);
    resid[i] = clamp01(resid[i] - f * dt * 3);
    dirt[i] = clamp01(dirt[i] - f * dt * 0.35 * work * soap[i]);
  });
}

// The squeegee sweeps the band between where the blade was and where it is now. What it
// collects rides along as a bead on the blade; the blade ends leave a thin line of water.
let lastSweep = null;
function squeegee(dt) {
  const half = Math.min(W, H) * 0.17, c = Math.cos(bladeAng), s = Math.sin(bladeAng);
  const a = { x: P.x - c * half, y: P.y - s * half }, b = { x: P.x + c * half, y: P.y + s * half };
  if (!lastSweep) { lastSweep = { a, b }; return; }
  const pa = lastSweep.a, pb = lastSweep.b;
  lastSweep = { a, b };
  const quad = [pa, pb, b, a].map(p => toTex(p.x, p.y));
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for (const [x, y] of quad) { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }
  const pad = 1.5;
  minx = Math.max(0, Math.floor(minx - pad)); maxx = Math.min(SW - 1, Math.ceil(maxx + pad));
  miny = Math.max(0, Math.floor(miny - pad)); maxy = Math.min(SH - 1, Math.ceil(maxy + pad));
  const [ax, ay] = toTex(a.x, a.y), [bx, by] = toTex(b.x, b.y), [pax, pay] = toTex(pa.x, pa.y), [pbx, pby] = toTex(pb.x, pb.y);
  const inside = (x, y) => {
    let sign = 0;
    for (let k = 0; k < 4; k++) {
      const [x1, y1] = quad[k], [x2, y2] = quad[(k + 1) % 4];
      const cr = (x2 - x1) * (y - y1) - (y2 - y1) * (x - x1);
      if (Math.abs(cr) < 1e-6) continue;
      const sg = Math.sign(cr);
      if (!sign) sign = sg; else if (sg !== sign) return false;
    }
    return true;
  };
  const segDist = (x, y, x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy || 1; let t = ((x - x1) * dx + (y - y1) * dy) / l2; t = t < 0 ? 0 : t > 1 ? 1 : t; return Math.hypot(x - x1 - dx * t, y - y1 - dy * t); };
  let picked = 0, dryDrag = 0;
  for (let j = miny; j <= maxy; j++) for (let i = minx; i <= maxx; i++) {
    const k = j * SW + i;
    // The blade ends trace a thin line of water unless a later stroke overlaps it.
    const endLine = Math.min(segDist(i, j, ax, ay, pax, pay), segDist(i, j, bx, by, pbx, pby));
    if (inside(i + 0.5, j + 0.5)) {
      picked += wet[k] + soap[k];
      if (soap[k] > 0.15 || wet[k] > 0.3) dirt[k] = Math.min(dirt[k], 1 - Math.min(1, (soap[k] + wet[k]) * 1.4)) * 0.3;
      else { dryDrag += dirt[k]; dirt[k] *= 0.96; }
      soap[k] = 0; wet[k] = 0; resid[k] *= 0.15;
      if (endLine < 1.0 && picked > 0) { resid[k] = Math.max(resid[k], 0.5); wet[k] = 0.3; }
    }
  }
  bead += picked * 0.0005;
  // A heavy bead runs off the low end of the blade as a drip.
  if (bead > 1.2) { spawnDrip((a.y > b.y ? a : b), 0.6); bead -= 0.6; }
  dirty = true;
  return { picked, dryDrag };
}

// Wiping with the towel takes up lines, drips and the last of the water.
function towel(dt) {
  const [cx, cy] = toTex(P.x, P.y), r = Math.min(W, H) * 0.06 * texPerPx(), work = 0.5 + Math.min(1, speed / 700);
  disc(cx, cy, r, (i, f) => {
    resid[i] = clamp01(resid[i] - f * dt * 3 * work);
    wet[i] = clamp01(wet[i] - f * dt * 4 * work);
    soap[i] = clamp01(soap[i] - f * dt * 2 * work);
    if (dirt[i] < 0.4) dirt[i] = clamp01(dirt[i] - f * dt * 0.8 * work);
  });
}

// Drips run down the glass, leaving a wet track that slowly dries.
const drips = [];
function spawnDrip(p, vol) { drips.push({ x: p.x, y: p.y, vol, wob: rand(0, 6) }); plink(); }
function dropBead() {
  if (bead < 0.08) { bead = 0; return; }
  const n = Math.min(5, 1 + Math.floor(bead * 3)), half = Math.min(W, H) * 0.17, c = Math.cos(bladeAng), s = Math.sin(bladeAng);
  for (let k = 0; k < n; k++) { const t = rand(-0.9, 0.9); spawnDrip({ x: P.x + c * half * t, y: P.y + s * half * t + 4 }, bead / n); }
  bead = 0;
}
function stepDrips(dt) {
  for (let k = drips.length - 1; k >= 0; k--) {
    const d = drips[k];
    const v = 40 + d.vol * 260;
    d.y += v * dt; d.x += Math.sin(d.y * 0.05 + d.wob) * 6 * dt;
    d.vol -= dt * 0.05;
    const [cx, cy] = toTex(d.x, d.y), r = 0.9 + d.vol * 2.4;
    disc(cx, cy, r, (i, f) => { wet[i] = Math.max(wet[i], 0.35 + f * 0.65); if (dirt[i] > 0.3) resid[i] = Math.max(resid[i], 0.2 * f); });
    if (d.vol < 0.02 || d.y > H) drips.splice(k, 1);
  }
}

// Water dries off slowly; suds slowly collapse into water.
let dryClock = 0;
function dry(dt) {
  dryClock += dt;
  if (dryClock < 0.25) return;
  const step = dryClock; dryClock = 0;
  for (let i = 0, n = SW * SH; i < n; i++) {
    if (soap[i] > 0) { soap[i] = Math.max(0, soap[i] - step * 0.004); }
    if (wet[i] > 0 && soap[i] < 0.05) wet[i] = Math.max(0, wet[i] - step * (wet[i] < 0.5 ? 0.03 : 0.012));
  }
  // Soapy water sags out of the bottom of the suds and runs down in thin streaks.
  for (let n = 0; n < 24; n++) {
    const i = (Math.random() * SW) | 0, j = (Math.random() * (SH - 8)) | 0, k = j * SW + i;
    if (soap[k] > 0.45 && wet[k] > 0.5 && soap[k + 6 * SW] < 0.15 && Math.random() < 0.5 && drips.length < 60)
      drips.push({ x: (i + 0.5) / SW * W, y: (j + 6) / SH * H, vol: rand(0.04, 0.12), wob: rand(0, 6) });
  }
  dirty = true;
}

// ───────────────────────────── Drawing the tools ─────────────────────────────

function drawTools() {
  tg.setTransform(dpr, 0, 0, dpr, 0, 0);
  tg.clearRect(0, 0, W, H);
  if (!hasPointer) return;
  tg.save();
  tg.translate(P.x, P.y);
  tg.shadowColor = 'rgba(0,0,0,0.45)'; tg.shadowBlur = 18; tg.shadowOffsetY = 10;
  const u = Math.min(W, H);
  if (tool === 'squeegee') {
    const half = u * 0.17;
    tg.rotate(bladeAng);
    // Handle, angled down and away, with a ribbed rubber grip.
    tg.save(); tg.rotate(0.35);
    const hg = tg.createLinearGradient(-u * 0.02, 0, u * 0.02, 0); hg.addColorStop(0, '#1c1d20'); hg.addColorStop(0.5, '#3a3c40'); hg.addColorStop(1, '#141517');
    tg.fillStyle = hg; tg.beginPath(); tg.roundRect(-u * 0.018, u * 0.02, u * 0.036, u * 0.3, u * 0.018); tg.fill();
    tg.shadowColor = 'transparent';
    tg.strokeStyle = 'rgba(255,255,255,0.08)'; tg.lineWidth = 1;
    for (let k = 0; k < 14; k++) { const y = u * 0.12 + k * u * 0.012; tg.beginPath(); tg.moveTo(-u * 0.016, y); tg.lineTo(u * 0.016, y); tg.stroke(); }
    const brass = tg.createLinearGradient(-u * 0.02, 0, u * 0.02, 0); brass.addColorStop(0, '#6b5320'); brass.addColorStop(0.5, '#e6c46a'); brass.addColorStop(1, '#5e4718');
    tg.fillStyle = brass; tg.fillRect(-u * 0.022, u * 0.012, u * 0.044, u * 0.03);
    tg.restore();
    tg.shadowColor = 'rgba(0,0,0,0.45)';
    // Channel: brushed steel with a wing nut, and the rubber blade along its edge.
    const ch = tg.createLinearGradient(0, -u * 0.03, 0, u * 0.006);
    ch.addColorStop(0, '#5c6066'); ch.addColorStop(0.35, '#e1e4e8'); ch.addColorStop(0.6, '#9aa0a7'); ch.addColorStop(1, '#4b4f55');
    tg.fillStyle = ch; tg.beginPath(); tg.roundRect(-half, -u * 0.03, half * 2, u * 0.032, 3); tg.fill();
    tg.shadowColor = 'transparent';
    tg.fillStyle = 'rgba(255,255,255,0.25)'; tg.fillRect(-half + 4, -u * 0.026, half * 2 - 8, 1.5);
    const rub = tg.createLinearGradient(0, 0, 0, u * 0.012); rub.addColorStop(0, '#0d0d0e'); rub.addColorStop(0.6, '#26272a'); rub.addColorStop(1, '#0a0a0b');
    tg.fillStyle = rub; tg.fillRect(-half - 2, u * 0.002, half * 2 + 4, u * 0.012);
    // The water bead riding the blade.
    if (down && bead > 0.02) {
      const bh = Math.min(u * 0.012, 2 + bead * 8);
      const bg = tg.createLinearGradient(0, u * 0.014, 0, u * 0.014 + bh);
      bg.addColorStop(0, 'rgba(255,255,255,0.5)'); bg.addColorStop(0.4, 'rgba(200,220,240,0.18)'); bg.addColorStop(1, 'rgba(255,255,255,0.35)');
      tg.fillStyle = bg; tg.beginPath(); tg.roundRect(-half + 6, u * 0.014, half * 2 - 12, bh, bh / 2); tg.fill();
    }
  } else if (tool === 'scrub') {
    const half = u * 0.11;
    tg.rotate(bladeAng * 0.3);
    tg.save(); tg.rotate(0.3);
    tg.fillStyle = '#2a2b2f'; tg.beginPath(); tg.roundRect(-u * 0.015, u * 0.02, u * 0.03, u * 0.28, u * 0.015); tg.fill();
    tg.restore();
    // Microfibre sleeve: a fat, fluffy, slightly wet roll on a T-bar.
    const sl = tg.createLinearGradient(0, -u * 0.04, 0, u * 0.04);
    const wetTint = down ? 0.75 : 1;
    sl.addColorStop(0, `rgb(${210 * wetTint | 0},${214 * wetTint | 0},${220 * wetTint | 0})`); sl.addColorStop(0.5, `rgb(${245 * wetTint | 0},${246 * wetTint | 0},${248 * wetTint | 0})`); sl.addColorStop(1, `rgb(${170 * wetTint | 0},${176 * wetTint | 0},${186 * wetTint | 0})`);
    tg.fillStyle = sl; tg.beginPath(); tg.roundRect(-half, -u * 0.04, half * 2, u * 0.08, u * 0.04); tg.fill();
    tg.shadowColor = 'transparent';
    tg.strokeStyle = 'rgba(120,130,145,0.35)'; tg.lineWidth = 1;
    for (let k = 0; k < 220; k++) { const x = rand(-half, half), y = rand(-u * 0.038, u * 0.038), a = rand(0, 6); tg.beginPath(); tg.moveTo(x, y); tg.lineTo(x + Math.cos(a) * 4, y + Math.sin(a) * 4); tg.stroke(); }
    tg.strokeStyle = 'rgba(40,90,170,0.7)'; tg.lineWidth = 3; tg.beginPath(); tg.moveTo(-half + u * 0.02, 0); tg.lineTo(half - u * 0.02, 0); tg.stroke();
  } else {
    // A folded terry towel.
    const w = u * 0.12, h = u * 0.08;
    tg.rotate(-0.15);
    const tw = tg.createLinearGradient(-w, -h, w, h); tw.addColorStop(0, '#d9dfe6'); tw.addColorStop(1, '#a9b3bf');
    tg.fillStyle = tw; tg.beginPath(); tg.roundRect(-w / 2, -h / 2, w, h, 10); tg.fill();
    tg.shadowColor = 'transparent';
    tg.fillStyle = 'rgba(255,255,255,0.35)'; tg.beginPath(); tg.roundRect(-w / 2, -h / 2, w, h * 0.35, [10, 10, 2, 2]); tg.fill();
    tg.fillStyle = 'rgba(80,90,105,0.2)';
    for (let k = 0; k < 160; k++) tg.fillRect(rand(-w / 2, w / 2), rand(-h / 2, h / 2), 1.5, 1.5);
    tg.strokeStyle = 'rgba(60,70,85,0.35)'; tg.lineWidth = 2; tg.beginPath(); tg.moveTo(-w / 2 + 6, h * 0.18); tg.lineTo(w / 2 - 6, h * 0.18); tg.stroke();
  }
  tg.restore();
}

// ───────────────────────────── Frame ─────────────────────────────

let done = false, statsClock = 0, lastStatus = '', squeakPhase = 0;
const clock = new THREE.Clock();
function stats() {
  let clean = 0, n = 0;
  for (let j = 4; j < SH - 4; j += 3) for (let i = 4; i < SW - 4; i += 3) {
    const k = j * SW + i;
    n++;
    if (dirt[k] < 0.12 && soap[k] < 0.08 && resid[k] < 0.12 && wet[k] < 0.4) clean++;
  }
  const pct = Math.round(100 * clean / n);
  if (!done && pct >= 98) done = true;
  const text = done ? 'Spotless' : `Clean ${pct}%`;
  if (text !== lastStatus) statusEl.textContent = lastStatus = text;
}

function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  const dx = P.x - prev.x, dy = P.y - prev.y, dist = Math.hypot(dx, dy);
  speed += (dist / Math.max(dt, 1e-3) - speed) * 0.3;
  // The blade turns to lie across the direction it is pulled.
  if (dist > 1.5) {
    let want = Math.atan2(dy, dx) + Math.PI / 2;
    let diff = Math.atan2(Math.sin(want - bladeAng), Math.cos(want - bladeAng));
    if (Math.abs(diff) > Math.PI / 2) { want += Math.PI; diff = Math.atan2(Math.sin(want - bladeAng), Math.cos(want - bladeAng)); }
    bladeAng += diff * Math.min(1, dt * (tool === 'squeegee' ? 9 : 4));
  }
  prev.x = P.x; prev.y = P.y;

  let sweep = null;
  if (down && hasPointer) {
    if (tool === 'scrub') scrub(dt);
    else if (tool === 'squeegee') sweep = squeegee(dt);
    else towel(dt);
  }
  stepDrips(dt);
  dry(dt);
  if (dirty) upload();

  if (S) {
    const sp = Math.min(1, speed / 900);
    const onClean = sweep ? (sweep.picked > 0 ? 1 : 0.4) : 0;
    squeakPhase += dt * (8 + sp * 20);
    const chirp = 0.55 + 0.45 * Math.sin(squeakPhase) * Math.sin(squeakPhase * 0.37);
    S.squeak.frequency.setTargetAtTime(1100 + sp * 700 + Math.sin(t * 13) * 80, audio.currentTime, 0.02);
    S.sq.frequency.setTargetAtTime(1200 + sp * 800, audio.currentTime, 0.02);
    S.sqg.gain.setTargetAtTime(down && tool === 'squeegee' ? 0.05 * sp * onClean * chirp : 0, audio.currentTime, 0.02);
    level(S.drag, down && tool === 'squeegee' ? 0.05 * sp : 0, 0.03);
    level(S.scrub, down && tool === 'scrub' ? 0.08 * (0.3 + sp) : 0, 0.04);
    level(S.fizz, down && tool === 'scrub' ? 0.03 : 0, 0.1);
    level(S.cloth, down && tool === 'towel' ? 0.08 * (0.3 + sp) : 0, 0.04);
  }

  U.uTime.value = t;
  U.uParallax.value.set((P.x / W - 0.5) * 0.008, (P.y / H - 0.5) * 0.004);
  street.update(dt, P.x / W - 0.5, P.y / H - 0.5);
  renderer.setRenderTarget(street.rt);
  renderer.render(street.scene, street.camera);
  renderer.setRenderTarget(null);
  renderer.render(scene, cam);
  drawTools();
  statsClock += dt;
  if (statsClock > 0.5) { statsClock = 0; stats(); }
  requestAnimationFrame(frame);
}

// Preview: a clean band pulled through the dirt, with suds either side.
if (new URLSearchParams(location.search).has('demo')) {
  for (let j = 0; j < SH; j++) for (let i = 0; i < SW; i++) {
    const k = j * SW + i, x = i / SW;
    if (x > 0.36 && x < 0.62) { dirt[k] = 0; if (Math.abs(x - 0.36) < 0.004 || Math.abs(x - 0.62) < 0.004) { resid[k] = 0.6; wet[k] = 0.4; } }
    else if (x > 0.62 && x < 0.86) { soap[k] = 0.85; wet[k] = 1; dirt[k] = 0.5; }
  }
  P.x = W * 0.49; P.y = H * 0.55; hasPointer = true; setTool('squeegee'); bladeAng = 0;
  for (let k = 0; k < 4; k++) drips.push({ x: W * rand(0.38, 0.6), y: H * rand(0.6, 0.75), vol: rand(0.1, 0.3), wob: rand(0, 6) });
}
requestAnimationFrame(frame);
</script>
