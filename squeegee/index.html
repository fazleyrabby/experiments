<script type="module">
import * as THREE from 'three';

const mobile = matchMedia('(hover: none)').matches || Math.min(innerWidth, innerHeight) < 600;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;

// ───────────────────────────── The street outside ─────────────────────────────
// Painted once onto a canvas: a dusk sky, the buildings across the road with their lit
// windows and shop signs, lamps, and the wet road reflecting it all. The camera is focused
// on the glass, so the whole view is blurred into bokeh before it is used.

function paintStreet() {
  const W = 2048, H = 1152, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, H * 0.5);
  sky.addColorStop(0, '#16203a'); sky.addColorStop(0.55, '#3a3552'); sky.addColorStop(1, '#b0685a');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // Distant skyline.
  for (let x = -40; x < W; x += rand(50, 120)) {
    const h = rand(H * 0.12, H * 0.32), w = rand(60, 140);
    g.fillStyle = `rgb(${30 + rand(0, 12)},${30 + rand(0, 12)},${48 + rand(0, 15)})`;
    g.fillRect(x, H * 0.5 - h, w, h + 10);
    for (let i = 0; i < w * h / 900; i++) if (Math.random() < 0.35) { g.fillStyle = Math.random() < 0.8 ? '#ffcf86' : '#9ec4ff'; g.fillRect(x + rand(4, w - 6), H * 0.5 - h + rand(4, h), 3, 4); }
  }
  // The block across the street: brick and render facades, windows, shopfronts at street level.
  const signs = ['NOODLES', 'LAUNDRY', 'BOOKS', 'OPEN', 'FLOWERS', 'RAMEN', 'BAR', 'PHARMACY', 'VINYL', 'TAILOR'];
  const neon = ['#ff4d6d', '#4dd2ff', '#ffd24d', '#7dff8a', '#ff8a3d', '#c77dff'];
  let x = -30;
  while (x < W) {
    const w = rand(220, 380), top = H * rand(0.08, 0.3), base = H * 0.66;
    const tone = rand(0.7, 1.15), brick = Math.random() < 0.6;
    g.fillStyle = brick ? `rgb(${78 * tone | 0},${44 * tone | 0},${36 * tone | 0})` : `rgb(${92 * tone | 0},${86 * tone | 0},${80 * tone | 0})`;
    g.fillRect(x, top, w, base - top);
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x + w - 6, top, 6, base - top);
    // Upper-floor windows.
    const cols = Math.max(2, Math.round(w / 70)), rows = Math.max(2, Math.round((base - top - 150) / 85));
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      const wx = x + 18 + k * (w - 36) / cols, wy = top + 30 + r * 85, ww = (w - 36) / cols - 18, wh = 52;
      const lit = Math.random(), col = lit < 0.42 ? (Math.random() < 0.85 ? '#ffc46e' : '#8fb8ff') : lit < 0.5 ? '#ff9e5a' : '#1a1b22';
      g.fillStyle = col; g.fillRect(wx, wy, ww, wh);
      if (lit < 0.5) { g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(wx, wy + wh * rand(0.2, 0.6), ww, 2); g.fillRect(wx + ww / 2 - 1, wy, 2, wh); }
    }
    // Shopfront with a glowing window and a neon sign.
    g.fillStyle = '#ffd9a0'; g.globalAlpha = 0.85; g.fillRect(x + 20, base - 120, w - 40, 100); g.globalAlpha = 1;
    g.fillStyle = 'rgba(40,20,10,0.5)'; for (let s = 0; s < 4; s++) g.fillRect(x + 30 + s * (w - 60) / 4, base - 110, (w - 60) / 4 - 14, 80);
    const awn = neon[(Math.random() * neon.length) | 0];
    g.fillStyle = `rgb(${rand(60, 140) | 0},${rand(30, 60) | 0},${rand(30, 60) | 0})`; g.fillRect(x + 10, base - 150, w - 20, 26);
    g.font = '700 46px "Helvetica Neue", Arial, sans-serif'; g.textAlign = 'center';
    g.shadowColor = awn; g.shadowBlur = 30; g.fillStyle = awn;
    g.fillText(signs[(Math.random() * signs.length) | 0], x + w / 2, base - 172);
    g.shadowBlur = 0;
    x += w + rand(6, 20);
  }
  // Pavement, road, kerb.
  g.fillStyle = '#2a2a30'; g.fillRect(0, H * 0.66, W, H * 0.05);
  g.fillStyle = '#121318'; g.fillRect(0, H * 0.71, W, H * 0.29);
  // Wet road: the lights above, smeared down as long reflections.
  const above = g.getImageData(0, H * 0.4, W, H * 0.26);
  const ref = document.createElement('canvas'); ref.width = W; ref.height = H * 0.26;
  ref.getContext('2d').putImageData(above, 0, 0);
  g.save(); g.globalAlpha = 0.4; g.translate(0, H * 1.42); g.scale(1, -1.15); g.filter = 'blur(6px)'; g.drawImage(ref, 0, 0); g.restore();
  g.fillStyle = 'rgba(12,13,18,0.35)'; g.fillRect(0, H * 0.71, W, H * 0.29);
  for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(230,220,180,0.5)'; g.fillRect(i * 380 + 60, H * 0.85, 160, 8); }
  // Street lamps with their glow.
  for (let lx = 180; lx < W; lx += 560) {
    g.fillStyle = '#0b0b0e'; g.fillRect(lx, H * 0.35, 8, H * 0.36);
    const glow = g.createRadialGradient(lx + 4, H * 0.35, 0, lx + 4, H * 0.35, 120);
    glow.addColorStop(0, 'rgba(255,220,160,1)'); glow.addColorStop(0.15, 'rgba(255,200,130,0.6)'); glow.addColorStop(1, 'rgba(255,180,120,0)');
    g.fillStyle = glow; g.fillRect(lx - 120, H * 0.35 - 120, 248, 240);
  }
  // Focus on the glass: everything outside goes soft, and the brightest points open into bokeh discs.
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const o = out.getContext('2d');
  o.filter = 'blur(20px)'; o.drawImage(c, 0, 0); o.filter = 'none';
  o.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 160; i++) {
    const px = Math.random() * W, py = Math.random() * H * 0.72;
    const d = g.getImageData(px | 0, py | 0, 1, 1).data;
    if (d[0] + d[1] + d[2] < 420) continue;
    const r = rand(16, 40);
    const grd = o.createRadialGradient(px, py, r * 0.6, px, py, r);
    grd.addColorStop(0, `rgba(${d[0]},${d[1]},${d[2]},0.16)`); grd.addColorStop(0.9, `rgba(${d[0]},${d[1]},${d[2]},0.22)`); grd.addColorStop(1, 'rgba(0,0,0,0)');
    o.fillStyle = grd; o.beginPath(); o.arc(px, py, r, 0, Math.PI * 2); o.fill();
  }
  return out;
}

// The dirt that does not change: grime density, mineral water-spot rings, dust and handprint smudges.
function paintGrime() {
  const W = 1024, H = 576;
  const layer = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); return [c, g]; };
  const [c1, g1] = layer();       // film: blotchy, heavier at the bottom where the rain ran down
  for (let i = 0; i < 260; i++) { const x = rand(0, W), y = rand(0, H), r = rand(20, 120); const grd = g1.createRadialGradient(x, y, 0, x, y, r); grd.addColorStop(0, `rgba(255,255,255,${rand(0.05, 0.22)})`); grd.addColorStop(1, 'rgba(255,255,255,0)'); g1.fillStyle = grd; g1.fillRect(x - r, y - r, r * 2, r * 2); }
  const fade = g1.createLinearGradient(0, 0, 0, H); fade.addColorStop(0, 'rgba(255,255,255,0.25)'); fade.addColorStop(1, 'rgba(255,255,255,0.6)'); g1.fillStyle = fade; g1.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) { const x = rand(0, W), y = rand(0, H * 0.7), l = rand(60, 300); g1.strokeStyle = `rgba(255,255,255,${rand(0.08, 0.25)})`; g1.lineWidth = rand(2, 6); g1.beginPath(); g1.moveTo(x, y); g1.bezierCurveTo(x + rand(-8, 8), y + l * 0.3, x + rand(-10, 10), y + l * 0.6, x + rand(-6, 6), y + l); g1.stroke(); }
  const [c2, g2] = layer();       // dried water spots: rings with darker rims
  for (let i = 0; i < 900; i++) { const x = rand(0, W), y = rand(0, H), r = rand(1.5, 7); g2.strokeStyle = `rgba(255,255,255,${rand(0.3, 0.8)})`; g2.lineWidth = rand(0.6, 1.6); g2.beginPath(); g2.ellipse(x, y, r, r * rand(0.8, 1.1), 0, 0, Math.PI * 2); g2.stroke(); g2.fillStyle = `rgba(255,255,255,${rand(0.05, 0.2)})`; g2.fill(); }
  const [c3, g3] = layer();       // dust and specks
  for (let i = 0; i < 6000; i++) { g3.fillStyle = `rgba(255,255,255,${rand(0.2, 1)})`; const s = rand(0.6, 2.2); g3.fillRect(rand(0, W), rand(0, H), s, s); }
  const [c4, g4] = layer();       // handprints and finger smears
  for (let h = 0; h < 4; h++) {
    const hx = rand(W * 0.15, W * 0.85), hy = rand(H * 0.35, H * 0.85), sc = rand(0.8, 1.2), a = rand(-0.4, 0.4);
    g4.save(); g4.translate(hx, hy); g4.rotate(a); g4.scale(sc, sc);
    g4.fillStyle = 'rgba(255,255,255,0.35)';
    g4.beginPath(); g4.ellipse(0, 0, 30, 36, 0, 0, Math.PI * 2); g4.fill();
    for (let f = 0; f < 5; f++) { const fa = -1.9 + f * 0.42 + (f === 0 ? -0.5 : 0); g4.save(); g4.rotate(fa + Math.PI / 2); g4.beginPath(); g4.ellipse(0, -62 - (f === 0 ? -20 : 0), 9, f === 0 ? 20 : 26, 0, 0, Math.PI * 2); g4.fill(); g4.restore(); }
    g4.restore();
  }
  for (let i = 0; i < 10; i++) { const x = rand(0, W), y = rand(H * 0.3, H); g4.strokeStyle = 'rgba(255,255,255,0.2)'; g4.lineWidth = rand(10, 18); g4.lineCap = 'round'; g4.beginPath(); g4.moveTo(x, y); g4.lineTo(x + rand(-40, 40), y + rand(30, 90)); g4.stroke(); }
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const o = out.getContext('2d'), img = o.createImageData(W, H);
  const chan = (c, k) => { const d = c.getContext('2d').getImageData(0, 0, W, H).data; for (let i = 0; i < d.length; i += 4) img.data[i + k] = d[i]; };
  chan(c1, 0); chan(c2, 1); chan(c3, 2);
  const d4 = c4.getContext('2d').getImageData(0, 0, W, H).data;
  for (let i = 0; i < d4.length; i += 4) img.data[i + 3] = 255;     // alpha would premultiply the others; smears go in their own texture
  o.putImageData(img, 0, 0);
  return { grime: out, smear: c4 };
}

// Gold-leaf sign lettering on the glass, read from inside the shop, so mirrored.
function paintLettering() {
  const W = 2048, H = 1152, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.translate(W, 0); g.scale(-1, 1);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const word = 'CORNER BAKERY', cx = W / 2, cy = H * 0.7, R = 560;
  g.font = '800 104px Georgia, "Times New Roman", serif';
  const step = 0.15, total = word.length * step;
  [...word].forEach((ch, i) => {
    const a = -Math.PI / 2 - total / 2 + (i + 0.5) * step;
    g.save(); g.translate(cx + Math.cos(a) * R, cy + Math.sin(a) * R); g.rotate(a + Math.PI / 2);
    g.lineWidth = 12; g.strokeStyle = '#000'; g.strokeText(ch, 0, 0);
    g.fillStyle = '#fff'; g.fillText(ch, 0, 0);
    g.restore();
  });
  g.font = 'italic 600 54px Georgia, serif';
  g.lineWidth = 8; g.strokeStyle = '#000'; g.strokeText('Est. 1962  ·  Fresh Daily', cx, H * 0.35); g.fillStyle = '#fff'; g.fillText('Est. 1962  ·  Fresh Daily', cx, H * 0.35);
  // Red channel: the gold; green channel: its black outline.
  const d = g.getImageData(0, 0, W, H), out = document.createElement('canvas');
  out.width = W; out.height = H;
  const o = out.getContext('2d'), img = o.createImageData(W, H);
  for (let i = 0; i < d.data.length; i += 4) {
    const a = d.data[i + 3] / 255, lum = d.data[i] / 255;
    img.data[i] = 255 * a * lum; img.data[i + 1] = 255 * a * (1 - lum); img.data[i + 2] = 0; img.data[i + 3] = 255;
  }
  o.putImageData(img, 0, 0);
  return out;
}

// ───────────────────────────── Glass state ─────────────────────────────
// Per texel, top-down:  R dirt left on the glass, G soap suds, B water, A edge lines and
// streaks the squeegee leaves behind. Dirt under suds has been loosened and goes with the water.

let SW = 0, SH = 0, dirt, soap, wet, resid, buf, stateTex;
function makeState(aspect) {
  SW = Math.round(aspect >= 1 ? 640 : 640 * aspect); SH = Math.round(aspect >= 1 ? 640 / aspect : 640);
  dirt = new Float32Array(SW * SH).fill(1); soap = new Float32Array(SW * SH); wet = new Float32Array(SW * SH); resid = new Float32Array(SW * SH);
  buf = new Uint8Array(SW * SH * 4);
  if (stateTex) stateTex.dispose();
  stateTex = new THREE.DataTexture(buf, SW, SH);
  stateTex.magFilter = stateTex.minFilter = THREE.LinearFilter;
  if (U) U.tState.value = stateTex;
  dirty = true;
}
let dirty = true, U = null;
function upload() {
  for (let i = 0, n = SW * SH; i < n; i++) {
    const o = i * 4;
    buf[o] = dirt[i] * 255; buf[o + 1] = soap[i] * 255; buf[o + 2] = wet[i] * 255; buf[o + 3] = resid[i] * 255;
  }
  stateTex.needsUpdate = true;
  dirty = false;
}

// ───────────────────────────── Renderer ─────────────────────────────

const canvas = document.getElementById('stage'), toolCanvas = document.getElementById('tools'), tg = toolCanvas.getContext('2d');
const statusEl = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const tex = (c, srgb = true, mip = true) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = mip; t.minFilter = mip ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter; return t; };
const street = tex(paintStreet());
let grimeSet = paintGrime();
const grimeTex = tex(grimeSet.grime, false), smearTex = tex(grimeSet.smear, false);
grimeTex.wrapS = grimeTex.wrapT = smearTex.wrapS = smearTex.wrapT = THREE.MirroredRepeatWrapping;
const letterTex = tex(paintLettering(), false);

U = {
  tState: { value: null }, tStreet: { value: street }, tGrime: { value: grimeTex }, tSmear: { value: smearTex }, tLetters: { value: letterTex },
  uTime: { value: 0 }, uAspect: { value: 1 }, uTexel: { value: new THREE.Vector2() }, uParallax: { value: new THREE.Vector2() }, uFrame: { value: 0.025 },
};
const mat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tState, tStreet, tGrime, tSmear, tLetters;
    uniform float uTime, uAspect, uFrame;
    uniform vec2 uTexel, uParallax;
    varying vec2 vUv;
    float h21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
    // Distance to the nearest bubble wall, and that bubble's size, for the suds.
    vec2 bubbles(vec2 p) {
      vec2 i = floor(p), f = fract(p); float d1 = 8.0, d2 = 8.0; float rr = 0.0;
      for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
        vec2 g = vec2(x, y), o = vec2(h21(i + g), h21(i + g + 7.3)) * 0.8 + 0.1;
        float d = length(g + o - f) / (0.6 + 0.6 * h21(i + g + 3.1));
        if (d < d1) { d2 = d1; d1 = d; rr = h21(i + g + 3.1); } else if (d < d2) d2 = d;
      }
      return vec2(d2 - d1, rr);
    }
    // The street, with car lights sliding past and the glass's refraction.
    vec3 outside(vec2 uv) {
      vec2 suv = (uv - 0.5) / vec2(max(1.0, 1.78 / uAspect), max(1.0, uAspect / 1.78)) + 0.5 + uParallax;
      vec3 c = texture2D(tStreet, suv).rgb;

  } else {
    // A folded terry towel.
    const w = u * 0.12, h = u * 0.08;
    tg.rotate(-0.15);
    const tw = tg.createLinearGradient(-w, -h, w, h); tw.addColorStop(0, '#d9dfe6'); tw.addColorStop(1, '#a9b3bf');
    tg.fillStyle = tw; tg.beginPath(); tg.roundRect(-w / 2, -h / 2, w, h, 10); tg.fill();
    tg.shadowColor = 'transparent';
    tg.fillStyle = 'rgba(255,255,255,0.35)'; tg.beginPath(); tg.roundRect(-w / 2, -h / 2, w, h * 0.35, [10, 10, 2, 2]); tg.fill();
    tg.fillStyle = 'rgba(80,90,105,0.2)';
    for (let k = 0; k < 160; k++) tg.fillRect(rand(-w / 2, w / 2), rand(-h / 2, h / 2), 1.5, 1.5);
    tg.strokeStyle = 'rgba(60,70,85,0.35)'; tg.lineWidth = 2; tg.beginPath(); tg.moveTo(-w / 2 + 6, h * 0.18); tg.lineTo(w / 2 - 6, h * 0.18); tg.stroke();
  }
  tg.restore();
}

// ───────────────────────────── Frame ─────────────────────────────

let done = false, statsClock = 0, lastStatus = '', squeakPhase = 0;
const clock = new THREE.Clock();
function stats() {
  let clean = 0, n = 0;
  for (let j = 4; j < SH - 4; j += 3) for (let i = 4; i < SW - 4; i += 3) {
    const k = j * SW + i;
    n++;
    if (dirt[k] < 0.12 && soap[k] < 0.08 && resid[k] < 0.12 && wet[k] < 0.4) clean++;
  }
  const pct = Math.round(100 * clean / n);
  if (!done && pct >= 98) done = true;
  const text = done ? 'Spotless' : `Clean ${pct}%`;
  if (text !== lastStatus) statusEl.textContent = lastStatus = text;
}

function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  const dx = P.x - prev.x, dy = P.y - prev.y, dist = Math.hypot(dx, dy);
  speed += (dist / Math.max(dt, 1e-3) - speed) * 0.3;
  // The blade turns to lie across the direction it is pulled.
  if (dist > 1.5) {
    let want = Math.atan2(dy, dx) + Math.PI / 2;
    let diff = Math.atan2(Math.sin(want - bladeAng), Math.cos(want - bladeAng));
    if (Math.abs(diff) > Math.PI / 2) { want += Math.PI; diff = Math.atan2(Math.sin(want - bladeAng), Math.cos(want - bladeAng)); }
    bladeAng += diff * Math.min(1, dt * (tool === 'squeegee' ? 9 : 4));
  }
  prev.x = P.x; prev.y = P.y;

  let sweep = null;
  if (down && hasPointer) {
    if (tool === 'scrub') scrub(dt);
    else if (tool === 'squeegee') sweep = squeegee(dt);
    else towel(dt);
  }
  stepDrips(dt);
  dry(dt);
  if (dirty) upload();

  if (S) {
    const sp = Math.min(1, speed / 900);
    const onClean = sweep ? (sweep.picked > 0 ? 1 : 0.4) : 0;
    squeakPhase += dt * (8 + sp * 20);
    const chirp = 0.55 + 0.45 * Math.sin(squeakPhase) * Math.sin(squeakPhase * 0.37);
    S.squeak.frequency.setTargetAtTime(1100 + sp * 700 + Math.sin(t * 13) * 80, audio.currentTime, 0.02);
    S.sq.frequency.setTargetAtTime(1200 + sp * 800, audio.currentTime, 0.02);
    S.sqg.gain.setTargetAtTime(down && tool === 'squeegee' ? 0.05 * sp * onClean * chirp : 0, audio.currentTime, 0.02);
    level(S.drag, down && tool === 'squeegee' ? 0.05 * sp : 0, 0.03);
    level(S.scrub, down && tool === 'scrub' ? 0.08 * (0.3 + sp) : 0, 0.04);
    level(S.fizz, down && tool === 'scrub' ? 0.03 : 0, 0.1);
    level(S.cloth, down && tool === 'towel' ? 0.08 * (0.3 + sp) : 0, 0.04);
  }

  U.uTime.value = t;
  U.uParallax.value.set((P.x / W - 0.5) * 0.008, (P.y / H - 0.5) * 0.004);
  renderer.render(scene, cam);
  drawTools();
  statsClock += dt;
  if (statsClock > 0.5) { statsClock = 0; stats(); }
  requestAnimationFrame(frame);
}

// Preview: a clean band pulled through the dirt, with suds either side.
if (new URLSearchParams(location.search).has('demo')) {
  for (let j = 0; j < SH; j++) for (let i = 0; i < SW; i++) {
    const k = j * SW + i, x = i / SW;
    if (x > 0.36 && x < 0.62) { dirt[k] = 0; if (Math.abs(x - 0.36) < 0.004 || Math.abs(x - 0.62) < 0.004) { resid[k] = 0.6; wet[k] = 0.4; } }
    else if (x > 0.62 && x < 0.86) { soap[k] = 0.85; wet[k] = 1; dirt[k] = 0.5; }
  }
  P.x = W * 0.49; P.y = H * 0.55; hasPointer = true; setTool('squeegee'); bladeAng = 0;
  for (let k = 0; k < 4; k++) drips.push({ x: W * rand(0.38, 0.6), y: H * rand(0.6, 0.75), vol: rand(0.1, 0.3), wob: rand(0, 6) });
}
requestAnimationFrame(frame);
</script>
<script defer src="/visit-counter.js" data-project="squeegee"></script>
