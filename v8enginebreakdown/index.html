<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111315" />
    <meta name="description" content="An interactive, procedural V8 engine with an exploded view and working crank mechanism." />
    <title>V8 Engine Study</title>
  </head>
  <body>
    <main class="exhibit">
      <div id="viewport" aria-label="Interactive 3D V8 engine. Drag to rotate, scroll or pinch to zoom."></div>
      <div id="component-labels" class="component-labels" aria-label="Exploded engine components"></div>
      <div id="selection-label" class="selection-label" hidden><span id="selection-title"></span><p id="selection-description"></p><button id="clear-selection" aria-label="Clear component selection">×</button></div>
      <div class="controls" aria-label="Engine controls">
        <button id="break-down" class="button button-primary">BREAK DOWN</button>
        <button id="reassemble" class="button button-secondary">REASSEMBLE</button>
      </div>
      <div id="loading" class="loading" aria-label="Loading engine"><div></div></div>
      <div id="error" class="error" role="alert" hidden><h2>3D view unavailable</h2><p>This study needs WebGL. Try a browser with hardware acceleration enabled.</p><button onclick="location.reload()">TRY AGAIN</button></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
