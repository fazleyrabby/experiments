<!DOCTYPE html>

<title>Rust Restoration // 38</title>
<style>
  :root { --bg: #171512; --ink: #ece4d6; --chip: rgba(26, 23, 20, 0.8); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  canvas#stage.turning { cursor: grab; }
  canvas#stage.turning.held { cursor: grabbing; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(130% 100% at 50% 45%, transparent 50%, rgba(8, 6, 4, 0.55) 100%);
  }
  .label, .items {
    position: fixed; user-select: none; -webkit-user-select: none;
    font: 500 11px/1.7 "Helvetica Neue", Helvetica, Inter, system-ui, sans-serif;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink);
  }
  .label { bottom: 26px; pointer-events: none; }
  .label.left { left: 28px; }
  .label.right { left: 28px; top: 24px; bottom: auto; font-variant-numeric: tabular-nums; }
  .label.visits { top: 24px; bottom: auto; right: 28px; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .label.visits[hidden] { display: none; }
  .label.visits::before { content: ""; width: 6px; height: 6px; background: var(--ink); }
  .label .hint { opacity: 0.6; }
  .label .touch { display: none; }
  @media (hover: none) {
    .label .mouse { display: none; }
    .label .touch { display: inline; }
  }
  .items { top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--chip); }
  .items button {
    all: unset; cursor: pointer; padding: 6px 12px 5px; border-radius: 999px; color: var(--ink);
    font: 600 10px/1 "Helvetica Neue", Helvetica, Inter, system-ui, sans-serif; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .items button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .items button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .dock {
    position: fixed; right: 22px; bottom: 22px;
    display: flex; gap: 4px; padding: 6px; border-radius: 999px;
    background: var(--chip); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .dock button {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 7px;
    padding: 8px 12px 8px 10px; border-radius: 999px; color: var(--ink);
    font: 600 10px/1 "Helvetica Neue", Helvetica, Inter, system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .dock button svg { width: 20px; height: 20px; flex: none; }
  .dock button kbd { font: inherit; opacity: 0.4; }
  .dock button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .dock button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .dock .sep { width: 1px; margin: 6px 2px; background: rgba(236, 228, 214, 0.2); }
  @media (max-width: 1180px) {
    .dock button span, .dock button kbd { display: none; }
    .dock button { padding: 9px; }
  }
  @media (max-width: 860px) {
    .dock { right: auto; left: 50%; transform: translateX(-50%); bottom: 74px; }
  }
  @media (max-width: 520px) {
    .label { bottom: 18px; font-size: 10px; }
    .label.left { left: 18px; right: 18px; }
    .label.right { top: 16px; left: 18px; right: 120px; }
    .label.visits { top: 16px; right: 18px; }
    .items { top: 46px; }
    .dock button { padding: 8px; }
  }
</style>
<script type="importmap">
{

<body>

<div class="vignette"></div>
<div class="label left">
  <div>Rust Restoration // 38</div>
  <div class="hint">
    <span class="mouse">Spray and let it soak, wire wheel, sand, polish, then wipe the haze off<br>Right-drag or Turn to reach every side / 1–6 tools / O overview / N new</span>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mobile = matchMedia('(hover: none)').matches || Math.min(innerWidth, innerHeight) < 600;

// ───────────────────────────── Renderer ─────────────────────────────

const canvas = document.getElementById('stage');
const statusEl = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const gl = renderer.getContext();
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171512);
// The lamp's pool of light: the bench falls away into the dark of the workshop.
scene.fog = new THREE.Fog(0x171512, 5.5, 12);

// A workshop to reflect. Polished steel is only as bright as what it mirrors, so the room is
// graded like a real one (dark bench below, lit walls at the horizon, a pale ceiling) and carries
// big softboxes, tube lights, a window and a warm lamp that slide across the steel as it turns.
{
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.SphereGeometry(12, 64, 32), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: 'varying vec3 vD; void main() { vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `varying vec3 vD;
      float h(vec2 p) { return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5); }
      void main() {
        float y = vD.y;
        vec3 floorC = vec3(0.045, 0.028, 0.016), wall = vec3(0.2, 0.18, 0.16), ceil = vec3(0.1, 0.1, 0.11);
        vec3 c = mix(floorC, wall, smoothstep(-0.18, 0.02, y));
        c = mix(c, ceil, smoothstep(0.25, 0.75, y));
        // Shelving and clutter along the walls: darker bands so the horizon reads as a room.
        float a = atan(vD.z, vD.x);
        float shelf = step(0.5, h(vec2(floor(a * 7.0), 1.0))) * smoothstep(0.02, 0.06, y) * (1.0 - smoothstep(0.2, 0.26, y));
        c *= 1.0 - 0.55 * shelf;
        gl_FragColor = vec4(c, 1.0);
      }`,
  }));
  const glow = (c, w, h, x, y, z) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  };
  glow(new THREE.Color(4.2, 4.2, 4.4), 5.5, 3, 0.4, 7, -3.2);              // overhead softbox, ahead of the camera
  // Key softbox where a flat face lying on the bench mirrors it, as a product photographer would place it:
  // a bright core in a dimmer diffuser, so polished faces show a gradient rather than a flat white card.
  glow(new THREE.Color(0.75, 0.75, 0.8), 8, 4.2, 0, 5.4, -5.6);
  glow(new THREE.Color(1.3, 1.3, 1.38), 4, 1.4, 0.6, 5.45, -5.5);
  glow(new THREE.Color(5, 4.9, 4.7), 1.1, 6, -6.5, 3.5, 1.5);           // strip lights either side
  glow(new THREE.Color(5, 4.9, 4.7), 1.1, 6, 6.5, 3.5, -1);
  glow(new THREE.Color(9, 9.4, 10.2), 4, 3, -4, 3, -7.5);               // window
  glow(new THREE.Color(10, 6.4, 3.2), 1.2, 1.2, 6, 2.2, 5);             // warm lamp
  glow(new THREE.Color(0.5, 0.48, 0.45), 7, 2.5, 0, 1.5, 9);            // lit wall behind the camera
  for (const z of [-2, 0.5, 3]) glow(new THREE.Color(12, 11.6, 11), 6, 0.22, 0, 8, z);   // tube lights
  env.add(room);
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, 0.015).texture;
}

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);

// Post: multisampled HDR, a soft bloom so sparks and specular glints glow like they do through a
// lens, then tone mapping and a whisper of film grain.
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: mobile ? 2 : 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.22, 0.5, 1.1);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grain = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      float n = fract(sin(dot(gl_FragCoord.xy + uTime * 61.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
      c.rgb += n * 0.022 * (1.0 - c.rgb * 0.6);
      gl_FragColor = c;
    }`,
});
composer.addPass(grain);
RectAreaLightUniformsLib.init();
const tube = new THREE.RectAreaLight(0xfff4e6, 2.4, 4.2, 0.3);
tube.position.set(0.3, 3.4, -0.4);
tube.lookAt(0, 0.4, 0.3);
scene.add(tube);
const sun = new THREE.DirectionalLight(0xffe4c6, 1.7);
sun.position.set(-2.4, 5, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2.6, right: 2.6, top: 2.2, bottom: -2.2, near: 0.5, far: 12 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01; sun.shadow.radius = 6;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xc8d4e4, 0x2a2016, 0.12));

// ───────────────────────────── Bench ─────────────────────────────

function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s = 0, oct = 4) {
  let t = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { t += amp * vnoise(x * f, y * f, s + i); f *= 2.03; amp *= 0.5; }
  return t / (1 - Math.pow(0.5, oct));
}

const BW = 10, BD = 10, BZ = -2;    // bench size and how far it runs back from the piece
const benchCanvas = document.createElement('canvas');
benchCanvas.width = mobile ? 1536 : 2048; benchCanvas.height = Math.round(benchCanvas.width * BD / BW);
const bench2d = benchCanvas.getContext('2d');
// A second canvas carries height and wear for the bump and roughness maps.
const benchHCanvas = document.createElement('canvas');
benchHCanvas.width = benchCanvas.width; benchHCanvas.height = benchCanvas.height;
function paintBench() {
  const g = bench2d, W = benchCanvas.width, H = benchCanvas.height, px = W / BW;   // pixels per unit
  const img = g.createImageData(W, H), d = img.data;
  const himg = benchHCanvas.getContext('2d').createImageData(W, H), hd = himg.data;
  // Planks of slightly different widths, each sawn from its own log: its own pith line, colour and ring spacing.
  const edges = [0];
  while (edges[edges.length - 1] < H) edges.push(edges[edges.length - 1] + px * (0.85 + Math.random() * 0.4));
  edges[edges.length - 1] = H;
  for (let p = 0; p + 1 < edges.length; p++) {
    const y0 = Math.round(edges[p]), y1 = Math.round(edges[p + 1]), s = p * 17 + 3;
    const tone = 0.86 + Math.random() * 0.26, warm = Math.random() * 0.08;
    const pith = (y0 + y1) / 2 + (Math.random() - 0.5) * (y1 - y0) * 1.4;
    const peak = Math.random() * W, arch = 1.4 + Math.random() * 2.2, rings = 3.5 + Math.random() * 3;
    for (let y = y0; y < y1; y++) {
      for (let x = 0; x < W; x++) {
        const ux = x / px, uy = (y - pith) / px;
        // Flat-sawn grain: growth rings cut at a shallow angle make long arches ("cathedrals").
        const warp = (fbm(ux * 0.35, uy * 2.2, s, 3) - 0.5) * 0.5;
        const along = (x - peak) / W;
        const rc = Math.abs(uy + warp * 0.6) + along * along * arch + warp * 0.15;
        const ring = (rc * rings) % 1;
        const late = smooth(0.62, 0.9, ring) * (1 - smooth(0.93, 1, ring));
        // Open pores in the latewood and fine streaks running with the grain.
        const streak = vnoise(ux * 2.2, uy * 70, s + 5);
        const pore = late * (streak > 0.7 ? 0.25 : 0) + (vnoise(ux * 40, uy * 160, s + 9) > 0.86 ? 0.12 : 0);
        const broad = fbm(ux * 0.4, uy * 0.8, s + 11, 3);
        const v = tone * (0.74 + 0.36 * broad) * (1 - 0.2 * late - pore * 0.7) * (0.93 + 0.1 * streak);
        const k = (y * W + x) * 4;
        d[k] = 128 * v * (1 + warm); d[k + 1] = 86 * v; d[k + 2] = 50 * v * (1 - warm); d[k + 3] = 255;
        const hgt = 150 - 50 * late - 120 * pore + 20 * streak;
        hd[k] = hd[k + 1] = hd[k + 2] = hgt; hd[k + 3] = 255;
      }
    }
  }
  g.putImageData(img, 0, 0);
  const h2 = benchHCanvas.getContext('2d');
  h2.putImageData(himg, 0, 0);
  // Joints between planks: a dark gap with a softened arris either side.
  for (let p = 1; p + 1 < edges.length; p++) {
    const y = edges[p];
    for (const [c, ctx] of [['rgba(10,6,3,0.92)', g], ['rgba(0,0,0,1)', h2]]) { ctx.fillStyle = c; ctx.fillRect(0, y - 2.5, W, 5); }
    g.fillStyle = 'rgba(255,230,190,0.08)'; g.fillRect(0, y + 2.5, W, 2);
    h2.fillStyle = 'rgba(40,40,40,0.6)'; h2.fillRect(0, y - 6, W, 3); h2.fillRect(0, y + 3, W, 3);
  }
  // Years of use: grime and oil soaked in, rings left by cans, scratches and the odd dent.
  g.globalCompositeOperation = 'multiply';
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = px * (0.2 + Math.random() * 1.4);
    const rg = g.createRadialGradient(x, y, 0, x, y, r), a = 0.12 + Math.random() * 0.3;
    rg.addColorStop(0, `rgba(70,48,30,${a})`); rg.addColorStop(1, 'rgba(70,48,30,0)');
    g.fillStyle = rg; g.beginPath(); g.ellipse(x, y, r * (1 + Math.random()), r, Math.random() * 3, 0, Math.PI * 2); g.fill();
  }
  for (let i = 0; i < 3; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = px * (0.3 + Math.random() * 0.25);
    g.strokeStyle = 'rgba(60,40,24,0.14)'; g.lineWidth = 2 + Math.random() * 3; g.filter = 'blur(2px)';
    g.beginPath(); g.arc(x, y, r, Math.random() * 6, Math.random() * 6 + 4.5); g.stroke();
  }
  g.filter = 'none';
  g.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * W, y = Math.random() * H, l = px * (0.05 + Math.random() * 0.6), a = Math.random() * Math.PI;
    const light = Math.random() < 0.6;
    g.strokeStyle = light ? `rgba(230,190,140,${0.05 + Math.random() * 0.12})` : `rgba(30,18,8,${0.08 + Math.random() * 0.15})`;
    g.lineWidth = 0.6 + Math.random() * 1.2;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + (Math.random() - 0.5) * 10, y + Math.sin(a) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    h2.strokeStyle = 'rgba(60,60,60,0.5)'; h2.lineWidth = 1.2;
    h2.beginPath(); h2.moveTo(x, y); h2.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); h2.stroke();
  }
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = 2 + Math.random() * 7;
    const rg = h2.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(40,40,40,0.8)'); rg.addColorStop(1, 'rgba(40,40,40,0)');
    h2.fillStyle = rg; h2.beginPath(); h2.arc(x, y, r, 0, Math.PI * 2); h2.fill();
  }
}
paintBench();

      // Steel nobody has worked yet carries dull grey-black mill scale; the abrasives cut through to bright metal.
      float worked = clamp(max(max(wheel, sanded), shine) * 1.4, 0.0, 1.0);
      steel *= mix(0.42, 1.0, worked);
      steel *= 1.0 - 0.62 * pit;
      steel *= 1.0 - 0.4 * stamp * (1.0 - 0.6 * shine);
      float rough = 0.52 + 0.12 * forge;
      rough = mix(rough, 0.28 + 0.34 * swirl, wheel);
      rough = mix(rough, 0.16 + 0.18 * lin, sanded);
      rough = mix(rough, 0.025 + 0.03 * lin * (1.0 - sanded), shine * shine);
      rough = max(rough, pit * 0.6);
      // Compound haze from the polisher, smeared in arcs until it is wiped.
      float smear = 0.65 + 0.35 * swirl;
      steel = mix(steel, vec3(0.05, 0.05, 0.055), haze * smear * 0.85);
      rough = mix(rough, 0.6, haze * 0.85);

      float tone = fbm3(q * 6.0 + 7.0, 4), flake = fbm3(q * 42.0, 3), grit = n3(q * 150.0) * 0.6 + n3(q * 310.0) * 0.4;
      vec3 rBlack = vec3(0.04, 0.022, 0.016), rDark = vec3(0.15, 0.055, 0.024), rMid = vec3(0.38, 0.14, 0.04), rHi = vec3(0.6, 0.29, 0.08);
      vec3 rustCol = mix(rDark, rMid, smoothstep(0.28, 0.72, tone * 0.7 + flake * 0.3));
      rustCol = mix(rustCol, rHi, smoothstep(0.7, 0.95, flake) * 0.8 * heavy);
      rustCol = mix(rustCol, rBlack, smoothstep(0.62, 0.95, pitN + (1.0 - tone) * 0.3) * 0.55);
      rustCol *= (0.55 + 0.55 * rust * (0.7 + 0.6 * flake)) * (0.78 + 0.44 * grit);
      float cover = smoothstep(0.05, 0.42, rust);
      float stain = smoothstep(0.0, 0.1, rust) * (1.0 - cover);
      // Thin oxide between the crusts: a dark brown-grey film, not bright metal.
      vec3 film = vec3(0.13, 0.085, 0.055) * (0.8 + 0.4 * tone);
      vec3 col = mix(steel, film, stain * 0.9);
      col = mix(col, rustCol, cover);
      cMetal = (1.0 - cover) * (1.0 - 0.65 * stain);
      rough = mix(rough, 0.95, cover);
      rough = min(1.0, rough + 0.3 * stain);
      // The remover: wet rust darkens and shines, softened rust goes sludgy orange.
      col = mix(col, col * vec3(1.3, 1.02, 0.8), softened * cover * 0.55);
      col *= 1.0 - 0.45 * wetness * cover - 0.12 * wetness * (1.0 - cover);
      rough = mix(rough, 0.14, wetness * 0.85);
      cRough = rough;
      cH = rust * (0.4 + 0.4 * flake + 0.35 * grit) * (1.0 - 0.5 * softened) * 1.3
         - pit * 0.9 * (1.0 - cover)
         - stamp * 0.9
         + (swirl * wheel * (1.0 - sanded) + lin * sanded) * (1.0 - shine) * 0.2;
      diffuseColor.rgb = col;`)
    .replace('#include <roughnessmap_fragment>', 'float roughnessFactor = cRough;')
    .replace('#include <metalnessmap_fragment>', 'float metalnessFactor = cMetal;')
    .replace('#include <normal_fragment_maps>', `
      vec2 dHdxy = vec2(dFdx(cH), dFdy(cH)) * 0.05;
      normal = perturbNormalArb(-vViewPosition, normal, dHdxy, faceDirection);`);
};

function loadItem(name, fresh = true) {
  itemName = name;
  for (const b of document.querySelectorAll('.items [data-item]')) b.setAttribute('aria-pressed', String(b.dataset.item === name));
  if (mesh) { holder.remove(mesh); mesh.geometry.dispose(); }
  if (V) { V.texA.dispose(); V.texB.dispose(); }
  const { geo, stamp } = BUILDERS[name]();
  V = makeVolume(geo);
  // Each piece's stamp canvas is a different size; free the old GPU storage so the new one isn't
  // copied into a texture allocated for the previous size (GL_INVALID_VALUE: offset overflows).
  stampTex.dispose(); stampTex.image = stamp.canvas; stampTex.needsUpdate = true;
  U.uStamp.value.set(...stamp.rect);
  U.tA.value = V.texA; U.tB.value = V.texB;
  U.uMin.value.copy(V.min); U.uSize.value.copy(V.size);
  const seed = Math.random() * 100;
  U.uSeed.value.set(seed, seed * 0.37, seed * 0.71);
  mesh = new THREE.Mesh(geo, steelMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  holder.add(mesh);
  radius = geo.boundingSphere.radius;
  samples = sampleSurface(geo, 30000);
  wetList = [];
  restored = false;
  if (fresh) { holder.quaternion.identity(); spin.set(0, 0); }
  frameCamera();
}

function knurled(r0, r1, h, ridges, segs = 64) {
  const g = new THREE.CylinderGeometry(r0, r1, h, segs, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), r = Math.hypot(x, z);
    if (r < 1e-4) continue;
    const k = 1 + 0.06 * Math.max(0, Math.cos(Math.atan2(z, x) * ridges));
    p.setX(i, x * k); p.setZ(i, z * k);
  }
  g.computeVertexNormals();
  return g;
}
const lathe = (profile, segs = 64) => new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), segs);
function labelTexture(lines, bg, fg, w = 1024, h = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  for (const [text, x, y, size, color = fg, weight = 800] of lines) {
    g.fillStyle = color; g.font = `${weight} ${size}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if ('letterSpacing' in g) g.letterSpacing = `${size * 0.08}px`;
    g.fillText(text, x * w, y * h);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  return { t, g };
}
// Fine surface grain for moulded plastic and rubber, so tools do not read as smooth CG.
const grainTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;

  for (let i = 0; i < img.data.length; i += 4) { const v = 110 + Math.random() * 40; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);

})();

const clamp255 = x => x < 0 ? 0 : x > 255 ? 255 : x;

// Visit the voxels near the hit, in a disc flattened along the surface normal so a tool on

  const j0 = Math.max(0, Math.floor(cj - r * sy)), j1 = Math.min(V.ny - 1, Math.ceil(cj + r * sy));

        tmp.addScaledVector(worldN, -tmp.dot(worldN)).add(p);
        const flight = 0.12 + Math.random() * 0.06, k = 1 / flight;
        emit(fine, { x: from.x, y: from.y, z: from.z, vx: (tmp.x - from.x) * k, vy: (tmp.y - from.y) * k, vz: (tmp.z - from.z) * k, life: flight + 0.02, s: 0.0075, r: 0.92, g: 0.68, b: 0.48, a: 0.42, type: 'mist' });
      }
    } else if (tool === 'wheel') {
      // Thrown off the bottom of the wheel, toward the user, along the direction it spins.
      tmp.copy(camera.position).sub(p);
      bz.copy(tmp).addScaledVector(worldN, -tmp.dot(worldN)).normalize();
      const dust = Math.round(contact.rust * 28), spark = Math.round(contact.metal * 8 + contact.rust * 3);
      for (let i = 0; i < dust; i++) {
        const sp = 0.8 + Math.random() * 2;
        emit(fine, { x: p.x, y: p.y, z: p.z, vx: bz.x * sp + worldN.x + (Math.random() - 0.5) * 1.5, vy: bz.y * sp + worldN.y * (0.6 + Math.random()), vz: bz.z * sp + worldN.z + (Math.random() - 0.5) * 1.5,
          life: 2, s: 0.006 + Math.random() * 0.008, r: 0.4 + Math.random() * 0.15, g: 0.17 + Math.random() * 0.06, b: 0.06, a: 0.95, type: 'dust' });
      }
      for (let i = 0; i < spark; i++) {
        const sp = 2.6 + Math.random() * 3.4;
        emit(sparks, { x: p.x, y: p.y, z: p.z, vx: bz.x * sp + (Math.random() - 0.5) * 2, vy: bz.y * sp + 0.6 + Math.random() * 1.4, vz: bz.z * sp + (Math.random() - 0.5) * 2,
          life: 0.25 + Math.random() * 0.35, s: 0.01 + Math.random() * 0.008, r: 5, g: 2.4, b: 0.7, a: 1, type: 'spark' });
      }
    } else if (tool === 'sand' && Math.random() < 0.7 && (contact.rust || contact.metal)) {
      for (let i = 0; i < 4; i++) {
        const red = contact.rust > contact.metal;
        emit(fine, { x: p.x + (Math.random() - 0.5) * 0.24, y: p.y, z: p.z + (Math.random() - 0.5) * 0.24, vx: (Math.random() - 0.5) * 0.5, vy: 0.15 + Math.random() * 0.25, vz: (Math.random() - 0.5) * 0.5,
          life: 2, s: 0.005, r: red ? 0.45 : 0.62, g: red ? 0.21 : 0.62, b: red ? 0.08 : 0.62, a: 0.75, type: 'dust' });
      }
    }
  }
  // Fizz: small bubbles rise where the remover sits on rust, on any face.
  if (fizz > 0.002 && wetList.length) {
    const A = V.A, tries = Math.min(70, Math.round(fizz * 900));
    for (let i = 0; i < tries; i++) {
      const s = (Math.random() * samples.idx.length) | 0, o = samples.idx[s] * 4;
      if (Math.random() > A[o + 1] / 255 * (A[o] < 230 ? 1 : 0)) continue;
      tmp.fromArray(samples.p, s * 3);
      mesh.localToWorld(tmp);
      emit(fine, { x: tmp.x, y: tmp.y, z: tmp.z, vx: 0, vy: 0, vz: 0, life: 0.6 + Math.random() * 1.2, s: 0.005 + Math.random() * 0.009, r: 0.95, g: 0.88, b: 0.76, a: -0.75, type: 'bubble' });
    }
  }
  stepParticles(fine, dt);
  stepParticles(sparks, dt);

  if (S) {
    const on = down && !!at;
    level('drillHum', tool === 'wheel' && on ? 0.05 : 0);
    S.drill.frequency.setTargetAtTime(tool === 'wheel' && working ? 104 : 118, audio.currentTime, 0.08);
    level('grit', tool === 'wheel' ? 0.32 * contact.rust : 0, 0.03);
    level('ping', tool === 'wheel' ? 0.09 * contact.metal : 0, 0.03);
    level('sandHum', tool === 'sand' && on ? 0.035 : 0);
    level('scrape', tool === 'sand' && working ? 0.05 + 0.2 * (contact.metal + contact.rust) : 0, 0.03);
    level('whir', tool === 'polish' && on ? 0.06 : 0);
    level('buff', tool === 'polish' && working ? 0.1 * contact.metal : 0);
    level('swish', tool === 'wipe' && working ? 0.12 * Math.min(1, speed / 1.2) : 0, 0.03);
    level('hiss', tool === 'spray' && on ? 0.12 : 0, 0.02);
    level('fizz', Math.min(0.06, fizz * 0.5) * (0.6 + 0.4 * Math.random()), 0.05);
  }

  uploadVolume();
  if (benchDirty) { benchTex.needsUpdate = true; benchDirty = false; }
  statsClock += dt;
  if (statsClock > 0.4) { statsClock = 0; stats(); }
  grain.uniforms.uTime.value = t % 100;
  composer.render();
  requestAnimationFrame(frame);
}

function stepParticles(L, dt) {
  const list = L.list;
  let w = 0;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    p.life -= dt;
    if (p.type === 'bubble') p.s += dt * 0.004;
    else {
      if (p.type !== 'mist') p.vy -= 9.8 * dt;
      const drag = p.type === 'dust' ? 0.985 : 0.99;
      p.vx *= drag; p.vz *= drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.type === 'spark' && p.y < 0.002) { p.y = 0.002; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; }
      if (p.type === 'dust' && p.y < 0.001) { dustOnBench(p.x, p.z, 0.5); p.life = 0; }
      if (p.type === 'mist' && p.life < 0.05) p.life = 0;
    }
    if (p.life > 0) list[w++] = p;
  }
  list.length = w;
  const n = Math.min(w, MAXP);
  for (let i = 0; i < n; i++) {
    const p = list[i], k = i * 3, c = i * 4;
    L.pos[k] = p.x; L.pos[k + 1] = p.y; L.pos[k + 2] = p.z;
    const fade = p.type === 'spark' || p.type === 'bubble' ? Math.min(1, p.life / 0.15) : 1;
    L.col[c] = p.r; L.col[c + 1] = p.g; L.col[c + 2] = p.b; L.col[c + 3] = p.a * fade;
    L.size[i] = p.s;
  }
  L.g.setDrawRange(0, n);
  L.g.attributes.position.needsUpdate = L.g.attributes.color.needsUpdate = L.g.attributes.size.needsUpdate = true;
}

// ───────────────────────────── Start ─────────────────────────────

const params = new URLSearchParams(location.search);
resize();
loadItem(params.get('item') in BUILDERS ? params.get('item') : 'wrench');
if (params.has('demo')) {
  // Preview: the right half fully restored, so before and after sit side by side.
  const A = V.A, B = V.B;
  for (let k = 0; k < V.nz; k++) for (let j = 0; j < V.ny; j++) for (let i = 0; i < V.nx; i++) {
    const x = V.min.x + (i + 0.5) / V.nx * V.size.x, t = smooth(-0.08, 0.08, x), o = ((k * V.ny + j) * V.nx + i) * 4;
    A[o] = 255 * t; B[o + 1] = 255 * t; B[o + 2] = 255 * t; B[o] = 255 * smooth(-0.25, -0.1, x) * (1 - t);
  }
  V.texA.needsUpdate = V.texB.needsUpdate = true;
  holder.quaternion.setFromAxisAngle(axisY, -0.25);
}
requestAnimationFrame(frame);
</script>
