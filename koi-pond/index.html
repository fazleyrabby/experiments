<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koi Pond in the Rain</title>
<meta name="description" content="A tranquil, interactive koi pond in the rain — procedural water, fish, weather and sound.">
<meta name="theme-color" content="#0c1614">
<style>
  :root{
    --glass: rgba(16, 26, 24, .42);
    --glass-hi: rgba(255,255,255,.10);
    --line: rgba(255,255,255,.13);
    --text: rgba(242,247,244,.94);
    --muted: rgba(226,236,231,.66);
    --radius: 18px;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#0b1513;color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased; touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #fx{cursor:default}
  .ui{transition:opacity .7s ease, transform .7s ease, filter .7s ease}
  body.clean .ui{opacity:0;pointer-events:none;filter:blur(4px)}
  body.clean .dock{transform:translate(-50%, 14px)}
  body.clean #fx{cursor:none}

  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--line);
    box-shadow:0 12px 40px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .back{
    position:fixed; z-index:5;
    top:calc(env(safe-area-inset-top, 0px) + 16px); left:calc(env(safe-area-inset-left, 0px) + 16px);
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 14px;border-radius:999px;color:var(--text);text-decoration:none;
    font-size:13px;font-weight:550;letter-spacing:.01em;
  }
  .back:hover{background:rgba(30,44,40,.55)}
  .back:focus-visible,.chip:focus-visible{outline:2px solid rgba(190,240,215,.7);outline-offset:2px}
  .caption{
    position:fixed;z-index:5;
    top:calc(env(safe-area-inset-top, 0px) + 62px); left:calc(env(safe-area-inset-left, 0px) + 22px);
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    text-shadow:0 1px 8px rgba(0,0,0,.45);pointer-events:none;
  }
  .dock{
    position:fixed;z-index:5;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);
    display:flex;align-items:center;gap:4px;padding:6px;border-radius:22px;
    max-width:calc(100vw - 24px);
  }
  .group{display:flex;gap:3px;align-items:center}
  .sep{width:1px;align-self:stretch;background:var(--line);margin:6px 5px}
  .chip{
    appearance:none;border:0;background:transparent;color:var(--muted);
    font:inherit;font-size:13px;font-weight:550;line-height:1;
    padding:10px 12px;border-radius:16px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
    transition:background .25s ease,color .25s ease, box-shadow .25s ease, transform .15s ease;
  }
  .chip .e{font-size:15px;line-height:1;filter:saturate(.9)}
  .chip:hover{background:rgba(255,255,255,.08);color:var(--text)}
  .chip:active{transform:scale(.96)}
  .chip.active{background:var(--glass-hi);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16), 0 4px 14px rgba(0,0,0,.18)}
  .chip.off{color:rgba(226,236,231,.45)}
  .only-touch{display:none}
  .hint{
    position:fixed;z-index:4;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 86px);
    padding:8px 14px;border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap;
    transition:opacity 1.2s ease;pointer-events:none;
  }
  .hint kbd{font:inherit;font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
  .hint.gone{opacity:0}
  .restore{
    position:fixed;z-index:6;top:calc(env(safe-area-inset-top, 0px) + 10px);left:calc(env(safe-area-inset-left, 0px) + 10px);
    width:44px;height:44px;border-radius:50%;border:0;background:transparent;opacity:0;pointer-events:none;
  }
  body.clean .restore{pointer-events:auto}
  @media (pointer:coarse){
    .only-touch{display:inline-flex}
    body.clean .restore{opacity:.35;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
    .hint .k{display:none}
  }
  @media (max-width:720px){
    .dock{flex-wrap:wrap;justify-content:center;width:calc(100vw - 20px);max-width:430px;border-radius:20px;gap:2px}
    .sep{display:none}
    .group{width:100%;justify-content:space-between}
    .group + .group{border-top:1px solid var(--line);padding-top:3px;margin-top:2px}
    .chip{padding:10px 9px;font-size:12.5px;flex:1;justify-content:center}
    .weather .chip .l{display:none}
    .weather .chip .e{font-size:18px}
    .caption{display:none}
    .hint{bottom:calc(env(safe-area-inset-bottom, 0px) + 128px)}
  }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" aria-label="Koi pond. Tap to feed the fish, drag to stir the water."></canvas>

<a class="back glass ui" href="/">← Experiments</a>
<div class="caption ui">Koi Pond in the Rain</div>

<nav class="dock glass ui" aria-label="Pond controls">
  <div class="group weather" role="radiogroup" aria-label="Weather">
    <button class="chip active" data-preset="drizzle" role="radio" aria-checked="true" title="Gentle Drizzle (1)"><span class="e">🌧️</span><span class="l">Drizzle</span></button>
    <button class="chip" data-preset="heavy" role="radio" aria-checked="false" title="Heavy Rain (2)"><span class="e">⛈️</span><span class="l">Heavy Rain</span></button>
    <button class="chip" data-preset="sun" role="radio" aria-checked="false" title="Dappled Sun (3)"><span class="e">☀️</span><span class="l">Dappled Sun</span></button>
    <button class="chip" data-preset="night" role="radio" aria-checked="false" title="Moonlit Night (4)"><span class="e">🌙</span><span class="l">Moonlit Night</span></button>
  </div>
  <div class="sep"></div>
  <div class="group actions">
    <button class="chip" id="btnFeed" title="Scatter food (F)"><span class="e">🍃</span><span class="l">Feed</span></button>
    <button class="chip" id="btnSound" aria-pressed="true" title="Sound (M)"><span class="e">🔊</span><span class="l">Sound</span></button>
    <button class="chip" id="btnClean" title="Clear uneaten food (C)"><span class="e">🧹</span><span class="l">Clean Feed</span></button>
    <button class="chip only-touch" id="btnHide" title="Clean view (H)" aria-label="Hide controls"><span class="e">◐</span></button>
  </div>
</nav>
<div class="hint glass ui" id="hint">Tap to feed · Drag to stir<span class="k"> · <kbd>H</kbd> hides controls</span></div>
<button class="restore" id="restore" aria-label="Show controls"></button>

<script>
(() => {
'use strict';

/* =========================================================================
   Utilities
   ========================================================================= */
const TAU = Math.PI * 2;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// 2D gradient noise
const PERM = new Uint8Array(512);
{ const p = new Uint8Array(256); for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; }
const GX = [1, -1, 1, -1, 1, -1, 0, 0], GY = [1, 1, -1, -1, 0, 0, 1, -1];
function noise2(x, y) {
  const X = Math.floor(x), Y = Math.floor(y), xf = x - X, yf = y - Y, xi = X & 255, yi = Y & 255;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = PERM[xi + PERM[yi]] & 7, b = PERM[xi + 1 + PERM[yi]] & 7, c = PERM[xi + PERM[yi + 1]] & 7, d = PERM[xi + 1 + PERM[yi + 1]] & 7;
  const n00 = GX[a] * xf + GY[a] * yf, n10 = GX[b] * (xf - 1) + GY[b] * yf;
  const n01 = GX[c] * xf + GY[c] * (yf - 1), n11 = GX[d] * (xf - 1) + GY[d] * (yf - 1);
  return lerp(lerp(n00, n10, u), lerp(n01, n11, u), v);
}

/* =========================================================================
   Weather presets (all numeric — cross-faded every frame)
   ========================================================================= */
const PRESETS = {
  drizzle: {
    tint: [0.44, 0.56, 0.50], tintAmt: 0.40, exposure: 0.95,
    caustic: 0.20, causticCol: [0.86, 1.0, 0.92], spec: 0.30, sky: [0.64, 0.71, 0.69], reflect: 0.12,
    mist: 0.07, mistCol: [0.66, 0.73, 0.71], beams: 0, dapple: 0, moon: 0, lantern: 0, stars: 0,
    vignette: 0.50, refract: 15, light: [-0.55, -0.83],
    rain: 5.0, dropStr: 1.0, ringAlpha: 0.36, ringCol: [228, 238, 234], wind: [0.12, 0.04],
    streaks: 0, splash: 0.08, shadow: 0.34, padShadow: 0.36, damp: 0.988,
    grade: [34, 52, 48], gradeAmt: 0.16, fireflies: 0, glow: 0,
    a_rain: 0.30, a_rainLow: 0.10, a_hiss: 0.03, a_breeze: 0.10, a_drone: 0.16, a_crickets: 0, a_plink: 0.75,
  },
  heavy: {
    tint: [0.30, 0.38, 0.43], tintAmt: 0.56, exposure: 0.78,
    caustic: 0.05, causticCol: [0.8, 0.9, 1.0], spec: 0.22, sky: [0.54, 0.60, 0.65], reflect: 0.22,
    mist: 0.30, mistCol: [0.60, 0.67, 0.71], beams: 0, dapple: 0, moon: 0, lantern: 0, stars: 0,
    vignette: 0.62, refract: 19, light: [-0.55, -0.83],
    rain: 34, dropStr: 1.3, ringAlpha: 0.28, ringCol: [205, 216, 224], wind: [0.95, 0.35],
    streaks: 1, splash: 0.75, shadow: 0.16, padShadow: 0.2, damp: 0.982,
    grade: [30, 40, 50], gradeAmt: 0.30, fireflies: 0, glow: 0,
    a_rain: 0.55, a_rainLow: 0.36, a_hiss: 0.20, a_breeze: 0.30, a_drone: 0.13, a_crickets: 0, a_plink: 0.35,
  },
  sun: {
    tint: [0.30, 0.62, 0.58], tintAmt: 0.24, exposure: 1.10,
    caustic: 1.0, causticCol: [1.0, 0.93, 0.72], spec: 0.95, sky: [0.84, 0.92, 0.95], reflect: 0.05,
    mist: 0, mistCol: [0.9, 0.9, 0.85], beams: 0.6, dapple: 0.55, moon: 0, lantern: 0, stars: 0,
    vignette: 0.36, refract: 12, light: [-0.55, -0.83],
    rain: 0.10, dropStr: 0.9, ringAlpha: 0.42, ringCol: [255, 250, 236], wind: [0.08, 0.02],
    streaks: 0, splash: 0.15, shadow: 0.58, padShadow: 0.58, damp: 0.99,
    grade: [255, 226, 170], gradeAmt: 0.06, fireflies: 0, glow: 0,
    a_rain: 0.0, a_rainLow: 0.0, a_hiss: 0.0, a_breeze: 0.17, a_drone: 0.12, a_crickets: 0, a_plink: 1.0,
  },
  night: {
    tint: [0.10, 0.22, 0.34], tintAmt: 0.62, exposure: 0.44,
    caustic: 0.10, causticCol: [0.7, 0.82, 1.0], spec: 0.28, sky: [0.09, 0.13, 0.23], reflect: 0.24,
    mist: 0.08, mistCol: [0.18, 0.24, 0.36], beams: 0, dapple: 0, moon: 1, lantern: 1, stars: 1,
    vignette: 0.72, refract: 14, light: [-0.4, -0.9],
    rain: 0.35, dropStr: 0.9, ringAlpha: 0.30, ringCol: [176, 196, 232], wind: [0.05, 0.02],
    streaks: 0, splash: 0.08, shadow: 0.24, padShadow: 0.3, damp: 0.989,
    grade: [9, 17, 36], gradeAmt: 0.64, fireflies: 1, glow: 1,
    a_rain: 0.04, a_rainLow: 0.02, a_hiss: 0.0, a_breeze: 0.08, a_drone: 0.20, a_crickets: 1, a_plink: 0.8,
  },
};
const clonePreset = (p) => JSON.parse(JSON.stringify(p));
let presetName = 'drizzle';
const P = clonePreset(PRESETS.drizzle);   // current (interpolated)
let T = PRESETS.drizzle;                    // target
function stepPreset(dt) {
  const k = 1 - Math.exp(-dt * 0.9);
  for (const key in T) {
    const t = T[key];
    if (Array.isArray(t)) { const a = P[key]; for (let i = 0; i < t.length; i++) a[i] += (t[i] - a[i]) * k; }
    else P[key] += (t - P[key]) * k;
  }
}

/* =========================================================================
   View / canvases
   ========================================================================= */
const glCanvas = document.getElementById('gl');
const fx = document.getElementById('fx');
const fctx = fx.getContext('2d');
const view = { W: 0, H: 0, dpr: 1, sceneScale: 1, fxScale: 1, glScale: 1, minDim: 0, depthPx: 24 };
const scene = document.createElement('canvas'); const sctx = scene.getContext('2d');
const SH = 0.2; // shadow buffer scale (css px -> px)
const shF = document.createElement('canvas'); const shFctx = shF.getContext('2d');
const shP = document.createElement('canvas'); const shPctx = shP.getContext('2d');
let bed = null;
const SHADOW_DIR = { x: 0.55, y: 0.84 };

/* =========================================================================
   Water height field (CPU, wave equation) -> normal texture for WebGL
   ========================================================================= */
const water = {
  cell: 4, gw: 0, gh: 0, a: null, b: null, tex: null, acc: 0,
  init(W, H) {
    this.cell = Math.max(3, Math.max(W, H) / 300);
    this.gw = Math.ceil(W / this.cell) + 3; this.gh = Math.ceil(H / this.cell) + 3;
    const n = this.gw * this.gh;
    this.a = new Float32Array(n); this.b = new Float32Array(n);
    this.tex = new Uint8ClampedArray(n * 4); this.tex.fill(128);
  },
  disturb(x, y, r, s) {
    const c = this.cell, gw = this.gw, gx = x / c + 1, gy = y / c + 1, rc = Math.max(1.25, r / c);
    const x0 = Math.max(1, Math.floor(gx - rc)), x1 = Math.min(gw - 2, Math.ceil(gx + rc));
    const y0 = Math.max(1, Math.floor(gy - rc)), y1 = Math.min(this.gh - 2, Math.ceil(gy + rc));
    const a = this.a;
    for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) {
      const dx = i - gx, dy = j - gy, d = Math.sqrt(dx * dx + dy * dy);
      if (d < rc) a[j * gw + i] += s * (0.5 + 0.5 * Math.cos(Math.PI * d / rc));
    }
  },
  step(damp) {
    const gw = this.gw, gh = this.gh, a = this.a, b = this.b, c2 = 0.32;
    for (let j = 1; j < gh - 1; j++) {
      const end = j * gw + gw - 1;
      for (let i = j * gw + 1; i < end; i++) {
        const cur = a[i];
        b[i] = (2 * cur - b[i] + c2 * (a[i - 1] + a[i + 1] + a[i - gw] + a[i + gw] - 4 * cur)) * damp;
      }
    }
    this.a = b; this.b = a;
  },
  height(x, y) {
    const c = this.cell, gw = this.gw;
    let fx_ = x / c + 1, fy = y / c + 1;
    fx_ = clamp(fx_, 0, gw - 1.001); fy = clamp(fy, 0, this.gh - 1.001);
    const i = fx_ | 0, j = fy | 0, u = fx_ - i, v = fy - j, k = j * gw + i, a = this.a;
    return lerp(lerp(a[k], a[k + 1], u), lerp(a[k + gw], a[k + gw + 1], u), v);
  },
  grad(x, y, out) {
    const c = this.cell;
    out.x = (this.height(x + c, y) - this.height(x - c, y)) * 0.5;
    out.y = (this.height(x, y + c) - this.height(x, y - c)) * 0.5;
  },
  encode() {
    const gw = this.gw, gh = this.gh, a = this.a, t = this.tex, K = 420, HK = 220;
    for (let j = 1; j < gh - 1; j++) {
      const end = j * gw + gw - 1;
      for (let i = j * gw + 1; i < end; i++) {
        const o = i << 2;
        t[o] = 128 + (a[i + 1] - a[i - 1]) * K;
        t[o + 1] = 128 + (a[i + gw] - a[i - gw]) * K;
        t[o + 2] = 128 + a[i] * HK;
        t[o + 3] = 255;
      }
    }
  },
};

/* =========================================================================
   WebGL compositor: refraction, caustics, reflections, light, mist
   ========================================================================= */
const VERT = `attribute vec2 aPos; varying vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; vUv.y = 1.0 - vUv.y; gl_Position = vec4(aPos,0.0,1.0); }`;
const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform sampler2D uScene, uNorm;
uniform vec2 uRes, uGridScale, uGridOff, uMoonPos, uLanternPos, uWind, uLight;
uniform float uTime, uTintAmt, uExposure, uCaustic, uSpec, uReflect, uMist, uBeams, uDapple, uMoon, uLantern, uStars, uVignette, uRefract, uAspect;
uniform vec3 uTint, uCausticCol, uSky, uMistCol;

vec2 hash2(vec2 p){ p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3))); return -1.0 + 2.0*fract(sin(p)*43758.5453); }
float hash1(vec2 p){ return fract(sin(dot(p, vec2(41.31, 289.17)))*45758.5453); }
float gnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(dot(hash2(i),f), dot(hash2(i+vec2(1.0,0.0)),f-vec2(1.0,0.0)),u.x),
             mix(dot(hash2(i+vec2(0.0,1.0)),f-vec2(0.0,1.0)), dot(hash2(i+vec2(1.0,1.0)),f-vec2(1.0,1.0)),u.x),u.y);
}
float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<4;i++){ s+=a*gnoise(p); p = mat2(1.6,1.2,-1.2,1.6)*p + 3.1; a*=0.5; } return s; }
float caustics(vec2 p, float t){
  vec2 w = vec2(gnoise(p*0.5 + vec2(t*0.07, 1.3)), gnoise(p*0.5 + vec2(4.7, -t*0.06)));
  p += w*1.7;
  float n1 = gnoise(p + vec2(t*0.23, -t*0.11));
  float n2 = gnoise(p*1.43 + vec2(-t*0.15, t*0.2) + 11.7);
  float c1 = 1.0 - smoothstep(0.0, 0.15, abs(n1));
  float c2 = 1.0 - smoothstep(0.0, 0.12, abs(n2));
  return c1*c1 + c2*c2*0.8;
}
void main(){
  vec2 uv = vUv;
  vec2 px = uv*uRes;
  vec2 asp = vec2(uAspect, 1.0);
  vec4 nt = texture2D(uNorm, uv*uGridScale + uGridOff);
  vec2 n = (nt.rg - 0.5)*2.0;
  float wl = length(uWind);
  if (wl > 0.02) {
    vec2 q = px*0.028 - uWind*uTime*2.2;
    n += vec2(gnoise(q), gnoise(q + 17.3))*wl*0.2;
  }
  vec2 off = n*uRefract/uRes;
  vec3 col;
  col.r = texture2D(uScene, uv + off*1.07).r;
  col.g = texture2D(uScene, uv + off).g;
  col.b = texture2D(uScene, uv + off*0.93).b;

  if (uCaustic > 0.01) {
    float ca = caustics(px/(uRes.y*0.12) + n*0.9, uTime*0.55);
    col += col*ca*uCaustic*uCausticCol*0.95 + ca*uCaustic*uCausticCol*0.035;
  }
  if (uDapple > 0.01) {
    float d = fbm(px/uRes.y*1.6 + vec2(uTime*0.012, -uTime*0.008));
    d = smoothstep(-0.12, 0.2, d);
    col *= mix(1.0, 0.62 + 0.62*d, uDapple);
  }
  col = col*mix(vec3(1.0), uTint*1.65, uTintAmt) + uTint*uTintAmt*0.12;
  if (uBeams > 0.01) {
    vec2 bp = uv*asp;
    float b = dot(bp, vec2(0.74, 0.67))*8.0 + fbm(bp*1.3 + vec2(uTime*0.025, 0.0))*2.6 - uTime*0.07;
    float beam = pow(0.5 + 0.5*sin(b), 6.0);
    col += uBeams*beam*(vec3(1.0,0.84,0.52)*0.12 + col*0.32);
  }
  col *= uExposure;
  if (uLantern > 0.01) {

  if (o.x < m) ax += (m - o.x) * 8; else if (o.x > W - m) ax -= (o.x - (W - m)) * 8;
  if (o.y < m) ay += (m - o.y) * 8; else if (o.y > H - m) ay -= (o.y - (H - m)) * 8;

    const dx = o.x - ob.x, dy = o.y - ob.y, d = Math.hypot(dx, dy) + 1e-3, lim = ob.r + o.r * 0.6;

    this.env(g, t, 0.07, 0.004, 0.07); o.connect(g); g.connect(p); p.connect(this.master); const s = ctx.createGain(); s.gain.value = 0.4; p.connect(s); s.connect(this.verbIn);
    o.start(t); o.stop(t + 0.14);
    this.noiseShot(t + 0.01, 0.06, 'bandpass', 1400, 2.5, 0.05, 0.003, 0.05, null, xn * 1.6 - 0.8);
  },
  swish(vel, xn) {
    if (!this.ok()) return; const t = this.ctx.currentTime; if (t - this.lastSwish < 0.14) return; this.lastSwish = t;
    const b = this.noiseShot(t, 0.6, 'bandpass', 500, 0.9, clamp(vel / 6000, 0.015, 0.11), 0.06, 0.38, null, xn * 1.6 - 0.8);
    b.frequency.setValueAtTime(450, t); b.frequency.exponentialRampToValueAtTime(1300, t + 0.3);
  },
  knock() {
    if (!this.ok()) return; const ctx = this.ctx, t = ctx.currentTime + 0.02;
    const out = ctx.createGain(); out.gain.value = 0.55; const p = this.pan(-0.55); out.connect(p); p.connect(this.master);
    const send = ctx.createGain(); send.gain.value = 1.4; p.connect(send); send.connect(this.verbIn);
    for (const [f, a, d] of [[612, 0.5, 0.42], [1190, 0.22, 0.22], [1745, 0.12, 0.12], [306, 0.32, 0.3]]) {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.985, t + d);
      this.env(g, t, a, 0.002, d); o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.05);
    }
    const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(85, t + 0.12);
    this.env(g, t, 0.4, 0.002, 0.14); o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.2);
    this.noiseShot(t, 0.03, 'bandpass', 2600, 1.2, 0.35, 0.001, 0.025, out);
    const b = this.noiseShot(t + 0.09, 1.2, 'lowpass', 2400, 0.7, 0.14, 0.05, 0.9, null, -0.5);
    b.frequency.setValueAtTime(2400, t + 0.09); b.frequency.exponentialRampToValueAtTime(600, t + 1.0);
  },
  tick(dt) {
    if (!this.ok() || this.cricket < 0.05) return;
    this.cricketT -= dt; if (this.cricketT > 0) return; this.cricketT = rand(0.45, 1.7);
    const ctx = this.ctx, t = ctx.currentTime + 0.02, o = ctx.createOscillator(), g = ctx.createGain(), p = this.pan(rand(-0.8, 0.8));
    o.frequency.value = rand(4300, 4800); g.gain.value = 0;
    const pulses = 3 + (Math.random() * 2 | 0), amp = 0.014 * this.cricket;
    for (let k = 0; k < pulses; k++) { const s = t + k * 0.055; g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(amp, s + 0.008); g.gain.linearRampToValueAtTime(0, s + 0.034); }
    o.connect(g); g.connect(p); p.connect(this.master); o.start(t); o.stop(t + pulses * 0.055 + 0.05);
  },
};

/* =========================================================================
   Interaction
   ========================================================================= */
function feedAt(x, y, n) {
  n = n || 3 + (Math.random() * 3 | 0);
  const tones = ['#b5712f', '#a8622a', '#c28038', '#9c5a24'];
  for (let i = 0; i < n; i++) {
    if (pellets.length > 140) pellets.shift().dead = true;
    const px = x + gauss() * 14, py = y + gauss() * 14;
    pellets.push(floater(px, py, rand(2.4, 3.4), { vx: gauss() * 30, vy: gauss() * 30, k: 0, wave: 900, drag: 1.4, wind: 0.8, stir: 1.1, age: 0, life: rand(55, 75), dead: false, col: tones[Math.random() * tones.length | 0] }));
    addRing(px, py, rand(10, 18), 0.5, rand(0.7, 1.0));
  }
  water.disturb(x, y, 7, -0.4);
  audio.plop(x / view.W);
}
function scatterFeed() {
  const W = view.W, H = view.H, groups = 2 + (Math.random() * 2 | 0);
  for (let g = 0; g < groups; g++) {
    let x, y, tries = 0; do { x = rand(W * 0.2, W * 0.8); y = rand(H * 0.2, H * 0.75); } while ((padAt(x, y) || !validSpot(x, y, 30)) && tries++ < 30);
    setTimeout(() => feedAt(x, y, 4 + (Math.random() * 3 | 0)), g * 180);
  }
}
function cleanFeed() {
  for (const p of pellets) { if (!p.dead) { p.life = Math.min(p.life, p.age + 0.6); } }
  for (const f of fish) f.target = null;
}
function scareAround(x, y, vel) {
  for (const f of fish) {
    const R = f.len * 1.5 + 50, d = Math.hypot(f.x - x, f.y - y), d2 = Math.hypot(f.sx[6] - x, f.sy[6] - y), dm = Math.min(d, d2);
    if (dm < R) f.scare(x, y, (1 - dm / R) * clamp(vel / 900, 0.35, 1.2));
  }
}
const pointers = new Map();
function localXY(e) { const r = fx.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
fx.addEventListener('pointerdown', (e) => {
  audio.unlock(); dismissHint();
  try { fx.setPointerCapture(e.pointerId); } catch (_) {}
  const [x, y] = localXY(e);
  pointers.set(e.pointerId, { x, y, sx: x, sy: y, t: performance.now(), lastV: 0, moved: 0, stirring: false, lastVortex: 0 });
});
fx.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const [x, y] = localXY(e), now = performance.now();
  const dx = x - p.x, dy = y - p.y, d = Math.hypot(dx, dy);
  p.moved += d;
  if (!p.stirring && p.moved > 12) p.stirring = true;
  if (p.stirring && d > 0.5) {
    const dts = Math.max(0.008, (now - p.t) / 1000), vel = Math.min(2400, d / dts);
    const steps = Math.ceil(d / (water.cell * 1.5)), str = clamp(vel / 900, 0.15, 1.2);
    for (let k = 1; k <= steps; k++) { const t = k / steps; water.disturb(lerp(p.x, x, t), lerp(p.y, y, t), 14, -0.5 * str / Math.sqrt(steps)); }
    if (now - p.lastVortex > 28) {
      p.lastVortex = now; if (vortices.length > 40) vortices.shift();
      vortices.push({ x, y, vx: clamp(dx / dts, -1500, 1500), vy: clamp(dy / dts, -1500, 1500), sp: Math.min(1500, vel), r: 110, life: 1.8, age: 0 });
      scareAround(x, y, vel);
    }
    audio.swish(vel, x / view.W);
    p.t = now;
  } else p.t = now;
  p.x = x; p.y = y;
});
function endPointer(e, cancelled) {
  const p = pointers.get(e.pointerId); if (!p) return; pointers.delete(e.pointerId);
  if (!cancelled && !p.stirring) feedAt(p.x, p.y);
}
fx.addEventListener('pointerup', (e) => endPointer(e, false));
fx.addEventListener('pointercancel', (e) => endPointer(e, true));
fx.addEventListener('contextmenu', (e) => e.preventDefault());

// UI
const chips = [...document.querySelectorAll('[data-preset]')];
function setPreset(name) {
  if (!PRESETS[name]) return;
  presetName = name; T = PRESETS[name];
  for (const c of chips) { const on = c.dataset.preset === name; c.classList.toggle('active', on); c.setAttribute('aria-checked', on); }
  audio.applyPreset(T, false);
  document.querySelector('meta[name="theme-color"]').content = name === 'night' ? '#060c16' : name === 'sun' ? '#123a33' : name === 'heavy' ? '#121a1e' : '#0c1614';
}
chips.forEach(c => c.addEventListener('click', () => { audio.unlock(); setPreset(c.dataset.preset); }));
const btnSound = document.getElementById('btnSound');
function setSound(on) {
  audio.setEnabled(on);
  btnSound.setAttribute('aria-pressed', on); btnSound.classList.toggle('off', !on);
  btnSound.querySelector('.e').textContent = on ? '🔊' : '🔇';
  btnSound.querySelector('.l').textContent = on ? 'Sound' : 'Muted';
}
btnSound.addEventListener('click', () => { const was = audio.unlocked; audio.unlock(); setSound(was ? !audio.enabled : true); });
document.getElementById('btnFeed').addEventListener('click', () => { audio.unlock(); scatterFeed(); });
document.getElementById('btnClean').addEventListener('click', () => { audio.unlock(); cleanFeed(); });
const toggleClean = () => document.body.classList.toggle('clean');
document.getElementById('btnHide').addEventListener('click', toggleClean);
document.getElementById('restore').addEventListener('click', toggleClean);
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'h') toggleClean();
  else if (k === '1') setPreset('drizzle'); else if (k === '2') setPreset('heavy'); else if (k === '3') setPreset('sun'); else if (k === '4') setPreset('night');
  else if (k === 'f') scatterFeed(); else if (k === 'c') cleanFeed();
  else if (k === 'm') { setSound(!audio.enabled); }
  else return;
  audio.unlock();
});
const hint = document.getElementById('hint');
let hintGone = false;
function dismissHint() { if (hintGone) return; hintGone = true; setTimeout(() => hint.classList.add('gone'), 2500); }
setTimeout(() => { hintGone = true; hint.classList.add('gone'); }, 9000);
document.addEventListener('visibilitychange', () => {
  if (!audio.ctx) return;
  if (document.hidden) audio.ctx.suspend(); else if (audio.enabled) audio.ctx.resume();
});

/* =========================================================================
   Resize / boot / loop
   ========================================================================= */
function resize(initial) {
  const oldW = view.W, oldH = view.H;
  const W = Math.max(1, window.innerWidth), H = Math.max(1, window.innerHeight), dpr = window.devicePixelRatio || 1;
  view.W = W; view.H = H; view.dpr = dpr; view.minDim = Math.min(W, H);
  view.depthPx = clamp(view.minDim * 0.03, 12, 34);
  view.sceneScale = Math.min(dpr, 1.5, Math.sqrt(2.6e6 / (W * H)));
  view.glScale = Math.min(dpr, 2, Math.sqrt(4.5e6 / (W * H)));
  view.fxScale = Math.min(dpr, 2, Math.sqrt(5e6 / (W * H)));
  scene.width = Math.round(W * view.sceneScale); scene.height = Math.round(H * view.sceneScale);
  shF.width = shP.width = Math.ceil(W * SH); shF.height = shP.height = Math.ceil(H * SH);
  glCanvas.width = Math.round(W * view.glScale); glCanvas.height = Math.round(H * view.glScale);
  fx.width = Math.round(W * view.fxScale); fx.height = Math.round(H * view.fxScale);
  water.init(W, H);
  layoutDecor();
  bed = buildBed();
  if (initial || !oldW) buildWorld();
  else {
    const sx = W / oldW, sy = H / oldH;
    for (const arr of [pads, leaves, duck, pellets]) for (const o of arr) { o.x *= sx; o.y *= sy; o.hx *= sx; o.hy *= sy; }
    for (const f of fish) { f.x *= sx; f.y *= sy; for (let i = 0; i < KOI_N; i++) { f.px[i] *= sx; f.py[i] *= sy; } f.computeSpine(); }
    for (const f of fireflies) { f.x *= sx; f.y *= sy; }
    rings = []; splashes = []; vortices = [];
  }
}
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => resize(false), 160); });

initGL();
resize(true);

let last = performance.now(), time = 0, simAcc = 0, shishiT = 7;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; time += dt;
  stepPreset(dt);
  spawnRain(dt);
  updateWorld(dt, time);
  shishiT -= dt;
  if (shishiT <= 0) {
    shishiT += 14;
    const s = world.spout;
    water.disturb(s.x, s.y, 20, -2.2);
    addRing(s.x, s.y, 70, 0.45, 2.2); setTimeout(() => addRing(s.x + rand(-6, 6), s.y + rand(-6, 6), 46, 0.35, 1.8), 160);
    for (let k = 0; k < 12; k++) splash(s.x, s.y, rand(30, 110), rand(0.25, 0.45));
    audio.knock();
  }
  audio.tick(dt);
  simAcc += dt; let steps = 0;
  while (simAcc >= 1 / 60 && steps < 3) { water.step(P.damp); simAcc -= 1 / 60; steps++; }
  if (steps === 3) simAcc = 0;
  water.encode();
  renderScene(time);
  renderGL(time);
  renderFX(time);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// tiny debug hook for automated checks
window.__koi = { setPreset, feedAt, scatterFeed, get fish() { return fish; }, get pellets() { return pellets; }, view, GL };
})();
