<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081512">
<meta name="description" content="A night train running through the tea hills, river, villages and rainforest of Sreemangal, Bangladesh, in changing weather.">
<title>শ্রীমঙ্গল রাতের ট্রেন — Sreemangal Night Train</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f0f2df;
    --muted: #b4c0a8;
    --line: rgba(227, 239, 208, .16);
    --glass: rgba(8, 19, 16, .74);
    --leaf: #b8d18a;
    --amber: #f5c775;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    overflow: hidden;
    display: grid;
    place-items: center;
    color: var(--ink);
    background: #040908;
    font: 13px/1.35 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { width: 100vw; height: 100vh; height: 100dvh; display: grid; place-items: center; }
  #scene { display: block; background: #0a1718; }
  button, input { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .scene-mark {
    position: fixed; z-index: 3;
    top: max(18px, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left));
    pointer-events: none; text-shadow: 0 2px 14px #020706; transition: opacity .7s ease;
  }
  .scene-mark .bn { color: #eadcae; font: 500 17px/1.2 "Noto Sans Bengali", "Kohinoor Bangla", "Bangla Sangam MN", "Nirmala UI", sans-serif; letter-spacing: .02em; }
  .scene-mark .en { margin-top: 5px; color: rgba(229,237,212,.72); font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; }
  body:not(.live) .scene-mark, body:not(.live) #route { opacity: 0; pointer-events: none; }

  #route {
    position: fixed; z-index: 4;
    top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));
    display: flex; gap: 2px; padding: 3px;
    border: 1px solid var(--line); border-radius: 10px;
    background: rgba(8,19,16,.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .6s ease;
  }
  #route button { border: 0; background: transparent; padding: 5px 9px; border-radius: 7px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  #route button:hover { background: rgba(255,255,255,.1); color: var(--ink); }
  #route button[aria-current="true"] { background: rgba(245,199,117,.17); color: #ffe7b5; }

  #dock {
    position: fixed; z-index: 5; left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: max-content; max-width: calc(100vw - 20px);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 7px 9px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--glass);
    backdrop-filter: blur(15px) saturate(1.15); -webkit-backdrop-filter: blur(15px) saturate(1.15);
    box-shadow: 0 12px 36px rgba(0,0,0,.4), inset 0 1px rgba(255,255,255,.06);
    transition: opacity .6s ease, transform .6s ease;
  }
  body:not(.live) #dock { opacity: 0; pointer-events: none; transform: translate(-50%, 12px); }
  .divider { width: 1px; height: 26px; background: var(--line); }
  button {
    border: 1px solid var(--line); background: rgba(255,255,255,.045);
    border-radius: 9px; padding: 7px 11px; cursor: pointer;
    transition: background .18s, border-color .18s, color .18s, transform .12s;
  }
  button:hover { background: rgba(255,255,255,.11); }
  button:active { transform: translateY(1px); }
  button[aria-pressed="true"] { background: rgba(184,209,138,.16); border-color: rgba(184,209,138,.48); color: #f4f4df; }
  .segmented { display: flex; gap: 2px; padding: 3px; border: 1px solid rgba(255,255,255,.09); border-radius: 11px; background: rgba(0,0,0,.14); }
  .segmented button { border-color: transparent; background: transparent; padding: 6px 8px; white-space: nowrap; font-size: 12px; }
  .segmented button[aria-pressed="true"] { background: rgba(184,209,138,.16); border-color: rgba(184,209,138,.3); }
  .ctl { display: grid; grid-template-columns: auto auto; align-items: center; gap: 0 10px; width: 118px; }
  .ctl span { color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .ctl output { justify-self: end; font-size: 11px; font-variant-numeric: tabular-nums; }
  .ctl input { grid-column: 1 / -1; width: 100%; margin: 3px 0 -1px; accent-color: var(--leaf); cursor: pointer; }
  .icon { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; }
  .icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #play .resume { display: none; }
  #play[aria-pressed="false"] .pause { display: none; }
  #play[aria-pressed="false"] .resume { display: block; }
  #horn { color: #ffe0a1; border-color: rgba(245,199,117,.3); }
  #horn:hover { background: rgba(245,199,117,.14); }

  #intro {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; padding: 20px; text-align: center;
    background: radial-gradient(ellipse at 50% 42%, rgba(6,20,17,.4), rgba(3,9,8,.88) 72%);
    transition: opacity 1.1s ease, visibility 1.1s ease;
  }
  #intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .card { max-width: 570px; padding: 20px; }
  .card .bn { margin-bottom: 12px; color: #c5d69d; font: 500 18px/1.3 "Noto Sans Bengali", "Kohinoor Bangla", "Bangla Sangam MN", "Nirmala UI", sans-serif; }
  .card h1 { margin: 0 0 13px; color: #f5f1df; font: 600 clamp(32px, 6vw, 55px)/.99 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: -.025em; text-wrap: balance; }
  .card p { max-width: 48ch; margin: 0 auto 24px; color: #b3c0ad; font-size: 14px; line-height: 1.6; text-wrap: pretty; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
  .actions button { padding: 11px 17px; border-radius: 10px; }
  .actions button:disabled { opacity: .45; cursor: progress; }
  .actions .primary { background: #c2d598; border-color: transparent; color: #152016; font-weight: 650; }
  .actions .primary:hover:not(:disabled) { background: #d1e2a9; }
  .small { margin-top: 17px; color: rgba(232,239,218,.5); font-size: 11px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }

  @media (max-width: 900px) {
    #route { display: none; }
    #dock { width: calc(100vw - 14px); gap: 6px; padding: 7px; }
    .segmented { order: 5; width: 100%; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
    .divider { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main id="stage">
  <canvas id="scene" width="1600" height="900" aria-label="A night train running through the tea hills of Sreemangal"></canvas>
</main>

<div class="scene-mark" aria-live="off">
  <div class="bn" id="placeBn">চা বাগান</div>
  <div class="en" id="placeEn">Tea gardens · Sreemangal</div>
</div>

<nav id="route" aria-label="Jump along the route"></nav>

<div id="dock" role="region" aria-label="Night train controls">
  <button class="icon" id="play" aria-label="Pause scene" aria-pressed="true" title="Play or pause · Space">
    <svg viewBox="0 0 24 24"><path class="pause" d="M8 5v14M16 5v14"/><path class="resume" d="M7 4.5v15L19 12z"/></svg>
  </button>
  <label class="ctl"><span>Speed</span><output id="paceOut">52 km/h</output><input id="pace" type="range" min="0" max="100" value="42" aria-label="Train speed"></label>
  <div class="divider" aria-hidden="true"></div>
  <div class="segmented" id="weather" role="group" aria-label="Weather"></div>
  <div class="divider" aria-hidden="true"></div>
  <button id="camera" title="Switch camera · C" aria-label="Switch camera">Follow</button>
  <button id="horn" class="icon" aria-label="Sound the train horn" title="Horn · H">
    <svg viewBox="0 0 24 24"><path d="M3 10v4h3l9 5V5l-9 5H3Z"/><path d="M18 9.5a4 4 0 0 1 0 5M20.5 7a8 8 0 0 1 0 10"/></svg>
  </button>
  <button class="icon" id="sound" aria-label="Enable sound" aria-pressed="false" title="Sound on or off · M">
    <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
  </button>
  <button class="icon" id="fs" aria-label="Enter fullscreen" title="Fullscreen · F">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<section id="intro" aria-labelledby="title">
  <div class="card">
    <div class="bn">চা বাগানের বুক চিরে</div>
    <h1 id="title">Sreemangal<br>Night Train</h1>
    <p>Ride through sleeping tea gardens, across the river, past village lamps and a small station, and into the Lawachara rainforest, under whatever the sky decides.</p>
    <div class="actions">
      <button class="primary" id="enterSound" disabled>Begin with sound</button>
      <button id="enterQuiet" disabled>Begin quietly</button>
    </div>
    <div class="small" id="loadNote" role="status">Painting the hills…</div>
  </div>
</section>

<script>
(() => {
  'use strict';
  // ?capture renders at double density and hands stepping to tools/capture.js.
  const CAPTURE = /[?&]capture\b/.test(location.search);
  const capture = CAPTURE ? { events: [] } : null;
  const W = 1280, H = 720, S = CAPTURE ? 2.5 : 1.25, L = 9600, RY = 220, TAU = Math.PI * 2;
  const $ = (s) => document.querySelector(s);
  const canvas = $('#scene');
  if (CAPTURE) { canvas.width = W * S; canvas.height = H * S; }
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingQuality = 'high';
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- maths ---------- */
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const mod = (a, n) => ((a % n) + n) % n;
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const band = (x, a, b, c, d) => sstep(a, b, x) * (1 - sstep(c, d, x));
  const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const rng = (seed) => {
    let n = (seed * 2654435761) | 0;
    return () => {
      n = (n + 0x6D2B79F5) | 0;
      let t = Math.imul(n ^ (n >>> 15), 1 | n);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  // Value noise that tiles on both axes, so every painted strip wraps without a seam.
  function tile(cx, cy, seed) {
    const r = rng(seed), t = new Float32Array(cx * cy);
    for (let i = 0; i < t.length; i++) t[i] = r();
    return (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
      const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
      const x0 = mod(xi, cx), x1 = (x0 + 1) % cx, y0 = mod(yi, cy), y1 = (y0 + 1) % cy;
      const a = t[y0 * cx + x0], b = t[y0 * cx + x1], c = t[y1 * cx + x0], d = t[y1 * cx + x1];
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    };
  }
  function fbmTile(cx, cy, octaves, seed) {
    const layers = [];
    for (let i = 0; i < octaves; i++) layers.push({ f: tile(cx << i, cy << i, seed + i * 17), x: cx << i, y: cy << i, a: Math.pow(.52, i) });
    const norm = layers.reduce((s, l) => s + l.a, 0);
    return (u, v) => {
      let s = 0;
      for (const l of layers) s += l.a * l.f(u * l.x, v * l.y);
      return s / norm;
    };
  }
  function layer(w, h, scale = S) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * scale); c.height = Math.ceil(h * scale);
    const x = c.getContext('2d');
    x.scale(scale, scale);
    return { c, x, w, h, lamps: [] };
  }

  /* ---------- route ---------- */
  const ZONES = [
    { id: 'tea', x: 0, end: 2600, bn: 'চা বাগান', en: 'Tea gardens · Sreemangal', nav: 'Tea gardens' },
    { id: 'river', x: 2600, end: 3900, bn: 'নদীর সেতু', en: 'River bridge', nav: 'River' },
    { id: 'village', x: 3900, end: 5500, bn: 'গ্রামের পথ', en: 'Village lamps', nav: 'Village' },
    { id: 'station', x: 5500, end: 7000, bn: 'শ্রীমঙ্গল স্টেশন', en: 'Sreemangal station', nav: 'Station' },
    { id: 'forest', x: 7000, end: 9000, bn: 'লাউয়াছড়া বন', en: 'Lawachara rainforest', nav: 'Rainforest' },
    { id: 'tea2', x: 9000, end: 9600, bn: 'চা বাগান', en: 'Tea gardens · Sreemangal', nav: null }
  ];
  const BRIDGE = { a: 2720, b: 3780, panel: 106 };
  const WATER_Y = 652;
  function trackY(x) {
    x = mod(x, L);
    const flat = Math.max(band(x, 2480, 2700, 3800, 4020), band(x, 5360, 5560, 6960, 7160));
    return 540 + (1 - flat) * (10 * Math.sin(x / L * TAU * 3) + 5 * Math.sin(x / L * TAU * 7 + 1));
  }
  const riverW = (x) => { x = mod(x, L); return band(x, 2600, 2720, 3780, 3900); };
  const onBridge = (x) => { x = mod(x, L); return x >= BRIDGE.a && x <= BRIDGE.b; };
  const zoneAt = (x) => { x = mod(x, L); return ZONES.find((z) => x >= z.x && x < z.end) || ZONES[0]; };
  const inTea = (x) => { x = mod(x, L); return x < 2560 || x > 9040; };

  /* ---------- plant and building painters ---------- */
  const LEAF = ['#091b1a', '#11302b', '#1c4a3a', '#3a7157'];
  const LEAF_FAR = ['#10282a', '#183a38', '#25504a', '#3f6f64'];
  const LEAF_DEEP = ['#061412', '#0b2420', '#143a2e', '#2a5f48'];
  function blobs(c, r, cx, cy, rx, ry, n, color, dx, dy, size, spread = 1) {
    c.fillStyle = color; c.beginPath();
    for (let i = 0; i < n; i++) {
      const a = r() * TAU, d = Math.sqrt(r()) * spread;
      const x = cx + dx * rx + Math.cos(a) * d * rx, y = cy + dy * ry + Math.sin(a) * d * ry;
      const b = size * (.6 + r() * .75);
      c.moveTo(x + b, y); c.ellipse(x, y, b, b * .74, 0, 0, TAU);
    }
    c.fill();
  }
  function canopy(c, r, cx, cy, rx, ry, p, n = 34) {
    const b = Math.min(rx, ry) * .36 + 1;
    blobs(c, r, cx, cy, rx, ry, n, p[0], 0, .08, b * 1.1);
    blobs(c, r, cx, cy, rx, ry, n | 0, p[1], .05, -.05, b * .78, .92);
    blobs(c, r, cx, cy, rx, ry, n * .75 | 0, p[2], .2, -.22, b * .48, .72);
    blobs(c, r, cx, cy, rx, ry, n * .5 | 0, p[3], .36, -.4, b * .22, .52);
  }
  function limb(c, x, y, x2, y2, w, col) {
    c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo((x + x2) / 2 + (y - y2) * .06, (y + y2) / 2, x2, y2); c.stroke();
  }
  function shadeTree(c, r, x, y, s, p = LEAF) {
    const lean = (r() - .5) * 14 * s, tx = x + lean, ty = y - 74 * s;
    limb(c, x, y, tx, ty, 3.2 * s, '#0c1a18');
    limb(c, x + .6 * s, y, tx + .6 * s, ty, 1 * s, '#32443c');
    for (let i = 0; i < 4; i++) {
      const ex = tx + (i - 1.5) * 19 * s + (r() - .5) * 5 * s, ey = ty - (6 + r() * 15) * s;
      limb(c, tx, ty + 11 * s, ex, ey, 1.3 * s, '#0e1e1b');
      canopy(c, r, ex, ey - 2 * s, (17 + r() * 8) * s, (6 + r() * 3) * s, p, 15);
    }
    canopy(c, r, tx, ty - 17 * s, 26 * s, 7 * s, p, 18);
  }
  function roundTree(c, r, x, y, s, p = LEAF) {
    limb(c, x, y, x + (r() - .5) * 8 * s, y - 42 * s, 6 * s, '#0b1715');
    limb(c, x + 1.5 * s, y, x + 1 * s, y - 34 * s, 1.2 * s, '#2c3d36');
    for (let i = 0; i < 5; i++) {
      canopy(c, r, x + (r() - .5) * 46 * s, y - (58 + r() * 40) * s, (20 + r() * 12) * s, (16 + r() * 9) * s, p, 20);
    }
    canopy(c, r, x, y - 86 * s, 30 * s, 24 * s, p, 26);
  }
  function areca(c, r, x, y, s) {
    const h = (92 + r() * 42) * s, tx = x + (r() - .5) * 16 * s;
    limb(c, x, y, tx, y - h, 2 * s, '#101d1a');
    limb(c, x + .5, y, tx + .5, y - h, .6 * s, '#4a5c50');
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI + i / 8 * Math.PI, len = (17 + r() * 8) * s;
      const ex = tx + Math.cos(a) * len, ey = y - h + Math.sin(a) * len * .46 + len * .32;
      c.strokeStyle = i > 4 ? '#3a7157' : i > 2 ? '#1c4a3a' : '#11302b'; c.lineWidth = 1.5 * s;
      c.beginPath(); c.moveTo(tx, y - h); c.quadraticCurveTo((tx + ex) / 2, y - h + Math.sin(a) * len * .8, ex, ey); c.stroke();
    }
  }
  function banana(c, r, x, y, s) {
    limb(c, x, y, x + 1, y - 30 * s, 4.5 * s, '#183a2d');
    for (let i = 0; i < 7; i++) {
      const dir = i % 2 ? 1 : -1, len = (24 + r() * 14) * s, top = y - (30 + r() * 12) * s;
      const ex = x + dir * len, ey = top + (r() * 14 - 2) * s, mx = x + dir * len * .5, my = top - (11 + r() * 8) * s;
      c.fillStyle = dir > 0 ? (i % 3 ? '#2f6a4b' : '#40825a') : (i % 3 ? '#143a2c' : '#1c4a3a');
      c.beginPath(); c.moveTo(x, top); c.quadraticCurveTo(mx, my - 5 * s, ex, ey); c.quadraticCurveTo(mx, my + 6 * s, x, top); c.fill();
    }
  }
  function bamboo(c, r, x, y, s) {
    for (let i = 0; i < 11; i++) {
      const bx = x + (r() - .5) * 22 * s, h = (110 + r() * 60) * s, ex = bx + (i - 5) * 4.4 * s + 6 * s;
      c.strokeStyle = i % 3 ? '#143228' : '#2c5a43'; c.lineWidth = 1.5 * s;
      c.beginPath(); c.moveTo(bx, y); c.quadraticCurveTo(bx, y - h * .6, ex, y - h); c.stroke();
      for (let k = 0; k < 8; k++) {
        const t = .45 + k * .075, px = lerp(bx, ex, t * t), py = y - h * t;
        blobs(c, r, px, py, 9 * s, 3.2 * s, 5, k % 2 ? '#1c4a3a' : '#2c6349', .1, 0, 1.9 * s);
      }
    }
  }
  function house(c, r, x, y, w, h, kind = 0) {
    const wall = kind === 1 ? '#4e5349' : kind === 2 ? '#47423a' : '#3b4340';
    c.fillStyle = '#071311'; c.fillRect(x - 3, y - 1, w + 6, 3);
    c.fillStyle = wall; c.fillRect(x, y - h, w, h);
    for (let i = 0; i < w; i += 3) { c.fillStyle = i % 6 ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.035)'; c.fillRect(x + i, y - h, 1, h); }
    const rh = h * .62;
    c.fillStyle = '#28322f';
    c.beginPath(); c.moveTo(x - 5, y - h + 2); c.lineTo(x + w * .46, y - h - rh); c.lineTo(x + w + 5, y - h + 2); c.closePath(); c.fill();
    c.save(); c.clip();
    for (let i = -w; i < w * 2; i += 3) { c.strokeStyle = i % 6 ? 'rgba(160,190,185,.09)' : 'rgba(0,0,0,.22)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x + i, y - h + 2); c.lineTo(x + w * .46 + (i - w * .46) * .1, y - h - rh); c.stroke(); }
    const sheen = c.createLinearGradient(x + w * .46, 0, x + w + 5, 0);
    sheen.addColorStop(0, 'rgba(160,200,200,.26)'); sheen.addColorStop(1, 'rgba(160,200,200,.03)');
    c.fillStyle = sheen; c.fillRect(x + w * .46, y - h - rh, w, rh + 3);
    for (let i = 0; i < 5; i++) { c.fillStyle = 'rgba(95,55,30,.17)'; c.fillRect(x + r() * w, y - h - r() * rh, 3 + r() * 9, 2 + r() * 5); }

      step(dt) { render(update(dt)); return this.info(); },
      info: () => ({ time: state.time, head: train.s - cam, cam, v: train.v, wind: fx.wind, rain: fx.rain, hail: fx.hail }),
      scale: S
    };
  }
  $('#enterSound').addEventListener('click', () => enter(true));
  $('#enterQuiet').addEventListener('click', () => enter(false));

  (async () => {
    const note = $('#loadNote');
    for (let i = 0; i < BUILD.length; i++) {
      note.textContent = `${BUILD[i][0]}… ${Math.round(i / BUILD.length * 100)}%`;
      await new Promise((r) => setTimeout(r, 0));
      BUILD[i][1]();
    }
    train.v = paceSpeed() * .7;
    running = true;
    note.textContent = 'Keys: Space pause · H horn · C camera · 1–5 weather · M sound · F fullscreen';
    $('#enterSound').disabled = false; $('#enterQuiet').disabled = false;
    if (CAPTURE) exposeCapture(); else requestAnimationFrame(loop);
  })().catch((err) => { console.error(err); $('#loadNote').textContent = 'The scene could not be prepared in this browser.'; });
})();
</script>
</body>
</html>
