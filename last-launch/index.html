/* flow field: every zombie follows one BFS from the hero */
const dist=new Uint16Array(WS*WS),flowX=new Float32Array(WS*WS),flowZ=new Float32Array(WS*WS),bfsQ=new Int32Array(WS*WS);
function updateFlow(hx,hz){dist.fill(65535);const s=cellI(hx,hz);if(s<0)return;let h=0,t=0;bfsQ[t++]=s;dist[s]=0;
  while(h<t){const c=bfsQ[h++],d=dist[c]+1,x=c%WS,z=c/WS|0;
    if(x>0)vis(c-1,d);if(x<WS-1)vis(c+1,d);if(z>0)vis(c-WS,d);if(z<WS-1)vis(c+WS,d)}
  function vis(n,d){const v=ter[n];if(dist[n]!==65535||v===T_SOLID||v===T_DEEP)return;dist[n]=d;bfsQ[t++]=n}
  for(let i=0;i<WS*WS;i++){flowX[i]=flowZ[i]=0;if(dist[i]===65535)continue;const x=i%WS,z=i/WS|0;let best=dist[i],bx=0,bz=0;
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const nx=x+a,nz=z+b;if(nx<0||nz<0||nx>=WS||nz>=WS)continue;const n=nx+nz*WS;if(dist[n]>=best)continue;if(a&&b&&(dist[x+a+z*WS]===65535||dist[x+(z+b)*WS]===65535))continue;best=dist[n];bx=a;bz=b}
    if(bx||bz){const l=Math.hypot(bx,bz);flowX[i]=bx/l;flowZ[i]=bz/l}}
}

  document.querySelectorAll('[data-vk]').forEach(b=>b.onclick=()=>{const k=b.dataset.vk,v=VIS_ALLOWED[k].find(x=>String(x)===b.dataset.vv);if(v===undefined)return;VIS[k]=v;if(k==='ocolor'&&v!=='auto'&&!VIS.outline)VIS.outline=1;commitVisual()});syncSettings()}
function closeSettings(){const b=settingsBack;settingsBack=null;if(b)b()}
function updateFpsChip(){const c=$('fpsChip');c.hidden=!VIS.fps;if(!VIS.fps)c.textContent=''}
function showPause(){G.mode='pause';joy.on=false;showOv(`<div class="panel small"><h3>Paused</h3><p class="lead">Stage ${G.stage+1}: ${STAGES[G.stage].name}</p><div class="row"><button class="btn" id="res2">Resume</button><button class="btn alt" id="snd">${AU.muted?'Sound On':'Mute'}</button><button class="btn alt" id="setBtn">Settings</button><button class="btn alt" id="quit">Quit Stage</button></div></div>`);$('setBtn').onclick=()=>showSettings(showPause);$('res2').onclick=resume;$('snd').onclick=()=>{AU.muted=!AU.muted;if(AU.master)AU.master.gain.value=AU.muted?0:.75;$('snd').textContent=AU.muted?'Sound On':'Mute'};$('quit').onclick=()=>{persist();startStage(save.stage,true);showTitle()}}
function resume(){hideOv();G.mode='play';last=performance.now();audioInit()}
function perkChoices(){const p=R.perks,pool=PERKS.filter(x=>(p[x.id]||0)<x.max&&(x.id!=='squad'||squad.length<33));const out=[];const w=x=>({dmg:1.6,rate:1.4,multi:1,squad:1.1,boom:.9,chain:.9,fire:.9}[x.id]||.8);while(out.length<3&&pool.length){let t=pool.reduce((a,x)=>a+w(x),0)*Math.random(),k=0;for(;k<pool.length;k++){t-=w(pool[k]);if(t<=0)break}out.push(pool.splice(Math.min(k,pool.length-1),1)[0])}return out}
function applyPerk(x){R.perks[x.id]=(R.perks[x.id]||0)+1;const was=H.max;derive();if(x.id==='hp')H.hp=Math.min(H.max,H.hp+30+(H.max-was-30));if(x.id==='squad')addSquad(3);if(x.id==='strike')R.strikes++;hudDirty=true}
function showLevelUp(){const c=perkChoices();if(!c.length)return;G.mode='level';joy.on=false;SFX.level();if(G.auto){applyPerk(c[0]);G.mode='play';return}showOv(`<div class="panel"><h3>Level ${R.level}</h3><p class="muted" style="margin:6px 0 0">Choose one upgrade</p><div class="cards">${c.map((x,i)=>`<button class="card" data-i="${i}"><div class="ico" style="color:${x.c}">${x.i}</div><b>${x.n}</b><span>${x.d}</span><em>${R.perks[x.id]?'Rank '+R.perks[x.id]+' to '+(R.perks[x.id]+1):'New'}</em></button>`).join('')}</div></div>`);document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{applyPerk(c[+b.dataset.i]);hideOv();G.mode='play';last=performance.now()})}
const metaCost=m=>Math.round(m.base*Math.pow(1.55,save.meta[m.id]||0));
const gunCost=id=>Math.round(GUNS[id].cost*Math.pow(1.72,gunLvl(id)));
function showShop(){G.mode='shop';document.body.classList.remove('playing');R=clone(save);derive();const next=STAGES[save.stage];const refillC=30+save.stage*18;showOv(`<div class="panel"><div class="shophead"><div><h3>Ghat Shop</h3><div class="muted">Next: Stage ${save.stage+1}, ${next.name}, ${next.kills} zombies</div></div><div class="shopcoins">$${save.coins}</div></div><div class="lab">GUNS. BUY A COPY TO MERGE IT UP.</div><div class="grid">${GUN_IDS.map(id=>{const D=GUNS[id],L=save.guns[id]||0,c=gunCost(id),eq=save.gun===id;return `<div class="item ${eq?'eq':''}"><img class="shopIco ${L?'':'locked'}" src="${gunIcon(id)}" alt=""><b>${D.n}${L?' L'+L:''}</b><small>${D.d}</small><div class="gunActs">${L?`<button class="mini" data-equip="${id}" ${eq?'disabled':''}>${eq?'EQUIPPED':'EQUIP'}</button>`:''}${id!=='pistol'?`<button class="mini buy" data-buy="${id}" ${save.coins>=c?'':'disabled'}>${L?'MERGE':'BUY'} $${c}</button>`:''}</div></div>`}).join('')}</div><div class="lab">PERMANENT UPGRADES</div><div class="grid">${META.map(m=>{const l=save.meta[m.id]||0,c=metaCost(m),max=l>=m.max;return `<button class="item" data-meta="${m.id}" ${max||save.coins<c?'disabled':''}><b>${m.n} ${l}/${m.max}</b><small>${m.d}</small><i>${max?'MAXED':'$'+c}</i></button>`}).join('')}<button class="item" id="refill" ${save.coins<refillC?'disabled':''}><b>Refill Ammo</b><small>All owned guns</small><i>$${refillC}</i></button></div><div class="row"><button class="btn" id="nextS">Start Stage ${save.stage+1}</button></div></div>`);
  document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{save.gun=b.dataset.equip;SFX.pick();persist();showShop()});
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const id=b.dataset.buy,L=save.guns[id]||0,c=gunCost(id);if(save.coins<c)return;save.coins-=c;save.guns[id]=L+1;if(!L)save.gun=id;R=clone(save);derive();save.ammo[id]=reserveCap(id);SFX.level();persist();showShop()});
  document.querySelectorAll('[data-meta]').forEach(b=>b.onclick=()=>{const m=META.find(x=>x.id===b.dataset.meta),c=metaCost(m);if(save.coins>=c){save.coins-=c;save.meta[m.id]=(save.meta[m.id]||0)+1;persist();SFX.level();showShop()}});
  $('refill').onclick=()=>{if(save.coins<refillC)return;save.coins-=refillC;R=clone(save);derive();for(const id of GUN_IDS)if(save.guns[id]&&GUNS[id].reserve!==Infinity)save.ammo[id]=reserveCap(id);persist();SFX.pick();showShop()};$('nextS').onclick=()=>{audioInit();startStage(save.stage)}}
function showDead(){showOv(`<div class="panel small"><h3 style="color:var(--red)">You Were Overrun</h3><p class="lead">Stage ${G.stage+1}: ${G.kills} of ${G.total} zombies down.<br>You keep the <b style="color:var(--gold)">$${G.runCoins||0}</b> you collected.</p><div class="row"><button class="btn" id="retry">Retry Stage</button><button class="btn alt" id="shop2">Ghat Shop</button></div></div>`);$('retry').onclick=()=>{audioInit();startStage(save.stage)};$('shop2').onclick=showShop}
function launchEnding(){G.mode='win';document.body.classList.remove('playing');SFX.horn();setTimeout(()=>SFX.horn(),1600);showOv(`<div class="panel small"><h1 class="title" style="font-size:clamp(34px,7vw,58px)">YOU MADE<br>THE LAUNCH</h1><div class="bn">শেষ লঞ্চ ছেড়ে গেল</div><p class="lead">The Colossus is down. You got ${squad.length} survivors onto the last ferry.</p><div class="row"><button class="btn" id="again">Play Again, Keep Coins</button></div></div>`);$('again').onclick=()=>{const coins=save.coins,meta=save.meta,won=true;save={...newSave(),coins,meta,won,best:STAGES.length};persist();startStage(0)}}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;const STEP=1/60;
let fpsN=0,fpsT=performance.now();
function loop(now){requestAnimationFrame(loop);const rdt=Math.min(.05,(now-last)/1000);last=now;if(VIS.fps){fpsN++;if(now-fpsT>=500){$('fpsChip').textContent=Math.round(fpsN*1000/(now-fpsT))+' FPS';fpsN=0;fpsT=now}}if(G.mode==='play'||G.mode==='clearing'||G.mode==='title'){acc+=rdt;let n=0;while(acc>=STEP&&n++<3){step(STEP);acc-=STEP}if(n>=3)acc=0}else if(G.mode==='dead'){updateParticles(rdt)}render(rdt);hud(rdt);if(bannerT>0){bannerT-=rdt;if(bannerT<=0)$('banner').classList.remove('on')}}
window.__LL={G,H,get R(){return R},get save(){return save},get zc(){return zc},get squad(){return squad.length},get giants(){return giants.length},startStage,addSquad,giveGun,gainCoins,spawnGiant,spawnCluster,callStrike,step,equip,derive,get gates(){return gates.length},get gateList(){return gates},dropAt,camT,VIS,get view(){return{rtW,rtH,PX,VSCALE,radius:viewRadius()}}};
updateFpsChip();startStage(Math.min(save.stage,STAGES.length-1),true);showTitle();requestAnimationFrame(loop);
</script>
</body>
