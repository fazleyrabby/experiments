<style>

{

<body>
<canvas id="stage"></canvas>

  </div>
</div>

<div class="label visits" id="visits" title="Total visits" hidden></div>
<nav class="dock" aria-label="Tools">
  <button type="button" data-tool="mower" aria-pressed="true" title="Push mower (1)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h11l2-3h3"/><path d="M5 14V11h9v3"/><circle cx="7" cy="17.5" r="2"/><circle cx="15" cy="17.5" r="2"/><path d="M14 11 19 4h2"/></svg>

  </button>
  <button type="button" data-tool="trimmer" aria-pressed="false" title="String trimmer (2)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3 8 15"/><path d="M15 6h3"/><ellipse cx="6.5" cy="17" rx="3" ry="1.6"/><path d="M2 19l3-1M8 18l3 1"/></svg>
    <span>Trimmer</span><kbd>2</kbd>

  <button type="button" data-tool="blower" aria-pressed="false" title="Leaf blower (3)">

    <span>Blower</span><kbd>3</kbd>
  </button>
  <button type="button" data-action="new" title="Let it grow back (N)">

    <span>New lawn</span><kbd>N</kbd>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const mobile = matchMedia('(hover: none)').matches || Math.min(innerWidth, innerHeight) < 600;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ───────────────────────────── Yard layout ─────────────────────────────
// The lawn is 8 × 5.5 m, fenced at the back, with a tree near the back left and a run of
// stepping stones across it. Units are metres.

const LW = 8, LD = 5.5, X0 = -LW / 2, Z0 = -LD / 2;
const FENCE_Z = Z0, FRONT_Z = -Z0;
const TREE = { x: -2.55, z: -1.75, r: 0.17 };
const STONES = [];
for (let i = 0; i < 7; i++) {
  const t = i / 6;
  STONES.push({ x: -1.4 + t * 3.6 + Math.sin(t * 5) * 0.25, z: 2.35 - t * 4.1, r: rand(0.2, 0.25), rot: rand(0, Math.PI), sx: rand(0.9, 1.15) });
}
const onStone = (x, z, pad = 0) => STONES.some(s => Math.hypot((x - s.x) / s.sx, z - s.z) < s.r + pad);
const SUN = new THREE.Vector3(2.6, 5.2, -5.4).normalize();

// ───────────────────────────── Renderer ─────────────────────────────

const canvas = document.getElementById('stage');
const statusEl = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const skyTop = new THREE.Color(0x8fb6d6), skyLow = new THREE.Color(0xf2d6a8);
scene.background = skyLow.clone().lerp(skyTop, 0.35);
scene.fog = new THREE.Fog(scene.background, 14, 30);
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 60);

const sun = new THREE.DirectionalLight(0xffe1b0, 2.6);
sun.position.copy(SUN).multiplyScalar(12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xa9c6e6, 0x3a3a1c, 0.75));

// ───────────────────────────── Textures ─────────────────────────────

function canvasTex(w, h, paint, srgb = true, repeat = null) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const speckle = (g, w, h, n, colors, size = [1, 3]) => {
  for (let i = 0; i < n; i++) { g.fillStyle = colors[(Math.random() * colors.length) | 0]; const s = rand(...size); g.fillRect(Math.random() * w, Math.random() * h, s, s); }
};

// Soil with thatch, seen between the blades.
const soilTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#5a4a30'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 30000, ['#4a3c24', '#6a5838', '#7a6844', '#4f5a2a', '#5f6a30'], [1, 4]);
  for (let i = 0; i < 2500; i++) { g.strokeStyle = `rgba(${Math.random() < 0.5 ? '120,105,60' : '60,75,30'},0.5)`; g.lineWidth = 1; g.beginPath(); const x = Math.random() * w, y = Math.random() * h, a = Math.random() * 6; g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 14, y + Math.sin(a) * 14); g.stroke(); }
}, true, [6, 4]);
const stoneTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#8f8a80'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 20000, ['#7d786e', '#a29c90', '#6e6a62', '#b2ac9f', '#8a8478'], [1, 3]);
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(70,80,50,${rand(0.05, 0.15)})`; g.beginPath(); g.arc(Math.random() * w, Math.random() * h, rand(10, 40), 0, 7); g.fill(); }
});
const woodTex = canvasTex(256, 1024, (g, w, h) => {
  g.fillStyle = '#7a5d40'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 2) { g.fillStyle = `rgba(${Math.random() < 0.5 ? '60,42,26' : '140,110,80'},${rand(0.08, 0.25)})`; g.fillRect(x, 0, rand(1, 3), h); }
  for (let i = 0; i < 6; i++) { g.fillStyle = 'rgba(40,28,18,0.5)'; g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, 6, 12, 0, 0, 7); g.fill(); }
});
const barkTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#4b3c2e'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 3) { g.fillStyle = `rgba(${Math.random() < 0.5 ? '30,22,16' : '110,95,75'},${rand(0.2, 0.5)})`; g.fillRect(x, 0, rand(1, 4), h); }
  for (let i = 0; i < 300; i++) { g.fillStyle = 'rgba(25,18,12,0.5)'; g.fillRect(Math.random() * w, Math.random() * h, rand(2, 8), rand(8, 30)); }
}, true, [2, 1]);

// ───────────────────────────── Grounds ─────────────────────────────

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: soilTex, roughness: 1 }));
soilTex.repeat.set(30, 30);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const stoneMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.92, bumpMap: stoneTex, bumpScale: 1.5 });
for (const s of STONES) {
  const geo = new THREE.CylinderGeometry(s.r, s.r * 1.02, 0.05, 28, 1);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const a = Math.atan2(p.getZ(i), p.getX(i)); const k = 1 + 0.08 * Math.sin(a * 3 + s.rot) + 0.04 * Math.sin(a * 7); p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k); }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, stoneMat);
  m.position.set(s.x, 0.012, s.z); m.scale.x = s.sx; m.rotation.y = s.rot * 0.1;
  m.receiveShadow = true; m.castShadow = true;
  scene.add(m);
}

// Board fence across the back.
const fence = new THREE.Group();
const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.85 });
for (let x = X0 - 1; x < -X0 + 1; x += 0.155) {
  const board = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.25 + rand(-0.02, 0.02), 0.022), woodMat);
  board.position.set(x, 0.62, FENCE_Z - 0.06); board.rotation.z = rand(-0.006, 0.006);
  board.castShadow = board.receiveShadow = true;
  fence.add(board);
}
for (const y of [0.25, 1.0]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(LW + 2, 0.08, 0.05), woodMat);
  rail.position.set(0, y, FENCE_Z - 0.11); rail.castShadow = true; fence.add(rail);
}
scene.add(fence);

// The tree: bark trunk with roots flaring into the lawn, and a clumped canopy overhead.
const tree = new THREE.Group();
const trunk = new THREE.Mesh(new THREE.CylinderGeometry(TREE.r * 0.8, TREE.r * 1.25, 3.4, 20, 8), new THREE.MeshStandardMaterial({ map: barkTex, roughness: 0.95, bumpMap: barkTex, bumpScale: 2 }));
trunk.position.y = 1.7; trunk.castShadow = true; trunk.receiveShadow = true;
tree.add(trunk);
const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f5f25, roughness: 0.9, flatShading: true });
for (let i = 0; i < 9; i++) {
  const geo = new THREE.IcosahedronGeometry(rand(0.7, 1.1), 2);
  const p = geo.attributes.position;
  for (let k = 0; k < p.count; k++) { const s = 1 + rand(-0.12, 0.12); p.setXYZ(k, p.getX(k) * s, p.getY(k) * s, p.getZ(k) * s); }
  geo.computeVertexNormals();
  const c = new THREE.Mesh(geo, leafMat);
  c.position.set(rand(-1.1, 1.1), 3.4 + rand(-0.3, 0.7), rand(-1.1, 0.6));
  c.castShadow = true;
  tree.add(c);
}
tree.position.set(TREE.x, 0, TREE.z);
scene.add(tree);

// ───────────────────────────── Lawn state ─────────────────────────────
// One texel per ~2.5 cm of lawn:
//   R  grass length (255 = overgrown, 0 = mown short)
//   GB the direction the cut blades lean, which is what makes stripes
//   A  scrap of mown-over flowers, unused by the shader

const SW = 320, SH = Math.round(SW * LD / LW);
const state = new Uint8Array(SW * SH * 4);
const stateTex = new THREE.DataTexture(state, SW, SH);
stateTex.magFilter = stateTex.minFilter = THREE.LinearFilter;
function resetLawn() {
  for (let i = 0; i < SW * SH; i++) { state[i * 4] = 255; state[i * 4 + 1] = 128; state[i * 4 + 2] = 128; state[i * 4 + 3] = 0; }
  stateTex.needsUpdate = true;
}
resetLawn();
const toTexel = (x, z) => [(x - X0) / LW * SW, (z - Z0) / LD * SH];

// Static shade on the lawn from the fence and the canopy, painted along the sun direction.
const shadeTex = canvasTex(512, 352, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  const sx = -SUN.x / SUN.y, sz = -SUN.z / SUN.y;      // ground offset per metre of height
  const px = x => (x - X0) / LW * w, pz = z => (z - Z0) / LD * h;
  g.filter = 'blur(10px)';
  g.fillStyle = 'rgba(0,0,0,0.55)';
  g.fillRect(0, 0, w, pz(FENCE_Z + 1.2 * sz));        // fence band
  g.filter = 'blur(22px)';
  for (const c of tree.children.slice(1)) {
    const wx = TREE.x + c.position.x + c.position.y * sx, wz = TREE.z + c.position.z + c.position.y * sz;
    g.fillStyle = 'rgba(0,0,0,0.42)';
    g.beginPath(); g.ellipse(px(wx), pz(wz), 0.95 / LW * w, 0.8 / LD * h, 0, 0, 7); g.fill();
  }
}, false);

// ───────────────────────────── Grass ─────────────────────────────
// Instanced blades, each a tapered strip bent in the vertex shader by wind, by its own lean,
// and, once mown, by the direction the mower passed. The shading is done here too: soft
// sky light, sun, translucent tips when the sun is behind them, and the stripe effect.

const SEG = 6;
function bladeGeometry() {
  const g = new THREE.InstancedBufferGeometry();
  const t = [], side = [], idx = [];
  for (let i = 0; i <= SEG; i++) { t.push(i / SEG, i / SEG); side.push(-1, 1); }
  for (let i = 0; i < SEG; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(t.length * 3), 3));
  g.setAttribute('aT', new THREE.Float32BufferAttribute(t, 1));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(side, 1));
  g.setIndex(idx);
  return g;
}
const COUNT = mobile ? 52000 : 115000;
const bladeGeo = bladeGeometry();
const iOff = new Float32Array(COUNT * 2), iH = new Float32Array(COUNT), iRot = new Float32Array(COUNT), iW = new Float32Array(COUNT), iTint = new Float32Array(COUNT), iBend = new Float32Array(COUNT);
let n = 0;
while (n < COUNT) {
  const x = rand(X0 + 0.02, -X0 - 0.02), z = rand(Z0 + 0.06, -Z0 - 0.02);
  if (onStone(x, z, 0.015) || Math.hypot(x - TREE.x, z - TREE.z) < TREE.r + 0.05) continue;
  const clump = 0.5 + 0.5 * Math.sin(x * 3.1 + Math.sin(z * 2.3) * 2) * Math.sin(z * 2.7 + x);
  iOff[n * 2] = x; iOff[n * 2 + 1] = z;
  iH[n] = rand(0.17, 0.3) * (0.85 + 0.3 * clump);
  iRot[n] = rand(0, Math.PI * 2);
  iW[n] = rand(0.008, 0.014);
  iTint[n] = Math.random() < 0.08 ? rand(0.6, 1) : rand(0, 0.35) * clump;
  iBend[n] = rand(0.15, 0.55);
  n++;
}
for (const [name, arr, size] of [['iOff', iOff, 2], ['iH', iH, 1], ['iRot', iRot, 1], ['iW', iW, 1], ['iTint', iTint, 1], ['iBend', iBend, 1]]) {
  bladeGeo.setAttribute(name, new THREE.InstancedBufferAttribute(arr, size));
}
bladeGeo.instanceCount = COUNT;

const grassU = {
  tState: { value: stateTex }, tShade: { value: shadeTex },
  uMin: { value: new THREE.Vector2(X0, Z0) }, uSize: { value: new THREE.Vector2(LW, LD) },
  uTime: { value: 0 }, uSun: { value: SUN.clone() },
  uMower: { value: new THREE.Vector4(0, 3, 0, 0) }, uBlow: { value: new THREE.Vector4(0, 0, 0, 0) },
  fogColor: { value: scene.fog.color }, fogNear: { value: scene.fog.near }, fogFar: { value: scene.fog.far },
};
const grassMat = new THREE.ShaderMaterial({
  uniforms: grassU, side: THREE.DoubleSide, fog: true,
  vertexShader: `
    uniform sampler2D tState, tShade;
    uniform vec2 uMin, uSize;
    uniform float uTime;
    uniform vec4 uBlow;
    attribute float aT, aSide;
    attribute vec2 iOff;
    attribute float iH, iRot, iW, iTint, iBend;
    varying float vT, vTint, vShade, vStripe, vCut;
    varying vec3 vN, vPos;
    #include <fog_pars_vertex>
    void main() {
      vec2 suv = (iOff - uMin) / uSize;
      vec4 st = texture2D(tState, suv);
      float len = st.r, cut = 1.0 - len;
      vec2 lean = st.gb * 2.0 - 1.0;
      float H = iH * mix(0.17, 1.0, len);
      float t = aT;
      vec2 f = vec2(cos(iRot), sin(iRot));
      float w = iW * mix(1.0, 1.35, cut) * (1.0 - t * mix(0.85, 0.35, cut));
      // Overgrown grass flops and sways; mown grass stands short and leans the way the mower went.
      vec2 natural = vec2(cos(iRot * 1.7 + 1.0), sin(iRot * 1.7 + 1.0)) * iBend;
      float gust = sin(uTime * 1.6 + iOff.x * 0.8 + iOff.y * 0.5) * 0.5 + sin(uTime * 3.3 + iOff.x * 2.1 - iOff.y * 1.3) * 0.25;
      vec2 wind = vec2(0.7, 0.3) * gust * 0.4;
      vec2 toB = iOff - uBlow.xy;
      float bd = length(toB);
      vec2 blow = bd < 1.3 ? normalize(toB + 1e-4) * uBlow.z * (1.0 - bd / 1.3) * (0.7 + 0.3 * sin(uTime * 30.0 + iOff.x * 40.0)) : vec2(0.0);
      vec2 bend = mix(natural + wind, lean * 0.95 + wind * 0.12, cut) + blow;
      float b = min(1.4, length(bend));
      vec3 p = vec3(iOff.x, 0.0, iOff.y) + vec3(f.x, 0.0, f.y) * aSide * w;
      p.xz += bend * t * t * H * 0.85;
      p.y = t * H * (1.0 - 0.32 * b * b * 0.5);
      vec3 perp = normalize(vec3(-f.y, 0.0, f.x));
      vN = normalize(mix(perp, vec3(0.0, 1.0, 0.0), 0.45 + 0.3 * t));
      vT = t; vTint = iTint; vCut = cut;
      vShade = texture2D(tShade, vec2(suv.x, 1.0 - suv.y)).r;
      vec2 toCam = normalize(iOff - cameraPosition.xz);
      vStripe = cut * clamp(length(lean) * 1.5, 0.0, 1.0) * dot(normalize(lean + 1e-4), toCam);
      vPos = p;
      vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: `
    uniform vec3 uSun;
    uniform vec4 uMower;
    varying float vT, vTint, vShade, vStripe, vCut;
    varying vec3 vN, vPos;
    #include <fog_pars_fragment>
    void main() {
      vec3 root = vec3(0.045, 0.1, 0.02), tip = vec3(0.2, 0.36, 0.07);
      vec3 col = mix(root, tip, vT);

      const x = X0 + (i + 0.5) / SW * LW - cx, z = Z0 + (j + 0.5) / SH * LD - cz;
      const lx = x * c - z * s, lz = x * s + z * c;
      if (Math.abs(lx) > halfW || Math.abs(lz) > halfL) continue;
      const o = (j * SW + i) * 4;
      if (state[o] > len) { cut += state[o] - len; state[o] = len; }
      state[o + 1] = 128 + leanX * 127; state[o + 2] = 128 + leanZ * 127;
    }
  }
  stateTex.needsUpdate = true;
  return cut / 255 / (halfW * halfL * 4 * (SW / LW) ** 2);
}
function cutDisc(cx, cz, rad, len) {
  const [ti, tj] = toTexel(cx, cz), r = rad / LW * SW;
  let cut = 0;
  for (let j = Math.max(0, Math.floor(tj - r)); j <= Math.min(SH - 1, Math.ceil(tj + r)); j++) {
    for (let i = Math.max(0, Math.floor(ti - r)); i <= Math.min(SW - 1, Math.ceil(ti + r)); i++) {
      const dx = i - ti, dz = j - tj, d = Math.hypot(dx, dz) / r;
      if (d > 1) continue;
      const o = (j * SW + i) * 4, l = len + Math.random() * 30;
      if (state[o] > l) { cut += state[o] - l; state[o] = l; state[o + 1] = 128 + (dx / (d * r + 1e-3)) * 90; state[o + 2] = 128 + (dz / (d * r + 1e-3)) * 90; }
    }
  }
  stateTex.needsUpdate = true;
  return cut / 255 / (Math.PI * r * r);
}
function chopFlowers(test) {
  for (const f of flowers) {
    if (!f.alive || !test(f.x, f.z)) continue;
    f.alive = false; placeFlower(f);
    if (f.seed) for (let i = 0; i < 70; i++) fluff.push({ x: f.x, y: f.height, z: f.z, vx: rand(-0.6, 0.6), vy: rand(0.1, 0.8), vz: rand(-0.6, 0.6), life: rand(3, 6) });
    else for (let i = 0; i < 10; i++) addClip(f.x, 0.2, f.z, rand(-1, 1), rand(0.5, 1.5), rand(-1, 1));
  }
}

// ───────────────────────────── Frame ─────────────────────────────

let done = false, statsClock = 0, lastStatus = '';
const clock = new THREE.Clock(), clipMat = new THREE.Matrix4(), clipQ = new THREE.Quaternion(), clipE = new THREE.Euler(), one = new THREE.Vector3(1, 1, 1);
const pos3 = new THREE.Vector3();
let mowerSpeed = 0, rolled = 0, engineLoad = 0, lastGroundX = 0;

function stats() {
  let cut = 0, total = 0;
  for (let i = 0; i < COUNT; i += 37) {
    const [ti, tj] = toTexel(iOff[i * 2], iOff[i * 2 + 1]);
    const o = ((Math.min(SH - 1, tj | 0)) * SW + Math.min(SW - 1, ti | 0)) * 4;
    total++; if (state[o] < 120) cut++;
  }
  const pct = Math.round(100 * cut / total);
  let onStones = 0;
  for (const c of clips) if (c.rest && onStone(c.x, c.z)) onStones++;
  if (!done && pct >= 97 && onStones === 0) done = true;
  const text = done ? 'Lawn done' : `Mowed ${pct}%${onStones ? ` / Clippings on the stones ${onStones}` : ''}`;
  if (text !== lastStatus) statusEl.textContent = lastStatus = text;
}

function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  grassU.uTime.value = t;

  const focus = tool === 'mower' ? mower.position.x : lastGroundX;
  panX += (Math.max(-panLimit, Math.min(panLimit, focus)) - panX) * Math.min(1, dt * 1.5);
  camera.position.copy(camBase).add(tmp.set(panX + pointer.x * 0.25, 0, 0));
  camera.lookAt(lookAt.set(panX, 0, 0.15));

  let ground = null;
  if (hasPointer) { ray.setFromCamera(pointer, camera); ground = ray.ray.intersectPlane(groundPlane, tmp.clone()); if (ground) lastGroundX = ground.x; }

  // ── Mower: pushed toward the pointer while held, turning to face its direction of travel.
  const mowing = tool === 'mower' && down && ground;
  if (mowing) target.copy(ground);
  if (tool === 'mower' && down && ground) {
    const dx = target.x - mower.position.x, dz = target.z - mower.position.z, d = Math.hypot(dx, dz);
    const want = d > 0.12 ? Math.min(1.7, d * 3) : 0;
    mowerSpeed += (want - mowerSpeed) * Math.min(1, dt * 4);
    if (d > 0.12) {
      let diff = Math.atan2(dx, dz) - heading;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      // A push mower turns on the spot slowly and drives mostly straight.
      heading += Math.max(-dt * 2.6, Math.min(dt * 2.6, diff));
      const fwd = Math.max(0, Math.cos(diff));
      mower.position.x += Math.sin(heading) * mowerSpeed * fwd * dt;
      mower.position.z += Math.cos(heading) * mowerSpeed * fwd * dt;
      rolled += mowerSpeed * fwd * dt;
    }
  } else mowerSpeed *= 0.85;
  // Fence, lawn edges and the tree stop the deck, leaving a strip only the trimmer reaches.
  mower.position.x = Math.max(X0 + 0.33, Math.min(-X0 - 0.33, mower.position.x));
  mower.position.z = Math.max(FENCE_Z + 0.42, Math.min(FRONT_Z - 0.2, mower.position.z));
  const tdx = mower.position.x - TREE.x, tdz = mower.position.z - TREE.z, td = Math.hypot(tdx, tdz), minD = TREE.r + 0.42;
  if (td < minD) { mower.position.x = TREE.x + tdx / td * minD; mower.position.z = TREE.z + tdz / td * minD; }
  mower.rotation.y = heading;
  for (const [i, w] of mower.userData.wheels.entries()) w.rotation.x = rolled / (i < 2 ? 0.075 : 0.095);
  const running = tool === 'mower' && down;
  mower.userData.body.position.y = running ? Math.sin(t * 90) * 0.0015 : 0;
  grassU.uMower.value.set(mower.position.x, mower.position.z, heading, 1);
  if (running) {
    const fx = Math.sin(heading), fz = Math.cos(heading);
    const c = cutRect(mower.position.x, mower.position.z, heading, 0.23, 0.25, 0, fx, fz);
    engineLoad += (Math.min(1, c * 6) - engineLoad) * 0.2;
    const mx = mower.position.x, mz = mower.position.z;
    chopFlowers((x, z) => { const lx = (x - mx) * Math.cos(heading) - (z - mz) * Math.sin(heading), lz = (x - mx) * Math.sin(heading) + (z - mz) * Math.cos(heading); return Math.abs(lx) < 0.25 && Math.abs(lz) < 0.27; });
  } else engineLoad *= 0.9;

  // ── Trimmer: a spinning line that cuts a ragged disc and flings clippings.
  trimmer.visible = tool === 'trimmer' && !!ground;
  if (trimmer.visible) {
    trimmer.position.set(ground.x, down ? 0.01 : 0.06, ground.z);
    trimmer.rotation.y = Math.atan2(camera.position.x - ground.x, camera.position.z - ground.z);
    trimmer.userData.spin.rotation.y += dt * (down ? 80 : 4);
    if (down) {
      const c = cutDisc(ground.x, ground.z, 0.15, 25);
      chopFlowers((x, z) => Math.hypot(x - ground.x, z - ground.z) < 0.17);
      const nClip = Math.min(8, Math.round(c * 40) + (Math.random() < 0.3 ? 1 : 0));
      for (let i = 0; i < nClip; i++) { const a = rand(0, Math.PI * 2), sp = rand(1, 2.6); addClip(ground.x + Math.cos(a) * 0.12, 0.05, ground.z + Math.sin(a) * 0.12, Math.cos(a) * sp, rand(0.6, 1.6), Math.sin(a) * sp); }
    }
  }

  // ── Blower: a jet from the nozzle that sends clippings and fluff tumbling and flattens grass.
  blower.visible = tool === 'blower' && !!ground;
  let blowDir = null;
  if (blower.visible) {
    blower.position.set(ground.x, 0.02, ground.z);
    const a = Math.atan2(camera.position.x - ground.x, camera.position.z - ground.z);
    blower.rotation.y = a;
    blowDir = new THREE.Vector2(-Math.sin(a), -Math.cos(a));
    grassU.uBlow.value.set(ground.x + blowDir.x * 0.4, ground.z + blowDir.y * 0.4, down ? 0.9 : 0, 0);
  } else grassU.uBlow.value.z = 0;

  // ── Clippings: fly, settle, and get blown.
  for (const c of clips) {
    if (blowDir && down) {
      const rx = c.x - ground.x, rz = c.z - ground.z, along = rx * blowDir.x + rz * blowDir.y, across = Math.abs(rx * blowDir.y - rz * blowDir.x);
      if (along > -0.05 && along < 1.4 && across < 0.15 + along * 0.35) {
        const f = (1 - along / 1.4) * 9 * dt;
        c.vx += blowDir.x * f * 3 + rand(-1, 1) * f; c.vz += blowDir.y * f * 3 + rand(-1, 1) * f; c.vy += f * rand(0.5, 1.5); c.rest = false;
      }
    }
    if (c.rest) continue;
    c.vy -= 9.8 * dt; c.vx *= 0.97; c.vz *= 0.97;
    c.x += c.vx * dt; c.y += c.vy * dt; c.z += c.vz * dt; c.rx += c.spin * dt;
    const floor = onStone(c.x, c.z) ? 0.04 : 0.01;
    if (c.y < floor) { c.y = floor; if (Math.abs(c.vy) < 0.6) { c.rest = true; c.rx = Math.PI / 2; c.vx = c.vz = c.vy = 0; } else { c.vy *= -0.25; c.vx *= 0.5; c.vz *= 0.5; } }
  }
  for (let i = clips.length - 1; i >= 0; i--) { const c = clips[i]; if (c.x < X0 - 1 || c.x > -X0 + 1 || c.z > FRONT_Z + 1.5 || c.z < FENCE_Z - 0.2) clips.splice(i, 1); }
  clipMesh.count = clips.length;
  for (let i = 0; i < clips.length; i++) {
    const c = clips[i];
    clipQ.setFromEuler(clipE.set(c.rx, c.ry, 0));
    clipMat.compose(pos3.set(c.x, c.y, c.z), clipQ, one);
    clipMesh.setMatrixAt(i, clipMat);
  }
  clipMesh.instanceMatrix.needsUpdate = true;

  // ── Mower debris: a few clippings escape the bag, flower heads bounce off the deck.
  if (running && engineLoad > 0.1 && Math.random() < engineLoad) {
    const side = Math.cos(heading), sz = -Math.sin(heading);
    addClip(mower.position.x + side * 0.3, 0.1, mower.position.z + sz * 0.3, side * rand(0.8, 1.6), rand(0.3, 0.9), sz * rand(0.8, 1.6));
  }

  // ── Dandelion fluff drifts off on the breeze.
  let fi = 0;
  for (let i = fluff.length - 1; i >= 0; i--) {
    const f = fluff[i];
    f.life -= dt;
    if (f.life <= 0) { fluff.splice(i, 1); continue; }
    f.vx += (0.35 - f.vx) * dt * 0.6 + rand(-0.3, 0.3) * dt; f.vz += (0.15 - f.vz) * dt * 0.6 + rand(-0.3, 0.3) * dt; f.vy += (0.08 - f.vy) * dt * 0.8;
    if (blowDir && down) { const rx = f.x - ground.x, rz = f.z - ground.z; if (Math.hypot(rx, rz) < 1.2) { f.vx += blowDir.x * dt * 6; f.vz += blowDir.y * dt * 6; f.vy += dt * 2; } }
    f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
  }
  for (const f of fluff) { if (fi >= MAXF) break; fluffPos[fi * 3] = f.x; fluffPos[fi * 3 + 1] = f.y; fluffPos[fi * 3 + 2] = f.z; fi++; }
  fluffGeo.setDrawRange(0, fi);
  fluffGeo.attributes.position.needsUpdate = true;

  // ── Sound.
  if (S) {
    const eng = tool === 'mower' && down;
    S.fire.frequency.setTargetAtTime(46 - engineLoad * 9, audio.currentTime, 0.12);
    S.fire2.frequency.setTargetAtTime(92 - engineLoad * 18, audio.currentTime, 0.12);
    level('engine', eng ? 0.12 : 0, 0.15); level('engine2', eng ? 0.05 : 0, 0.15); level('exhaust', eng ? 0.1 + engineLoad * 0.08 : 0, 0.15);
    level('chop', eng ? 0.05 + engineLoad * 0.18 : 0, 0.05);
    const tr = tool === 'trimmer' && down;
    level('whine', tr ? 0.06 : 0, 0.08); level('whine2', tr ? 0.03 : 0, 0.08); level('lash', tr ? 0.06 : 0, 0.05);
    const bl = tool === 'blower' && down;
    level('blow', bl ? 0.22 : 0, 0.1); level('blowHi', bl ? 0.06 : 0, 0.1);
  }

  statsClock += dt;
  if (statsClock > 0.5) { statsClock = 0; stats(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Preview: half the lawn already striped, to show the before and after together.
if (new URLSearchParams(location.search).has('demo')) {
  for (let lane = 0; lane < 9; lane++) {
    const x = -0.3 + lane * 0.46;
    if (x > -X0) break;
    const dir = lane % 2 ? 1 : -1;
    for (let z = FENCE_Z + 0.42; z < FRONT_Z - 0.2; z += 0.05) {
      if (Math.hypot(x - TREE.x, z - TREE.z) < 0.6) continue;
      cutRect(x, z, 0, 0.235, 0.05, 0, 0, dir);
    }
  }
  mower.position.set(-0.3, 0, 0.6); heading = 0;
  chopFlowers((x, z) => x > -0.55);
}
requestAnimationFrame(frame);
</script>
<script defer src="/visit-counter.js" data-project="lawn-mowing"></script>
