<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pressure Washer Deck</title>
<meta name="description" content="Blast a filthy cedar deck back to bare wood. Sweep the jet in stripes, switch nozzle tips, chase the leaves off the edge, and lift the deep stains.">
<style>

  #back:hover { background: rgba(26, 34, 46, 0.78); }
  #title { left: max(20px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); text-shadow: 0 1px 12px rgba(0,0,0,.55); pointer-events: none; max-width: 300px; }
  #title h1 { margin: 0; font-size: 15px; font-weight: 650; }
  #title p { margin: 3px 0 0; opacity: .82; transition: opacity .6s; }
  body.sprayed #title p { opacity: 0; }
  #stats { top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 7px 16px 7px 12px; border-radius: 999px; min-width: 250px; }
  #pct { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; letter-spacing: -.01em; }
  #bar { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; min-width: 70px; }
  #bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #5ec8ff, #ffe27a); border-radius: 99px; }
  #sub { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; white-space: nowrap; }
  #tools { right: max(16px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); display: flex; gap: 6px; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  #tools button { border-radius: 999px; padding: 6px 12px; }
  #tools button:hover, .tip:hover, .mini:hover { background: rgba(26, 34, 46, 0.8); }
  #tools button[aria-pressed="false"] { opacity: .55; }
  #dock { left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 22px; max-width: calc(100vw - 24px); }
  .tips { display: flex; gap: 6px; }
  .tip { display: flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--line); white-space: nowrap; }
  .tip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
  .tip kbd { font: inherit; opacity: .5; font-size: 10px; }
  .tip[aria-pressed="true"] { background: var(--ink); color: #10161d; border-color: var(--ink); }
  .tip[aria-pressed="true"] kbd { opacity: .55; }
  .sep { width: 1px; align-self: stretch; background: var(--line); }
  .dist { display: flex; flex-direction: column; gap: 2px; min-width: 118px; }
  .dist label { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; opacity: .65; display: flex; justify-content: space-between; }
  .dist input { width: 100%; margin: 0; accent-color: var(--hot); }
  .mini { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 16px; line-height: 1; padding: 0; }

  #done { inset: 0; display: grid; place-items: center; background: rgba(8, 14, 22, 0.42); opacity: 0; pointer-events: none; transition: opacity .8s ease; }
  #done.show { opacity: 1; pointer-events: auto; }
  #done .card { text-align: center; padding: 26px 34px 24px; border-radius: 22px; max-width: min(380px, calc(100vw - 32px)); }
  #done h2 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.02em; }
  #done p { margin: 0 0 16px; opacity: .8; }
  #done .stats { display: flex; gap: 22px; justify-content: center; margin-bottom: 18px; }
  #done .stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  #done .stats span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .65; }
  #again { background: var(--hot); color: #1d1204; border: 0; border-radius: 999px; padding: 10px 22px; font-weight: 700; }
  #again:hover { filter: brightness(1.08); }
  #loader { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: #aab6c0; color: #26323d; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; transition: opacity .7s ease; }
  #loader.done { opacity: 0; pointer-events: none; }

    #title { display: none; }
    #dock { flex-wrap: wrap; justify-content: center; gap: 8px; border-radius: 18px; }
    .sep { display: none; }
    .tip { padding: 6px 9px; } .tip kbd { display: none; }
    #stats { min-width: 0; padding: 6px 12px; gap: 8px; } #sub { display: none; }
    #tools { top: calc(max(14px, env(safe-area-inset-top)) + 46px); right: max(12px, env(safe-area-inset-right)); }
  }
  @media (prefers-reduced-motion: reduce) { .hud, #loader, #done { transition: none; } }

<div id="tools" class="hud"><button id="mute" class="glass" type="button" aria-pressed="true">Sound</button><button id="restart" class="glass" type="button">Restart</button></div>

<div id="dock" class="hud glass">

  <div class="sep"></div>

float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }`;

  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform sampler2D uGrime;\n' + GLSL_NOISE)
    .replace('#include <map_fragment>', `#include <map_fragment>
      vec4 gm = texture2D(uGrime, vMapUv);
      float dirtV = gm.r, stainV = gm.g, wetV = gm.b;
      vec2 gu = vMapUv;
      float nA = vn(gu * vec2(70.0, 49.0)), nC = vn(gu * vec2(18.0, 13.0));
      float nB = vn(gu * vec2(260.0, 182.0)) * 0.55 + vn(gu * vec2(780.0, 546.0)) * 0.3 + vn(gu * vec2(2100.0, 1470.0)) * 0.15;
      float streak = vn(gu * vec2(30.0, 900.0));                                  // algae follows the grain
      float lichen = smoothstep(0.82, 0.9, vn(gu * vec2(90.0, 63.0) + 7.0)) * smoothstep(0.45, 0.7, vn(gu * vec2(600.0, 420.0)));
      float speck = smoothstep(0.8, 0.93, vn(gu * vec2(1500.0, 1050.0)));
      vec3 grimeCol = mix(vec3(0.055, 0.078, 0.036), vec3(0.20, 0.19, 0.145), nA);
      grimeCol = mix(grimeCol, vec3(0.09, 0.115, 0.05), streak * 0.5);
      grimeCol = mix(grimeCol, vec3(0.045, 0.04, 0.032), smoothstep(0.5, 0.85, nC) * 0.7) * (0.55 + 0.9 * nB);
      grimeCol = mix(grimeCol, vec3(0.30, 0.32, 0.24), lichen * 0.4);
      grimeCol = mix(grimeCol, vec3(0.02, 0.022, 0.018), speck * 0.75);
      vec3 woodCol = diffuseColor.rgb;
      float clean = (1.0 - dirtV) * (1.0 - stainV);
      woodCol = mix(woodCol, woodCol * vec3(1.13, 1.10, 1.05), clean * 0.8);
      woodCol = mix(woodCol, woodCol * vec3(0.36, 0.33, 0.30), stainV * 0.92);
      woodCol *= 0.9 + 0.2 * vn(gu * vec2(14.0, 340.0));
      woodCol *= 1.0 - 0.34 * wetV * (1.0 - dirtV);
      float thr = dirtV + (nB - 0.5) * 0.34;
      float cover = smoothstep(0.30, 0.52, thr);
      diffuseColor.rgb = mix(woodCol, grimeCol, cover);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, 1.0, cover * 0.85);
      roughnessFactor = mix(roughnessFactor, 0.22, wetV * (1.0 - cover));`);
};
