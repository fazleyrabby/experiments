<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mechanical Stag</title>
<meta name="description" content="A clockwork stag built from hundreds of machined parts: titanium armor, brass pistons, carbon ribs and a glowing reactor heart. Explode it into layers, click any part, make it walk, or dissolve it into thousands of tiny gears and bolts.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cpath d='M16 26v-9M16 17l-6-6V5M10 11l-4-2M16 17l6-6V5M22 11l4-2' stroke='%235ef2ff' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='20' r='2.4' fill='%235ef2ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#0b0d10; --panel:rgba(14,17,21,.74); --panel2:rgba(22,26,32,.9);
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --text:#e7ecf1; --mute:#8b96a3; --acc:#5ef2ff; --brass:#e0a63e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stage,#stage canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
  #stage canvas{cursor:crosshair}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  .hud{position:fixed;z-index:3;transition:opacity .35s}
  body.boot .hud{opacity:0}
  body.capture .hud,body.capture #labels,body.capture #leaders,body.capture .vignette,body.capture .toast{display:none}
  .glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-radius:14px}

  .title{left:20px;top:18px;max-width:min(360px,calc(100vw - 40px));pointer-events:none}
  .kicker{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--acc);display:flex;align-items:center;gap:8px;text-transform:uppercase}
  .kicker i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .title h1{margin:10px 0 6px;font-weight:600;font-size:30px;letter-spacing:-.02em;line-height:1}
  .title p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.45}

  .layers{right:20px;top:18px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:178px}
  .layers h2{margin:2px 6px 6px;font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between}
  .chip{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;font-size:13px;color:var(--text);transition:background .15s,opacity .15s}
  .chip:hover{background:rgba(255,255,255,.05)}
  .chip:focus-visible{outline:1px solid var(--acc)}
  .chip .sw{width:10px;height:10px;border-radius:3px;background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset}
  .chip .n{margin-left:auto;font:400 11px "IBM Plex Mono",monospace;color:var(--mute)}
  .chip[aria-pressed=false]{opacity:.38}
  .chip[aria-pressed=false] .sw{background:transparent;box-shadow:0 0 0 1px var(--c) inset}
  .q{all:unset;cursor:pointer;margin-top:6px;padding:7px 8px;border-radius:9px;border-top:1px solid var(--line);font:500 11px "IBM Plex Mono",monospace;color:var(--mute);letter-spacing:.06em;display:flex;justify-content:space-between}
  .q b{color:var(--text);font-weight:500}

  .dock{left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px;max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
  .seg{display:flex;background:rgba(0,0,0,.28);border-radius:10px;padding:3px;gap:2px}
  .btn{all:unset;cursor:pointer;font:500 12.5px "IBM Plex Sans",sans-serif;color:var(--mute);padding:8px 12px;border-radius:8px;white-space:nowrap;transition:color .15s,background .15s;min-height:18px;text-align:center}
  .btn:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .btn:focus-visible{outline:1px solid var(--acc)}
  .btn.on{color:var(--text);background:rgba(255,255,255,.1)}
  .btn[disabled]{opacity:.3;pointer-events:none}
  .btn[hidden]{display:none}
  .btn.primary{color:#061014;background:var(--acc);font-weight:600}
  .btn.primary:hover{background:#9af7ff}
  .slider{display:flex;align-items:center;gap:8px;padding:0 4px;font:500 11px "IBM Plex Mono",monospace;color:var(--mute)}
  .slider input{width:120px;accent-color:var(--acc)}
  .slider output{width:34px;text-align:right;color:var(--text)}
  .sep{width:1px;height:24px;background:var(--line2)}

  .info{left:20px;bottom:88px;width:min(320px,calc(100vw - 40px));padding:14px 16px 14px}
  .info[hidden]{display:none}
  .info .k{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--acc))}
  .info h3{margin:8px 0 8px;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .info dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:5px 10px;font-size:12.5px}
  .info dt{color:var(--mute);font-family:"IBM Plex Mono",monospace;font-size:11px;padding-top:1px}
  .info dd{margin:0;line-height:1.4}
  .info .x{all:unset;cursor:pointer;position:absolute;right:10px;top:9px;color:var(--mute);font-size:16px;padding:2px 6px;border-radius:6px}
  .info .x:hover{color:var(--text);background:rgba(255,255,255,.06)}

  .hint{left:50%;bottom:76px;transform:translateX(-50%);font:400 11.5px "IBM Plex Mono",monospace;color:var(--mute);white-space:nowrap;pointer-events:none;letter-spacing:.02em}
  body.has-info .hint{opacity:0}

  #leaders{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:2}
  .lab{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font:500 11px/1.25 "IBM Plex Mono",monospace;color:var(--text);background:rgba(10,12,15,.78);border:1px solid var(--line2);padding:5px 8px;border-radius:7px;opacity:0;transition:opacity .25s}
  .lab small{display:block;color:var(--mute);font-weight:400;font-size:10px}
  .lab::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}

  .toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:4;font:500 12px "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--acc);background:var(--panel2);border:1px solid var(--line2);padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}

  @media (max-width:760px){
    .title h1{font-size:24px}
    .title p{font-size:12.5px}
    .title{left:16px;top:14px}
    .title p{display:none}
    .layers{top:84px;left:16px;right:16px;min-width:0;padding:4px;flex-direction:row;flex-wrap:wrap;justify-content:space-between}
    .layers h2,.chip .n,.q span{display:none}
    .chip{padding:6px 7px;font-size:11.5px;gap:6px}
    .q{margin:0;border:0;padding:6px 7px}
    .slider{display:none}
    .hint{display:none}
    .info{left:16px;bottom:auto;top:136px}
    .sep{display:none}
    .dock{bottom:12px;gap:6px}
    .btn{padding:8px 10px;font-size:12px}
  }
</style>

<body class="boot">
<div id="stage"></div>
<div class="vignette"></div>
<svg id="leaders"></svg>
<div id="labels"></div>

<header class="hud title">
  <div class="kicker"><i></i>CERV-07 · Online</div>
  <h1>Mechanical Stag</h1>
  <p>A clockwork stag built from hundreds of machined parts. Drag to orbit, scroll to zoom, click any part.</p>
</header>

<aside class="hud layers glass" aria-label="Layers">
  <h2><span>Layers</span><span id="partCount"></span></h2>
  <button class="chip" data-layer="armor" aria-pressed="true" style="--c:#cfd6dd"><span class="sw"></span>Armor<span class="n" data-n="armor"></span></button>
  <button class="chip" data-layer="muscle" aria-pressed="true" style="--c:#e0a63e"><span class="sw"></span>Actuators<span class="n" data-n="muscle"></span></button>
  <button class="chip" data-layer="skeleton" aria-pressed="true" style="--c:#7d8896"><span class="sw"></span>Skeleton<span class="n" data-n="skeleton"></span></button>
  <button class="chip" data-layer="core" aria-pressed="true" style="--c:#5ef2ff"><span class="sw"></span>Core<span class="n" data-n="core"></span></button>
  <button class="q" id="quality"><span>RENDER</span><b id="qv">HIGH</b></button>
</aside>

<div class="hud info glass" id="info" hidden>
  <button class="x" id="infoX" aria-label="Close">×</button>
  <div class="k" id="iLayer">Armor</div>
  <h3 id="iName">Part</h3>
  <dl>
    <dt>Material</dt><dd id="iMat"></dd>
    <dt>Function</dt><dd id="iRole"></dd>
    <dt>Part no.</dt><dd id="iNo" class="mono"></dd>
  </dl>
</div>

<div class="hud hint">drag · orbit &nbsp; scroll · zoom &nbsp; click · inspect &nbsp; E · explode &nbsp; W · walk &nbsp; D · dissolve</div>

<nav class="hud dock glass" aria-label="Controls">
  <div class="seg" id="modes">
    <button class="btn on" data-e="0">Assembled</button>
    <button class="btn" data-e="0.5">Layers</button>
    <button class="btn" data-e="1">Exploded</button>
  </div>
  <label class="slider"><input id="explode" type="range" min="0" max="1" step="0.001" value="0" aria-label="Explode amount"><output id="ev">0%</output></label>
  <span class="sep"></span>
  <button class="btn" id="walk">Walk</button>
  <button class="btn on" id="antlers">Antlers</button>
  <button class="btn on" id="labelsBtn">Labels</button>
  <button class="btn primary" id="dissolve">Dissolve</button>
  <button class="btn" id="drop" hidden>Drop</button>
</nav>
<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ============================== utilities ============================== */
const $ = s => document.querySelector(s);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const { lerp, clamp } = THREE.MathUtils;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const spow = (v, p) => Math.sign(v) * Math.pow(Math.abs(v), p);
const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
const TAU = Math.PI * 2, UP = V(0, 1, 0), ZAX = V(0, 0, 1);
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261114);
const _a = V(), _b = V(), _c = V(), _d = V(), _e = V(), _q = new THREE.Quaternion(), _m = new THREE.Matrix4();

const coarse = matchMedia('(pointer: coarse)').matches || innerWidth < 760;
const CAPTURE = new URLSearchParams(location.search).has('capture');
let HQ = !coarse || CAPTURE;
if (CAPTURE) document.body.classList.add('capture');

/* ============================== renderer ============================== */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio, HQ ? 2 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
$('#stage').appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
scene.fog = new THREE.Fog(0x0b0d10, 7, 16);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 60);
const CAM_END = V(2.55, 1.55, 2.85), CAM_START = V(3.9, 2.3, 4.6);
camera.position.copy(CAM_START);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0.05);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 0.6; controls.maxDistance = 7.5;
controls.maxPolarAngle = Math.PI * 0.53;
controls.zoomSpeed = 0.8;
let introCam = true;
controls.addEventListener('start', () => { introCam = false; });

/* lights */
scene.add(new THREE.HemisphereLight(0xbcd3e6, 0x15110c, 0.35));
const key = new THREE.DirectionalLight(0xfff3e6, 2.1);
key.position.set(2.6, 4.6, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(HQ ? 2048 : 1024, HQ ? 2048 : 1024);
Object.assign(key.shadow.camera, { left: -1.7, right: 1.7, top: 2.2, bottom: -1.2, near: 0.5, far: 12 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.015;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fd2ff, 2.2); rim.position.set(-3, 2.6, -3.2); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffd7ad, 0.55); fill.position.set(-2.5, 1.2, 2.5); scene.add(fill);

/* post */
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.45, 1.35);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let gtao = null;
import('three/addons/postprocessing/GTAOPass.js').then(({ GTAOPass }) => {
  try {
    gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
    gtao.output = GTAOPass.OUTPUT.Default;
    gtao.blendIntensity = 0.85;
    gtao.updateGtaoMaterial({ radius: 0.12, distanceExponent: 1.4, thickness: 1.2, scale: 1, samples: 12 });
    gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 12 });
    gtao.enabled = HQ;
    composer.insertPass(gtao, 1);
  } catch (e) { console.warn('GTAO unavailable', e); gtao = null; }
}).catch(() => {});

/* ============================== textures ============================== */
function canvasTex(S, draw, { srgb = false, rep = 1 } = {}) {
  const c = document.createElement('canvas'); c.width = c.height = S;
  draw(c.getContext('2d'), S);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = maxAniso;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function panelFeatures(g, S, v, mode) {
  const dark = mode === 'bump' ? 'rgb(36,36,36)' : 'rgb(215,215,215)';
  g.fillStyle = dark; g.strokeStyle = dark;
  if (v === 0) {
    for (const [x, y] of [[0.13, 0.13], [0.87, 0.13], [0.13, 0.87], [0.87, 0.87]]) { g.beginPath(); g.arc(x * S, y * S, 7, 0, TAU); g.fill(); }
  } else if (v === 1) {
    for (let i = 0; i < 6; i++) { const x = S * 0.6, y = S * (0.28 + i * 0.085); g.beginPath(); g.roundRect(x, y, S * 0.26, S * 0.035, S * 0.017); g.fill(); }
  } else if (v === 2) {
    g.lineWidth = 2.2; const r = 13;
    for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) {
      const cx = S * 0.2 + i * r * 1.75 + (j % 2) * r * 0.87, cy = S * 0.62 + j * r * 1.5;
      g.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * TAU + Math.PI / 6; g[k ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * r * 0.82, cy + Math.sin(a) * r * 0.82); } g.closePath(); g.stroke();
    }
  } else if (v === 3) {
    g.font = `600 ${S * 0.085}px "IBM Plex Mono", monospace`; g.textBaseline = 'middle';
    g.fillText('CERV-07', S * 0.16, S * 0.36);
    g.font = `500 ${S * 0.036}px "IBM Plex Mono", monospace`;
    g.fillText('MK.IV  TI-6AL-4V  LOT 0419', S * 0.16, S * 0.48);
    for (let i = 0; i < 26; i++) { const w = 1 + (R() * 4 | 0); g.fillRect(S * 0.16 + i * 9, S * 0.58, w, S * 0.07); }
  }
}
function panelMaps(v) {
  const S = 512;
  const rough = canvasTex(S, (g) => {
    g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 1700; i++) {
      const y = R() * S, x = R() * S, l = 30 + R() * 280, c = 95 + R() * 70 | 0;
      g.strokeStyle = `rgba(${c},${c},${c},.35)`; g.lineWidth = 0.6 + R() * 1.4;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + (R() - 0.5) * 2); g.stroke();
    }
    for (let i = 0; i < 26; i++) {
      const x = R() * S, y = R() * S, a = R() * TAU, l = 10 + R() * 50;
      g.strokeStyle = 'rgba(55,55,55,.7)'; g.lineWidth = 0.8;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    g.strokeStyle = 'rgba(70,70,70,.8)'; g.lineWidth = 12; g.strokeRect(6, 6, S - 12, S - 12);
    g.strokeStyle = 'rgb(205,205,205)'; g.lineWidth = 6; g.strokeRect(34, 34, S - 68, S - 68);
    panelFeatures(g, S, v, 'rough');
  });
  const bump = canvasTex(S, (g) => {
    g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 500; i++) {
      const y = R() * S, x = R() * S, l = 30 + R() * 200, c = 118 + R() * 20 | 0;
      g.strokeStyle = `rgba(${c},${c},${c},.5)`; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y); g.stroke();
    }
    g.strokeStyle = 'rgb(30,30,30)'; g.lineWidth = 5; g.strokeRect(34, 34, S - 68, S - 68);
    g.strokeStyle = 'rgb(175,175,175)'; g.lineWidth = 2; g.strokeRect(39, 39, S - 78, S - 78);
    panelFeatures(g, S, v, 'bump');
  });
  return { rough, bump };
}
const PANEL = [0, 1, 2, 3].map(panelMaps);
const carbon = (() => {
  const draw = (g, S, mode) => {
    const n = 16, c = S / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const horiz = (i + j) % 2 === 0;
      const grd = horiz ? g.createLinearGradient(i * c, 0, i * c + c, 0) : g.createLinearGradient(0, j * c, 0, j * c + c);
      if (mode === 'map') { grd.addColorStop(0, '#0d0f12'); grd.addColorStop(0.5, '#2c3138'); grd.addColorStop(1, '#0d0f12'); }
      else { grd.addColorStop(0, '#404040'); grd.addColorStop(0.5, '#c8c8c8'); grd.addColorStop(1, '#404040'); }
      g.fillStyle = grd; g.fillRect(i * c, j * c, c, c);
    }
  };
  return { map: canvasTex(256, (g, S) => draw(g, S, 'map'), { srgb: true, rep: 3 }), bump: canvasTex(256, (g, S) => draw(g, S, 'bump'), { rep: 3 }) };
})();
const floorTex = canvasTex(1024, (g, S) => {
  g.fillStyle = '#16191d'; g.fillRect(0, 0, S, S);
